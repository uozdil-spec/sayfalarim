#coach,#hintP{top:8px;bottom:auto}
.cw{margin:0 auto;max-width:520px;background:rgba(14,12,9,.97);border:1px solid var(--gold);border-radius:18px;padding:12px 14px;box-shadow:0 10px 40px rgba(0,0,0,.85);-webkit-animation:up .35s ease-out;animation:up .35s ease-out}
@-webkit-keyframes up{from{opacity:0;-webkit-transform:translateY(16px)}to{opacity:1;-webkit-transform:none}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.cc{display:flex;align-items:flex-start}
.bulb{width:34px;height:34px;border-radius:50%;background:rgba(212,170,90,.16);border:1px solid var(--gold);color:var(--gold2);display:flex;align-items:center;justify-content:center;flex:none;margin-right:10px}
.ct{min-width:0}.ct b{display:block;font-size:15px;color:var(--gold2)}.ct p{margin:3px 0 0;font-size:13.5px;line-height:1.4;color:#d9cfb8}
.cb{display:flex;flex-wrap:wrap;align-items:center;margin-top:8px}
.cb .chip{margin:0 8px 0 0}
.lnk{background:none;border:0;color:var(--mut);font-size:12px;text-decoration:underline;padding:6px 2px}
.hp{max-height:44vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.hp h4{margin:0 0 4px;font-size:14px;color:var(--gold2);letter-spacing:.04em}
.alt{display:flex;align-items:center;padding:6px 4px;border-radius:12px;margin-top:2px}
.lt{width:26px;height:26px;border-radius:50%;flex:none;margin-right:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#1b1306;background:#8fe0b0}
.at{flex:1;min-width:0}.at b{font-size:14px}.at p{margin:2px 0 0;font-size:12.5px;color:#cfc5ac;line-height:1.35}
.alt .btn{width:auto;min-height:34px;padding:0 14px;font-size:13px;margin-left:8px;flex:none}
.best{font-size:9.5px;letter-spacing:.1em;color:#1b1306;background:var(--gold2);border-radius:99px;padding:2px 7px;margin-left:6px;vertical-align:1px;font-weight:700}
.msg{max-width:82%;padding:8px 12px;margin:3px 0;border-radius:14px;font-size:14.5px;line-height:1.35;overflow-wrap:anywhere;word-wrap:break-word;-webkit-user-select:text;user-select:text}
.msg.me{align-self:flex-end;background:rgba(212,170,90,.2);border:1px solid rgba(212,170,90,.45)}
.msg.th{align-self:flex-start;background:var(--pan2);border:1px solid var(--ln)}
.msg small{display:block;font-size:10.5px;color:var(--mut);margin-bottom:2px}
.chlog{max-height:34vh;overflow-y:auto;display:flex;flex-direction:column;padding:6px 2px;-webkit-overflow-scrolling:touch}
.chips{display:flex;flex-wrap:wrap;margin:6px -3px 0}
.chip{margin:3px;padding:8px 12px;border-radius:99px;border:1px solid var(--ln);background:var(--pan);font-size:13px;display:inline-flex;align-items:center}
.chip:active{border-color:var(--gold)}
.chrow{display:flex;margin-top:8px}
.chrow .inp{font-size:16px;letter-spacing:0;text-align:left;text-transform:none;flex:1;padding:12px;min-width:0}
.chrow .btn{width:auto;margin-left:8px;padding:0 18px}
.fr{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid rgba(212,170,90,.1)}
.fr .dot{width:10px;height:10px;border-radius:50%;background:#4a4538;margin-right:12px;flex:none}
.fr.on .dot{background:#6fd08c;box-shadow:0 0 8px rgba(111,208,140,.7)}
.fn{flex:1;min-width:0}.fn b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fn small{color:var(--mut);font-size:11px;letter-spacing:.12em}
.fr .btn{width:auto;min-height:40px;padding:0 14px;font-size:14px;margin-left:8px;flex:none}
.xb{background:none;border:0;color:var(--mut);padding:8px;margin-left:2px;flex:none}
.st-ok{color:#6fd08c}.st-bad{color:#ff8a7a}.st-conn{color:var(--mut)}
.seat{display:flex;align-items:center;padding:8px 10px;margin:4px 0;border:1px solid var(--ln);border-radius:12px;background:var(--pan)}
.seat .av{margin-right:10px}
.seat .nm b{font-size:15px}
.seat.emp{border-style:dashed;opacity:.8}
.sc{display:flex;align-items:center;padding:7px 0;border-bottom:1px solid rgba(212,170,90,.1)}
.sc .nm b{font-size:15px}
.sc .tt{font-family:'Cinzel',Georgia,serif;font-size:22px;color:var(--gold2);min-width:48px;text-align:right}
.sc .pp{color:#8fe0b0;font-size:13px;min-width:46px;text-align:right}
.sc.win{background:rgba(212,170,90,.1);border-radius:10px}
.mini{display:flex;flex-wrap:wrap;margin:4px 0 0}
.mini .tl{--u:13px;margin:2px 4px 3px 0}
#ov{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.8);display:none;align-items:flex-end;justify-content:center;z-index:60}
#ov.on{display:flex}
#sheet{position:relative;width:100%;max-width:520px;max-height:88%;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#0e0c09;border:1px solid var(--ln);border-bottom:0;border-radius:22px 22px 0 0;
padding:18px 18px 18px;padding-bottom:calc(var(--sab) + 18px);padding-left:calc(var(--sal) + 18px);padding-right:calc(var(--sar) + 18px)}
.sb{position:absolute;left:12px;top:12px;width:38px;height:38px}
#sheet h2{font-family:'Cinzel',Georgia,serif;font-size:21px;letter-spacing:.08em;margin:2px 0 12px;color:var(--gold2);text-align:center}
#sheet h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin:16px 0 8px;font-weight:600}
#sheet p,#sheet li{font-size:14.5px;line-height:1.5;color:#d9cfb8;margin:6px 0}
#sheet ul{padding-left:18px;margin:4px 0}
#sheet b{color:var(--gold2)}
#sheet.hasb h2{padding:0 44px}
.seg{display:flex}
.seg button{flex:1;padding:12px 6px;margin-right:6px;border-radius:12px;border:1px solid var(--ln);background:var(--pan);font-size:14px}
.seg button:last-child{margin-right:0}
.seg button.on{border-color:var(--gold);background:rgba(212,170,90,.16);color:var(--gold2);font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(212,170,90,.1)}
.row:last-child{border-bottom:0}
.row .lb{flex:none;margin-right:12px;font-size:15px}
.row .lb small{display:block;color:var(--mut);font-size:12px}
.row .seg{flex:1;max-width:280px}
.row .seg button{padding:9px 3px;font-size:13px}
.inp{width:100%;padding:14px;border-radius:14px;border:1px solid var(--ln);background:#090806;color:var(--ink);font-size:24px;text-align:center;letter-spacing:.4em;text-transform:uppercase;-webkit-user-select:text;user-select:text}
.inp.nm2{font-size:16px;letter-spacing:.02em;text-transform:none;text-align:left}
.code{font-family:'Cinzel',Georgia,serif;font-size:42px;letter-spacing:.3em;text-align:center;color:var(--gold2);margin:8px 0 4px 0.3em;-webkit-user-select:text;user-select:text}
.note{font-size:12.5px;color:var(--mut);text-align:center;margin:8px 0}
.gap{height:10px}
.cap{font-size:12.5px;color:var(--mut);text-align:center;margin:0 0 8px}
.tip{border-left:2px solid var(--gold);padding-left:10px}
.dots:after{content:"";-webkit-animation:dt 1.2s steps(4) infinite;animation:dt 1.2s steps(4) infinite}
@-webkit-keyframes dt{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
@keyframes dt{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
#cover{position:fixed;left:0;top:0;right:0;bottom:0;background:#000;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
#cover.on{display:flex}
#cover h2{font-family:'Cinzel',Georgia,serif;font-size:26px;color:var(--gold2);letter-spacing:.08em;margin:0 0 8px}
#cover p{color:var(--mut);margin:0 0 22px;font-size:14px}
#cover .btn{max-width:300px}
.win-t{font-family:'Cinzel',Georgia,serif;font-size:28px;text-align:center;color:var(--gold2);margin:4px 0 2px}
.conf{position:fixed;top:-20px;width:9px;height:15px;z-index:90;pointer-events:none;-webkit-animation:cf 2.4s ease-in forwards;animation:cf 2.4s ease-in forwards}
@-webkit-keyframes cf{to{-webkit-transform:translateY(110vh) rotate(540deg);opacity:.9}}
@keyframes cf{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}

#opps.c3 .op{padding:5px 6px}
#opps.c3 .av{width:26px;height:26px;margin-right:6px;font-size:12px}

 #opps.c3 .bk{display:block}#opps.c3 .bks em:after{content:''}#opps.c3 .av{width:30px;height:30px}

 .menu>.btn{width:calc(50% - 5px);min-height:50px;margin-bottom:8px;padding-top:6px;padding-bottom:6px}
 #logo{width:64px;height:64px;margin-right:14px}
 h1{font-size:26px;margin-top:0}
 .body{flex-direction:row}
 #opps{flex-direction:column;justify-content:flex-start;width:170px;flex:none;overflow-y:auto}
 .op{max-width:none;flex:none;margin:2px 4px 2px 0}

 #coach,#hintP{left:auto;right:6px;width:300px;top:4px}
 #toast{bottom:calc(var(--sab) + 60px)}
 #hand{min-height:74px}
}

<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0c16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Oklar">
<title>Oklar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0a0c16;--ink:#eaedff;--mut:#8089bd;--line:#aab4f5;--acc:#fb7185;--glass:rgba(255,255,255,.055)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none;
  font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(800px 460px at 85% -8%,rgba(120,110,255,.20),transparent 60%),
             radial-gradient(640px 460px at -10% 108%,rgba(251,113,133,.14),transparent 60%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{opacity:.3;pointer-events:none}
svg{display:block}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#app{position:fixed;inset:0;max-width:680px;margin:0 auto}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.screen.active{display:flex;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--glass);
  border:1px solid rgba(170,180,245,.16);transition:transform .12s,background .2s}
.ib:active{transform:scale(.9);background:rgba(170,180,245,.18)}

/* ALT SEKMELER */
.tabs{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:6;display:none;gap:6px;padding:6px;height:66px;border-radius:24px;
  background:rgba(18,22,46,.8);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(170,180,245,.22);box-shadow:0 16px 44px -10px #000}
#app.tabs-on .tabs{display:flex}
.tabs button{flex:1;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:800;letter-spacing:.04em;color:var(--mut);transition:all .25s}
.tabs button.on{color:#0a0c16;background:linear-gradient(100deg,#aab4f5,#e6e8ff);box-shadow:0 8px 20px -8px rgba(170,180,245,.8)}
.tabs .i{width:22px;height:22px}
#app.tabs-on .scroll{padding-bottom:104px}

/* ANA SAYFA */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:28px}
.home-in{position:relative;min-height:100%}
.home-in>*:not(.aurora){position:relative;z-index:1}
.aurora{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.aurora i{position:absolute;border-radius:50%;filter:blur(72px);opacity:.5;animation:float 14s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:320px;height:320px;left:-100px;top:40px;background:#5b50ff}
.aurora i:nth-child(2){width:300px;height:300px;right:-110px;top:420px;background:#fb4f73;animation-duration:18s;opacity:.34}
.aurora i:nth-child(3){width:280px;height:280px;left:20%;top:900px;background:#22d3b0;opacity:.2;animation-duration:22s}
@keyframes float{to{transform:translate(40px,-50px) scale(1.18)}}
.hero{height:318px}
.hero canvas{position:absolute;left:50%;top:52px;transform:translateX(-50%);
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 16%,#000 52%,transparent 94%);mask-image:linear-gradient(180deg,transparent,#000 16%,#000 52%,transparent 94%)}
.toprow{position:absolute;left:0;right:0;top:0;z-index:3;display:flex;justify-content:space-between;padding:12px 16px 0}
.tr{display:flex;gap:10px}
.brand{position:absolute;left:0;right:0;bottom:6px;text-align:center}
.brand::before{content:"";position:absolute;left:8%;right:8%;top:-34px;bottom:-14px;z-index:-1;
  background:radial-gradient(closest-side,rgba(10,12,22,.82),rgba(10,12,22,.5) 60%,transparent)}
.logo{margin:0;display:flex;justify-content:center;font-size:58px;line-height:1;font-weight:900;letter-spacing:.2em;padding-left:.2em}
.logo span{display:inline-block;background:linear-gradient(180deg,#fff 10%,#aab4f5 75%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 16px rgba(140,130,255,.6));animation:rise .8s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(.09s*var(--i))}
.logo span.hot{background-image:linear-gradient(180deg,#fff 5%,#fb7185 80%);filter:drop-shadow(0 0 18px rgba(251,113,133,.7))}
@keyframes rise{from{transform:translateY(24px) scale(.6);opacity:0}}
.sub{margin:10px 0 0;color:#a3abe0;font-size:15px;letter-spacing:.1em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 16px 14px}
.stat{padding:12px 6px 10px;border-radius:18px;text-align:center;background:var(--glass);border:1px solid rgba(170,180,245,.14);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.stat b{display:flex;justify-content:center;align-items:center;gap:5px;font-size:21px;font-weight:800}
.stat b .i{width:18px;height:18px}
.stat small{color:var(--mut);font-size:11px;letter-spacing:.05em}
.play{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:14px;margin:0 16px 14px;width:calc(100% - 32px);
  padding:16px;border-radius:24px;color:#0a0c16;text-align:left;
  background:linear-gradient(100deg,#aab4f5,#e6e8ff 52%,#ffa6b4);box-shadow:0 16px 38px -12px rgba(170,180,245,.8);
  animation:glow 2.6s ease-in-out infinite;transition:transform .12s}
.play:active{transform:scale(.97)}
@keyframes glow{50%{box-shadow:0 18px 46px -8px rgba(251,113,133,.7)}}
.play::after{content:"";position:absolute;top:0;bottom:0;width:70px;left:-100px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);
  transform:skewX(-20deg);animation:shine 3.4s infinite}
@keyframes shine{0%{left:-100px}55%,100%{left:120%}}
.play .pi{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#0a0c16;color:#fff}
.play .pi svg{width:22px;height:22px;fill:currentColor;margin-left:3px}
.play b{display:block;font-size:21px;font-weight:900;letter-spacing:.08em}
.play small{display:block;font-size:13px;font-weight:600;opacity:.62;margin-top:1px}
.daily{display:flex;align-items:center;gap:14px;margin:0 16px 20px;padding:14px 16px;border-radius:22px;cursor:pointer;border:1.5px solid transparent;
  background:linear-gradient(#141831,#141831) padding-box,linear-gradient(120deg,#fbbf24,#fb7185,#a78bfa) border-box;transition:transform .12s}
.daily:active{transform:scale(.985)}
.daily .ic{flex:none;width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#fbbf24,#fb7185);color:#1b1020}
.daily .ic .i{width:26px;height:26px;stroke-width:2.2}
.daily.done .ic{background:linear-gradient(135deg,#34d399,#5eead4)}
.daily .tx b{display:block;font-size:17px}
.daily .tx small{color:var(--mut);font-size:12px}
.daily .go{margin-left:auto;flex:none;padding:9px 15px;border-radius:14px;font-weight:800;font-size:13px;background:rgba(255,255,255,.09)}
.sec{margin:4px 24px 10px;font-size:11px;letter-spacing:.22em;color:var(--mut);text-transform:uppercase;font-weight:700}
.card{position:relative;overflow:hidden;border-radius:22px;padding:18px;margin:0 16px 12px;min-height:104px;
  background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  border:1px solid rgba(var(--cr),.32);box-shadow:0 14px 34px -18px rgb(var(--cr));cursor:pointer;transition:transform .12s;
  animation:cardin .55s cubic-bezier(.2,1.1,.3,1) both;animation-delay:calc(.08s*var(--n))}
.card:active{transform:scale(.985)}
@keyframes cardin{from{opacity:0;transform:translateY(18px)}}
.pv{position:absolute;right:0;top:0;opacity:.4;pointer-events:none;
  -webkit-mask-image:linear-gradient(90deg,transparent 30%,#000 58%,transparent 80%);mask-image:linear-gradient(90deg,transparent 30%,#000 58%,transparent 80%)}
.ct{position:relative;max-width:60%}
.cn{font-size:25px;font-weight:800;color:var(--c);letter-spacing:.02em}
.cg{color:var(--mut);font-size:13px;margin:2px 0 8px}
.cs{font-size:12px;color:#9aa3d8}
.ring{position:absolute;right:16px;top:50%;margin-top:-30px;width:60px;height:60px;filter:drop-shadow(0 0 8px rgba(var(--cr),.5))}
.tipcard{display:flex;align-items:center;gap:10px;margin:6px 16px 0;padding:12px 14px;border-radius:16px;font-size:13px;line-height:1.35;
  color:#ffd98a;background:rgba(255,209,102,.08);border:1px solid rgba(255,209,102,.2)}
.tipcard button{margin-left:auto;flex:none;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.08);font-size:16px;line-height:1}
.foot{text-align:center;color:#4f5784;font-size:12px;margin:18px 0 0}
.lnk{padding:10px 18px;border-radius:14px;color:#aab4f5;font-weight:700;font-size:14px;background:var(--glass);border:1px solid rgba(170,180,245,.16);margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translate(-50%,20px);padding:12px 18px;border-radius:14px;max-width:86vw;text-align:center;
  background:#222849;border:1px solid rgba(170,180,245,.25);font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:40}
.toast.on{opacity:1;transform:translate(-50%,0)}
.two{display:flex;gap:10px}.two .btn{flex:1}

/* BÖLÜM LİSTESİ */
.head{display:flex;align-items:center;gap:12px;padding:12px 16px}
.head .home{margin-left:auto}
.head h2{margin:0;font-size:22px;font-weight:800;color:var(--c)}
.head small{display:block;color:var(--mut);font-size:12px;font-weight:500;margin-top:1px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:6px 16px 30px}
.tile{aspect-ratio:1;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:var(--glass);border:1px solid rgba(170,180,245,.12);font-weight:700;font-size:18px;transition:transform .1s}
.tile:active{transform:scale(.92)}
.tile .st{font-size:9px;letter-spacing:1px;color:#3b4270;line-height:1}
.tile .st b{color:#ffd166;font-weight:400}
.tile.done{border-color:rgba(var(--cr),.4);background:linear-gradient(160deg,rgba(var(--cr),.14),rgba(255,255,255,.03))}
.tile.next{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 22px -4px var(--c);animation:pulse 1.8s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 1px var(--c),0 0 6px -2px var(--c)}}
.tile.lock{opacity:.35}
.tile.lock .i{width:18px;height:18px}

/* TAKVİM */
.cal-head{padding:18px 22px 4px}
.cal-head h1{margin:0;font-size:34px;font-weight:900;letter-spacing:.04em}
.cal-head p{margin:4px 0 0;color:var(--mut);font-size:14px;line-height:1.4}
.yearbar{display:flex;align-items:center;justify-content:center;gap:22px;margin:12px 0}
.yearbar b{font-size:26px;font-weight:900;letter-spacing:.08em;min-width:90px;text-align:center}
.sumrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 16px 14px}
.months{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.mt{position:relative;border-radius:22px;padding:14px 14px 12px;min-height:150px;cursor:pointer;overflow:hidden;
  background:linear-gradient(150deg,rgba(var(--cr),.16),rgba(255,255,255,.025) 60%);border:1px solid rgba(var(--cr),.34);
  transition:transform .12s;animation:cardin .5s cubic-bezier(.2,1.1,.3,1) both;animation-delay:calc(.04s*var(--n))}
.mt:active{transform:scale(.97)}
.mt .mn{font-size:21px;font-weight:900;color:var(--c);letter-spacing:.02em}
.mt .mst{position:absolute;right:10px;top:12px;font-size:10px;font-weight:800;letter-spacing:.12em;padding:4px 8px;border-radius:10px;background:var(--c);color:#0a0c16}
.mt .mr{display:flex;justify-content:space-between;font-size:12px;color:#aab1e6;margin-top:10px}
.mt .mr b{color:var(--ink)}
.mt .mb{height:5px;border-radius:5px;background:rgba(255,255,255,.09);margin-top:5px;overflow:hidden}
.mt .mb i{display:block;height:100%;background:var(--c);border-radius:5px}
.mt .bd{display:flex;gap:6px;margin-top:10px;min-height:22px}
.mt .bd span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#0a0c16}
.mt .bd svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.mt.cur{box-shadow:0 0 0 1.5px var(--c),0 0 30px -6px var(--c)}
.mt.fut{opacity:.5;background:var(--glass);border-color:rgba(170,180,245,.14)}
.mt.fut .mn{color:#aab1e6}
.mt.fut .lk{margin-top:14px;color:var(--mut);font-size:13px;line-height:1.4}
.mt.fut .lk .i{width:20px;height:20px;margin-bottom:6px}
.mt.off{opacity:.25;border-style:dashed;background:none;cursor:default}
.seg{display:flex;gap:6px;margin:2px 16px 10px;padding:5px;border-radius:18px;background:var(--glass);border:1px solid rgba(170,180,245,.14)}
.seg button{flex:1;padding:11px;border-radius:14px;font-weight:800;font-size:14px;color:var(--mut);transition:all .2s}
.seg button.on{background:var(--c);color:#0a0c16}
.dgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;padding:0 16px}
.dh{text-align:center;font-size:11px;color:var(--mut);letter-spacing:.06em;padding:4px 0}
.dd{position:relative;aspect-ratio:1;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:800;font-size:15px;
  background:var(--glass);border:1px solid rgba(170,180,245,.12);transition:transform .1s}
.dd:active{transform:scale(.9)}
.dd small{font-size:9px;line-height:1;color:#ffd166;letter-spacing:1px;height:9px}
.dd .dt{position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%}
.dd.done{border-color:rgba(var(--cr),.55);background:linear-gradient(160deg,rgba(var(--cr),.2),rgba(255,255,255,.03))}
.dd.today{box-shadow:0 0 0 1.5px var(--c),0 0 18px -3px var(--c);animation:pulse 1.8s infinite}
.dd.fut{opacity:.28;pointer-events:none}
.dd.blank{background:none;border:0;pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:14px 16px 4px;font-size:12px;color:var(--mut)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.mnote{margin:12px 22px 4px;text-align:center;color:var(--mut);font-size:13px;line-height:1.45}

/* OYUN */
.gtop{display:grid;grid-template-columns:100px 1fr 100px;align-items:center;padding:10px 12px 6px}
.gl{display:flex;gap:8px}
.gc{text-align:center}
.gt{font-size:13px;color:var(--mut);letter-spacing:.06em}
.gt b{font-size:17px;letter-spacing:.04em}
.hearts{display:flex;gap:5px;justify-content:center;margin-top:5px;min-height:24px;flex-wrap:wrap}
.h{width:24px;height:24px;fill:#f0566b;filter:drop-shadow(0 0 6px rgba(240,86,107,.55));transition:all .3s}
.h.lost{fill:#2b3052;filter:none}
.h.hit{animation:hit .5s}
@keyframes hit{0%{transform:scale(1.5)}100%{transform:scale(1)}}
.gr{text-align:right;color:var(--mut);font-size:12px;padding-right:6px;line-height:1.15}
.gr b{display:block;color:var(--ink);font-size:20px}
.bar{height:4px;margin:4px 16px 0;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--c);box-shadow:0 0 10px var(--c);transition:width .35s}
#board{position:relative;flex:1;min-height:0;margin:8px;border-radius:18px;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 0%,rgba(120,110,255,.07),transparent 70%);border:1px solid rgba(170,180,245,.08)}
#gcv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#mmBtn{position:absolute;right:10px;bottom:10px;width:40px;height:40px;display:none;background:rgba(10,12,22,.7);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#mmBtn.off{opacity:.55}
#board.over #gcv{opacity:.4;filter:saturate(.3);transition:.4s}
#board.over::after{content:'OYUN BİTTİ';position:absolute;left:0;right:0;top:42%;text-align:center;font-weight:900;font-size:30px;letter-spacing:.14em;color:#ff8da0;text-shadow:0 0 24px rgba(255,93,115,.7);pointer-events:none}
#mm{position:absolute;left:10px;bottom:10px;display:none;touch-action:none;border-radius:12px;
  background:rgba(10,12,22,.7);border:1px solid rgba(170,180,245,.3);box-shadow:0 8px 22px -8px #000}
.dock{display:flex;justify-content:center;gap:10px;padding:8px 8px 14px}
.db{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--mut)}
.db .ib{width:52px;height:52px}
.db:active .ib{transform:scale(.9)}

/* PANEL */
.sheet{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:22px;z-index:20;
  background:rgba(6,8,16,.66);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.sheet.on{display:flex;animation:fadeo .25s}
@keyframes fadeo{from{opacity:0}to{opacity:1}}
.panel{width:100%;max-width:400px;max-height:92vh;overflow:auto;border-radius:26px;padding:24px 22px 20px;
  background:linear-gradient(160deg,#1a1f3d,#11142a);border:1px solid rgba(170,180,245,.2);box-shadow:0 30px 80px -20px #000;animation:up .35s cubic-bezier(.2,1.2,.3,1)}
@keyframes up{from{transform:translateY(24px) scale(.96);opacity:0}}
.panel h3{margin:0 0 14px;font-size:22px;text-align:center}
.step{display:flex;gap:14px;align-items:center;padding:8px 0;font-size:15px;line-height:1.35;color:#ccd1ff}
.step .n{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(170,180,245,.14);color:var(--line)}
.tip{margin:12px 0 4px;padding:10px 12px;border-radius:14px;background:rgba(255,209,102,.1);color:#ffd98a;font-size:13px;text-align:center}
.btn{display:block;width:100%;margin-top:10px;padding:14px;border-radius:16px;font-weight:700;font-size:16px;background:var(--glass);border:1px solid rgba(170,180,245,.18)}
.btn.p{color:#0a0c16;background:linear-gradient(90deg,#aab4f5,#d6d9ff);border:0}
.btn.d{color:#ff8da0}
.btn:active{transform:scale(.97)}
.row{display:flex;justify-content:space-between;align-items:center;padding:13px 2px;border-bottom:1px solid rgba(170,180,245,.1);font-size:16px}
.row small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.sw{width:50px;height:30px;border-radius:30px;background:#2a2f55;position:relative;transition:.25s;flex:none}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#8b94c9;transition:.25s}
.sw.on{background:#6f7cf0}.sw.on::after{left:23px;background:#fff}
.stars{display:flex;justify-content:center;gap:8px;margin:2px 0 8px}
.stars svg{width:54px;height:54px;fill:#262b4d}
.stars svg.on{fill:#ffd166;filter:drop-shadow(0 0 12px rgba(255,209,102,.7));animation:starin .6s both}
@keyframes starin{0%{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.3) rotate(8deg)}100%{transform:scale(1)}}
.meta{text-align:center;color:var(--mut);font-size:14px;margin-bottom:6px;line-height:1.5}
.inp{width:100%;margin:6px 0 4px;padding:15px 16px;border-radius:16px;font:inherit;font-size:18px;font-weight:700;text-align:center;color:var(--ink);
  background:rgba(255,255,255,.07);border:1.5px solid rgba(170,180,245,.3);outline:0;-webkit-user-select:text;user-select:text}
.inp:focus{border-color:#aab4f5;box-shadow:0 0 0 4px rgba(170,180,245,.18)}
textarea.inp{font-size:12px;font-weight:500;text-align:left;height:96px;resize:none;word-break:break-all}
.err{min-height:18px;color:#ff8da0;font-size:13px;text-align:center}

<script>
//#GEN_START
const DIFFS=[
 {id:'kolay',name:'Kolay',tag:'Isınma turu · küçük labirent',accent:'#5eead4',rgb:'94,234,212',line:'#8fe9d9',hearts:5,c:[7,12],r:[10,18],len:[[2,5],[3,10]],turn:.25,hard:[0,.5],tries:3},
 {id:'orta',name:'Orta',tag:'Keyifli beyin egzersizi',accent:'#fbbf24',rgb:'251,191,36',line:'#f6d37f',hearts:5,c:[12,20],r:[18,32],len:[[2,6],[4,16]],turn:.35,hard:[.4,.8],tries:3},
 {id:'zor',name:'Zor',tag:'Geniş haritalar, uzun yollar',accent:'#a78bfa',rgb:'167,139,250',line:'#bfb1ff',hearts:4,mega:[0,4],megaL:[45,90],c:[22,36],r:[34,60],len:[[3,8],[5,26]],turn:.45,hard:[.7,.95],tries:2},
 {id:'kabus',name:'Kabus',tag:'Dev labirent · yüzlerce ok',accent:'#fb7185',rgb:'251,113,133',line:'#aab4f5',hearts:4,mega:[3,8],megaL:[110,300],c:[40,70],r:[68,120],len:[[4,12],[8,50]],turn:.5,hard:[.8,.95],tries:1}
];
const PACK={mega:[0,3],megaL:[50,110],c:[10,40],r:[16,76],len:[[2,8],[5,30]],turn:.4,hard:[.4,1],tries:2,hearts:4};
const DAILY={mega:[0,4],megaL:[50,130],c:[10,56],r:[16,104],len:[[2,8],[5,36]],turn:.4,hard:[.3,1],tries:2,hearts:4};
const lerp=(a,b,t)=>a+(b-a)*t;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];

/* Dıştan içe doğru kurulur: her ok, çıkış yolu daha önce konmuş oklarla dolu olacak şekilde eklenir.
   Böylece harita her zaman çözülebilir ve hiç boşluk kalmaz. */
function genOnce(cols,rows,minL,maxL,seed,turn,hard,mega,megaL){
  const rnd=mulberry32(seed),N=cols*rows,placed=new Uint8Array(N),inC=new Uint8Array(N*4),cand=[],arrows=[];
  const clear=(q,d)=>{let x=q%cols+DIRS[d][0],y=((q/cols)|0)+DIRS[d][1];
    while(x>=0&&y>=0&&x<cols&&y<rows){if(!placed[y*cols+x])return false;x+=DIRS[d][0];y+=DIRS[d][1]}return true};
  const addC=(q,d)=>{const k=q*4+d;if(!inC[k]){inC[k]=1;cand.push(k)}};
  for(let x=0;x<cols;x++){addC(x,3);addC((rows-1)*cols+x,2)}
  for(let y=0;y<rows;y++){addC(y*cols,1);addC(y*cols+cols-1,0)}
  const rayLen=(q,d)=>{const x=q%cols,y=(q/cols)|0;return d===0?cols-1-x:d===1?x:d===2?rows-1-y:y};
  const pickL=()=>{
    const u=rnd(),span=Math.max(1,maxL-minL);
    if(u<.28)return minL+((rnd()*span*.3)|0);
    if(u<.66)return minL+Math.round(span*(.3+rnd()*.35));
    if(u<.92)return minL+Math.round(span*(.65+rnd()*.35));
    return Math.round(maxL*(1.4+rnd()*2.2));
  };
  const fr=n=>{let f=0,nx=n%cols,ny=(n/cols)|0;for(const[ex,ey]of DIRS){const x2=nx+ex,y2=ny+ey;if(x2>=0&&y2>=0&&x2<cols&&y2<rows&&!placed[y2*cols+x2])f++}return f};
  // q yerleşince tek başına kalacak komşu sayısı
  const dn=(q,behind)=>{let c=0,x=q%cols,y=(q/cols)|0;for(const[ex,ey]of DIRS){const nx=x+ex,ny=y+ey;if(nx<0||ny<0||nx>=cols||ny>=rows)continue;const n=ny*cols+nx;if(n===behind||placed[n])continue;if(fr(n)===1)c++}return c};
  let remaining=N,guard=0;
  while(remaining>0&&guard++<N*3){
    const rec=[];let tries=0;
    while(rec.length<28&&tries<80&&cand.length){tries++;const i=(rnd()*cand.length)|0,k=cand[i];rec.push([i,k])}
    let best=null,bs=-1e9;const del=[];
    for(const[i,k]of rec){
      const q=k>>2,d=k&3;
      if(placed[q]){del.push(i);continue}
      const bx=q%cols-DIRS[d][0],by=((q/cols)|0)-DIRS[d][1],bf=bx>=0&&by>=0&&bx<cols&&by<rows&&!placed[by*cols+bx];
      const rl=rayLen(q,d),sc=(bf?1000:0)-300*dn(q,bf?by*cols+bx:-1)+(rnd()<hard?rl:-rl)*.12+rnd()*3;
      if(sc>bs){bs=sc;best={i,q,d,bf}}
    }
    if(best&&!best.bf){ // sadece kısa/tek kareli kalacaksa, geride boş karesi olan başka bir aday ara
      let alt=null,as=-1e9;
      for(let i=0;i<cand.length;i++){const k=cand[i],q2=k>>2,d2=k&3;if(placed[q2])continue;
        const bx=q2%cols-DIRS[d2][0],by=((q2/cols)|0)-DIRS[d2][1];
        if(bx>=0&&by>=0&&bx<cols&&by<rows&&!placed[by*cols+bx]){const sc2=rnd()-.3*dn(q2,by*cols+bx);if(sc2>as){as=sc2;alt={i,q:q2,d:d2,bf:true}}}}
      if(alt)best=alt;
    }
    if(best)del.push(best.i);
    const uniq=[...new Set(del)].sort((a,b)=>b-a);
    for(const i of uniq){const last=cand.pop();if(i<cand.length)cand[i]=last}
    if(!best){
      if(!cand.length){ // yedek tarama
        for(let q=0;q<N;q++)if(!placed[q])for(let d=0;d<4;d++)if(clear(q,d))addC(q,d);
        if(!cand.length)break;
      }
      continue;
    }
    const{q,d}=best;placed[q]=1;remaining--;
    let megaHit=false;if(mega>0&&(rnd()<.06||remaining<N*.6)){mega--;megaHit=true}
    const path=[q],L=megaHit?Math.round(megaL[0]+rnd()*(megaL[1]-megaL[0])):pickL(),tn=Math.min(.9,turn*(.3+1.5*rnd()));
    let cur=-1;
    if(best.bf&&L>1){cur=(((q/cols)|0)-DIRS[d][1])*cols+q%cols-DIRS[d][0]}
    let dir=d^1;
    while(cur>=0&&path.length<L){
      placed[cur]=1;remaining--;path.push(cur);
      if(path.length>=L)break;
      const cx=cur%cols,cy=(cur/cols)|0,opts=[];
      for(let e=0;e<4;e++){const x=cx+DIRS[e][0],y=cy+DIRS[e][1];if(x>=0&&y>=0&&x<cols&&y<rows&&!placed[y*cols+x])opts.push(e)}
      if(!opts.length)break;
      let e;
      const dead1=opts.filter(o=>fr((cy+DIRS[o][1])*cols+cx+DIRS[o][0])===0);
      if(dead1.length){e=dead1[(rnd()*dead1.length)|0];dir=e;cur=(cy+DIRS[e][1])*cols+cx+DIRS[e][0];continue}
      if(rnd()<(megaHit?.25:.7)){ // dar yerleri önce doldur: boşta kalan kare bırakma
        let bd=9,bo=[];
        for(const o of opts){const nx=cx+DIRS[o][0],ny=cy+DIRS[o][1];let f=0;
          for(const[ex,ey]of DIRS){const x2=nx+ex,y2=ny+ey;if(x2>=0&&y2>=0&&x2<cols&&y2<rows&&!placed[y2*cols+x2])f++}
          if(f<bd){bd=f;bo=[o]}else if(f===bd)bo.push(o)}
        e=bo[(rnd()*bo.length)|0];
      }else e=(opts.includes(dir)&&rnd()>tn)?dir:opts[(rnd()*opts.length)|0];
      dir=e;cur=(cy+DIRS[e][1])*cols+cx+DIRS[e][0];
    }
    {const tl=path[path.length-1];if(path.length>=2||best.bf){for(const[ex,ey]of DIRS){const nx=tl%cols+ex,ny=((tl/cols)|0)+ey;
      if(nx>=0&&ny>=0&&nx<cols&&ny<rows){const n=ny*cols+nx;if(!placed[n]&&fr(n)===0){placed[n]=1;remaining--;path.push(n);break}}}}}
    // path baştan kuyruğa; kuyruk→baş
    const cells=path.slice().reverse(),ray=[];
    let x=q%cols+DIRS[d][0],y=((q/cols)|0)+DIRS[d][1];
    while(x>=0&&y>=0&&x<cols&&y<rows){ray.push(y*cols+x);x+=DIRS[d][0];y+=DIRS[d][1]}
    arrows.push({id:arrows.length,cells,dx:DIRS[d][0],dy:DIRS[d][1],ray});
    for(const p of path){
      for(let e=0;e<4;e++){
        let x=p%cols+DIRS[e][0],y=((p/cols)|0)+DIRS[e][1];
        while(x>=0&&y>=0&&x<cols&&y<rows&&placed[y*cols+x]){x+=DIRS[e][0];y+=DIRS[e][1]}
        if(x>=0&&y>=0&&x<cols&&y<rows){const q2=y*cols+x,od=e^1;if(!inC[q2*4+od]&&clear(q2,od))addC(q2,od)}
      }
    }
  }
  /* kısa okları komşu oklara ekle: bir ok, kuyruğuna bitişik ve kendinden sonra gelen (ya da önce gelen kısa) oku yutabilir.
     Çıkış sırası korunduğu için çözülebilirlik bozulmaz. */
  const owner=new Int32Array(N).fill(-1);arrows.forEach((a,i)=>{a.o=i;for(const c of a.cells)owner[c]=i});
  const dead=new Uint8Array(arrows.length),capL=Math.max(maxL*3,12);
  const tryMerge=(xi,yi)=>{ // Y, X'in kuyruğuna eklenir (X daha önce gelmeli)
    const X=arrows[xi],Y=arrows[yi];if(dead[xi]||dead[yi]||xi>=yi||X.cells.length+Y.cells.length>capL)return false;
    const t=X.cells[0],tx=t%cols,ty=(t/cols)|0,opts=[];
    for(const c of[Y.cells[0],Y.cells[Y.cells.length-1]]){
      if(Math.abs((c%cols)-tx)+Math.abs(((c/cols)|0)-ty)!==1)continue;
      if(X.cells.length===1&&!(c%cols===tx-X.dx&&((c/cols)|0)===ty-X.dy))continue;
      opts.push(c);
    }
    if(!opts.length)return false;
    const c=opts[(rnd()*opts.length)|0],ord=Y.cells[Y.cells.length-1]===c?Y.cells:Y.cells.slice().reverse();
    X.cells=ord.concat(X.cells);for(const k of Y.cells)owner[k]=xi;dead[yi]=1;return true;
  };
  const nb=c=>{const x=c%cols,y=(c/cols)|0,r=[];for(const[ex,ey]of DIRS){const nx=x+ex,ny=y+ey;if(nx>=0&&ny>=0&&nx<cols&&ny<rows)r.push(ny*cols+nx)}return r};
  for(let pass=0;pass<5;pass++){
    let moved=0;const lim=3+pass;
    for(let i=arrows.length-1;i>=0;i--){ // kısa ok, daha önceki bir okun kuyruğuna katılır
      const S=arrows[i];if(dead[i]||S.cells.length>lim)continue;
      const cs=new Set();for(const c of[S.cells[0],S.cells[S.cells.length-1]])for(const n of nb(c)){const A=owner[n];if(A>=0&&A<i&&!dead[A]&&arrows[A].cells[0]===n)cs.add(A)}
      for(const A of[...cs].sort(()=>rnd()-.5))if(tryMerge(A,i)){moved++;break}
    }
    for(let i=0;i<arrows.length;i++){ // kısa ok, kuyruğuna bitişik sonraki bir oku yutar
      const X=arrows[i];if(dead[i]||X.cells.length>lim)continue;
      const cs=new Set();for(const n of nb(X.cells[0])){const Y=owner[n];if(Y>i&&!dead[Y])cs.add(Y)}
      for(const Y of[...cs].sort(()=>rnd()-.5))if(tryMerge(i,Y)){moved++;break}
    }
    for(let i=arrows.length-1;i>=0;i--){ // kısa ok, kuyruğuna bitişik SONRAKİ bir okun kuyruğuna da katılabilir (kimsenin yolunu tıkamıyorsa)
      const S=arrows[i];if(dead[i]||S.cells.length>lim)continue;
      const cs=new Set();for(const c of[S.cells[0],S.cells[S.cells.length-1]])for(const n of nb(c)){const C=owner[n];if(C>i&&!dead[C]&&arrows[C].cells[0]===n)cs.add(C)}
      for(const C of[...cs].sort(()=>rnd()-.5)){
        const CC=arrows[C];if(CC.cells.length+S.cells.length>capL)continue;
        const t=CC.cells[0],opts=[];
        for(const c of[S.cells[0],S.cells[S.cells.length-1]]){
          if(Math.abs((c%cols)-(t%cols))+Math.abs(((c/cols)|0)-((t/cols)|0))!==1)continue;
          if(CC.cells.length===1&&!(c%cols===(t%cols)-CC.dx&&((c/cols)|0)===((t/cols)|0)-CC.dy))continue;
          opts.push(c);
        }
        if(!opts.length)continue;
        let ok=true;
        for(let b=i+1;b<=C&&ok;b++){if(dead[b])continue;const B=arrows[b];if(!B.rs)B.rs=new Set(B.ray);for(const k of S.cells)if(B.rs.has(k)){ok=false;break}}
        if(!ok)continue;
        const c=opts[(rnd()*opts.length)|0],ord=S.cells[S.cells.length-1]===c?S.cells:S.cells.slice().reverse();
        CC.cells=ord.concat(CC.cells);for(const k of S.cells)owner[k]=C;dead[i]=1;moved++;break;
      }
    }
    if(!moved)break;
  }
  /* hâlâ tek kareli ok kaldıysa: bir yönü seçip, arkasındaki okun başlangıç kısmını ona katarak uzat */
  arrows.forEach((a,i)=>a.k=i);
  const rayFrom=(c,d)=>{const r=[];let x=c%cols+DIRS[d][0],y=((c/cols)|0)+DIRS[d][1];while(x>=0&&y>=0&&x<cols&&y<rows){r.push(y*cols+x);x+=DIRS[d][0];y+=DIRS[d][1]}return r};
  for(let i=0;i<arrows.length;i++){
    const S=arrows[i];if(dead[i]||S.cells.length!==1)continue;
    const sc=S.cells[0],cx=sc%cols,cy=(sc/cols)|0;
    const d0=DIRS.findIndex(d=>d[0]===S.dx&&d[1]===S.dy),order=[d0,0,1,2,3].filter((v,j,ar)=>ar.indexOf(v)===j);
    for(const d of order){
      const bx=cx-DIRS[d][0],by=cy-DIRS[d][1];if(bx<0||by<0||bx>=cols||by>=rows)continue;
      const b=by*cols+bx,A=owner[b];if(A<0||A===i||dead[A])continue;
      const AA=arrows[A],idx=AA.cells.indexOf(b);
      if(idx===AA.cells.length-1){ // arkadaki ok tamamen bu okun gövdesi olur

      let pts,col=this.col,w=lw,gcol=this.col,ga=.1,ox=0,oy=0;
      if(a.anim){
        const t=Math.max(0,(now-a.anim.t0)/1000),travel=9*t+35*t*t;
        if(travel>=a.anim.T){a.anim=null;continue}
        active=true;pts=this.slidePts(a,travel);ga=.28;
      }else{
        pts=a.pc.map(p=>[p[0]*c,p[1]*c]);
        const sa=now-a.shake;
        if(sa<420){active=true;const k=1-sa/420,s=Math.sin(sa*.05)*c*.16*k;ox=-a.dy*s+a.dx*Math.abs(s)*.5;oy=a.dx*s+a.dy*Math.abs(s)*.5}
        if(a.hit&&col===this.col){col='#e7a9b6';gcol='#ff5d73';ga=.16}
        const fa=now-a.flash;
        if(fa<700){active=true;const k=1-fa/700;col='#ff5d73';gcol='#ff5d73';ga=.12+.4*k;w=lw*(1+.35*k)}
        const pa=now-a.pop;
        if(pa<600){active=true;const k=1-pa/600;col='#7cf7c2';gcol='#7cf7c2';ga=.1+.4*k}
        if(this.hint&&this.hint.id===a.id){
          if(now<this.hint.until){active=true;const p=(Math.sin(now*.009)+1)/2;col='#ffffff';gcol=this.acc;ga=.2+.35*p;w=lw*(1.15+.35*p)}
          else this.hint=null;
        }
      }
      if(ox||oy)pts=pts.map(p=>[p[0]+ox,p[1]+oy]);
      this.snake(pts,a.dx,a.dy,col,w,gcol,ga);
    }
    if(this.rayFx){
      const f=(now-this.rayFx.t0)/800;
      if(f<1){
        active=true;const a=this.rayFx.a,h=a.pc[a.pc.length-1],b=this.rayFx.b;
        ctx.strokeStyle='#ff5d73';ctx.globalAlpha=(1-f)*.85;ctx.lineWidth=Math.max(1.5,c*.07);ctx.setLineDash([c*.18,c*.2]);
        ctx.beginPath();ctx.moveTo((h[0]+a.dx*.5)*c,(h[1]+a.dy*.5)*c);ctx.lineTo(b[0]*c,b[1]*c);ctx.stroke();
        ctx.setLineDash([]);ctx.globalAlpha=1;
      }else this.rayFx=null;
    }
    if(this.mm&&this.viewMode)this.drawMini();
    return active;
  }
  drawMini(){
    const m=this.mm,c=this.cell,W=this.cols*c,H=this.rows*c;
    const big=W>this.vw*1.04||H>this.vh*1.04,show=big&&save.set.map!==false;
    const bt=$('#mmBtn');if(bt&&bt.style.display!==(big?'grid':'none'))bt.style.display=big?'grid':'none';
    if(!show){if(m.style.display!=='none')m.style.display='none';return}
    if(m.style.display!=='block')m.style.display='block';
    const k=Math.min(96/this.cols,150/this.rows),w=Math.max(20,Math.round(this.cols*k)),h=Math.max(20,Math.round(this.rows*k));
    if(this.mmK!==k||m.dataset.w!==w+'x'+h){
      this.mmK=k;m.dataset.w=w+'x'+h;m.style.width=w+'px';m.style.height=h+'px';m.width=w*2;m.height=h*2;
    }
    const x=m.getContext('2d');x.setTransform(2,0,0,2,0,0);x.clearRect(0,0,w,h);
    x.lineCap='round';x.lineJoin='round';x.strokeStyle=this.col;x.globalAlpha=.85;x.lineWidth=Math.max(.8,k*.35);
    x.beginPath();
    for(const a of this.arrows){
      if(a.removed)continue;
      x.moveTo(a.pc[0][0]*k,a.pc[0][1]*k);for(let i=1;i<a.pc.length;i++)x.lineTo(a.pc[i][0]*k,a.pc[i][1]*k);
    }
    x.stroke();x.globalAlpha=1;
    const rx=clamp(-this.ox/c*k,0,w),ry=clamp(-this.oy/c*k,0,h),rw=Math.min(w-rx,this.vw/c*k),rh=Math.min(h-ry,this.vh/c*k);
    x.fillStyle='rgba(255,255,255,.1)';x.fillRect(rx,ry,rw,rh);
    x.strokeStyle=this.acc;x.lineWidth=1.5;x.strokeRect(rx+.75,ry+.75,Math.max(2,rw-1.5),Math.max(2,rh-1.5));
  }
}

function monthKind(y,m){
  const now=new Date(),ni=now.getFullYear()*12+now.getMonth(),i=y*12+m,si=START.y*12+START.m;
  return i<si?'off':i>ni?'fut':i===ni?'cur':'past';
}
function monthDays(y,m){ // oynanabilir gün sayısı ve çözülen
  const dim=new Date(y,m+1,0).getDate(),tk=keyOf(0);let total=0,done=0;
  for(let d=1;d<=dim;d++){const k=dkey(y,m,d);if(k>=START_KEY&&k<=tk){total++;if(save.days[k])done++}}
  return{total,done};
}
function monthBadges(y,m){
  const pd=(save.packs[ym(y,m)]||[]).filter(x=>x>0).length,md=monthDays(y,m),kind=monthKind(y,m);
  return{pack:pd===100,days:kind==='past'&&md.total>0&&md.done===md.total,pd,md};
}

/* ---------- oyun ---------- */
function resolve(src){
  if(src.t==='lvl'){
    const D=DIFFS[src.di];
    return{lv:makeLevel(src.di,src.li),hearts:D.hearts,acc:D.accent,line:D.line,key:`${GEN_VER}:l:${src.di}:${src.li}`,
      title:`<b style="color:${D.accent}">${D.name}</b> · Bölüm ${src.li+1}`,label:`${D.name} · Bölüm ${src.li+1}`,back:'Bölümler'};
  }
  if(src.t==='pack'){
    const M=MONTHS[src.m],k=src.y*12+src.m;
    return{lv:makeFrom(PACK,src.li,777000+k*10007),hearts:PACK.hearts,acc:M[1],line:mix(M[1],.3),key:`${GEN_VER}:p:${ym(src.y,src.m)}:${src.li}`,
      title:`<b style="color:${M[1]}">${M[0]}</b> · Paket ${src.li+1}`,label:`${M[0]} paketi · Bölüm ${src.li+1}`,back:'Takvim'};
  }
  const p=parseKey(src.key),df=dayDiff(src.key),dow=new Date(p.y,p.m,p.d).getDay();
  return{lv:makeFrom(DAILY,Math.round(df.t*99),31337+dayNum(src.key)*101),hearts:DAILY.hearts,acc:'#fbbf24',line:'#ffd978',key:`${GEN_VER}:d:${src.key}`,
    title:`<b style="color:#fbbf24">Günlük</b> · ${p.d} ${MONTHS[p.m][0].slice(0,3)}`,label:`${WDF[dow]} · ${DIFFS[df.idx].name}`,back:'Geri'};
}
function nextSrc(src){
  if(src.t==='lvl')return src.li+1<100?{t:'lvl',di:src.di,li:src.li+1}:(src.di+1<4?{t:'lvl',di:src.di+1,li:0}:null);
  if(src.t==='pack')return src.li+1<100?{t:'pack',y:src.y,m:src.m,li:src.li+1}:null;
  return null;
}
function startGame(src,o={}){
  $('#board').classList.remove('over');closeSheet();{const c=$('#confetti');c.getContext('2d').clearRect(0,0,c.width,c.height)}
  const R=resolve(src);
  G={src,R,hearts:R.hearts,max:R.hearts,mistakes:0,hintUsed:false,over:false};
  board=new Board($('#gcv'),R.lv,{col:R.line,acc:R.acc,view:true,mm:$('#mm')});
  $('#game').style.setProperty('--c',R.acc);
  if(src.t==='lvl'){save.last=[src.di,src.li]}
  if(o.fresh)save.snap=null;
  persist();
  if(curScreen==='game')navReplace({s:'game'});else navPush({s:'game'});
  show('game');fit(true);
  const sn=save.snap;
  if(sn&&sn.k===R.key&&!o.fresh){
    for(const id of sn.h){const a=board.arrows[id];if(a&&!a.removed)board.removeInstant(a)}
    G.hearts=sn.hearts;G.mistakes=sn.m;G.hintUsed=sn.hu;for(const id of sn.x||[]){if(board.arrows[id])board.arrows[id].hit=true}board.kick();
    if(sn.h.length)toast('Kaldığın yerden devam ediyorsun');
  }
  hud();
}
function saveSnap(){save.snap={k:G.R.key,h:board.history.slice(),hearts:G.hearts,m:G.mistakes,hu:G.hintUsed,x:board.arrows.filter(a=>a.hit).map(a=>a.id)};persist()}
function fit(first){
  if(!board)return;const el=$('#board');if(!el.clientWidth)return;
  board.setView(el.clientWidth,el.clientHeight);
  if(first)board.initCam();else{board.cell=clamp(board.cell,board.minScale(),72);board.clampCam()}
  board.kick();
}
function hud(first){
  $('#gTitle').innerHTML=G.R.title;
  $('#hearts').innerHTML=Array.from({length:G.max},(_,i)=>
    `<svg class="h ${i<G.hearts?'':'lost'} ${(i===G.hearts&&first==='hit')?'hit':''}" viewBox="0 0 24 24"><path d="${I.heart}"/></svg>`).join('');
  $('#gLeft').textContent=board.left;
  $('#gBar').style.width=((1-board.left/board.arrows.length)*100)+'%';
}
function pick(fx,fy){
  const cx=Math.floor(fx),cy=Math.floor(fy);let best=null,bd=.85;
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    const x=cx+dx,y=cy+dy;if(x<0||y<0||x>=board.cols||y>=board.rows)continue;
    const id=board.occ[y*board.cols+x];if(id<0)continue;
    const d=Math.hypot(fx-(x+.5),fy-(y+.5));if(d<bd){bd=d;best=board.arrows[id]}
  }
  return best;
}
function tap(cx,cy){
  if(!G||G.over)return;audio();
  const r=$('#gcv').getBoundingClientRect(),a=pick((cx-r.left-board.ox)/board.cell,(cy-r.top-board.oy)/board.cell);
  if(!a)return;const now=performance.now(),b=board.blocker(a);
  if(b<0){
    board.remove(a,now);const ratio=1-board.left/board.arrows.length;
    sfx.ok(ratio);vib(12);hud();saveSnap();
    if(board.left===0){G.over=true;setTimeout(win,700)}
  }else{
    if(now-a.shake<450)return;
    a.shake=now;const B=board.arrows[b];B.flash=now;
    const hc=B.pc.find((p,i)=>board.occ[B.cells[i]]===b)||B.pc[0];
    board.rayFx={t0:now,a,b:[hc[0],hc[1]]};board.kick();
    if(a.hit){sfx.hint();vib(15);toast('Bu ok için can zaten gitti');return} // aynı okta ikinci kez can gitmez
    a.hit=true;G.hearts--;G.mistakes++;sfx.bad();vib([40,40,40]);hud('hit');
    if(G.hearts<=0){G.over=true;save.snap=null;persist();$('#board').classList.add('over');setTimeout(lose,700)}else saveSnap();
  }
}
/* dokunma: tek parmak sürükle = gez, iki parmak = yakınlaştır, kısa dokunuş = ok seç */
(function(){
  const cv=$('#gcv'),ptrs=new Map();let sx=0,sy=0,t0=0,moved=false,vx=0,vy=0,lt=0,pd=0,pcx=0,pcy=0;
  const rel=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  const two=()=>{const p=[...ptrs.values()];return{d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)||1,x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2}};
  cv.addEventListener('pointerdown',e=>{
    if(!board)return;try{cv.setPointerCapture(e.pointerId)}catch(_){}
    const[x,y]=rel(e);ptrs.set(e.pointerId,{x,y});board.vel=null;board.tw=null;
    if(ptrs.size===1){sx=e.clientX;sy=e.clientY;t0=e.timeStamp;moved=false;vx=vy=0;lt=e.timeStamp}
    else if(ptrs.size===2){moved=true;const t=two();pd=t.d;pcx=t.x;pcy=t.y}
  });
  cv.addEventListener('pointermove',e=>{
    const p=ptrs.get(e.pointerId);if(!p||!board)return;
    const[x,y]=rel(e),dx=x-p.x,dy=y-p.y;p.x=x;p.y=y;
    if(ptrs.size===1){
      if(!moved&&Math.hypot(e.clientX-sx,e.clientY-sy)<8)return;
      moved=true;cv.style.cursor='grabbing';board.panBy(dx,dy);
      const dt=Math.max(1,e.timeStamp-lt);lt=e.timeStamp;vx=.7*vx+.3*dx/dt;vy=.7*vy+.3*dy/dt;
    }else if(ptrs.size===2){
      const t=two();board.zoomAt(t.x,t.y,board.cell*t.d/pd);board.panBy(t.x-pcx,t.y-pcy);pd=t.d;pcx=t.x;pcy=t.y;
    }
  });
  const up=e=>{
    if(!ptrs.has(e.pointerId))return;const n=ptrs.size;ptrs.delete(e.pointerId);cv.style.cursor='grab';
    if(n===1&&board){
      if(!moved&&e.timeStamp-t0<600)tap(e.clientX,e.clientY);
      else if(moved&&e.timeStamp-lt<80&&Math.hypot(vx,vy)>.15)board.vel={x:vx,y:vy},board.kick();
    }else if(n===2){const r=[...ptrs.values()][0];if(r){sx=0;sy=0}}
  };
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  cv.addEventListener('wheel',e=>{if(!board)return;e.preventDefault();const[x,y]=rel(e);board.zoomAt(x,y,board.cell*(e.deltaY<0?1.15:1/1.15))},{passive:false});
  const mm=$('#mm');let down=false;
  const go=e=>{if(!board||!board.mmK)return;const r=mm.getBoundingClientRect();board.centerOn((e.clientX-r.left)/board.mmK,(e.clientY-r.top)/board.mmK,false)};
  mm.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();try{mm.setPointerCapture(e.pointerId)}catch(_){}down=true;go(e)});
  mm.addEventListener('pointermove',e=>{if(down)go(e)});
  mm.addEventListener('pointerup',()=>down=false);mm.addEventListener('pointercancel',()=>down=false);
})();
function undo(){
  if(!G||G.over||!board.history.length)return;
  const a=board.arrows[board.history.pop()];board.restore(a,performance.now());vib(8);hud();saveSnap();
}
function hint(){
  if(!G||G.over)return;const a=board.bestHint();if(!a)return;
  G.hintUsed=true;board.hint={id:a.id,until:performance.now()+3000};sfx.hint();
  const h=a.pc[a.pc.length-1],sx=board.ox+h[0]*board.cell,sy=board.oy+h[1]*board.cell;
  if(sx<40||sy<40||sx>board.vw-40||sy>board.vh-40)board.centerOn(h[0],h[1],true);
  board.kick();saveSnap();
}
function zoom(f){if(!board)return;board.zoomAt(board.vw/2,board.vh/2,board.cell*f)}
function win(){
  const R=G.R,src=G.src;let n=3-(G.mistakes>0?1:0)-(G.hintUsed?1:0);n=Math.max(1,n);
  const info=G.mistakes?`${G.mistakes} hata`:'Hatasız',msg=n===3?'Kusursuz!':n===2?'Güzel iş!':'Bitirdin!';
  const starsHtml=`<div class="stars">${[0,1,2].map(i=>`<svg viewBox="0 0 24 24" class="${i<n?'on':''}" style="animation-delay:${.15+i*.18}s"><path d="${I.star}"/></svg>`).join('')}</div>`;
  save.snap=null;sfx.win();vib([30,50,30,50,80]);confetti(R.acc);
  if(src.t==='day'){
    const cur=save.days[src.key]||0;if(n>cur)save.days[src.key]=n;persist();
    sheet(`<h3>Günün bulmacası tamam!</h3>${starsHtml}<div class="meta">${R.label} · ${info}<br>Günlük seri: <b style="color:#fb923c">${streakNow()} gün</b></div>
      <button class="btn p" data-act="home">Ana sayfa</button><div class="two"><button class="btn" data-act="again">Tekrar oyna</button><button class="btn" data-act="levels">Geri</button></div>`,true);
    return;
  }
  if(src.t==='pack'){const a=packArr(ym(src.y,src.m));if(n>a[src.li])a[src.li]=n}
  else{const cur=save.stars[src.di][src.li];if(n>cur)save.stars[src.di][src.li]=n}
  const nx=nextSrc(src);G.next=nx;
  if(src.t==='lvl')save.last=nx?[nx.di,nx.li]:[src.di,src.li];
  persist();
  const nextLabel=nx?(nx.t==='lvl'&&nx.di!==src.di?DIFFS[nx.di].name+' seviyesine geç':'Sonraki bölüm'):'';
  sheet(`<h3>${msg}</h3>${starsHtml}<div class="meta">${R.label} · ${info}${G.hintUsed?' · ipucu kullanıldı':''}</div>
    ${nx?`<button class="btn p" data-act="next">${nextLabel}</button>`:`<div class="meta">Bu serinin sonuna geldin. Tebrikler!</div>`}
    <button class="btn" data-act="again">Tekrar oyna</button>
    <div class="two"><button class="btn" data-act="levels">${R.back}</button><button class="btn" data-act="home">Ana sayfa</button></div>`,true);
}
function lose(){
  sfx.lose();
  const left=board?board.left:0,tot=board?board.arrows.length:0;
  sheet(`<h3 style="color:#ff8da0">Oyun bitti</h3><div class="meta">Tüm canların gitti.<br>${tot-left} / ${tot} ok çıkarıldı. Önü kapalı oklara dikkat et; ipucu tıkanan oku gösterir.</div>
    <button class="btn p" data-act="again">Yeniden başlat</button>
    <div class="two"><button class="btn" data-act="levels">${G.R.back==='Geri'?'Geri dön':G.R.back+' menüsü'}</button><button class="btn" data-act="home">Ana sayfa</button></div>`,true);
}

/* ---------- paneller ---------- */
let lockSheet=false;
function sheet(html,lock){$('#panel').innerHTML=html;lockSheet=!!lock;$('#sheet').classList.add('on')}
function closeSheet(){$('#sheet').classList.remove('on')}
function helpSheet(){
  sheet(`<h3>Nasıl oynanır?</h3>
    <div class="step"><span class="n">1</span><span>Bir oka dokun. Okun gittiği yol boşsa ok kayıp çıkar.</span></div>
    <div class="step"><span class="n">2</span><span>Yol doluysa bir kalp gider. Kalpler biterse bölümü baştan oynarsın.</span></div>
    <div class="step"><span class="n">3</span><span>Haritada gezmek için parmağını basılı tutup sürükle. İki parmakla yakınlaştır.</span></div>
    <div class="step"><span class="n">4</span><span>Büyük haritada köşedeki mini haritaya dokunarak istediğin yere atla. Harita düğmesiyle onu kapatabilirsin.</span></div>
    <div class="step"><span class="n">5</span><span>Hatasız ve ipucusuz bitirirsen 3 yıldız. Yarım bıraktığın bölüm kaydedilir.</span></div>
    <div class="tip">Takılırsan <b>İpucu</b> çıkabilecek oku gösterir.</div>
    <button class="btn p" data-act="close">Anladım</button>`);
  save.seen=true;persist();
}
function settingsSheet(){
  const row=(k,t,s)=>`<div class="row" data-act="tog" data-k="${k}"><div>${t}<small>${s}</small></div><div class="sw ${save.set[k]?'on':''}"></div></div>`;
  sheet(`<h3>Ayarlar</h3>${row('sound','Ses','Kaydırma ve uyarı sesleri')}${row('vib','Titreşim','Dokunma geri bildirimi (Android)')}
    ${row('all','Tüm bölümleri aç','Sırayla açılma kuralını kaldırır')}
    <button class="btn d" data-act="reset">İlerlemeyi sıfırla</button><button class="btn p" data-act="close">Tamam</button>`);
}
function welcomeSheet(first){
  sheet(`<h3>${first?'Hoş geldin!':'Yeni oyuncu'}</h3><p class="note">Bir takma ad yaz. İlerlemen, yıldızların ve serin bu isme özel kaydedilir; başkası kendi adıyla sıfırdan başlar.</p>
    <input class="inp" id="nick" maxlength="16" placeholder="Takma adın" autocomplete="off" autocapitalize="words" spellcheck="false">
    <div class="err" id="nerr"></div><button class="btn p" data-act="pstart">Başla</button>${first?'':'<button class="btn" data-act="plist">Vazgeç</button>'}`,true);
  setTimeout(()=>{const i=$('#nick');if(i)i.focus()},120);
}
function profileSheet(){
  const me=curP();
  const rows=prof.list.map(p=>`<button class="prow ${p.id===prof.cur?'on':''}" data-act="pswitch" data-id="${p.id}">${avatar(p)}<span><b>${esc(p.name)}</b><small>${profStars(p.id)} / 400 bölüm</small></span>${p.id===prof.cur?`<span class="ck">${IC.check}</span>`:''}</button>`).join('');
  sheet(`<h3>Oyuncular</h3><div>${rows}</div>
    <button class="btn p" data-act="pnew">+ Yeni oyuncu ekle</button>
    <div class="two"><button class="btn" data-act="pren">Adı değiştir</button><button class="btn" data-act="pexp">Kodla taşı</button></div>
    <button class="btn d" data-act="pdel">${esc(me.name)} oyuncusunu sil</button><button class="btn" data-act="close">Kapat</button>`);
}
function submitNick(rename){
  const n=cleanName($('#nick').value),err=$('#nerr');
  if(n.length<2){err.textContent='En az 2 harf yaz.';return}
  if(nameTaken(n,rename?prof.cur:null)){err.textContent='Bu ad bu cihazda kullanılıyor, başka bir ad dene.';return}
  if(rename){curP().name=n;saveProf();closeSheet();renderHome();toast('Adın değişti');return}
  const first=!prof.list.length;createProfile(n);closeSheet();show('home');
  if(first||!save.seen)setTimeout(helpSheet,350);else toast('Merhaba '+n+'!');
}
function exportSheet(){
  let code='';try{code='OKLAR1.'+btoa(unescape(encodeURIComponent(JSON.stringify(save))))}catch(e){}
  sheet(`<h3>İlerlemeyi taşı</h3><p class="note">Bu kodu başka telefonda "Kodu yükle" ile yapıştırırsan kaldığın yerden devam edersin. Kodu sadece kendine ver.</p>
    <textarea class="inp" id="code" readonly>${code}</textarea>
    <button class="btn p" data-act="pcopy">Kodu kopyala</button>
    <button class="btn" data-act="pimp">Kodu yükle</button><button class="btn" data-act="plist">Geri</button>`);
}
function importSheet(){
  sheet(`<h3>Kodu yükle</h3><p class="note">Başka cihazdan aldığın kodu yapıştır. <b>${esc(curP().name)}</b> oyuncusunun şu anki ilerlemesi bu kodla değişir.</p>
    <textarea class="inp" id="code" placeholder="OKLAR1...." spellcheck="false"></textarea><div class="err" id="nerr"></div>
    <button class="btn p" data-act="pdoimp">Yükle</button><button class="btn" data-act="pexp">Geri</button>`,true);
}
const acts={
  pstart(){submitNick(false)},
  plist:profileSheet,
  pnew(){welcomeSheet(false)},
  pswitch(b){const id=b.dataset.id;if(id!==prof.cur){selectProfile(id);closeSheet();renderHome();show('home');toast('Merhaba '+curP().name+'!')}else closeSheet()},
  pren(){sheet(`<h3>Adı değiştir</h3><input class="inp" id="nick" maxlength="16" value="${esc(curP().name)}" autocomplete="off" spellcheck="false"><div class="err" id="nerr"></div>
    <button class="btn p" data-act="prensave">Kaydet</button><button class="btn" data-act="plist">Vazgeç</button>`,true)},
  prensave(){submitNick(true)},
  pdel(){const me=curP();if(!confirm(me.name+' oyuncusu ve tüm ilerlemesi silinsin mi?'))return;
    try{localStorage.removeItem(pKey(me.id))}catch(e){}
    prof.list=prof.list.filter(p=>p.id!==me.id);prof.cur=null;saveProf();
    if(prof.list.length){selectProfile(prof.list[0].id);closeSheet();renderHome()}else{save=defSave();KEY=pKey('none');closeSheet();renderHome();welcomeSheet(true)}},
  pexp:exportSheet,pimp:importSheet,
  async pcopy(){const t=$('#code').value;try{await navigator.clipboard.writeText(t);toast('Kod kopyalandı')}catch(e){$('#code').select();toast('Kodu seçili, elle kopyala')}},
  pdoimp(){
    const t=$('#code').value.trim(),err=$('#nerr');
    try{
      if(!t.startsWith('OKLAR1.'))throw 0;
      const o=JSON.parse(decodeURIComponent(escape(atob(t.slice(7)))));
      if(!o||!o.stars||o.stars.length!==4)throw 0;
      const d=defSave();save={...d,...o,set:{...d.set,...o.set},packs:o.packs||{},days:o.days||{},snap:null};persist();closeSheet();renderHome();toast('İlerleme yüklendi');
    }catch(e){err.textContent='Kod geçersiz. Tamamını yapıştırdığından emin ol.'}
  },
  close:closeSheet,
  tog(b){const k=b.dataset.k;save.set[k]=!save.set[k];persist();settingsSheet();sndIcon();if(k==='sound'&&save.set.sound)sfx.ok(.3)},
  reset(){if(confirm(curP().name+' oyuncusunun tüm ilerlemesi silinsin mi?')){save=defSave();save.seen=true;persist();closeSheet();if(curScreen==='home')renderHome();else if(curScreen==='cal')renderCal()}},
  next(){if(G.next)startGame(G.next)},
  again(){startGame(G.src,{fresh:true})},
  home(){goHome()},
  levels(){closeSheet();goBack()}
};
$('#panel').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)acts[b.dataset.act](b)});
$('#panel').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='nick'){e.preventDefault();const b=$('#panel [data-act=pstart],#panel [data-act=prensave]');if(b)b.click()}});
$('#who').onclick=()=>{if(curP())profileSheet()};
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet'&&!lockSheet)closeSheet()});

/* ---------- konfeti ---------- */
function confetti(acc){
  const c=$('#confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=[acc,'#ffd166','#aab4f5','#ffffff','#fb7185'];
  const ps=Array.from({length:90},()=>({x:innerWidth/2,y:innerHeight*.42,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,r:Math.random()*5+3,c:cols[(Math.random()*cols.length)|0],a:Math.random()*6}));
  let f=0;(function step(){
    x.clearRect(0,0,c.width,c.height);
    for(const p of ps){p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.vx*=.99;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.globalAlpha=Math.max(0,1-f/110);x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()}
    if(++f<110)requestAnimationFrame(step);else x.clearRect(0,0,c.width,c.height);
  })();
}

/* ---------- bağlantılar ---------- */
$('#bHelp').onclick=helpSheet;$('#bSet').onclick=settingsSheet;
$('#bSnd').onclick=()=>{save.set.sound=!save.set.sound;persist();sndIcon();if(save.set.sound)sfx.ok(.3)};
$('#bCont').onclick=()=>{audio();const[d,l]=save.last;startGame({t:'lvl',di:d,li:unlocked(d,l)?l:nextOf(d)})};
$('#bShare').onclick=async()=>{
  const url=location.href.split('#')[0];
  try{if(navigator.share){await navigator.share({title:'Oklar',text:'Oklar bulmacasını dene: hepsini dışarı çıkar!',url});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(url);toast('Bağlantı kopyalandı')}catch(e){toast(url)}
};
$('#lBack').onclick=goBack;$('#lHome').onclick=goHome;
$('#gBack').onclick=goBack;$('#gHome').onclick=goHome;
$('#gRestart').onclick=()=>startGame(G.src,{fresh:true});
$('#gUndo').onclick=undo;$('#gHint').onclick=hint;
$('#mmBtn').onclick=()=>{save.set.map=save.set.map===false;persist();$('#mmBtn').classList.toggle('off',save.set.map===false);if(board){board.mmK=0;const m=$('#mm');if(save.set.map===false)m.style.display='none';board.kick()}};
$('#gZi').onclick=()=>zoom(1.4);$('#gZo').onclick=()=>zoom(1/1.4);
addEventListener('resize',()=>{if(curScreen==='game')fit(false);else if(curScreen==='home')startHero()});
['gesturestart','gesturechange'].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
document.addEventListener('contextmenu',e=>e.preventDefault());
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
show('home');
if(!curP())setTimeout(()=>welcomeSheet(true),250);
else if(!save.seen)setTimeout(helpSheet,500);

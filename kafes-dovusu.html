<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kafes Dövüşü</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Düzen: tek ekran arcade. Üstte HUD, ortada kafes sahnesi, altta üç büyük dokunma düğmesi. Bilerek tek temalı (koyu arcade). */
:root{
  --bg:#14121a; --panel:#221e2c; --ink:#f3ecd8; --dim:#9a93a8; --line:#3a3348;
  --red:#d3382f; --amber:#f2b632; --green:#58c25a; --blue:#2e6fd0;
  --px:'Press Start 2P', ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#app{width:100%;max-width:520px;height:100%;margin:0 auto;display:flex;flex-direction:column;gap:8px;min-height:0}
#hud{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:start;font-family:var(--px);font-size:8px;line-height:1.4;flex:none}
.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.side.r{text-align:right}
.bar{height:12px;background:#0b0a10;border:2px solid var(--line)}
.bar i{display:block;height:100%;width:100%;background:var(--green)}
.bar.sp{height:8px;margin-top:4px}
.bar.sp i{background:var(--amber);width:0}
.mid{text-align:center;font-size:7px;color:var(--dim);min-width:84px}
#venue{color:var(--amber);margin-top:3px}
#combo{margin-top:5px;color:var(--amber);height:10px}
#stage{position:relative;width:100%;aspect-ratio:4/3;border:3px solid var(--line);background:#000;flex:none;overflow:hidden}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#callout{position:absolute;left:0;right:0;top:10%;text-align:center;font-family:var(--px);font-size:17px;color:#fff;text-shadow:3px 3px 0 #000;pointer-events:none;opacity:0}
#ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px;text-align:center;background:rgba(10,8,16,.88)}
#ov h1{font-family:var(--px);font-size:24px;line-height:1.3;margin:0;color:var(--amber);text-shadow:3px 3px 0 #000}
#ov h2{font-family:var(--px);font-size:16px;line-height:1.3;margin:0;color:var(--amber);text-shadow:3px 3px 0 #000}
#ov p{margin:0;font-size:13px;line-height:1.4;max-width:34ch}
#ov .tag{font-family:var(--px);font-size:8px;color:var(--dim)}
#ov .vs{font-family:var(--px);font-size:9px;line-height:1.6}
#ov .vs span{color:var(--red)}
#ov b{color:var(--amber)}
.go{font-family:var(--px);font-size:11px;color:#fff;background:var(--red);border:3px solid #000;box-shadow:0 5px 0 #000;padding:12px 16px;margin-top:4px;cursor:pointer;touch-action:manipulation}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 #000}
#tk{display:flex;gap:8px;align-items:stretch;flex:none}
#ticker{flex:1;min-width:0;font-size:13px;line-height:1.35;min-height:2.9em;background:var(--panel);border:2px solid var(--line);padding:6px 8px;display:flex;align-items:center}
#snd{font-family:var(--px);font-size:7px;color:var(--dim);background:var(--panel);border:2px solid var(--line);padding:0 8px;cursor:pointer;touch-action:manipulation}
#ctl{flex:1;min-height:104px;display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px}
.b{position:relative;font-family:var(--px);font-size:11px;line-height:1.5;color:#fff;border:3px solid #000;border-radius:0;box-shadow:0 5px 0 #000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden;touch-action:none;cursor:pointer}
.b small{font-size:7px;opacity:.8}
.b:active,.b.on{transform:translateY(4px);box-shadow:0 1px 0 #000}
#bBlock{background:var(--blue)}
#bPunch{background:var(--red);font-size:14px}
#bSpecial{background:#5b4a1e;color:#a79a72}
#bSpecial.rdy{background:var(--amber);color:#2a1d00;animation:pl .5s steps(2) infinite}
@keyframes pl{50%{filter:brightness(1.35)}}
.st{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.45)}
.st i{display:block;height:100%;width:100%;background:#9fd0ff}
.b:focus-visible,.go:focus-visible,#snd:focus-visible{outline:3px solid #fff;outline-offset:2px}
@media (prefers-reduced-motion:reduce){#bSpecial.rdy{animation:none}}
@media (max-width:380px){#ov h1{font-size:19px}#ov p{font-size:12px}}
</style>

</head>
<body>
<div id="app">
  <div id="hud">
    <div class="side"><div class="nm" id="pn">MÜHENDİS</div><div class="bar"><i id="phpb"></i></div><div class="bar sp"><i id="spb"></i></div></div>
    <div class="mid"><div id="round">MAÇ 1/3</div><div id="venue">OTOPARK</div></div>
    <div class="side r"><div class="nm" id="en">ZABITA ZEKİ</div><div class="bar"><i id="ehpb"></i></div><div id="combo"></div></div>
  </div>
  <div id="stage">
    <canvas id="cv" width="200" height="150" aria-label="Kafes dövüşü sahnesi"></canvas>
    <div id="callout"></div>
    <div id="ov"></div>
  </div>
  <div id="tk"><div id="ticker">Belediye Personeli Turnuvası kafesi kuruldu. Hakem mesai kartını basıyor.</div><button id="snd" type="button">SES<br>AÇIK</button></div>
  <div id="ctl">
    <button class="b" id="bBlock" type="button">SAVUN<small>BASILI TUT</small><span class="st"><i id="stb"></i></span></button>
    <button class="b" id="bSpecial" type="button">DİLEKÇE<small>DOLUNCA</small></button>
    <button class="b" id="bPunch" type="button">YUMRUK<small>DOKUN</small></button>
  </div>
</div>
<script>
const W=200,H=150,cv=document.getElementById('cv'),cx=cv.getContext('2d');
cx.imageSmoothingEnabled=false;
let C=cx;
const R=(x,y,w,h,c)=>{C.fillStyle=c;C.fillRect(Math.round(x),Math.round(y),w,h)};
const RM=(m,d,o,y,w,h,c)=>R(d>0?m+o:m-o-w,y,w,h,c);
function off(fn){const o=document.createElement('canvas');o.width=W;o.height=H;const prev=C;C=o.getContext('2d');fn();C=prev;return o}
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
function blob(x,y,r,c){for(let dy=-r;dy<=r;dy++){const w=Math.floor(Math.sqrt(r*r-dy*dy));R(x-w,y+dy,w*2,1,c)}}
function car(x,y,col){R(x,y+8,34,10,col);R(x+8,y,18,9,col);R(x+10,y+2,14,6,'#a9c3d6');R(x+4,y+16,7,7,'#111');R(x+23,y+16,7,7,'#111');R(x+32,y+10,2,3,'#ffe9a0');R(x,y+10,2,3,'#d33')}

const BG=[
off(()=>{ /* OTOPARK */
  R(0,0,W,112,'#5d6169');R(0,0,W,14,'#43474f');
  for(let x=14;x<W;x+=46){R(x,4,26,3,'#e9f3c8');R(x-2,7,30,2,'rgba(233,243,200,.25)')}
  [18,100,182].forEach(x=>{R(x,14,14,98,'#7a808a');R(x+11,14,3,98,'#5a5f68');for(let j=0;j<4;j++)R(x,88+j*6,14,3,j%2?'#222':'#e7b81c')});
  R(60,30,18,18,'#1f55b0');R(66,34,3,10,'#fff');R(66,34,7,3,'#fff');R(70,37,3,3,'#fff');R(66,40,7,2,'#fff');
  car(30,86,'#a8352f');car(130,86,'#2f5f9e');car(-8,90,'#d6c24a');
  R(0,112,W,38,'#3a3c43');
  for(let x=8;x<W;x+=34)for(let i=0;i<22;i++)R(x+i,112+i,2,1,'#d8d8d0');
  R(10,128,180,1,'#e8c33a');R(0,142,W,8,'#2a2b30');
}),
off(()=>{ /* KÖPRÜ ALTI */
  ['#0a1030','#0e1738','#13204a','#1a2c5c','#22386c'].forEach((c,i)=>R(0,i*18,W,18,c));
  for(let i=0;i<14;i++){const h=14+Math.floor(rnd()*26),x=i*15;R(x,86-h,12,h,'#101a3e');for(let k=0;k<4;k++)if(rnd()>.4)R(x+2+(k%2)*5,86-h+4+Math.floor(k/2)*7,2,2,'#f3c44f')}
  [[150,40],[184,34]].forEach(([x,h])=>{R(x,86-h,3,h,'#1a2650');R(x-1,86-h+8,5,2,'#1a2650');R(x,86-h-6,3,6,'#1a2650');R(x+1,86-h-9,1,3,'#1a2650')});
  R(120,70,22,16,'#16224a');for(let r=0;r<6;r++)R(131-(2+r),64+r,4+r*2,1,'#16224a');
  R(0,86,W,26,'#102a5c');for(let i=0;i<40;i++)R(Math.floor(rnd()*W),88+Math.floor(rnd()*22),6+Math.floor(rnd()*8),1,'#2f5aa0');
  R(0,0,W,12,'#1b1d23');R(0,12,W,3,'#31343c');
  for(let x=0;x<W;x+=24)for(let i=0;i<22;i++){R(x+i,15+i,2,1,'#2b2e36');R(x+24-i,15+i,2,1,'#2b2e36')}
  R(10,15,16,97,'#4b4e57');R(22,15,4,97,'#363942');R(172,15,16,97,'#4b4e57');R(184,15,4,97,'#363942');
  R(12,60,12,3,'#e4457b');R(14,64,8,3,'#35c4d9');R(12,68,10,2,'#f2c618');
  for(let r=5;r>0;r--){C.globalAlpha=.07;R(100-r*7,22-r*2,r*14,r*5,'#ffb347')}C.globalAlpha=1;R(97,15,6,4,'#ffd27a');
  R(0,112,W,38,'#2b2e3a');
  for(let i=0;i<26;i++)R(Math.floor(rnd()*W),114+Math.floor(rnd()*20),2,6+Math.floor(rnd()*10),'rgba(255,170,80,.18)');
  R(10,128,180,1,'#6f7a9a');R(0,142,W,8,'#1c1e27');
}),
off(()=>{ /* ORMAN */
  R(0,0,W,112,'#1b3a26');
  for(let i=0;i<10;i++)R(i*22+rnd()*8,10,5,102,'#2e5238');
  for(let y=0;y<112;y++){C.fillStyle='rgba(255,238,170,.10)';C.fillRect(Math.round(50+y*.5),y,22,1);C.fillRect(Math.round(120+y*.4),y,14,1)}
  [10,56,104,150,188].forEach(x=>{R(x,8,9,104,'#4a3524');R(x+6,8,3,104,'#382718');R(x-3,100,15,12,'#4a3524')});
  for(let i=0;i<9;i++)blob(i*24,6+rnd()*10,16+rnd()*8,i%2?'#245c34':'#2e7040');
  R(0,76,W,12,'rgba(205,235,215,.10)');
  R(0,112,W,38,'#3f5a2a');R(14,120,172,20,'#5a4a30');
  for(let i=0;i<70;i++)R(rnd()*W,114+rnd()*34,2,1,rnd()>.5?'#b5651d':'#d9a441');
  [[12,136],[176,140]].forEach(([x,y])=>{R(x,y,5,2,'#d33');R(x+1,y-1,3,1,'#d33');R(x+1,y,1,1,'#fff');R(x+2,y+2,2,3,'#eee')});
  R(0,144,W,6,'#2d4220');
})
];
const FENCE=off(()=>{
  for(let x=-112;x<W;x+=7)for(let i=0;i<112;i++){R(x+i,i,1,1,'rgba(214,224,236,.28)');R(x+112-i,i,1,1,'rgba(214,224,236,.28)')}
  R(0,0,W,3,'#a7adb6');R(0,3,W,1,'#4d525b');R(0,109,W,3,'#a7adb6');R(0,112,W,1,'#4d525b');
});
function posts(){
  R(0,0,6,H,'#a02a2a');R(0,0,2,H,'#d05050');R(0,46,6,10,'#eee');R(0,90,6,10,'#eee');
  R(194,0,6,H,'#2a4fa0');R(198,0,2,H,'#5080d0');R(194,46,6,10,'#eee');R(194,90,6,10,'#eee');
}

function drawFighter(f,dir,tm){
  const L=f.look,st=f.dispSt,fy=f.y,fl=f.flash>0,wd=L.wide||0;
  const sk=fl?'#fff':L.skin,sh=fl?'#fff':L.shirt,pa=fl?'#fff':L.pants,gl=fl?'#fff':L.glove;
  const c=f.x+(st==='punch'?5*dir:0);
  const bob=(st==='idle'||st==='guard'||st==='block')?Math.round(Math.sin(tm*6+f.ph)):0;
  const lean=st==='hit'?-3:(st==='punch'?3:(st==='windup'?-2:(st==='stun'?-2:0)));
  if(st==='ko'){
    RM(c,dir,-12,fy-1,34,2,'rgba(0,0,0,.4)');
    RM(c,dir,-33,fy-10,10,9,sk);RM(c,dir,-34,fy-13,11,4,L.hatc||L.hair||sk);
    RM(c,dir,-23,fy-9,14,8,sh);RM(c,dir,-9,fy-8,13,6,pa);RM(c,dir,4,fy-7,3,5,L.shoe);
    RM(c,dir,-29,fy-7,2,2,'#111');
    for(let i=0;i<3;i++){const a=tm*4+i*2.1;R(f.x+Math.cos(a)*(dir>0?-24:24)*.8-1+dir*-12,fy-18+Math.sin(a)*3,2,2,'#ffd23f')}
    return;
  }
  RM(c,dir,-11,fy-1,22,2,'rgba(0,0,0,.4)');
  const sw=st==='idle'?Math.round(Math.sin(tm*6+f.ph)):0;
  RM(c,dir,-5-sw,fy-14,4,12,pa);RM(c,dir,-6-sw,fy-2,6,2,L.shoe);
  RM(c,dir,1+sw,fy-14,4,12,pa);RM(c,dir,0+sw,fy-2,7,2,L.shoe);
  RM(c,dir,-8-wd+lean,fy-29+bob,3,11,sk);RM(c,dir,-9-wd+lean,fy-19+bob,4,4,gl);
  RM(c,dir,-6-wd+lean,fy-30+bob,12+wd*2,16,sh);
  RM(c,dir,-6-wd+lean,fy-15+bob,12+wd*2,2,'#222');
  if(L.vest){RM(c,dir,-6-wd+lean,fy-26+bob,12+wd*2,2,'#e8e8e0');RM(c,dir,-6-wd+lean,fy-21+bob,12+wd*2,2,'#e8e8e0')}
  if(L.badge)RM(c,dir,2+lean,fy-27+bob,2,2,'#f2c618');
  if(L.whistle)RM(c,dir,3+lean,fy-23+bob,2,3,'#eee');
  if(L.tie)RM(c,dir,0+lean,fy-29+bob,2,10,'#e8c33a');
  const hx=-5+lean,hy=fy-41+bob,ang=(st==='windup'||st==='punch');
  RM(c,dir,hx,hy,10,10,sk);
  RM(c,dir,hx+6,hy+4,2,2,'#111');
  if(ang)RM(c,dir,hx+5,hy+2,4,1,'#111');
  RM(c,dir,hx+6,hy+7,3,st==='hit'?2:1,st==='hit'?'#611':'#a33');
  switch(L.hat){
    case 'hard':RM(c,dir,hx-1,hy-4,12,5,'#f2c618');RM(c,dir,hx-1,hy,15,1,'#d9a800');RM(c,dir,hx+3,hy-4,2,5,'#d9a800');break;
    case 'cap':RM(c,dir,hx-1,hy-3,11,4,'#1f2f5a');RM(c,dir,hx+7,hy,6,1,'#111');RM(c,dir,hx+4,hy-2,2,2,'#f2c618');break;
    case 'bun':RM(c,dir,hx-1,hy-2,11,4,L.hair);RM(c,dir,hx-5,hy-5,5,5,L.hair);RM(c,dir,hx+5,hy+3,5,1,'#222');RM(c,dir,hx+5,hy+5,5,1,'#222');RM(c,dir,hx+6,hy+4,3,1,'#9cf');break;
    case 'straw':RM(c,dir,hx-4,hy-1,19,2,'#d9b45a');RM(c,dir,hx,hy-5,10,5,'#e6c36e');RM(c,dir,hx,hy-2,10,1,'#8a5a2b');break;
  }
  if(L.must)RM(c,dir,hx+5,hy+6,5,1,'#222');
  if(L.beard)RM(c,dir,hx+2,hy+8,8,4,'#c4c4c4');
  const ay=fy-29+bob;
  if(st==='punch'){RM(c,dir,5+lean,ay+2,13,4,sk);RM(c,dir,17+lean,ay,6,7,gl)}
  else if(st==='windup'){RM(c,dir,-9+lean,ay-6,3,10,sk);RM(c,dir,-11+lean,ay-11,6,6,gl)}
  else if(st==='block'||st==='guard'){RM(c,dir,4+lean,ay-8,4,10,sk);RM(c,dir,3+lean,ay-14,7,7,gl);RM(c,dir,-1+lean,ay-10,5,4,gl)}
  else{RM(c,dir,4+lean,ay+2,3,7,sk);RM(c,dir,3+lean,ay+7,6,6,gl)}
  if(st==='guard'||st==='block'){C.globalAlpha=.35;RM(c,dir,10,fy-48,5,38,'#4ab0ff');C.globalAlpha=1}
  if(st==='stun'){for(let i=0;i<3;i++){const a=tm*5+i*2.1;R(c+Math.cos(a)*8-1,hy-8+Math.sin(a)*2,2,2,'#ffd23f')}}
}
function drawBang(x,y){R(x-1,y-1,6,11,'#000');R(x-1,y+11,6,6,'#000');R(x,y,4,9,'#ff3b30');R(x,y+12,4,4,'#ff3b30')}
const $=id=>document.getElementById(id);
const rr=(a,b)=>a+Math.random()*(b-a);
const LOOK_P={skin:'#e0ac82',shirt:'#f08a24',pants:'#2f4a7a',glove:'#d83a34',shoe:'#222',hat:'hard',vest:1,hatc:'#f2c618'};
const LV=[
 {name:'ZABITA ZEKİ',venue:'OTOPARK',bg:0,hp:80,dmg:9,idle:[1.0,1.9],wind:.6,guard:.15,dbl:0,intr:1,
  desc:'Kaçak park cezası kesmeden uyuyamaz. Düdüğü ölümcül.',

 {name:'MÜDÜR MUALLA',venue:'KÖPRÜ ALTI',bg:1,hp:100,dmg:11,idle:[.9,1.6],wind:.5,guard:.25,dbl:.3,intr:.5,
  desc:'Gece mesaisi faturası keser. Bazen arka arkaya iki kez vurur!',

 {name:'BAHÇIVAN BEKİR',venue:'ORMAN',bg:2,hp:130,dmg:13,idle:[.8,1.4],wind:.45,guard:.3,dbl:.35,intr:.25,
  desc:'Hasır şapkalı, çelik yumruklu. Ormanın tek hâkimi.',
  look:{skin:'#c88e63',shirt:'#3d6b3a',pants:'#5b4b2a',glove:'#8a5a2b',shoe:'#2a1d10',hat:'straw',beard:1,wide:2,hatc:'#e6c36e'}}
];
const LINES={
 hit:['Yumruk geldi, dilekçe yok!','Bu darbe evrak kaydına girdi.','İmzalı ve mühürlü yumruk!','Matbu form bulunamadı, doğaçlama vurdu.'],
 hurt:['Kırmızı kart değil, kırmızı kalem!','Bu darbe için randevu almamıştın.','Tribünler "e-Devlet çöktü" diye bağırıyor.','Hakem sayıyor ama sıra numarası yok.'],
 block:['Dosya iade edildi: eksik evrak!','Mükemmel savunma, rötar yok.','Darbe, görev alanı dışı olduğu için reddedildi.'],
 perfect:['KUSURSUZ! Rakip kendi evrakına dolandı.','Tam zamanında savunma, mühür bastın!','Rakip sersemledi, kafesin sigortası attı.'],
 guard:['Rakip korumada! Mavi parlayana vurma.','Duvara vurdun, duvarın da mesai saati var.'],

 idle:['Çay ocağından "taze demlendi" sesi geliyor.','Seyirciler simit paylaşıyor.','Hakem mesai kartını basıyor.','Bir kedi kafesin üstünden geçti, kimse şaşırmadı.','Tribünde biri hâlâ sıra numarası bekliyor.']
};
const G={mode:'menu',lv:0,t:0,lock:0,shake:0,best:0,mute:false,parts:[],pops:[],lastSay:0,endT:0};
let P,E;
function mkF(x,look,hp){return{x,y:134,look,hp,max:hp,st:'idle',t:0,flash:0,ph:Math.random()*6,dispSt:'idle',chain:0}}
function newPlayer(){P=mkF(84,LOOK_P,100);Object.assign(P,{cd:0,sp:0,block:false,blockT:0,stam:100,combo:0,comboT:0,stunT:0,stT:0})}
function setEnemy(i){const L=LV[i];E=mkF(116,L.look,L.hp);E.t=1.2}
newPlayer();setEnemy(0);

/* ses */
let AC=null;
function snd(f,d,type,v,sl){if(G.mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=type||'square';o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sl),t+d);g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(t+d)}catch(e){}}
const buzz=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}};
function say(k,force){const n=performance.now();if(!force&&n-G.lastSay<1500)return;G.lastSay=n;const a=LINES[k];$('ticker').textContent=a[Math.floor(Math.random()*a.length)]}
function call(txt,col){const el=$('callout');el.textContent=txt;el.style.color=col||'#fff';if(el.animate)el.animate([{opacity:1,transform:'scale(1.25)'},{opacity:1,transform:'scale(1)',offset:.2},{opacity:0,transform:'scale(1)'}],{duration:900,fill:'forwards'});else el.style.opacity=1}
function pop(x,y,txt,col){G.pops.push({x,y,txt,col:col||'#fff',t:.9})}
function sparks(x,y,c){for(let i=0;i<8;i++)G.parts.push({x,y,vx:rr(-60,60),vy:rr(-70,10),g:200,w:2,h:2,c,life:.35})}
function papers(){for(let i=0;i<12;i++)G.parts.push({x:P.x+14,y:rr(88,108),vx:rr(110,190),vy:rr(-50,10),g:60,w:5,h:4,c:'#f5f5ee',life:.7})}
function hurt(f,d){f.hp=Math.max(0,f.hp-d);f.flash=.12;pop(f.x,84,'-'+d,f===P?'#ff6b5e':'#ffd23f')}

/* oyuncu eylemleri */
function doPunch(){
  if(G.mode!=='fight'||G.lock>0)return;
  if(P.cd>0||P.stunT>0||P.block||E.st==='ko')return;
  P.st='punch';P.stT=.17;P.cd=.3;
  if(E.st==='guard'){P.stunT=.55;P.combo=0;pop(E.x-4,76,'KORUMA!','#6fb7ff');snd(120,.15,'sawtooth',.06);say('guard');G.shake=2;return}
  const L=LV[G.lv],d=5+Math.min(P.combo,5)+Math.floor(Math.random()*3);
  hurt(E,d);P.combo++;P.comboT=1.1;P.sp=Math.min(100,P.sp+8);G.best=Math.max(G.best,P.combo);
  snd(180+Math.random()*60,.08,'square',.07,-80);G.shake=2;sparks(E.x-8,100,'#ffd23f');buzz(12);
  if(E.st==='windup'){if(Math.random()<L.intr){E.st='hit';E.t=.3;E.chain=0}}
  else if(E.st==='idle'||E.st==='punch'){E.st='hit';E.t=.25;E.chain=0}
  if(Math.random()<.3)say('hit');
}
function doSpecial(){
  if(G.mode!=='fight'||G.lock>0||P.sp<100||P.stunT>0||E.st==='ko')return;
  P.sp=0;P.st='punch';P.stT=.4;P.block=false;papers();
  hurt(E,28);E.st='stun';E.t=1.3;E.chain=0;G.shake=6;
  call('DİLEKÇE İMZALANDI!','#ffd23f');snd(500,.25,'triangle',.08,500);buzz(40);say('special',true);
}
function blockOn(){if(G.mode!=='fight'||G.lock>0||P.stunT>0||P.stam<6)return;P.block=true;P.blockT=0;$('bBlock').classList.add('on')}
function blockOff(){P.block=false;$('bBlock').classList.remove('on')}

/* rakip yapay zekası */
function strike(){
  const L=LV[G.lv],dmg=L.dmg+Math.floor(Math.random()*3);
  E.st='punch';E.t=.28;
  if(P.block&&P.stunT<=0){
    if(P.blockT<.32){pop(P.x+10,76,'KUSURSUZ!','#6fe3ff');call('KUSURSUZ!','#6fe3ff');E.st='stun';E.t=1.1;E.chain=0;P.sp=Math.min(100,P.sp+18);say('perfect',true);snd(700,.12,'triangle',.08,400);G.shake=3;sparks(P.x+12,100,'#6fe3ff')}
    else{hurt(P,Math.ceil(dmg*.2));P.sp=Math.min(100,P.sp+8);snd(140,.1,'square',.06);say('block');G.shake=2}
  }else{
    hurt(P,dmg);P.st='hit';P.stT=.3;P.combo=0;G.shake=6;sparks(P.x+10,100,'#ff6b5e');snd(110,.18,'sawtooth',.09,-50);buzz(40);say('hurt');
  }
}
function enemyAI(dt){
  const L=LV[G.lv];E.flash=Math.max(0,E.flash-dt);
  if(E.st==='ko')return;
  E.t-=dt;if(E.t>0)return;
  switch(E.st){
    case 'idle':
      if(Math.random()<L.guard){E.st='guard';E.t=.75}
      else{E.st='windup';E.t=L.wind;E.chain=Math.random()<L.dbl?1:0;snd(320,.08,'square',.04)}
      break;
    case 'guard':E.st='idle';E.t=rr(.4,.9);break;
    case 'windup':strike();break;
    case 'punch':
      if(E.chain>0){E.chain--;E.st='windup';E.t=.32;snd(320,.08,'square',.04)}
      else{E.st='idle';E.t=rr(L.idle[0],L.idle[1])}
      break;
    case 'hit':
      if(Math.random()<.35){E.st='windup';E.t=L.wind*.8;E.chain=0;snd(320,.08,'square',.04)}
      else{E.st='idle';E.t=rr(.35,.8)}
      break;
    case 'stun':E.st='idle';E.t=rr(.6,1);break;
  }
}

/* ekranlar */
function showOv(h){const o=$('ov');o.innerHTML=h;o.style.display='flex'}
function hideOv(){$('ov').style.display='none'}
function title(){
  G.mode='menu';G.lv=0;setEnemy(0);newPlayer();updHud(true);
  showOv('<h1>KAFES<br>DÖVÜŞÜ</h1><span class="tag">BELEDİYE PERSONELİ TURNUVASI</span>'+
  '<p><b>YUMRUK</b>: dokun, kombo yap. Rakip mavi parlıyorsa korumada, vurma!</p>'+
  '<p><b>SAVUN</b>: basılı tut. Rakip "!" yapınca son anda bas: kusursuz savunma rakibi sersemletir.</p>'+
  '<p><b>DİLEKÇE</b>: sarı bar dolunca fırlat.</p>'+
  '<button class="go" data-act="intro" type="button">TURNUVAYA GİR</button>');
}
function intro(){
  const L=LV[G.lv];G.mode='intro';setEnemy(G.lv);updHud(true);
  showOv('<span class="tag">MAÇ '+(G.lv+1)+'/3'+(G.lv===2?' • FİNAL':'')+'</span><h2>'+L.venue+'</h2>'+
  '<div class="vs">MÜHENDİS <span>VS</span><br>'+L.name+'</div><p>'+L.desc+'</p>'+
  '<button class="go" data-act="fight" type="button">HAZIRIM</button>');
}
function startFight(){
  hideOv();G.mode='fight';G.lock=2.4;G.parts=[];G.pops=[];
  Object.assign(P,{st:'idle',stT:0,cd:0,block:false,blockT:0,stam:100,combo:0,comboT:0,stunT:0,flash:0});
  $('bBlock').classList.remove('on');G.lastCount=5;updHud(true);
}
function endFight(win){
  G.mode='end';G.endT=1.6;G.win=win;
  if(win){E.st='ko';call('K.O.!','#ffd23f');snd(200,.5,'sawtooth',.09,-150);buzz(80)}
  else{P.st='ko';call('MESAİ BİTTİ','#ff6b5e');snd(160,.6,'sawtooth',.09,-110)}
}
function resultOv(){
  if(G.win){
    if(G.lv>=2){showOv('<h1>ŞAMPİYON!</h1><p>Terfi geldi: <b>Daire Başkanı Yardımcısı Vekili (Geçici)</b>. Maaş farkı bir sonraki dönemde.</p><span class="tag">EN YÜKSEK KOMBO: '+G.best+'</span><button class="go" data-act="title" type="button">YENİDEN OYNA</button>')}
    else{showOv('<h2>KAZANDIN!</h2><p>Çay molası: <b>+40 can</b>. Seyirciler simit atıyor.</p><span class="tag">EN YÜKSEK KOMBO: '+G.best+'</span><button class="go" data-act="next" type="button">SIRADAKİ MAÇ</button>')}
  }else{
    showOv('<h2>MESAİ BİTTİ</h2><p>Hakem seni çay ocağına taşıdı. Bir bardak çay iyi gelir.</p><button class="go" data-act="retry" type="button">TEKRAR DENE</button>');
  }
}
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;
  snd(440,.07,'square',.05);
  switch(b.dataset.act){
    case 'intro':G.lv=0;intro();break;
    case 'fight':startFight();break;
    case 'next':G.lv++;P.hp=Math.min(100,P.hp+40);intro();break;
    case 'retry':P.hp=100;P.sp=0;intro();break;
    case 'title':title();break;
  }
});

/* HUD */
function barCol(r){return r>.5?'#58c25a':r>.25?'#f2b632':'#e0463c'}
function updHud(names){
  if(names){const L=LV[G.lv];$('en').textContent=L.name;$('venue').textContent=L.venue;$('round').textContent='MAÇ '+(G.lv+1)+'/3'}
  const pr=P.hp/P.max,er=E.hp/E.max;
  $('phpb').style.width=(pr*100)+'%';$('phpb').style.background=barCol(pr);
  $('ehpb').style.width=(er*100)+'%';$('ehpb').style.background=barCol(er);
  $('spb').style.width=P.sp+'%';
  $('combo').textContent=P.combo>1?P.combo+'x KOMBO':'';
  $('bSpecial').classList.toggle('rdy',P.sp>=100&&G.mode==='fight');
  $('stb').style.width=P.stam+'%';
}

/* güncelleme ve çizim */
let last=0,idleT=0;
function update(dt){
  P.flash=Math.max(0,P.flash-dt);P.cd=Math.max(0,P.cd-dt);P.stunT=Math.max(0,P.stunT-dt);
  if(P.comboT>0){P.comboT-=dt;if(P.comboT<=0)P.combo=0}
  if(P.stT>0){P.stT-=dt;if(P.stT<=0&&P.st!=='ko')P.st='idle'}
  if(G.mode==='fight'){
    if(G.lock>0){
      G.lock-=dt;const n=Math.max(1,Math.ceil(G.lock/.6));
      if(n!==G.lastCount&&G.lock>0){G.lastCount=n;const t=['','DÖVÜŞ!','1','2','3'][n];call(t,n===1?'#ffd23f':'#fff');snd(n===1?660:330,.12,'square',.06)}
      if(G.lock<=0){G.lock=0}
    }else{
      if(P.block){
        P.blockT+=dt;P.stam-=45*dt;
        if(P.stam<=0||P.stunT>0){P.stam=Math.max(0,P.stam);blockOff()}
      }else P.stam=Math.min(100,P.stam+28*dt);
      enemyAI(dt);
      idleT+=dt;if(idleT>7){idleT=0;say('idle')}
      if(E.hp<=0)endFight(true);else if(P.hp<=0)endFight(false);
    }
  }else if(G.mode==='end'){
    E.flash=Math.max(0,E.flash-dt);G.endT-=dt;if(G.endT<=0){G.mode='result';resultOv()}
  }else{E.flash=Math.max(0,E.flash-dt)}
  G.parts=G.parts.filter(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.life-=dt;return p.life>0});
  G.pops=G.pops.filter(p=>{p.y-=18*dt;p.t-=dt;return p.t>0});
}
function draw(){
  C=cx;const tm=G.t;
  P.dispSt=P.st==='ko'?'ko':(P.stunT>0?'stun':(P.block?'block':P.st));
  E.dispSt=E.st;
  C.save();
  if(G.shake>0){C.translate(Math.round((Math.random()-.5)*G.shake*2),Math.round((Math.random()-.5)*G.shake*2));G.shake=Math.max(0,G.shake-.4)}
  C.drawImage(BG[LV[G.lv].bg],0,0);C.drawImage(FENCE,0,0);
  drawFighter(P,1,tm);drawFighter(E,-1,tm);
  if(E.st==='windup'&&Math.floor(tm*14)%2===0)drawBang(E.x-2,60);
  G.parts.forEach(p=>R(p.x,p.y,p.w,p.h,p.c));
  C.font='8px "Press Start 2P", monospace';C.textAlign='center';C.lineWidth=3;C.strokeStyle='#000';C.lineJoin='round';
  G.pops.forEach(p=>{const x=Math.max(36,Math.min(164,p.x));C.strokeText(p.txt,x,p.y);C.fillStyle=p.col;C.fillText(p.txt,x,p.y)});
  C.restore();
  posts();
}
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;G.t+=dt;
  update(dt);draw();updHud(false);
  requestAnimationFrame(frame);
}

/* girdi */
const bind=(id,down,up)=>{const el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();down()});if(up){['pointerup','pointercancel','pointerleave'].forEach(n=>el.addEventListener(n,up))}};
bind('bPunch',doPunch);bind('bSpecial',doSpecial);bind('bBlock',blockOn,blockOff);
window.addEventListener('pointerup',blockOff);window.addEventListener('blur',blockOff);
window.addEventListener('keydown',e=>{if(e.repeat)return;const k=e.key.toLowerCase();if(k==='j'||k===' '){e.preventDefault();doPunch()}else if(k==='k'||k==='shift')blockOn();else if(k==='l')doSpecial()});
window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='k'||k==='shift')blockOff()});
document.addEventListener('contextmenu',e=>e.preventDefault());
$('snd').addEventListener('click',()=>{G.mute=!G.mute;$('snd').innerHTML=G.mute?'SES<br>KAPALI':'SES<br>AÇIK'});
try{document.fonts&&document.fonts.load('8px "Press Start 2P"')}catch(e){}
title();
requestAnimationFrame(frame);
</script>
</body>
</html>

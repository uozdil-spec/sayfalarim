<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kelime Avı ve Hafıza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--bg:#eef2f9;--card:#fff;--ink:#0f1a3d;--mute:#5a6585;--acc:#2346b5;--acc-ink:#fff;--acc2:#e3eafb;--line:#d3dbee;--lg:80%;--warn:#d9822b;--saf:#ffc531;--turq:#3cd0c2;--coral:#ff7a66;--navy:#14307f;--navy2:#0d1f5c;--disp:"Baloo 2",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0c1230;--card:#161f4a;--ink:#eef1fb;--mute:#9aa6cf;--acc:#7d98ff;--acc-ink:#0a1030;--acc2:#202c66;--line:#2b3770;--lg:36%}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:480px;margin:0 auto;padding:16px 14px 32px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.hero{background:radial-gradient(120% 90% at 50% 0%,#1f46b0 0%,var(--navy) 45%,var(--navy2) 100%);border-radius:28px;padding:22px 18px;text-align:center;color:#fff;box-shadow:0 8px 0 -3px rgba(15,26,61,.22)}
.tiles{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;width:min(100%,340px);margin:0 auto 18px}
.tile{aspect-ratio:1;display:grid;place-items:center;background:#f4f7fb;color:#16276b;border-radius:10px;box-shadow:0 3px 0 rgba(0,0,0,.28);font:800 clamp(1.05rem,5.6vw,1.5rem)/1 var(--disp);cursor:pointer;user-select:none;-webkit-user-select:none}
.tile span{display:block;padding-top:.12em}
.tile.lit{animation:lit .6s cubic-bezier(.3,1.5,.5,1) var(--d) both}
.tile.lit.done{animation:none;background:var(--lc);color:var(--lt)}
.tile span.b{animation:bump .32s}
@keyframes lit{45%{transform:scale(1.2) rotate(-4deg)}100%{transform:scale(1);background:var(--lc);color:var(--lt)}}
@keyframes bump{40%{transform:translateY(-6px) scale(1.25)}}
@media (prefers-reduced-motion:reduce){.tile.lit{animation:none;background:var(--lc);color:var(--lt)}.tile span.b{animation:none}}
.hero h1{margin:0;font:800 clamp(1.9rem,8.5vw,2.5rem)/1.02 var(--disp)}
.hero p{margin:8px 0 0;color:#c4d1ff;font-size:1rem}
.menu h2{font:700 1.1rem var(--disp);margin:24px 0 10px;color:var(--ink)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:4px}
.mode{position:relative;text-align:left;border:0;border-radius:22px;padding:14px 14px 16px;color:#0f1a3d;display:flex;flex-direction:column;gap:6px;opacity:.82;filter:saturate(.75);transition:opacity .15s,transform .15s,box-shadow .15s;box-shadow:0 4px 0 rgba(15,26,61,.22)}
.mode b{font:800 1.3rem/1.05 var(--disp)}
.mode small{font-size:.82rem;line-height:1.3;opacity:.85}
.mode.ws{background:var(--turq)}
.mode.mem{background:var(--coral)}
.mode.on{opacity:1;filter:none;transform:translateY(-3px);box-shadow:0 7px 0 rgba(15,26,61,.3),0 0 0 3px var(--bg),0 0 0 6px var(--acc)}
.mode.on::after{content:"✓";position:absolute;top:10px;right:12px;width:24px;height:24px;border-radius:50%;background:#0f1a3d;color:#fff;font-size:.85rem;display:grid;place-items:center}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:10px 6px;border:1.5px solid var(--line);background:var(--card);border-radius:14px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.seg button.on,.chips button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.st{letter-spacing:.1em;font-size:.9rem;color:#d98f00}
.seg button.on .st{color:var(--acc-ink)}
.rail{position:relative;margin:0 -14px}
.rail::after{content:"";position:absolute;top:0;right:0;bottom:8px;width:34px;background:linear-gradient(90deg,transparent,var(--bg));pointer-events:none}
.chips{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:max-content;grid-template-rows:repeat(2,auto);gap:8px;overflow-x:auto;padding:2px 36px 8px 14px;scroll-snap-type:x proximity;scroll-padding-left:14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{white-space:nowrap;scroll-snap-align:start;padding:10px 14px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;font-size:.92rem}
.menu h2 small{font:600 .8rem system-ui,sans-serif;color:var(--mute);margin-left:8px}
.hgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:min(100%,340px);margin:0 auto 18px;perspective:700px}
.hc{aspect-ratio:1/.9;cursor:pointer}
.hi{position:relative;width:100%;height:100%;border-radius:12px;background:#2c4fc0;box-shadow:0 3px 0 rgba(0,0,0,.28);display:grid;place-items:center;color:#fff;font:800 1rem/1 var(--disp)}
.hi .q{font-size:1.4rem;opacity:.85}
.hi .f{position:absolute;opacity:0;color:#0f1a3d;font-size:1rem}
.hi .f.em{font-size:1.7rem}
.hi.lit{animation:flip .6s var(--d) both}
.hi.lit .q{animation:qh .6s var(--d) both}
.hi.lit .f{animation:fs .6s var(--d) both}
.hi.lit.done{animation:none;background:var(--lc)}
.hi.lit.done .q{animation:none;opacity:0}
.hi.lit.done .f{animation:none;opacity:1}
.hc.b{animation:bump .32s}
@keyframes flip{0%{transform:rotateY(0)}49%{background:#2c4fc0}50%{transform:rotateY(90deg);background:var(--lc)}100%{transform:rotateY(0);background:var(--lc)}}
@keyframes qh{0%,49%{opacity:.85}50%,100%{opacity:0}}
@keyframes fs{0%,49%{opacity:0}50%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.hi.lit{animation:none;background:var(--lc)}.hi.lit .q{animation:none;opacity:0}.hi.lit .f{animation:none;opacity:1}.hc.b{animation:none}}
.hint-text{margin:10px 2px 0;font-size:.88rem;color:var(--mute)}
.record{margin:18px 0 0;text-align:center;font-weight:600;color:var(--mute);font-size:.92rem}
.start{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:12px;padding:14px;border:0;border-radius:20px;background:var(--saf);color:#0f1a3d;font:800 1.6rem/1 var(--disp);box-shadow:0 6px 0 #c48f00;transition:transform .08s,box-shadow .08s}
.start:active{transform:translateY(5px);box-shadow:0 1px 0 #c48f00}
.start svg{width:22px;height:22px}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.bar .stat{flex:1;text-align:center;font-weight:600;font-variant-numeric:tabular-nums;font-size:.95rem}
.ibtn{padding:8px 12px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;font-size:.9rem}
.sub{text-align:center;color:var(--mute);font-size:.85rem;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:2px;background:var(--line);border:2px solid var(--line);border-radius:12px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;margin:0 auto;width:min(100%,460px)}
.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:var(--card);font-weight:700;font-size:var(--fs);cursor:pointer}
.cell.sel{background:var(--acc);color:var(--acc-ink)}
.cell.found{background:hsl(var(--h) 65% var(--lg))}
.cell.sel.found{background:var(--acc)}
.cell.hint{outline:3px solid var(--warn);outline-offset:-3px}
.words{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.words li{padding:5px 10px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:.85rem;font-weight:600}
.words li.ok{text-decoration:line-through;color:var(--mute);background:hsl(var(--h) 65% var(--lg));border-color:transparent}
.mgrid{display:grid;grid-template-columns:repeat(var(--c),1fr);gap:8px}
.card{border:1.5px solid var(--line);background:var(--acc);color:var(--acc-ink);border-radius:12px;min-height:76px;padding:6px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;line-height:1.2}
.card .q{font-size:1.6rem;opacity:.85}
.card .t{display:none}
.card.open,.card.done{background:var(--card);color:var(--ink);animation:pop .18s ease}
.card.open .q,.card.done .q{display:none}
.card.open .t,.card.done .t{display:block}
.card.done{background:var(--acc2);border-color:var(--acc)}
.mgrid.sq .card{aspect-ratio:1}
@keyframes pop{from{transform:scale(.92)}to{transform:scale(1)}}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal{background:var(--card);border-radius:18px;padding:22px;max-width:360px;width:100%;text-align:center}
.modal h3{margin:0 0 8px;font:800 1.5rem var(--disp)}
.modal p{margin:4px 0;color:var(--mute)}
.modal .big{font:800 2.4rem var(--disp);color:var(--acc);margin:10px 0}
.modal .row{display:flex;gap:8px;margin-top:16px}
.modal .row button{flex:1;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:600}
.modal .row button.p{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
</style>
</head>

function best(key,score){
  var b=0;
  try{b=+localStorage.getItem(key)||0;}catch(e){}
  var nb=score>b;
  if(nb){try{localStorage.setItem(key,String(score));}catch(e){}}
  return {best:Math.max(b,score),isNew:nb};
}

/* ---------- KELİME AVI ---------- */
function genGrid(words,n,dirs){
  var sorted = words.slice().sort(function(a,b){return b.length-a.length;});
  for(var attempt=0;attempt<300;attempt++){
    var grid = new Array(n*n).fill('');
    var placed = [];
    var ok = true;
    for(var wi=0;wi<sorted.length;wi++){
      var w = sorted[wi], chars = Array.from(w), len = chars.length, done = false;
      for(var t=0;t<500 && !done;t++){
        var d = dirs[rnd(dirs.length)];
        var r0 = d[0]===1 ? rnd(n-len+1) : d[0]===-1 ? len-1+rnd(n-len+1) : rnd(n);
        var c0 = d[1]===1 ? rnd(n-len+1) : d[1]===-1 ? len-1+rnd(n-len+1) : rnd(n);
        var cells = [], fits = true;
        for(var k=0;k<len;k++){
          var r=r0+d[0]*k, c=c0+d[1]*k, idx=r*n+c;
          if(grid[idx]!=='' && grid[idx]!==chars[k]){fits=false;break;}
          cells.push(idx);
        }
        if(fits){
          cells.forEach(function(idx,k){grid[idx]=chars[k];});
          placed.push({word:w,cells:cells});
          done = true;
        }
      }
      if(!done){ok=false;break;}
    }
    if(ok){
      for(var i=0;i<grid.length;i++) if(grid[i]==='') grid[i]=ALPHABET[rnd(ALPHABET.length)];
      return {grid:grid,placed:placed};
    }
  }
  return null;
}

function startWS(){
  var th = WS.find(function(t){return t.id===cfg.theme.ws;});
  var d = DIFF[cfg.diff], n = d.n;
  var pool = th.words.filter(function(w){return Array.from(w).length<=n;});
  var count = Math.min(d.words,pool.length);
  var g = null;
  while(!g){
    g = genGrid(shuffle(pool).slice(0,count),n,d.dirs);
    if(!g && count>3) count--;
  }
  var total = g.placed.length;
  var foundSet = {}, foundCount = 0, hints = 0;
  var fs = Math.round(Math.min(window.innerWidth-28,460)/n*0.52);

  app.innerHTML = barHtml()+
    '<p class="sub">'+th.emoji+' '+th.name+' · '+d.label+'</p>'+
    '<div class="grid" id="grid" style="--n:'+n+';--fs:'+fs+'px">'+
      g.grid.map(function(ch,i){return '<div class="cell" data-i="'+i+'">'+ch+'</div>';}).join('')+'</div>'+
    '<ul class="words" id="words">'+
      g.placed.slice().sort(function(a,b){return a.word.localeCompare(b.word,'tr');}).map(function(p){return '<li data-w="'+p.word+'">'+p.word+'</li>';}).join('')+'</ul>'+
    '<div style="text-align:center;margin-top:14px"><button class="ibtn" id="hint">💡 İpucu (−20 puan)</button></div>';
  wireBar();

  var statEl = $('#stat');
  function upd(){statEl.textContent='⏱ '+fmt(secs)+' · '+foundCount+'/'+total;}
  startTimer(upd);

  var gridEl = $('#grid');
  var cellEls = Array.prototype.slice.call(gridEl.children);

  function snap(a,b){
    var ar=Math.floor(a/n), ac=a%n, br=Math.floor(b/n), bc=b%n;
    var dr=br-ar, dc=bc-ac, adr=Math.abs(dr), adc=Math.abs(dc);
    if(adr===0 && adc===0) return [a];
    var sr=Math.sign(dr), sc=Math.sign(dc), steps;
    if(adr>=2*adc){sc=0;steps=adr;}
    else if(adc>=2*adr){sr=0;steps=adc;}
    else steps=Math.min(adr,adc);
    var out=[];
    for(var k=0;k<=steps;k++) out.push((ar+sr*k)*n+(ac+sc*k));
    return out;
  }

  var anchor=null, endIdx=null, dragging=false, moved=false;
  function idxFrom(e){
    var el = document.elementFromPoint(e.clientX,e.clientY);
    var c = el && el.closest ? el.closest('.cell') : null;
    return c && gridEl.contains(c) ? +c.getAttribute('data-i') : null;
  }
  function paint(){
    cellEls.forEach(function(c){c.classList.remove('sel');});
    if(anchor===null) return;
    snap(anchor,endIdx).forEach(function(i){cellEls[i].classList.add('sel');});
  }
  function clearSel(){anchor=null;endIdx=null;dragging=false;moved=false;paint();}

  function commit(){
    var line = snap(anchor,endIdx);
    var str = line.map(function(i){return g.grid[i];}).join('');
    var rev = Array.from(str).reverse().join('');
    var hit = g.placed.find(function(p){return !foundSet[p.word] && (p.word===str || p.word===rev);});
    clearSel();
    if(hit) markFound(hit);
  }
  function markFound(p){
    foundSet[p.word]=true; foundCount++;
    var h = (foundCount*47+20)%360;
    p.cells.forEach(function(i){
      cellEls[i].classList.add('found');
      cellEls[i].style.setProperty('--h',h);
    });
    var li = $('#words li[data-w="'+p.word+'"]');
    if(li){li.classList.add('ok');li.style.setProperty('--h',h);}
    upd();
    if(foundCount===total) finish();
  }
  function finish(){
    stopTimer();
    var score = Math.max(0,total*100+Math.max(0,total*40-secs)-hints*20);
    setTimeout(function(){
      showResult('Tebrikler! 🎉',['Tüm kelimeleri buldun.','Süre: '+fmt(secs)+(hints?' · İpucu: '+hints:'')],score,'kh:ws:'+cfg.theme.ws+':'+cfg.diff);
    },350);
  }

  gridEl.addEventListener('pointerdown',function(e){
    var i = idxFrom(e);
    if(i===null) return;
    e.preventDefault();
    if(anchor!==null && !dragging){
      if(i===anchor){clearSel();return;}
      endIdx=i; commit(); return;
    }
    anchor=i; endIdx=i; dragging=true; moved=false; paint();
  });
  gridEl.addEventListener('pointermove',function(e){
    if(!dragging) return;
    var i = idxFrom(e);
    if(i===null || i===endIdx) return;
    endIdx=i; if(i!==anchor) moved=true; paint();
  });
  function up(){
    if(!dragging) return;
    dragging=false;
    if(moved && endIdx!==anchor) commit(); else paint();
  }
  gridEl.addEventListener('pointerup',up);
  gridEl.addEventListener('pointercancel',function(){clearSel();});

  $('#hint').onclick=function(){
    var left = g.placed.filter(function(p){return !foundSet[p.word];});
    if(!left.length) return;
    var p = left[rnd(left.length)];
    hints++;
    var el = cellEls[p.cells[0]];
    el.classList.add('hint');
    setTimeout(function(){el.classList.remove('hint');},1800);
  };
}

  var d = DIFF[cfg.diff];
  var pairs = shuffle(th.pairs).slice(0,Math.min(d.pairs,th.pairs.length));
  var cards = [];
  pairs.forEach(function(p,i){cards.push({pid:i,t:p[0]});cards.push({pid:i,t:p[1]});});
  cards = shuffle(cards);
  var cols = th.wide ? 3 : (pairs.length<=6 ? 3 : 4);
  var total = pairs.length, matched = 0, moves = 0, first = null, lock = false;

  function fsFor(t){
    var l = Array.from(t).length;
    if(th.wide) return '.85rem';
    if(l<=3) return '1.8rem';
    if(l<=7) return '1rem';
    return '.82rem';
  }
  app.innerHTML = barHtml()+
    '<p class="sub">'+th.emoji+' '+th.name+' · '+d.label+'</p>'+
    '<div class="mgrid'+(th.wide?'':' sq')+'" id="mg" style="--c:'+cols+'">'+
      cards.map(function(c,i){return '<button class="card" data-i="'+i+'"><span class="q">?</span><span class="t" style="font-size:'+fsFor(c.t)+'">'+c.t+'</span></button>';}).join('')+'</div>';
  wireBar();

  var statEl = $('#stat');
  function upd(){statEl.textContent='⏱ '+fmt(secs)+' · Hamle '+moves+' · '+matched+'/'+total;}
  startTimer(upd);

  var els = Array.prototype.slice.call(document.querySelectorAll('.card'));
  $('#mg').addEventListener('click',function(e){
    var b = e.target.closest('.card');
    if(!b || lock) return;
    var i = +b.getAttribute('data-i');
    if(els[i].classList.contains('open') || els[i].classList.contains('done')) return;
    els[i].classList.add('open');
    if(first===null){first=i;return;}
    moves++;
    var a = first; first = null;
    if(cards[a].pid===cards[i].pid){
      els[a].classList.remove('open'); els[a].classList.add('done');
      els[i].classList.remove('open'); els[i].classList.add('done');
      matched++; upd();
      if(matched===total) finish();
    } else {
      lock = true; upd();
      setTimeout(function(){
        els[a].classList.remove('open'); els[i].classList.remove('open');
        lock = false;
      },900);
    }
  });
  function finish(){
    stopTimer();
    var score = Math.max(50,total*100-(moves-total)*10+Math.max(0,total*15-secs));
    setTimeout(function(){
      showResult('Harika! 🎉',['Tüm çiftleri buldun.','Süre: '+fmt(secs)+' · Hamle: '+moves],score,'kh:mem:'+cfg.theme.mem+':'+cfg.diff);
    },400);
  }
}

renderMenu();
</script>
</body>
</html>

<script>
(function(){
'use strict';

/* ================= OYUN MOTORU (kurallar + yapay zekâ) ================= */
/*ENGINE*/
function makeEngine(){
 var ADJ=[],MILLS=[],MOF=[],i,r,k,a,b;
 for(i=0;i<24;i++){ADJ.push([]);MOF.push([]);}
 for(r=0;r<3;r++)for(k=0;k<8;k++){a=r*8+k;b=r*8+(k+1)%8;ADJ[a].push(b);ADJ[b].push(a);}
 for(r=0;r<2;r++)for(k=1;k<8;k+=2){a=r*8+k;b=(r+1)*8+k;ADJ[a].push(b);ADJ[b].push(a);}
 for(r=0;r<3;r++)for(k=0;k<8;k+=2)MILLS.push([r*8+k,r*8+(k+1)%8,r*8+(k+2)%8]);
 for(k=1;k<8;k+=2)MILLS.push([k,8+k,16+k]);
 MILLS.forEach(function(m){m.forEach(function(p){MOF[p].push(m);});});

 function newState(){var bb=[],j;for(j=0;j<24;j++)bb.push(0);return {b:bb,hand:[0,9,9],on:[0,0,0],turn:1,noCap:0};}
 function clone(s){return {b:s.b.slice(),hand:s.hand.slice(),on:s.on.slice(),turn:s.turn,noCap:s.noCap};}
 function total(s,p){return s.hand[p]+s.on[p];}
 function flying(s,p){return s.hand[p]===0&&s.on[p]===3;}
 function isMillAt(bd,idx,p){var ms=MOF[idx],j,m;for(j=0;j<ms.length;j++){m=ms[j];if(bd[m[0]]===p&&bd[m[1]]===p&&bd[m[2]]===p)return true;}return false;}
 function removable(s,q){var out=[],all=[],j;for(j=0;j<24;j++)if(s.b[j]===q){all.push(j);if(!isMillAt(s.b,j,q))out.push(j);}return out.length?out:all;}
 function genMoves(s){
  var p=s.turn,bd=s.b,mv=[],q=3-p,f,t,j,ad;
  function add(ff,tt){
   if(ff>=0)bd[ff]=0;
   bd[tt]=p;var mill=isMillAt(bd,tt,p);bd[tt]=0;
   if(ff>=0)bd[ff]=p;
   if(mill){var rs=removable(s,q),x;for(x=0;x<rs.length;x++)mv.push([ff,tt,rs[x]]);}
   else mv.push([ff,tt,-1]);
  }
  if(s.hand[p]>0){for(t=0;t<24;t++)if(bd[t]===0)add(-1,t);}
  else if(flying(s,p)){for(f=0;f<24;f++)if(bd[f]===p)for(t=0;t<24;t++)if(bd[t]===0)add(f,t);}
  else{for(f=0;f<24;f++)if(bd[f]===p){ad=ADJ[f];for(j=0;j<ad.length;j++)if(bd[ad[j]]===0)add(f,ad[j]);}}
  return mv;
 }
 function doMove(s,m){var p=s.turn,f=m[0],t=m[1],rr=m[2];
  if(f<0){s.hand[p]--;s.on[p]++;}else s.b[f]=0;
  s.b[t]=p;
  if(rr>=0){s.b[rr]=0;s.on[3-p]--;}
  s.turn=3-p;}
 function undoMove(s,m){var p=3-s.turn,f=m[0],t=m[1],rr=m[2];
  s.turn=p;
  if(rr>=0){s.b[rr]=3-p;s.on[3-p]++;}
  s.b[t]=0;
  if(f<0){s.hand[p]++;s.on[p]--;}else s.b[f]=p;}
 function commit(s,m){doMove(s,m);if(m[0]<0||m[2]>=0)s.noCap=0;else s.noCap++;}
 function key(s){return s.b.join('')+s.turn;}
 function isLegal(s,m){var mv=genMoves(s),j;for(j=0;j<mv.length;j++)if(mv[j][0]===m[0]&&mv[j][1]===m[1]&&mv[j][2]===m[2])return true;return false;}
 function outcome(s){
  var p=s.turn;
  if(total(s,p)<3)return {winner:3-p,reason:'pieces'};
  if(s.hand[p]===0&&genMoves(s).length===0)return {winner:3-p,reason:'blocked'};
  return null;
 }
 function evaluate(s,me){
  var o=3-me,bd=s.b,j,v,m,c1,c2,e,x,sc=0,mm=0,mo=0,tm=0,to=0,ad,mobm=0,mobo=0;
  sc+=40*(total(s,me)-total(s,o));
  for(j=0;j<MILLS.length;j++){m=MILLS[j];c1=0;c2=0;e=0;
   for(x=0;x<3;x++){v=bd[m[x]];if(v===me)c1++;else if(v===o)c2++;else e++;}
   if(c1===3)mm++;else if(c2===3)mo++;else if(c1===2&&e===1)tm++;else if(c2===2&&e===1)to++;}
  sc+=12*(mm-mo)+10*(tm-to);
  if(s.hand[me]===0&&s.hand[o]===0){
   for(j=0;j<24;j++){v=bd[j];if(!v)continue;ad=ADJ[j];for(x=0;x<ad.length;x++)if(bd[ad[x]]===0){if(v===me)mobm++;else mobo++;}}
   sc+=2*(mobm-mobo);
  }else{
   for(j=0;j<24;j++){v=bd[j];if(v)sc+=(v===me?1:-1)*ADJ[j].length;}
  }
  return sc;
 }
 var WIN=100000,deadline=0,nodes=0,timeUp=false;
 function capFirst(x,y){return (y[2]>=0?1:0)-(x[2]>=0?1:0);}
 function negamax(s,d,alpha,beta,ply){
  if((++nodes&255)===0&&Date.now()>deadline)timeUp=true;
  if(timeUp)return 0;
  var p=s.turn;
  if(total(s,p)<3)return -WIN+ply;
  var mv=genMoves(s);
  if(!mv.length)return -WIN+ply;
  if(d===0)return evaluate(s,p);
  mv.sort(capFirst);
  var best=-1e9,j,v,m;
  for(j=0;j<mv.length;j++){
   m=mv[j];doMove(s,m);v=-negamax(s,d-1,-beta,-alpha,ply+1);undoMove(s,m);
   if(timeUp)return 0;
   if(v>best)best=v;
   if(v>alpha)alpha=v;
   if(alpha>=beta)break;
  }
  return best;
 }
 function shuffle(arr){var j,t,x;for(j=arr.length-1;j>0;j--){x=Math.floor(Math.random()*(j+1));t=arr[j];arr[j]=arr[x];arr[x]=t;}}
 function search(s0,maxD,ms,randP,rep){
  var s=clone(s0),mv=genMoves(s),j;
  if(!mv.length)return null;
  if(mv.length===1)return mv[0];
  if(randP&&Math.random()<randP){
   var caps=mv.filter(function(m){return m[2]>=0;});
   var pool=(caps.length&&Math.random()<0.6)?caps:mv;
   return pool[Math.floor(Math.random()*pool.length)];
  }
  shuffle(mv);mv.sort(capFirst);
  deadline=Date.now()+ms;timeUp=false;nodes=0;
  var best=mv[0],d,alpha,bm,bs,aborted,m,v,kk;
  for(d=1;d<=maxD;d++){
   alpha=-1e9;bm=null;bs=-1e9;aborted=false;
   for(j=0;j<mv.length;j++){
    m=mv[j];doMove(s,m);
    v=-negamax(s,d-1,-1e9,-alpha,1);
    if(timeUp){undoMove(s,m);aborted=true;break;}
    if(rep){kk=key(s);if(rep[kk])v-=25*rep[kk];}
    undoMove(s,m);
    if(v>bs){bs=v;bm=m;}
    if(v>alpha)alpha=v;
   }
   if(aborted||!bm)break;
   best=bm;
   mv.splice(mv.indexOf(bm),1);mv.unshift(bm);
   if(bs>WIN-200)break;
  }
  return best;
 }
 return {ADJ:ADJ,MILLS:MILLS,MOF:MOF,newState:newState,clone:clone,total:total,flying:flying,isMillAt:isMillAt,removable:removable,
  genMoves:genMoves,doMove:doMove,undoMove:undoMove,commit:commit,key:key,isLegal:isLegal,outcome:outcome,search:search};
}
/*ENGINE_END*/
var E=makeEngine();

/* ================= YARDIMCILAR ================= */
var $=function(s,r){return (r||document).querySelector(s);};

 set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}},del:function(k){try{localStorage.removeItem(k);}catch(e){}}};

/* ================= SES & TİTREŞİM ================= */
var AC=null,NB=null;
function audio(){
 if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;try{AC=new C();}catch(e){return null;}}
 if(AC.state==='suspended'&&AC.resume){try{AC.resume();}catch(e){}}
 return AC;
}
function tone(f1,f2,dur,type,vol,delay){
 var a=audio();if(!a||!S.sound)return;
 try{
  var t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f1,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol||.2,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.03);
 }catch(e){}
}
function noise(dur,vol,hp,delay){
 var a=audio();if(!a||!S.sound)return;
 try{
  if(!NB){NB=a.createBuffer(1,a.sampleRate*0.4,a.sampleRate);var d=NB.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  var t=a.currentTime+(delay||0),src=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
  src.buffer=NB;f.type='highpass';f.frequency.value=hp||1000;
  g.gain.setValueAtTime(vol||.2,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  src.connect(f);f.connect(g);g.connect(a.destination);src.start(t);src.stop(t+dur+.03);
 }catch(e){}
}

var GX=[],GY=[];
(function(){
 for(var r=0;r<3;r++){var a=r,b=6-r,c=3;

})();
var L={B:300,u:40,m:30,d:26,k:2.6,N:4,step:1.3};
var THEMES={
 bambu:{base:['#e0a15c','#c8803b','#d58f48'],grain:'122,62,18',lite:'255,218,165',line:'#1a0f08',edge:['#a86a31','#6b3a14'],pt:'#cb8a46',txt:'rgba(26,15,8,.55)'},

 gece:{base:['#191610','#0e0c09','#14110c'],grain:'0,0,0',lite:'120,100,60',line:'#a98544',edge:['#1b1710','#080705'],pt:'#15120d',txt:'rgba(169,133,68,.35)'}
};
function seeded(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function drawBoard(cv,th,size){
 var c=cv.getContext('2d'),R=seeded(7),x,i,T=THEMES[th];
 cv.width=cv.height=size;
 var g=c.createLinearGradient(0,0,size,size);g.addColorStop(0,T.base[0]);g.addColorStop(.5,T.base[1]);g.addColorStop(1,T.base[2]);
 c.fillStyle=g;c.fillRect(0,0,size,size);
 // bambu şeritleri
 x=0;
 while(x<size){var w=size*(0.012+R()*0.03);
  c.fillStyle='rgba('+(R()<.5?T.grain:T.lite)+','+(0.04+R()*0.09).toFixed(3)+')';c.fillRect(x,0,w,size);x+=w;}
 for(i=0;i<Math.round(size*0.35);i++){
  c.fillStyle='rgba('+T.grain+','+(0.05+R()*0.12).toFixed(3)+')';

function dur(ms){return S.anim==='off'?0:(S.anim==='fast'?ms*0.55:ms);}
function tween(ms,fn,done){
 if(ms<=0){fn(1);if(done)done();return;}
 var t0=null;
 function step(ts){if(t0===null)t0=ts;var t=Math.min(1,(ts-t0)/ms);fn(t);if(t<1)raf(step);else if(done)done();}
 raf(step);
}
function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}

function buildStatic(){

 plane.innerHTML='';
 edgeEls=[];ptEls=[];glEls=[];
 var i,el;
 for(i=0;i<5;i++){el=document.createElement('div');el.className='ed';plane.appendChild(el);edgeEls.push(el);}

}
function XY(i){return {x:L.m+GX[i]*L.u,y:L.m+GY[i]*L.u};}

function layout(){
 if(!stage||!stage.clientWidth)return;
 var body=stage.parentNode,col=getComputedStyle(body).flexDirection==='column';
 stage.style.flex='';stage.style.height='';body.style.justifyContent='';
 var W=stage.clientWidth,H=stage.clientHeight,tilt=S.tilt*Math.PI/180,k=L.k;
 var sn=Math.sin(tilt),cs=Math.cos(tilt),sb=k/(k-0.5*sn),stp=k/(k+0.5*sn);
 var bw=W*0.97/sb,bh=H*0.97/(0.5*cs*(sb+stp)+0.05);
 var B=Math.floor(Math.max(120,Math.min(bw,bh)));
 if(col){var needH=Math.ceil(B*(0.5*cs*(sb+stp)+0.06));if(needH<H){stage.style.flex='none';stage.style.height=needH+'px';body.style.justifyContent='center';H=needH;}}
 L.B=B;L.m=B*0.09;L.u=(B-2*L.m)/6;L.d=L.u*0.68;
 L.N=S.perf?2:4;L.step=Math.max(1,L.d*0.2/L.N);
 stage.style.webkitPerspective=(k*B)+'px';stage.style.perspective=(k*B)+'px';
 plane.style.width=plane.style.height=B+'px';
 var shift=0.25*B*cs*(sb-stp)+B*0.012;
 plane.style.left=((W-B)/2)+'px';plane.style.top=((H-B)/2-shift)+'px';
 tr(plane,'rotateX('+S.tilt+'deg)');
 var T=THEMES[S.theme],th=Math.max(4,B*0.024),rad=B*0.03,i,el;
 for(i=0;i<edgeEls.length;i++){el=edgeEls[i];el.style.width=el.style.height=B+'px';el.style.borderRadius=rad+'px';
  el.style.background=T.edge[i<2?0:1];tr(el,'translateZ('+(-(i+1)*th/edgeEls.length)+'px)');}
 var ts=S.perf?640:1024;
 if(G.texTheme!==S.theme||G.texSize!==ts){drawBoard(texCv,S.theme,ts);G.texTheme=S.theme;G.texSize=ts;}
 texCv.style.width=texCv.style.height=B+'px';texCv.style.borderRadius=rad+'px';
 var ps=Math.max(L.u*0.96,40);
 for(i=0;i<24;i++){var q=XY(i);el=ptEls[i];el.style.width=el.style.height=ps+'px';el.style.left=(q.x-ps/2)+'px';el.style.top=(q.y-ps/2)+'px';}
 var h=L.d*0.2;
 for(i=0;i<glEls.length;i++){var m=E.MILLS[i],p1=XY(m[0]),p3=XY(m[2]),dx=p3.x-p1.x,dy=p3.y-p1.y,len=Math.sqrt(dx*dx+dy*dy);
  el=glEls[i];el.style.width=len+'px';el.style.height=h+'px';
  tr(el,'translate3d('+p1.x+'px,'+(p1.y-h/2)+'px,3px) rotate('+Math.atan2(dy,dx)+'rad)');}
 var kk;for(kk in G.pcs)if(G.pcs.hasOwnProperty(kk))rebuildPieceSize(G.pcs[kk]);

/* taşlar */
function buildPieceEl(p){
 var el=p.el,s='',i,d=L.d;
 el.className='pc c'+p.col+(p.sel?' sel':'');
 el.style.width=el.style.height=d+'px';
 for(i=0;i<L.N;i++)s+='<i class="ly" style="-webkit-transform:translateZ('+(4+i*L.step)+'px);transform:translateZ('+(4+i*L.step)+'px)"></i>';
 s+='<i class="tp" style="-webkit-transform:translateZ('+(4+L.N*L.step)+'px);transform:translateZ('+(4+L.N*L.step)+'px)"></i>';
 el.innerHTML=s;
 var sh=p.sh,ss=d*1.3;sh.className='psh';sh.style.width=sh.style.height=ss+'px';
}
function rebuildPieceSize(p){buildPieceEl(p);}
function setP(p,x,y,z,sc){
 p.x=x;p.y=y;p.z=z;sc=sc===undefined?1:sc;
 var d=L.d,ss=d*1.3;
 tr(p.el,'translate3d('+(x-d/2)+'px,'+(y-d/2)+'px,'+z+'px)'+(sc!==1?' scale('+sc+')':''));
 var off=z*0.32;
 tr(p.sh,'translate3d('+(x-ss/2+d*0.07+off)+'px,'+(y-ss/2+d*0.1+off*1.2)+'px,1px)'+(sc!==1?' scale('+sc+')':''));
 p.sh.style.opacity=Math.max(.2,.95-z/(d*3.2));
}
function newPiece(col,idx){
 var p={col:col,idx:idx,el:document.createElement('div'),sh:document.createElement('div'),x:0,y:0,z:0,sel:false};
 buildPieceEl(p);plane.appendChild(p.sh);plane.appendChild(p.el);

}
function killPiece(p){if(p.el.parentNode)p.el.parentNode.removeChild(p.el);if(p.sh.parentNode)p.sh.parentNode.removeChild(p.sh);}
function repose(){
 var k,p,q;
 for(k in G.pcs)if(G.pcs.hasOwnProperty(k)){p=G.pcs[k];q=XY(p.idx);setP(p,q.x,q.y,p.sel?L.d*0.45:0,1);}
}
function clearDyn(){
 var kids=plane.children,i,rm=[];
 for(i=0;i<kids.length;i++){var c=kids[i].className||'';if(/\b(pc|psh|mk)\b/.test(c))rm.push(kids[i]);}
 rm.forEach(function(n){plane.removeChild(n);});
 G.pcs={};G.marks=[];
}
function render(){
 clearDyn();G.sel=-1;G.pend=null;
 for(var i=0;i<24;i++){var v=G.s.b[i];if(v){var p=newPiece(v,i),q=XY(i);G.pcs[i]=p;setP(p,q.x,q.y,0,1);}}
 updateMills(G.s.b,[]);hud();
}
function addMark(i,type){
 var q=XY(i),sz=type==='lg'?L.u*0.36:L.d*1.22,m=document.createElement('div');
 m.className='mk';m.style.width=m.style.height=sz+'px';
 tr(m,'translate3d('+(q.x-sz/2)+'px,'+(q.y-sz/2)+'px,2px)');

}
function clearMarks(){G.marks.forEach(function(m){if(m.parentNode)m.parentNode.removeChild(m);});G.marks=[];}
function updateMills(bd,hot){
 for(var i=0;i<E.MILLS.length;i++){var m=E.MILLS[i],o=bd[m[0]],el=glEls[i];
  var on=o&&bd[m[1]]===o&&bd[m[2]]===o;
  el.className='gl'+(on?' on o'+o:'');
 }
 hot.forEach(function(mi){var el=glEls[mi];el.className+=' hot';setTimeout(function(){el.className=el.className.replace(' hot','');},1100);});
}
function millsAt(bd,t,p){var out=[];for(var i=0;i<E.MILLS.length;i++){var m=E.MILLS[i];if((m[0]===t||m[1]===t||m[2]===t)&&bd[m[0]]===p&&bd[m[1]]===p&&bd[m[2]]===p)out.push(i);}return out;}
function sparks(mi){
 if(S.perf||S.anim==='off')return;
 var m=E.MILLS[mi],a=XY(m[0]),b=XY(m[2]),cx=(a.x+b.x)/2,cy=(a.y+b.y)/2,i,list=[];
 for(i=0;i<12;i++){var el=document.createElement('div'),sz=L.d*0.16;

  plane.appendChild(el);list.push({el:el,vx:(Math.random()-.5)*L.u*2.2,vy:(Math.random()-.5)*L.u*2.2,vz:L.d*(1+Math.random()*1.6),sz:sz});}
 tween(650,function(t){list.forEach(function(s){tr(s.el,'translate3d('+(cx+s.vx*t-s.sz/2)+'px,'+(cy+s.vy*t-s.sz/2)+'px,'+(s.vz*t*(1.3-t)*1.6+6)+'px) scale('+(1-t)+')');});},
  function(){list.forEach(function(s){if(s.el.parentNode)s.el.parentNode.removeChild(s.el);});});
}

/* hareket görselleri */
function visMove(f,t,cb){
 var p,q=XY(t),s=G.s,col=s.turn,fly=false;
 if(f<0){
  p=newPiece(col,t);G.pcs[t]=p;var z0=L.d*3.4;setP(p,q.x,q.y,z0,1);
  tween(dur(300),function(x){setP(p,q.x,q.y,z0*(1-x*x),1);},function(){
   SND.tock();vib(12);
   tween(dur(150),function(x){setP(p,q.x,q.y,L.d*0.16*Math.sin(Math.PI*x),1);},function(){setP(p,q.x,q.y,0,1);cb();});
  });
 }else{
  p=G.pcs[f];if(!p){cb();return;}
  delete G.pcs[f];G.pcs[t]=p;p.idx=t;
  if(p.sel){p.sel=false;p.el.className='pc c'+p.col;}
  var a={x:p.x,y:p.y};fly=E.flying(s,col);
  var lift=L.d*(fly?2.4:0.7),z0=p.z;
  tween(dur(fly?520:300),function(x){var e=ease(x);setP(p,a.x+(q.x-a.x)*e,a.y+(q.y-a.y)*e,Math.max(z0*(1-x),0)+lift*Math.sin(Math.PI*x),1);},function(){
   setP(p,q.x,q.y,0,1);SND.tock();vib(12);cb();});
 }
}
function visRemove(i,cb){
 var p=G.pcs[i];
 if(!p){cb();return;}
 delete G.pcs[i];SND.rem();vib(60);
 tween(dur(430),function(x){setP(p,p.x,p.y,L.d*2.4*x,Math.max(.05,1-0.95*x));},function(){killPiece(p);cb();});
}
function selectPiece(i){
 var old=G.pcs[G.sel];
 if(old&&G.sel!==i){old.sel=false;old.el.className='pc c'+old.col;setP(old,old.x,old.y,0,1);}
 clearMarks();G.sel=i;
 if(i<0)return;
 var p=G.pcs[i];if(!p)return;
 p.sel=true;p.el.className='pc c'+p.col+' sel';SND.sel();
 var z1=L.d*0.45,q=XY(i);
 tween(dur(120),function(x){setP(p,q.x,q.y,z1*x,1);});
 legalTargets(i).forEach(function(t){addMark(t,'lg');});
}
function deselect(){
 var p=G.pcs[G.sel];
 if(p){p.sel=false;p.el.className='pc c'+p.col;var q=XY(G.sel);setP(p,q.x,q.y,0,1);}
 G.sel=-1;clearMarks();
}
function legalTargets(f){
 var s=G.s,p=s.turn,out=[],i;
 if(s.hand[p]>0)return out;
 if(E.flying(s,p)){for(i=0;i<24;i++)if(s.b[i]===0)out.push(i);}
 else E.ADJ[f].forEach(function(t){if(s.b[t]===0)out.push(t);});
 return out;
}

/* ================= YAPAY ZEKÂ (Web Worker, olmazsa ana iş parçacığı) ================= */
var LV={1:{d:2,ms:150,rp:.4,min:450,name:'Kolay'},2:{d:4,ms:450,rp:0,min:600,name:'Orta'},3:{d:14,ms:1300,rp:0,min:700,name:'Usta'}};
var worker=null,wTried=false,wCb={},wId=0;
function getWorker(){
 if(worker||wTried)return worker;
 wTried=true;
 try{
  var src='var makeEngine='+makeEngine.toString()+';var E=makeEngine();onmessage=function(e){var d=e.data;var m=E.search(d.s,d.depth,d.ms,d.rp,d.rep);postMessage({id:d.id,m:m});};';
  var url=(window.URL||window.webkitURL).createObjectURL(new Blob([src],{type:'application/javascript'}));
  worker=new Worker(url);
  worker.onmessage=function(e){var cb=wCb[e.data.id];delete wCb[e.data.id];if(cb)cb(e.data.m);};
  worker.onerror=function(){worker=null;};
 }catch(e){worker=null;}
 return worker;
}
function askEngine(s,depth,ms,rp,rep,cb){
 var id=++wId,w=getWorker();
 if(w){
  wCb[id]=cb;
  try{w.postMessage({id:id,s:s,depth:depth,ms:ms,rp:rp,rep:rep});return;}catch(e){delete wCb[id];}
 }
 setTimeout(function(){cb(E.search(s,depth,ms,rp,rep));},30);
}
function repMap(){var m={};G.keys.forEach(function(k){m[k]=(m[k]||0)+1;});return m;}

/* ================= OYUN AKIŞI ================= */
function humanColor(){return G.mode==='local'?0:G.me;}
function myTurn(){
 if(G.mode==='local')return true;
 return G.s.turn===G.me;
}
function opp(c){return 3-c;}

function newGame(cfg){
 G.aiId++;G.rq=[];
 G.mode=cfg.mode;G.diff=cfg.diff||2;G.me=cfg.me||1;G.ai=3-G.me;
 G.s=E.newState();G.hist=[];G.keys=[];G.over=false;G.busy=false;G.pend=null;G.sel=-1;
 showScreen('game');layoutSoon();render();
 wake();
 saveGame();
 nextTurn();
}
var histG=false,skipPop=false;
function showScreen(id){
 ['home','game'].forEach(function(n){$('#'+n).className='screen'+(n===id?' on':'');});
 closeHintPanel();hideCoach();
 if(id==='game'){
  if(!histG){try{history.pushState({g:1},'');histG=true;}catch(e){}}
 }else{
  if(histG){histG=false;skipPop=true;try{history.back();}catch(e){skipPop=false;}}
  homeRefresh();
 }
}
function rePush(){
 if($('#game').className.indexOf('on')>=0&&!histG){try{history.pushState({g:1},'');histG=true;}catch(e){}}
}
function handleBack(fromPop){
 function rep(){if(fromPop)rePush();}
 if(HT.on){closeHintPanel();rep();return;}
 if($('#coach').className.indexOf('on')>=0){hideCoach();rep();return;}
 if($('#ov').className==='on'){
  if(UI.back){var f=UI.back;f();rep();return;}
  if($('#ov').getAttribute('data-nc')){rep();return;}
  closeSheet();rep();return;
 }
 if($('#game').className.indexOf('on')>=0){ACT.home();if(fromPop)setTimeout(rePush,0);}
}
function layoutSoon(){layout();setTimeout(layout,60);setTimeout(layout,300);}

function tentative(f,t){var b=G.s.b.slice(),p=G.s.turn;if(f>=0)b[f]=0;b[t]=p;return b;}

function humanMove(f,t){
 var s=G.s,p=s.turn,b=tentative(f,t),mill=E.isMillAt(b,t,p);
 hideCoach();closeHintPanel();deselect();G.busy=true;hud();
 visMove(f,t,function(){
  if(mill){
   var rs=E.removable(s,3-p),ms=millsAt(b,t,p);
   G.pend={f:f,t:t,rem:rs};
   updateMills(b,ms);ms.forEach(sparks);SND.mill();vib([30,40,50]);
   rs.forEach(function(i){addMark(i,'rm');});
   G.busy=false;hud();coachShow('mill');
  }else commit([f,t,-1],true);
 });
}
function humanPick(i){
 var pd=G.pend;
 if(!pd||pd.rem.indexOf(i)<0){SND.err();toast('Kırmızı halkalı taşlardan birini seç');return;}
 G.pend=null;clearMarks();G.busy=true;hud();
 visRemove(i,function(){commit([pd.f,pd.t,i],true);});
}
function remoteMove(m){
 var s=G.s,p=s.turn,b=tentative(m[0],m[1]);
 G.busy=true;hud();
 visMove(m[0],m[1],function(){
  if(m[2]>=0){
   var ms=millsAt(b,m[1],p);updateMills(b,ms);ms.forEach(sparks);SND.mill();vib([30,40,50]);
   setTimeout(function(){visRemove(m[2],function(){commit(m,false);});},dur(480));
  }else commit(m,false);
 });
}
function commit(m,local){
 closeHintPanel();hideCoach();
 G.hist.push({s:E.clone(G.s),keys:G.keys.slice()});
 if(G.hist.length>60)G.hist.shift();
 E.commit(G.s,m);
 if(m[0]<0||m[2]>=0)G.keys=[];
 if(G.s.hand[1]===0&&G.s.hand[2]===0)G.keys.push(E.key(G.s));
 if(local&&G.mode==='online')Net.send({t:'mv',m:m});
 updateMills(G.s.b,[]);
 G.busy=false;
 var o=E.outcome(G.s);
 hud();
 if(o){endGame(o.winner,o.reason);return;}
 var rep=0,k=E.key(G.s);G.keys.forEach(function(x){if(x===k)rep++;});
 if(rep>=3){endGame(0,'rep');return;}
 if(G.s.noCap>=60){endGame(0,'nocap');return;}
 saveGame();
 nextTurn();
}
function nextTurn(){
 if(G.over)return;
 G.sel=-1;
 hud();
 setTimeout(coachCheck,450);
 if(G.mode==='ai'&&G.s.turn===G.ai){runAI();return;}
 pumpRemote();
}
function runAI(){
 G.busy=true;hud();
 var id=++G.aiId,t0=Date.now(),lv=LV[G.diff];
 askEngine(E.clone(G.s),lv.d,lv.ms,lv.rp,repMap(),function(m){
  if(id!==G.aiId||G.over)return;
  var wait=Math.max(0,lv.min-(Date.now()-t0));
  setTimeout(function(){if(id!==G.aiId||G.over)return;if(!m){endGame(G.me,'blocked');return;}remoteMove(m);},wait);
 });
}
function pumpRemote(){
 if(G.mode!=='online'||G.busy||G.over||!G.rq.length)return;
 if(G.s.turn===G.me)return;
 var m=G.rq.shift();
 if(!E.isLegal(G.s,m)){Net.send({t:'sync-req'});return;}
 remoteMove(m);

function endGame(winner,reason){

 hideCoach();if(HT.on)closeHintPanel();
 if(!myTurn()){toast(G.mode==='ai'?'Bilgisayarın sırası':'Rakibin sırası');return;}
 var s=G.s,p=s.turn;
 if(s.hand[p]>0){
  if(s.b[i]!==0){SND.err();toast('Boş bir noktaya koy');return;}

function reach(s,o,e,l){
 if(s.hand[o]>0||E.flying(s,o))return true;
 var a=E.ADJ[e],i;
 for(i=0;i<a.length;i++)if(s.b[a[i]]===o&&a[i]!==l[0]&&a[i]!==l[1]&&a[i]!==l[2])return true;

  if(oc===2&&em>=0&&reach(s,o,em,l)&&out.indexOf(em)<0)out.push(em);
 }

}

 var s=G.s,p=s.turn,th=threatPts(s,p);
 if(th.length&&coachShow('threat',th))return;
 if(s.hand[p]>0)coachShow('place');
 else if(E.flying(s,p))coachShow('fly');
 else{
  var mv=[],i,a,j;
  for(i=0;i<24;i++)if(s.b[i]===p){a=E.ADJ[i];for(j=0;j<a.length;j++)if(s.b[a[j]]===0){mv.push(i);break;}}

function classify(s,p,o,m,b){
 var f=m[0],t=m[1],i,j,l,oc,mine,emp,a;
 if(E.isMillAt(b,t,p))return 'mill';
 for(i=0;i<E.MILLS.length;i++){
  l=E.MILLS[i];if(l[0]!==t&&l[1]!==t&&l[2]!==t)continue;
  oc=0;for(j=0;j<3;j++)if(l[j]!==t&&s.b[l[j]]===o)oc++;
  if(oc===2&&reach(s,o,t,l))return 'block';
 }
 for(i=0;i<E.MILLS.length;i++){
  l=E.MILLS[i];if(l[0]!==t&&l[1]!==t&&l[2]!==t)continue;
  mine=0;emp=0;for(j=0;j<3;j++)if(l[j]!==t){if(b[l[j]]===p)mine++;else if(b[l[j]]===0)emp++;}
  if(mine===1&&emp===1)return 'setup';
 }
 if(f>=0)for(i=0;i<E.MILLS.length;i++){
  l=E.MILLS[i];if(l[0]!==f&&l[1]!==f&&l[2]!==f)continue;
  if(s.b[l[0]]===p&&s.b[l[1]]===p&&s.b[l[2]]===p)return 'open';
 }
 a=E.ADJ[t];
 if(f<0){if(a.length>=4)return 'mob';}
 else{mine=0;for(j=0;j<a.length;j++)if(b[a[j]]===0)mine++;if(mine>=2)return 'mob';}
 return 'safe';
}

  out.push({f:m[0],t:m[1],cat:classify(s,p,o,m,tentative(m[0],m[1])),r:Math.random(),best:false});
 }

}

/* ================= ÇEVRİMİÇİ (PeerJS / WebRTC) ================= */
var PFX='uozdil-dokuztas-';
var ICE=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'},{urls:['turn:eu-0.turn.peerjs.com:3478','turn:us-0.turn.peerjs.com:3478'],username:'peerjs',credential:'peerjsp'},{urls:['turn:openrelay.metered.ca:80','turn:openrelay.metered.ca:443','turn:openrelay.metered.ca:443?transport=tcp'],username:'openrelayproject',credential:'openrelayproject'}];
var ALPH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
var QUICK=['Merhaba 👋','İyi oyunlar!','Güzel hamle 👏','Bir tur daha?','Biraz düşüneyim…','Teşekkürler'];
var Net={peer:null,starting:false,ready:false,pstat:'',retry:0,conn:null,role:null,out:null,inv:null,oppName:'',oppUid:'',lastRx:0,hb:null,
 myRem:false,oppRem:false,q:[],pres:{},poll:null,invT:null,unread:0,chat:[],
 send:function(o){try{if(!this.conn)return;if(this.conn.open)this.conn.send(o);else if(o.t!=='p')this.q.push(o);}catch(e){}},
 flush:function(){try{while(this.q.length&&this.conn&&this.conn.open)this.conn.send(this.q.shift());}catch(e){}},
 close:function(){
  if(this.hb){clearInterval(this.hb);this.hb=null;}
  if(this.invT){clearTimeout(this.invT);this.invT=null;}
  var c=this.conn;this.conn=null;
  try{if(c)c.close();}catch(e){}
  this.role=null;this.out=null;this.inv=null;this.oppName='';this.oppUid='';this.myRem=false;this.oppRem=false;this.q=[];this.chat=[];this.unread=0;
 }};
function newUid(){var c='',i;for(i=0;i<6;i++)c+=ALPH.charAt(rnd(ALPH.length));return c;}
function ensureUid(){if(!S.uid||!/^[A-Z0-9]{6}$/.test(S.uid)){S.uid=newUid();saveS();}}
function cleanCode(v){return String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);}
function pid(id){return PFX+'u-'+id;}
function findFr(id){for(var i=0;i<S.friends.length;i++)if(S.friends[i].id===id)return S.friends[i];return null;}
function addFr(id,name){
 id=cleanCode(id);if(id.length!==6||id===S.uid)return null;
 var f=findFr(id);
 if(f){if(name&&f.name!==name){f.name=name;saveS();}return f;}
 if(S.friends.length>=24){toast('Arkadaş listesi dolu');return null;}
 f={id:id,name:name||'Arkadaş'};S.friends.push(f);saveS();return f;
}
function netLoad(cb,fail){
 if(window.Peer)return cb();
 var urls=['kafes-dovusu/vendor/peerjs.min.js','https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js','https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'],i=0;
 (function next(){
  if(i>=urls.length)return fail();
  var s=document.createElement('script');s.src=urls[i++];
  s.onload=function(){window.Peer?cb():next();};s.onerror=next;document.head.appendChild(s);
 })();
}
function setOnl(html){var el=$('#onlMsg');if(el)el.innerHTML=html;}

/* kendi kimliğimiz: uygulama açıkken davet alabilmek için sürekli kayıtlı */
function presStart(){
 ensureUid();
 if(Net.peer||Net.starting)return;
 Net.starting=true;Net.pstat='conn';refreshOnl();
 if(!S.onl){S.onl=true;saveS();}
 netLoad(function(){
  var pr;
  try{pr=new Peer(pid(S.uid),{debug:0,config:{iceServers:ICE}});}catch(e){Net.starting=false;Net.pstat='bad';refreshOnl();return;}
  Net.peer=pr;Net.starting=false;
  pr.on('open',function(){Net.ready=true;Net.pstat='ok';Net.retry=0;refreshOnl();if(UI.onl)pollNow();});
  pr.on('connection',onIncoming);
  pr.on('disconnected',function(){
   Net.ready=false;if(Net.peer!==pr)return;Net.pstat='conn';refreshOnl();
   setTimeout(function(){try{if(Net.peer===pr&&!pr.destroyed)pr.reconnect();}catch(e){}},2500);
  });
  pr.on('close',function(){if(Net.peer===pr){Net.peer=null;Net.ready=false;Net.pstat='bad';refreshOnl();}});
  pr.on('error',function(e){
   var ty=e&&e.type,msg=String((e&&e.message)||'');
   if(ty==='peer-unavailable'){peerGone(msg);return;}
   if(ty==='unavailable-id'){
    if(Net.peer===pr){Net.peer=null;Net.ready=false;}
    try{pr.destroy();}catch(x){}
    if(Net.retry<6){Net.retry++;Net.pstat='conn';refreshOnl();setTimeout(presStart,3000);}
    else{Net.pstat='dup';refreshOnl();}
    return;
   }
   if(ty==='network'||ty==='server-error'||ty==='socket-error'||ty==='socket-closed'){Net.ready=false;Net.pstat='bad';refreshOnl();}
  });
 },function(){Net.starting=false;Net.pstat='bad';refreshOnl();});
}
function peerGone(msg){
 var m=/u-([A-Z0-9]{6})/.exec(msg),id=m&&m[1];
 if(!id)return;
 delete Net.pres[id];
 if(Net.out&&Net.out.id===id)inviteFail((Net.oppName||'Arkadaşın')+' şu an çevrimdışı görünüyor.');
 refreshFr();
}

/* arkadaş durumu (ping/pong) */
var pingT={};
function pingFr(id){
 if(!Net.peer||!Net.ready||pingT[id])return;
 var c,done=false;
 try{c=Net.peer.connect(pid(id),{reliable:true});}catch(e){return;}
 function fin(){if(done)return;done=true;if(pingT[id]){clearTimeout(pingT[id]);delete pingT[id];}try{c.close();}catch(e){}}
 pingT[id]=setTimeout(function(){if(done)return;delete Net.pres[id];fin();refreshFr();},7000);
 c.on('open',function(){try{c.send({t:'ping',name:S.name||'',uid:S.uid});}catch(e){}});
 c.on('data',function(d){
  if(d&&d.t==='pong'){
   Net.pres[id]={t:Date.now(),busy:!!d.busy};
   var f=findFr(id),nm=String(d.name||'').slice(0,14);
   if(f&&nm&&f.name!==nm){f.name=nm;saveS();}
   fin();refreshFr();
  }
 });
 c.on('error',function(){fin();});
}
function pollNow(){S.friends.forEach(function(f){pingFr(f.id);});}
function startPoll(){stopPoll();Net.poll=setInterval(pollNow,15000);pollNow();}
function stopPoll(){if(Net.poll){clearInterval(Net.poll);Net.poll=null;}}
function isOn(id){var p=Net.pres[id];return !!(p&&Date.now()-p.t<45000);}

function stHtml(){
 var p=Net.pstat;
 if(p==='ok')return '<span class="st-ok">● Bağlı</span> · davet alabilirsin';
 if(p==='bad')return '<span class="st-bad">● Sunucuya ulaşılamıyor</span> <button class="lnk" data-act="retry">Tekrar dene</button>';
 if(p==='dup')return '<span class="st-bad">● Bu kod başka bir pencerede açık</span> <button class="lnk" data-act="retry">Tekrar dene</button>';
 return '<span class="st-conn">● Bağlanılıyor<span class="dots"></span></span>';
}
function frHtml(){
 if(!S.friends.length)return '<p class="note" style="margin:6px 0">Henüz arkadaşın yok. Aşağıdan arkadaşının kodunu ekle ya da kendi kodunu paylaş.</p>';
 var l=S.friends.slice();
 l.sort(function(a,b){return (isOn(b.id)?1:0)-(isOn(a.id)?1:0)||(a.name<b.name?-1:1);});
 return l.map(function(f){
  var on=isOn(f.id),bz=on&&Net.pres[f.id].busy;
  return '<div class="fr'+(on?' on':'')+'"><i class="dot"></i><div class="fn"><b>'+esc(f.name)+'</b><small>'+f.id+' · '+(on?(bz?'OYUNDA':'ÇEVRİMİÇİ'):'ÇEVRİMDIŞI')+'</small></div>'+
   (on&&!bz?'<button class="btn pri" data-act="inv" data-id="'+f.id+'">Davet et</button>':'')+
   '<button class="xb" data-act="rmFr" data-id="'+f.id+'" aria-label="Sil"><svg class="i"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>';
 }).join('');
}
function refreshFr(){if(!UI.onl)return;var el=$('#frList');if(el)el.innerHTML=frHtml();}
function refreshOnl(){if(!UI.onl)return;var el=$('#onlSt');if(el)el.innerHTML=stHtml();refreshFr();}

 openSheet('<h2>Çevrimiçi</h2><p class="note" id="onlSt" style="text-align:center;margin:0 0 4px"></p>'+

function inviteFriend(id){
 if(!S.name){sheetName(sheetOnline);return;}
 if(!Net.peer||!Net.ready){setOnl('Bağlantı kuruluyor, birazdan tekrar dene.');return;}
 if(Net.conn||Net.inv){return;}
 var f=findFr(id),c;
 try{c=Net.peer.connect(pid(id),{reliable:true});}catch(e){setOnl('Bağlantı kurulamadı.');return;}
 Net.conn=c;Net.role='host';Net.out={id:id};Net.oppName=f?f.name:'Arkadaş';Net.lastRx=Date.now();
 wireConn(c);
 c.on('data',function(d){route(c,d);});
 Net.send({t:'invite',name:S.name,uid:S.uid});
 openSheet('<h2>Davet gönderildi</h2><div class="code" style="font-size:24px;letter-spacing:.06em">'+esc(Net.oppName)+'</div><p class="note" style="text-align:center">Yanıt bekleniyor<span class="dots"></span></p><button class="btn sm" data-act="cancelInv">Vazgeç</button>',{noClose:true});
 Net.invT=setTimeout(function(){if(Net.out)inviteFail('Cevap gelmedi. '+(Net.oppName||'Arkadaşın')+' uygulamayı açık tutmuyor olabilir.');},30000);
}
function inviteFail(msg){
 if(Net.invT){clearTimeout(Net.invT);Net.invT=null;}
 Net.close();
 openSheet('<h2>Oyun başlamadı</h2><p class="note" style="font-size:14px;text-align:center">'+esc(msg)+'</p><div class="gap"></div><button class="btn pri sm" data-act="online">Arkadaş listesi</button><div class="gap"></div><button class="btn sm" data-act="close">Kapat</button>');
}
function onIncoming(c){
 c.on('data',function(d){route(c,d);});
 c.on('close',function(){
  if(Net.inv&&Net.inv.c===c){Net.inv=null;if(UI.invOpen){closeSheet();toast('Davet iptal edildi');}}
 });
 c.on('error',function(){});
}
function route(c,d){
 if(!d||!d.t)return;
 if(c===Net.conn){Net.lastRx=Date.now();onNet(d);return;}
 if(d.t==='ping'){
  try{c.send({t:'pong',name:S.name||'',uid:S.uid,busy:G.mode==='online'&&!G.over});}catch(e){}
  setTimeout(function(){try{c.close();}catch(e){}},1500);
 }else if(d.t==='invite'){
  if((G.mode==='online'&&!G.over)||Net.inv||Net.conn){try{c.send({t:'busy'});}catch(e){}setTimeout(function(){try{c.close();}catch(e){}},800);return;}
  Net.inv={c:c,name:String(d.name||'Arkadaş').slice(0,14),uid:cleanCode(d.uid)};
  showInvite();
 }
}
function showInvite(){
 var iv=Net.inv;if(!iv)return;
 openSheet('<h2>Oyun daveti</h2><div class="code" style="font-size:26px;letter-spacing:.06em">'+esc(iv.name)+'</div><p class="note" style="text-align:center">seni Dokuz Taş oynamaya çağırıyor.</p><div class="gap"></div><button class="btn pri sm" data-act="invAcc">Kabul et</button><div class="gap"></div><button class="btn sm" data-act="invNo">Reddet</button>',{noClose:true});
 UI.invOpen=true;vib([60,40,60]);try{SND.mill();}catch(e){}
}
function wireConn(c){
 c.on('open',function(){Net.lastRx=Date.now();Net.flush();});
 c.on('close',function(){connDown(c);});
 c.on('error',function(){connDown(c);});
 if(!Net.hb)Net.hb=setInterval(function(){
  Net.send({t:'p'});
  if(G.mode==='online'&&!G.over&&Date.now()-Net.lastRx>40000)onNetLost();
 },4000);
}
function connDown(c){
 if(c!==Net.conn)return;
 if(Net.out){inviteFail((Net.oppName||'Arkadaşın')+' ile bağlantı kurulamadı.');return;}
 if(G.mode==='online'){onNetLost();return;}
 Net.close();closeSheet();toast('Bağlantı kesildi');
}
function onNet(d){
 var t=d.t;
 if(t==='hi'&&Net.role==='host'&&(G.mode!=='online'||G.over)){
  Net.oppName=String(d.name||'Arkadaş').slice(0,14);Net.oppUid=cleanCode(d.uid);
  if(Net.oppUid)addFr(Net.oppUid,Net.oppName);
  if(Net.invT){clearTimeout(Net.invT);Net.invT=null;}
  Net.out=null;
  Net.send({t:'init',name:S.name||'Oyuncu',uid:S.uid,me:2});
  closeSheet();newGame({mode:'online',me:1});
 }else if(t==='init'&&Net.role==='guest'){
  if(Net.invT){clearTimeout(Net.invT);Net.invT=null;}
  Net.oppName=String(d.name||Net.oppName||'Arkadaş').slice(0,14);
  closeSheet();newGame({mode:'online',me:d.me===1?1:2});
 }else if((t==='no'||t==='busy')&&Net.out){
  inviteFail((Net.oppName||'Arkadaşın')+(t==='no'?' daveti reddetti.':' şu an başka bir oyunda.'));
 }else if(t==='mv'&&G.mode==='online'&&!G.over){
  if(d.m&&d.m.length===3){G.rq.push([d.m[0]|0,d.m[1]|0,d.m[2]|0]);pumpRemote();}
 }else if(t==='sync-req'&&Net.role==='host'&&G.mode==='online'){
  Net.send({t:'sync',s:G.s,keys:G.keys});
 }else if(t==='sync'&&G.mode==='online'&&d.s){
  G.s=d.s;G.keys=d.keys||[];G.rq=[];G.busy=false;G.pend=null;render();nextTurn();
 }else if(t==='resign'&&G.mode==='online'&&!G.over){
  endGame(G.me,'resign');
 }else if(t==='rematch'){
  Net.oppRem=true;rematchCheck();
 }else if(t==='newgame'&&Net.role==='guest'){
  Net.myRem=false;Net.oppRem=false;closeSheet();newGame({mode:'online',me:d.me===1?1:2});
 }else if(t==='chat'&&typeof d.x==='string'){
  var x=d.x.slice(0,200);
  Net.chat.push({me:false,x:x});
  if(UI.chatOpen)appendChat(false,x);
  else{Net.unread++;hud();toast((Net.oppName||'Rakip')+': '+x.slice(0,40),2400);vib(25);}
 }
}
function rematchCheck(){
 var n=$('#remNote');
 if(Net.role==='host'&&Net.myRem&&Net.oppRem){
  Net.myRem=false;Net.oppRem=false;
  var hostCol=G.me===1?2:1;
  Net.send({t:'newgame',me:G.me});
  closeSheet();newGame({mode:'online',me:hostCol});
 }else if(n){n.textContent=Net.oppRem?'Rakip rövanş istiyor.':(Net.myRem?'Rakibin onayı bekleniyor…':'');}
}
function onNetLost(){
 if(G.mode!=='online'||Net.lost)return;
 if(!Net.conn)return;
 if(G.over){var rn=$('#remNote');if(rn)rn.textContent='Rakip ayrıldı.';var rb=$('#bRem');if(rb)rb.disabled=true;Net.close();return;}
 Net.lost=true;
 G.over=true;G.busy=false;G.aiId++;hud();
 openSheet('<h2>Bağlantı koptu</h2><p class="note" style="font-size:14px">Rakiple bağlantı kesildi.</p><div class="gap"></div><button class="btn pri sm" data-act="home">Ana menü</button>',{noClose:true});
 Net.close();Net.lost=false;
}

/* sohbet */
function msgHtml(m){return '<div class="msg '+(m.me?'me':'th')+'"><small>'+esc(m.me?(S.name||'Sen'):(Net.oppName||'Rakip'))+'</small>'+esc(m.x)+'</div>';}
function appendChat(me,x){
 var el=$('#chLog');if(!el)return;
 var e0=$('#chEmpty');if(e0&&e0.parentNode)e0.parentNode.removeChild(e0);
 var d=document.createElement('div');d.innerHTML=msgHtml({me:me,x:x});el.appendChild(d.firstChild);
 el.scrollTop=el.scrollHeight;
}
function sendChat(x){
 x=String(x||'').replace(/\s+/g,' ').trim().slice(0,140);if(!x)return;
 Net.send({t:'chat',x:x});Net.chat.push({me:true,x:x});appendChat(true,x);
}
function reopenEnd(){if(G.overHtml)openSheet(G.overHtml,{noClose:true});else closeSheet();}
function sheetChat(){
 Net.unread=0;hud();
 var back=G.over?reopenEnd:null;
 var h='<h2>Sohbet</h2><p class="note" style="text-align:center;margin:0">'+esc(Net.oppName||'Rakip')+' ile</p><div class="chlog" id="chLog">'+
  (Net.chat.length?Net.chat.map(msgHtml).join(''):'<p class="note" id="chEmpty" style="text-align:center">Henüz mesaj yok. Hızlı bir mesaj seç ya da yaz.</p>')+'</div>'+
  '<div class="chips">'+QUICK.map(function(q,i){return '<button class="chip" data-act="chQ" data-i="'+i+'">'+esc(q)+'</button>';}).join('')+'</div>'+
  '<div class="chrow"><input class="inp" id="chIn" maxlength="140" placeholder="Mesaj yaz…" autocomplete="off"><button class="btn pri sm" data-act="chSend">Gönder</button></div>';
 if(!back)h+='<div class="gap"></div><button class="btn sm" data-act="close">Kapat</button>';
 openSheet(h,{back:back,noClose:!!back});
 UI.chatOpen=true;
 var el=$('#chLog');if(el)el.scrollTop=el.scrollHeight;
}
function sheetName(next){
 UI.afterName=next||null;
 openSheet('<h2>Kullanıcı adın</h2><p class="note" style="text-align:center;margin-top:0">Arkadaşların ve rakibin seni bu adla görür.</p>'+
  '<input class="inp nm2" id="nameIn2" maxlength="14" placeholder="Adın" value="'+esc(S.name)+'" autocomplete="off" autocapitalize="words">'+
  '<div class="gap"></div><button class="btn pri sm" data-act="saveName">Kaydet</button><div class="gap"></div><button class="btn sm" data-act="'+(next?'sheetBack':'close')+'">Vazgeç</button>',
  {back:next?function(){UI.afterName=null;next();}:null});
 setTimeout(function(){var e=$('#nameIn2');if(e&&e.focus){try{e.focus();}catch(x){}}},150);
}
function setNameChip(){var e=$('#homeName');if(e)e.textContent=S.name||'Adını yaz';}

/* ================= EKRAN KORUMA ================= */
var idleT=null,shiftT=null,wl=null;
function resetIdle(){
 document.body.className=document.body.className.replace(/\bidle\b/g,'').trim();
 if(idleT)clearTimeout(idleT);
 if(S.oled)idleT=setTimeout(function(){document.body.className+=' idle';},20000);
}
function applyOled(){
 resetIdle();
 var app=$('#app');
 if(shiftT){clearInterval(shiftT);shiftT=null;}
 if(S.oled){shiftT=setInterval(function(){tr(app,'translate('+(rnd(7)-3)+'px,'+(rnd(7)-3)+'px)');},60000);}
 else tr(app,'none');
}
function wake(){
 if(!S.wake){if(wl){try{wl.release();}catch(e){}wl=null;}return;}
 if(navigator.wakeLock&&navigator.wakeLock.request){try{navigator.wakeLock.request('screen').then(function(l){wl=l;}).catch(function(){});}catch(e){}}
}

/* ================= TOAST ================= */
var toastT=null;
function toast(msg,ms){
 var t=$('#toast');t.textContent=msg;t.className='on';
 if(toastT)clearTimeout(toastT);toastT=setTimeout(function(){t.className='';},ms||1900);
}

/* ================= ANA MENÜ ================= */
function homeRefresh(){
 var sv=LS.get('dokuztas.save',null),b=$('#bCont');
 if(sv&&sv.s){
  b.style.display='flex';
  var t=sv.mode==='ai'?('Bilgisayar · '+LV[sv.diff||2].name):'İki kişilik';
  $('#bContS').textContent=t;
 }else b.style.display='none';
 setNameChip();
 var st=S.stats;
 $('#homeFoot').textContent=(st.w+st.l+st.d>0?'Galibiyet '+st.w+'  ·  Mağlubiyet '+st.l+'  ·  Beraberlik '+st.d:'');
}

/* ================= OLAYLAR ================= */
var ACT={
 cont:function(){audio();if(!loadGame())homeRefresh();},
 newai:function(){audio();sheetNewAI();},
 startai:function(){
  var c=UI.sel.color;if(c===0)c=1+rnd(2);
  closeSheet();newGame({mode:'ai',diff:UI.sel.diff||2,me:c});
 },
 local:function(){audio();newGame({mode:'local'});},
 online:function(){if(!S.name)sheetName(sheetOnline);else sheetOnline();},
 name:function(){sheetName(UI.onl?sheetOnline:null);},
 saveName:function(){
  var e=$('#nameIn2'),v=e?e.value.replace(/\s+/g,' ').trim().slice(0,14):'';
  if(!v){toast('Bir ad yaz');return;}
  S.name=v;saveS();setNameChip();
  var nx=UI.afterName;UI.afterName=null;
  if(nx)nx();else closeSheet();
 },
 share:function(){
  var link=location.href.split('#')[0].split('?')[0]+'?f='+S.uid;
  var txt='Dokuz Taş oynayalım! Arkadaş kodum: '+S.uid+'\n'+link;
  if(navigator.share){try{navigator.share({text:txt});return;}catch(e){}}
  var ok=false;
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt);ok=true;}}catch(e){}
  setOnl(ok?'Davet metni kopyalandı.':'Kodunu elle paylaş: <b>'+S.uid+'</b>');
 },
 copyCode:function(){
  var ok=false;
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(S.uid);ok=true;}}catch(e){}
  setOnl(ok?'Kod kopyalandı.':'Kodun: <b>'+S.uid+'</b>');
 },
 addFr:function(){
  var el=$('#fcIn'),c=cleanCode(el?el.value:'');
  if(c.length!==6){setOnl('Kod 6 karakter olmalı.');return;}
  if(c===S.uid){setOnl('Bu senin kendi kodun.');return;}
  if(findFr(c)){setOnl('Bu kişi zaten listende.');return;}
  if(!addFr(c,''))return;
  if(el)el.value='';
  setOnl('Eklendi. Çevrimiçiyse adı görünecek.');refreshFr();pingFr(c);
 },
 rmFr:function(b){
  var id=b.getAttribute('data-id');
  S.friends=S.friends.filter(function(f){return f.id!==id;});saveS();refreshFr();
 },
 inv:function(b){inviteFriend(b.getAttribute('data-id'));},
 invAcc:function(){
  var iv=Net.inv;if(!iv)return;
  Net.inv=null;UI.invOpen=false;
  Net.conn=iv.c;Net.role='guest';Net.oppName=iv.name;Net.oppUid=iv.uid;Net.lastRx=Date.now();
  wireConn(iv.c);
  if(iv.uid)addFr(iv.uid,iv.name);
  Net.send({t:'hi',name:S.name||'Oyuncu',uid:S.uid});
  openSheet('<h2>Bağlanılıyor</h2><p class="note" style="text-align:center">Oyun başlıyor<span class="dots"></span></p>',{noClose:true});
  Net.invT=setTimeout(function(){if(G.mode!=='online'){Net.close();closeSheet();toast('Bağlantı kurulamadı');}},15000);
 },
 invNo:function(){
  var iv=Net.inv;Net.inv=null;UI.invOpen=false;
  if(iv){try{iv.c.send({t:'no'});}catch(e){}setTimeout(function(){try{iv.c.close();}catch(e){}},600);}
  closeSheet();
 },
 cancelInv:function(){Net.close();sheetOnline();},
 retry:function(){
  Net.retry=0;
  if(Net.peer){var p=Net.peer;Net.peer=null;try{p.destroy();}catch(e){}}
  Net.starting=false;Net.ready=false;presStart();
 },
 chat:function(){sheetChat();},
 chSend:function(){var e=$('#chIn');if(!e)return;sendChat(e.value);e.value='';},
 chQ:function(b){sendChat(QUICK[parseInt(b.getAttribute('data-i'),10)]);},
 sheetBack:function(){if(UI.back){var f=UI.back;f();}},
 back:function(){handleBack(false);},
 fs:function(){
  var d=document.documentElement,rq=d.requestFullscreen||d.webkitRequestFullscreen||d.mozRequestFullScreen||d.msRequestFullscreen;
  if(fsEl()){
   var ex=document.exitFullscreen||document.webkitExitFullscreen||document.mozCancelFullScreen||document.msExitFullscreen;
   try{ex.call(document);}catch(e){}return;
  }
  if(!rq){toast('Bu tarayıcı tam ekranı desteklemiyor. Ana ekrana ekleyerek tam ekran kullanabilirsin.',3600);return;}
  try{var r=rq.call(d);if(r&&r.catch)r.catch(function(){toast('Tam ekran açılamadı');});}catch(e){toast('Tam ekran açılamadı');}
 },
 coachAlt:function(){hideCoach();hint();},
 coachOk:function(){hideCoach();},
 coachOff:function(){S.coach=false;saveS();hideCoach();closeHintPanel();hud();toast('İpuçları kapandı. Ayarlardan açabilirsin.',2800);},
 altSel:function(b){HT.sel=parseInt(b.getAttribute('data-k'),10)||0;if(HT.on)renderAlts();},
 altPlay:function(b){
  var pk=HT.list[parseInt(b.getAttribute('data-k'),10)||0];
  closeHintPanel();if(pk&&!G.busy&&!G.over)humanMove(pk.f,pk.t);
 },
 hintOff:function(){closeHintPanel();},
 rules2:function(){sheetRules(sheetSettings);},
 rules:function(){sheetRules();},
 settings:function(){sheetSettings();},
 close:function(){closeSheet();},
 home:function(){
  if(G.mode==='online'&&!G.over&&$('#game').className.indexOf('on')>=0){
   openSheet('<h2>Oyundan ayrıl?</h2><p class="note" style="font-size:14px">Çevrimiçi oyundan ayrılırsan rakip kazanır.</p><div class="gap"></div><button class="btn pri sm" data-act="leaveYes">Ayrıl</button><div class="gap"></div><button class="btn sm" data-act="close">Vazgeç</button>');
   return;
  }
  ACT.leaveYes();
 },
 leaveYes:function(){
  if(G.mode==='online'){Net.send({t:'resign'});G.over=true;G.mode='left';setTimeout(function(){Net.close();},500);}
  G.aiId++;closeSheet();showScreen('home');
 },
 again:function(){closeSheet();newGame({mode:G.mode,diff:G.diff,me:G.mode==='ai'?(G.me===1?2:1):1});},
 rematch:function(){Net.myRem=true;Net.send({t:'rematch'});rematchCheck();var b=$('#bRem');if(b)b.disabled=true;},
 undo:function(){undo();},
 hint:function(){hint();},
 view:function(){cycleView();},
 resign:function(){if(!G.over)resign();},
 resignYes:function(){
  closeSheet();
  if(G.mode==='online'){Net.send({t:'resign'});endGame(3-G.me,'resign');}
  else if(G.mode==='ai')endGame(G.ai,'resign');
  else endGame(3-G.s.turn,'resign');
 }
};
function up(el,attr){while(el&&el!==document){if(el.getAttribute&&el.getAttribute(attr)!==null)return el;el=el.parentNode;}return null;}
document.addEventListener('click',function(e){
 resetIdle();
 var t=e.target,b;
 if(t.id==='ov'&&!t.getAttribute('data-nc')){closeSheet();return;}
 var sg=up(t,'data-seg');
 if(sg&&t.getAttribute('data-v')!==null&&t.tagName==='BUTTON'){
  var k=sg.getAttribute('data-seg'),v=t.getAttribute('data-v');
  [].forEach.call(sg.children,function(c){c.className=c===t?'on':'';});
  if(k==='diff'||k==='color')UI.sel[k]=parseInt(v,10);
  else applySetting(k,v);
  return;
 }
 b=up(t,'data-act');
 if(b){var f=ACT[b.getAttribute('data-act')];if(f&&!b.disabled){audio();f(b);}return;}
 var pt=up(t,'data-i');
 if(pt&&pt.className.indexOf('pt')>=0){tapPoint(parseInt(pt.getAttribute('data-i'),10));}
},false);
document.addEventListener('input',function(e){
 var id=e.target.id;
 if(id==='nameIn'){S.name=e.target.value.slice(0,14);saveS();}
 else if(id==='fcIn'){var c=cleanCode(e.target.value);if(c!==e.target.value)e.target.value=c;}
});
document.addEventListener('keydown',function(e){
 if(e.keyCode!==13)return;
 var id=e.target.id;
 if(id==='chIn')ACT.chSend();else if(id==='fcIn')ACT.addFr();else if(id==='nameIn2')ACT.saveName();
});
window.addEventListener('popstate',function(){
 if(skipPop){skipPop=false;return;}
 histG=false;handleBack(true);
});
function fsEl(){return document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement||document.msFullscreenElement;}
function fsChange(){
 var on=!!fsEl(),ps=document.querySelectorAll('.fsi path'),i;
 document.body.className=document.body.className.replace(/\bisfs\b/g,'').replace(/\s+$/,'')+(on?' isfs':'');
 for(i=0;i<ps.length;i++)ps[i].setAttribute('d',on?'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5':'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5');
 onResize();
}
['fullscreenchange','webkitfullscreenchange','mozfullscreenchange','MSFullscreenChange'].forEach(function(n){document.addEventListener(n,fsChange,false);});
document.addEventListener('touchstart',resetIdle,{passive:true});
document.addEventListener('contextmenu',function(e){e.preventDefault();});
var rs=null;
function onResize(){clearTimeout(rs);rs=setTimeout(function(){probeInsets();layout();},120);}
window.addEventListener('resize',onResize);
window.addEventListener('orientationchange',function(){setTimeout(onResize,250);});
document.addEventListener('visibilitychange',function(){if(!document.hidden){wake();try{if(Net.peer&&Net.peer.disconnected)Net.peer.reconnect();}catch(e){}}});

/* ================= BAŞLAT ================= */
probeInsets();buildStatic();applyOled();homeRefresh();G.started=true;
ensureUid();
(function(){
 var m=/[?&]f=([A-Za-z0-9]{6})/.exec(location.search),code=m&&m[1].toUpperCase();
 if(m){try{history.replaceState(null,'',location.pathname);}catch(e){}}
 if(code&&code!==S.uid){
  addFr(code,'');
  setTimeout(function(){if(!S.name)sheetName(sheetOnline);else{sheetOnline();setOnl('Davet bağlantısından eklendi.');}},500);
 }else if(S.onl)presStart();
})();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){G.texSize=0;layout();});
})();
</script>

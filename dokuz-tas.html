<style>

padding:8px 14px 10px;
padding-top:calc(var(--sat) + var(--top) + 8px);padding-bottom:calc(var(--sab) + 10px);
padding-left:calc(var(--sal) + 14px);padding-right:calc(var(--sar) + 14px)}

h1{font-family:'Cinzel',Georgia,serif;font-weight:700;font-size:34px;letter-spacing:.14em;margin:14px 0 0 .14em;color:var(--gold2);white-space:nowrap}

@keyframes pu{0%,100%{transform:scale(.82);opacity:.8}50%{transform:scale(1.08);opacity:1}}

padding:18px 18px 18px;padding-bottom:calc(var(--sab) + 18px);padding-left:calc(var(--sal) + 18px);padding-right:calc(var(--sar) + 18px)}

.row:last-child{border-bottom:0}
.row .lb{flex:none;margin-right:12px;font-size:15px}

.row .seg{flex:1;max-width:260px}
.row .seg button{padding:9px 4px;font-size:13px}
.inp{width:100%;padding:14px;border-radius:14px;border:1px solid var(--ln);background:#090806;color:var(--ink);font-size:24px;text-align:center;letter-spacing:.4em;text-transform:uppercase;-webkit-user-select:text;user-select:text}
.inp.nm2{font-size:16px;letter-spacing:.02em;text-transform:none;text-align:left}

.gap{height:10px}
.big{font-family:'Cinzel',Georgia,serif;font-size:30px;text-align:center;color:var(--gold2);margin:4px 0}
.dots:after{content:"";-webkit-animation:dt 1.2s steps(4) infinite;animation:dt 1.2s steps(4) infinite}
@-webkit-keyframes dt{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
@keyframes dt{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

@media (orientation:landscape) and (max-height:540px){
 .hwrap{flex-direction:row;flex-wrap:wrap;justify-content:center;align-content:center}

 .ab svg.i{margin:0 6px 0 0}
 #toast{bottom:calc(var(--sab) + 56px)}
}
@media (prefers-reduced-motion:reduce){.mk .in{-webkit-animation:none;animation:none}}
</style>

<script>
(function(){
'use strict';

/* ================= OYUN MOTORU (kurallar + yapay zekâ) ================= */
/*ENGINE*/
function makeEngine(){
 var ADJ=[],MILLS=[],MOF=[],i,r,k,a,b;
 for(i=0;i<24;i++){ADJ.push([]);MOF.push([]);}
 for(r=0;r<3;r++)for(k=0;k<8;k++){a=r*8+k;b=r*8+(k+1)%8;ADJ[a].push(b);ADJ[b].push(a);}
 for(r=0;r<2;r++)for(k=1;k<8;k+=2){a=r*8+k;b=(r+1)*8+k;ADJ[a].push(b);ADJ[b].push(a);}
 for(r=0;r<3;r++)for(k=0;k<8;k+=2)MILLS.push([r*8+k,r*8+(k+1)%8,r*8+(k+2)%8]);
 for(k=1;k<8;k+=2)MILLS.push([k,8+k,16+k]);
 MILLS.forEach(function(m){m.forEach(function(p){MOF[p].push(m);});});

 function newState(){var bb=[],j;for(j=0;j<24;j++)bb.push(0);return {b:bb,hand:[0,9,9],on:[0,0,0],turn:1,noCap:0};}
 function clone(s){return {b:s.b.slice(),hand:s.hand.slice(),on:s.on.slice(),turn:s.turn,noCap:s.noCap};}
 function total(s,p){return s.hand[p]+s.on[p];}
 function flying(s,p){return s.hand[p]===0&&s.on[p]===3;}
 function isMillAt(bd,idx,p){var ms=MOF[idx],j,m;for(j=0;j<ms.length;j++){m=ms[j];if(bd[m[0]]===p&&bd[m[1]]===p&&bd[m[2]]===p)return true;}return false;}
 function removable(s,q){var out=[],all=[],j;for(j=0;j<24;j++)if(s.b[j]===q){all.push(j);if(!isMillAt(s.b,j,q))out.push(j);}return out.length?out:all;}
 function genMoves(s){
  var p=s.turn,bd=s.b,mv=[],q=3-p,f,t,j,ad;
  function add(ff,tt){
   if(ff>=0)bd[ff]=0;
   bd[tt]=p;var mill=isMillAt(bd,tt,p);bd[tt]=0;
   if(ff>=0)bd[ff]=p;
   if(mill){var rs=removable(s,q),x;for(x=0;x<rs.length;x++)mv.push([ff,tt,rs[x]]);}
   else mv.push([ff,tt,-1]);
  }
  if(s.hand[p]>0){for(t=0;t<24;t++)if(bd[t]===0)add(-1,t);}
  else if(flying(s,p)){for(f=0;f<24;f++)if(bd[f]===p)for(t=0;t<24;t++)if(bd[t]===0)add(f,t);}
  else{for(f=0;f<24;f++)if(bd[f]===p){ad=ADJ[f];for(j=0;j<ad.length;j++)if(bd[ad[j]]===0)add(f,ad[j]);}}
  return mv;
 }

 for(k in G.pcs)if(G.pcs.hasOwnProperty(k)){p=G.pcs[k];q=XY(p.idx);setP(p,q.x,q.y,p.sel?L.d*0.45:0,1);}
}
function clearDyn(){
 var kids=plane.children,i,rm=[];
 for(i=0;i<kids.length;i++){var c=kids[i].className||'';if(/\b(pc|psh|mk)\b/.test(c))rm.push(kids[i]);}
 rm.forEach(function(n){plane.removeChild(n);});
 G.pcs={};G.marks=[];
}
function render(){
 clearDyn();G.sel=-1;G.pend=null;
 for(var i=0;i<24;i++){var v=G.s.b[i];if(v){var p=newPiece(v,i),q=XY(i);G.pcs[i]=p;setP(p,q.x,q.y,0,1);}}
 updateMills(G.s.b,[]);hud();
}
function addMark(i,type){
 var q=XY(i),sz=type==='lg'?L.u*0.36:L.d*1.22,m=document.createElement('div');
 m.className='mk';m.style.width=m.style.height=sz+'px';
 tr(m,'translate3d('+(q.x-sz/2)+'px,'+(q.y-sz/2)+'px,2px)');
 m.innerHTML='<i class="in '+type+'"></i>';plane.appendChild(m);G.marks.push(m);
}
function clearMarks(){G.marks.forEach(function(m){if(m.parentNode)m.parentNode.removeChild(m);});G.marks=[];}
function updateMills(bd,hot){
 for(var i=0;i<E.MILLS.length;i++){var m=E.MILLS[i],o=bd[m[0]],el=glEls[i];
  var on=o&&bd[m[1]]===o&&bd[m[2]]===o;
  el.className='gl'+(on?' on o'+o:'');
 }
 hot.forEach(function(mi){var el=glEls[mi];el.className+=' hot';setTimeout(function(){el.className=el.className.replace(' hot','');},1100);});
}
function millsAt(bd,t,p){var out=[];for(var i=0;i<E.MILLS.length;i++){var m=E.MILLS[i];if((m[0]===t||m[1]===t||m[2]===t)&&bd[m[0]]===p&&bd[m[1]]===p&&bd[m[2]]===p)out.push(i);}return out;}
function sparks(mi){
 if(S.perf||S.anim==='off')return;
 var m=E.MILLS[mi],a=XY(m[0]),b=XY(m[2]),cx=(a.x+b.x)/2,cy=(a.y+b.y)/2,i,list=[];
 for(i=0;i<12;i++){var el=document.createElement('div'),sz=L.d*0.16;
  el.className='mk';el.style.width=el.style.height=sz+'px';el.style.borderRadius='50%';el.style.background='#ffe39a';el.style.boxShadow='0 0 8px #ffd36a';
  plane.appendChild(el);list.push({el:el,vx:(Math.random()-.5)*L.u*2.2,vy:(Math.random()-.5)*L.u*2.2,vz:L.d*(1+Math.random()*1.6),sz:sz});}
 tween(650,function(t){list.forEach(function(s){tr(s.el,'translate3d('+(cx+s.vx*t-s.sz/2)+'px,'+(cy+s.vy*t-s.sz/2)+'px,'+(s.vz*t*(1.3-t)*1.6+6)+'px) scale('+(1-t)+')');});},
  function(){list.forEach(function(s){if(s.el.parentNode)s.el.parentNode.removeChild(s.el);});});
}

/* hareket görselleri */
function visMove(f,t,cb){
 var p,q=XY(t),s=G.s,col=s.turn,fly=false;
 if(f<0){
  p=newPiece(col,t);G.pcs[t]=p;var z0=L.d*3.4;setP(p,q.x,q.y,z0,1);
  tween(dur(300),function(x){setP(p,q.x,q.y,z0*(1-x*x),1);},function(){
   SND.tock();vib(12);
   tween(dur(150),function(x){setP(p,q.x,q.y,L.d*0.16*Math.sin(Math.PI*x),1);},function(){setP(p,q.x,q.y,0,1);cb();});
  });
 }else{
  p=G.pcs[f];if(!p){cb();return;}
  delete G.pcs[f];G.pcs[t]=p;p.idx=t;
  if(p.sel){p.sel=false;p.el.className='pc c'+p.col;}
  var a={x:p.x,y:p.y};fly=E.flying(s,col);
  var lift=L.d*(fly?2.4:0.7),z0=p.z;
  tween(dur(fly?520:300),function(x){var e=ease(x);setP(p,a.x+(q.x-a.x)*e,a.y+(q.y-a.y)*e,Math.max(z0*(1-x),0)+lift*Math.sin(Math.PI*x),1);},function(){
   setP(p,q.x,q.y,0,1);SND.tock();vib(12);cb();});
 }
}
function visRemove(i,cb){
 var p=G.pcs[i];
 if(!p){cb();return;}
 delete G.pcs[i];SND.rem();vib(60);
 tween(dur(430),function(x){setP(p,p.x,p.y,L.d*2.4*x,Math.max(.05,1-0.95*x));},function(){killPiece(p);cb();});
}
function selectPiece(i){
 var old=G.pcs[G.sel];
 if(old&&G.sel!==i){old.sel=false;old.el.className='pc c'+old.col;setP(old,old.x,old.y,0,1);}
 clearMarks();G.sel=i;
 if(i<0)return;
 var p=G.pcs[i];if(!p)return;
 p.sel=true;p.el.className='pc c'+p.col+' sel';SND.sel();
 var z1=L.d*0.45,q=XY(i);
 tween(dur(120),function(x){setP(p,q.x,q.y,z1*x,1);});
 legalTargets(i).forEach(function(t){addMark(t,'lg');});
}
function deselect(){
 var p=G.pcs[G.sel];
 if(p){p.sel=false;p.el.className='pc c'+p.col;var q=XY(G.sel);setP(p,q.x,q.y,0,1);}
 G.sel=-1;clearMarks();
}
function legalTargets(f){
 var s=G.s,p=s.turn,out=[],i;
 if(s.hand[p]>0)return out;
 if(E.flying(s,p)){for(i=0;i<24;i++)if(s.b[i]===0)out.push(i);}
 else E.ADJ[f].forEach(function(t){if(s.b[t]===0)out.push(t);});
 return out;
}

/* ================= YAPAY ZEKÂ (Web Worker, olmazsa ana iş parçacığı) ================= */
var LV={1:{d:2,ms:150,rp:.4,min:450,name:'Kolay'},2:{d:4,ms:450,rp:0,min:600,name:'Orta'},3:{d:14,ms:1300,rp:0,min:700,name:'Usta'}};
var worker=null,wTried=false,wCb={},wId=0;
function getWorker(){
 if(worker||wTried)return worker;
 wTried=true;
 try{
  var src='var makeEngine='+makeEngine.toString()+';var E=makeEngine();onmessage=function(e){var d=e.data;var m=E.search(d.s,d.depth,d.ms,d.rp,d.rep);postMessage({id:d.id,m:m});};';
  var url=(window.URL||window.webkitURL).createObjectURL(new Blob([src],{type:'application/javascript'}));
  worker=new Worker(url);
  worker.onmessage=function(e){var cb=wCb[e.data.id];delete wCb[e.data.id];if(cb)cb(e.data.m);};
  worker.onerror=function(){worker=null;};
 }catch(e){worker=null;}
 return worker;
}
function askEngine(s,depth,ms,rp,rep,cb){
 var id=++wId,w=getWorker();
 if(w){
  wCb[id]=cb;
  try{w.postMessage({id:id,s:s,depth:depth,ms:ms,rp:rp,rep:rep});return;}catch(e){delete wCb[id];}
 }
 setTimeout(function(){cb(E.search(s,depth,ms,rp,rep));},30);
}
function repMap(){var m={};G.keys.forEach(function(k){m[k]=(m[k]||0)+1;});return m;}

function humanColor(){return G.mode==='local'?0:G.me;}
function myTurn(){
 if(G.mode==='local')return true;
 return G.s.turn===G.me;
}
function opp(c){return 3-c;}

function newGame(cfg){
 G.aiId++;G.rq=[];
 G.mode=cfg.mode;G.diff=cfg.diff||2;G.me=cfg.me||1;G.ai=3-G.me;
 G.s=E.newState();G.hist=[];G.keys=[];G.over=false;G.busy=false;G.pend=null;G.sel=-1;
 showScreen('game');layoutSoon();render();
 wake();
 saveGame();
 nextTurn();
}
function showScreen(id){
 ['home','game'].forEach(function(n){$('#'+n).className='screen'+(n===id?' on':'');});
 if(id==='home')homeRefresh();
}
function layoutSoon(){layout();setTimeout(layout,60);setTimeout(layout,300);}

function tentative(f,t){var b=G.s.b.slice(),p=G.s.turn;if(f>=0)b[f]=0;b[t]=p;return b;}

function humanMove(f,t){
 var s=G.s,p=s.turn,b=tentative(f,t),mill=E.isMillAt(b,t,p);
 deselect();G.busy=true;hud();
 visMove(f,t,function(){
  if(mill){
   var rs=E.removable(s,3-p),ms=millsAt(b,t,p);
   G.pend={f:f,t:t,rem:rs};
   updateMills(b,ms);ms.forEach(sparks);SND.mill();vib([30,40,50]);
   rs.forEach(function(i){addMark(i,'rm');});
   G.busy=false;hud();
  }else commit([f,t,-1],true);
 });
}
function humanPick(i){
 var pd=G.pend;
 if(!pd||pd.rem.indexOf(i)<0){SND.err();toast('Kırmızı halkalı taşlardan birini seç');return;}
 G.pend=null;clearMarks();G.busy=true;hud();
 visRemove(i,function(){commit([pd.f,pd.t,i],true);});
}
function remoteMove(m){
 var s=G.s,p=s.turn,b=tentative(m[0],m[1]);
 G.busy=true;hud();
 visMove(m[0],m[1],function(){
  if(m[2]>=0){
   var ms=millsAt(b,m[1],p);updateMills(b,ms);ms.forEach(sparks);SND.mill();vib([30,40,50]);
   setTimeout(function(){visRemove(m[2],function(){commit(m,false);});},dur(480));
  }else commit(m,false);
 });
}
function commit(m,local){
 G.hist.push({s:E.clone(G.s),keys:G.keys.slice()});
 if(G.hist.length>60)G.hist.shift();
 E.commit(G.s,m);
 if(m[0]<0||m[2]>=0)G.keys=[];
 if(G.s.hand[1]===0&&G.s.hand[2]===0)G.keys.push(E.key(G.s));
 if(local&&G.mode==='online')Net.send({t:'mv',m:m});
 updateMills(G.s.b,[]);
 G.busy=false;
 var o=E.outcome(G.s);
 hud();
 if(o){endGame(o.winner,o.reason);return;}
 var rep=0,k=E.key(G.s);G.keys.forEach(function(x){if(x===k)rep++;});
 if(rep>=3){endGame(0,'rep');return;}
 if(G.s.noCap>=60){endGame(0,'nocap');return;}
 saveGame();
 nextTurn();
}
function nextTurn(){
 if(G.over)return;
 G.sel=-1;
 hud();
 if(G.mode==='ai'&&G.s.turn===G.ai){runAI();return;}
 pumpRemote();
}
function runAI(){
 G.busy=true;hud();
 var id=++G.aiId,t0=Date.now(),lv=LV[G.diff];
 askEngine(E.clone(G.s),lv.d,lv.ms,lv.rp,repMap(),function(m){
  if(id!==G.aiId||G.over)return;
  var wait=Math.max(0,lv.min-(Date.now()-t0));
  setTimeout(function(){if(id!==G.aiId||G.over)return;if(!m){endGame(G.me,'blocked');return;}remoteMove(m);},wait);
 });
}
function pumpRemote(){
 if(G.mode!=='online'||G.busy||G.over||!G.rq.length)return;
 if(G.s.turn===G.me)return;
 var m=G.rq.shift();
 if(!E.isLegal(G.s,m)){Net.send({t:'sync-req'});return;}
 remoteMove(m);
}

function endGame(winner,reason){
 G.over=true;G.busy=false;G.aiId++;deselect();clearMarks();G.pend=null;
 LS.del('dokuztas.save');
 var title,sub,snd;
 var why={pieces:'Rakibin 2 taşı kaldı.',blocked:'Rakip hamle yapamıyor.',rep:'Aynı konum üç kez tekrarlandı.',nocap:'60 hamledir taş alınmadı.',resign:'Rakip teslim oldu.',left:'Rakip oyundan ayrıldı.'};
 var mine=(G.mode==='local')?0:G.me;
 if(!winner){title='Berabere';sub=why[reason]||'';snd='draw';}
 else if(G.mode==='local'){title=CN[winner]+' kazandı';sub=reason==='pieces'?CN[3-winner]+' 2 taşa düştü.':(reason==='blocked'?CN[3-winner]+' hamle yapamıyor.':'');snd='win';}
 else if(winner===mine){title='Kazandın!';sub=why[reason]||'';snd='win';}
 else{title='Kaybettin';sub=reason==='pieces'?'2 taşın kaldı.':(reason==='blocked'?'Hamle yapamaz hale geldin.':(reason==='resign'?'Teslim oldun.':''));snd='lose';}
 if(G.mode==='ai'){S.stats[winner===0?'d':(winner===G.me?'w':'l')]++;saveS();}
 hud();
 setTimeout(function(){
  SND[snd]();vib(snd==='win'?[40,60,40,60,80]:[80]);
  var btns='';
  if(G.mode==='online')btns='<button class="btn pri sm" data-act="rematch" id="bRem">Rövanş</button><div class="gap"></div><button class="btn sm" data-act="home">Ana menü</button><p class="note" id="remNote"></p>';
  else btns='<button class="btn pri sm" data-act="again">Tekrar oyna</button><div class="gap"></div><button class="btn sm" data-act="home">Ana menü</button>';
  openSheet('<div class="big">'+esc(title)+'</div><p class="note" style="font-size:14px">'+esc(sub)+'</p><div class="gap"></div>'+btns,{noClose:true});
 },winner?700:300);
}

function saveGame(){
 if(G.mode==='online'||G.over)return;
 LS.set('dokuztas.save',{mode:G.mode,diff:G.diff,me:G.me,s:G.s,keys:G.keys,hist:G.hist.slice(-30)});
}
function loadGame(){
 var sv=LS.get('dokuztas.save',null);
 if(!sv||!sv.s)return false;
 G.aiId++;G.rq=[];G.mode=sv.mode;G.diff=sv.diff||2;G.me=sv.me||1;G.ai=3-G.me;G.s=sv.s;G.keys=sv.keys||[];G.hist=sv.hist||[];
 G.over=false;G.busy=false;G.pend=null;G.sel=-1;
 showScreen('game');layoutSoon();render();wake();nextTurn();
 return true;
}

function trayHtml(p){
 var h=G.s.hand[p],o=G.s.on[p],lost=9-h-o,s='',i;
 for(i=0;i<h;i++)s+='<i class="mi c'+p+'"></i>';
 for(i=0;i<o;i++)s+='<i class="mi c'+p+' b"></i>';
 for(i=0;i<lost;i++)s+='<i class="mi x"></i>';
 return s;
}
function names(){
 var bot,top,nb,nt,sb='',st='';
 if(G.mode==='local'){bot=1;top=2;nb='Oyuncu 1';nt='Oyuncu 2';}
 else{bot=G.me;top=3-G.me;
  nb=(G.mode==='online'&&S.name)?S.name:'Sen';
  nt=G.mode==='ai'?'Bilgisayar':(Net.oppName||'Rakip');}
 sb=CN[bot];st=CN[top]+(G.mode==='ai'?' · '+LV[G.diff].name:'');
 return {bot:bot,top:top,nb:nb,nt:nt,sb:sb,st:st};
}
function phaseText(p){
 var s=G.s;
 if(s.hand[p]>0)return '1. Aşama · Yerleştirme · '+s.hand[p]+' kaldı';
 if(E.flying(s,p))return '3. Aşama · Uçma';
 return '2. Aşama · Hareket';
}
function hud(){
 var n=names(),s=G.s,pl=$('#plB'),pt=$('#plT');
 function fill(el,col,nm,sub,act){
  el.querySelector('.av').className='av c'+col;
  el.querySelector('.nm b').textContent=nm;el.querySelector('.nm small').textContent=sub;
  el.querySelector('.tray').innerHTML=trayHtml(col);
  el.className='pl'+(act?' act':'')+((el===pt&&G.mode==='local')?' flip':'');
 }
 fill(pl,n.bot,n.nb,n.sb,!G.over&&s.turn===n.bot);
 fill(pt,n.top,n.nt,n.st,!G.over&&s.turn===n.top);
 var a='',b='';
 if(G.over){a='Oyun bitti';b='';}
 else if(G.pend){a='Değirmen! Bir taş al';b='Rakibin kırmızı halkalı taşlarından biri';}
 else if(G.mode==='ai'&&s.turn===G.ai){a='Bilgisayar düşünüyor';b=phaseText(s.turn);}
 else if(G.mode==='online'&&s.turn!==G.me){a=(Net.oppName||'Rakip')+' oynuyor';b=phaseText(s.turn);}
 else if(G.mode==='local'){a='Sıra: '+CN[s.turn];b=phaseText(s.turn);}
 else{a=E.flying(s,s.turn)&&s.hand[s.turn]===0?'Sıra sende · Uçabilirsin':'Sıra sende';b=phaseText(s.turn);}
 $('#st1').textContent=a;$('#st2').textContent=b;
 $('#aUndo').disabled=(G.mode==='online'||G.over||!G.hist.length);
 $('#aHint').disabled=(G.mode==='online'||G.over||G.busy||!myTurn()||!!G.pend);
 $('#aRes').disabled=G.over;
}

/* ================= GİRDİ ================= */
function tapPoint(i){
 resetIdle();audio();
 if(G.over||G.busy||!G.started)return;
 if(G.pend){humanPick(i);return;}
 if(!myTurn()){toast(G.mode==='ai'?'Bilgisayarın sırası':'Rakibin sırası');return;}
 var s=G.s,p=s.turn;
 if(s.hand[p]>0){
  if(s.b[i]!==0){SND.err();toast('Boş bir noktaya koy');return;}
  humanMove(-1,i);return;
 }
 if(s.b[i]===p){if(G.sel===i)deselect();else selectPiece(i);return;}
 if(G.sel>=0&&s.b[i]===0){
  if(legalTargets(G.sel).indexOf(i)>=0)humanMove(G.sel,i);
  else{SND.err();toast(E.flying(s,p)?'Boş bir nokta seç':'Taş sadece komşu boş noktaya gider');}
  return;
 }
 if(s.b[i]===3-p){SND.err();toast('Bu taş rakibin');return;}
 SND.err();toast('Önce kendi taşını seç');
}
function hint(){
 if(G.busy||G.over||G.pend||!myTurn())return;
 deselect();G.busy=true;hud();toast('İpucu hesaplanıyor…');
 var id=++G.aiId;
 askEngine(E.clone(G.s),6,800,0,null,function(m){
  if(id!==G.aiId)return;
  G.busy=false;hud();clearMarks();if(!m)return;
  if(m[0]>=0)addMark(m[0],'hn');
  addMark(m[1],'hn');
  toast(m[0]<0?'Önerilen nokta işaretlendi':'Önerilen hamle işaretlendi');
 });
}
function undo(){
 if(G.busy||G.mode==='online'||!G.hist.length||G.over)return;
 G.aiId++;
 if(G.pend){G.pend=null;}
 else if(G.mode==='ai'){
  var snap;
  while(G.hist.length){snap=G.hist.pop();G.s=snap.s;G.keys=snap.keys;if(G.s.turn===G.me)break;}
 }else{var sn=G.hist.pop();G.s=sn.s;G.keys=sn.keys;}
 clearMarks();render();saveGame();nextTurn();
}

function miniBoard(stones,hl,dots){
 var Z=160,M=14,U=(Z-2*M)/6,o='<svg class="fig" viewBox="0 0 '+Z+' '+Z+'" xmlns="http://www.w3.org/2000/svg"><defs><radialGradient id="gw" cx=".36" cy=".3" r=".8"><stop offset="0" stop-color="#fffdf5"/><stop offset=".5" stop-color="#eee6d0"/><stop offset="1" stop-color="#a89f86"/></radialGradient><radialGradient id="gb" cx=".36" cy=".3" r=".8"><stop offset="0" stop-color="#707070"/><stop offset=".45" stop-color="#222"/><stop offset="1" stop-color="#000"/></radialGradient></defs>';
 function X(i){return M+GX[i]*U;}function Y(i){return M+GY[i]*U;}
 o+='<rect width="'+Z+'" height="'+Z+'" rx="12" fill="#c98443"/>';
 var r,k,a,b;
 o+='<g stroke="#1a0f08" stroke-width="1.8" stroke-linecap="round" fill="none">';
 for(r=0;r<3;r++)for(k=0;k<8;k++){a=r*8+k;b=r*8+(k+1)%8;o+='<line x1="'+X(a)+'" y1="'+Y(a)+'" x2="'+X(b)+'" y2="'+Y(b)+'"/>';}

 (dots||[]).forEach(function(i){o+='<circle cx="'+X(i)+'" cy="'+Y(i)+'" r="5.5" fill="#ffd36a" stroke="#8a5a10" stroke-width="1"/>';});

 return o+'</svg>';

/* ================= ÇEVRİMİÇİ (PeerJS / WebRTC) ================= */
var PFX='uozdil-dokuztas-';
var ICE=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'},{urls:['turn:openrelay.metered.ca:80','turn:openrelay.metered.ca:443','turn:openrelay.metered.ca:443?transport=tcp'],username:'openrelayproject',credential:'openrelayproject'}];
var ALPH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
var Net={peer:null,conn:null,role:null,code:'',oppName:'',lastRx:0,hb:null,myRem:false,oppRem:false,joinT:null,
 q:[],
 send:function(o){try{if(!this.conn)return;if(this.conn.open)this.conn.send(o);else this.q.push(o);}catch(e){}},
 flush:function(){try{while(this.q.length&&this.conn&&this.conn.open)this.conn.send(this.q.shift());}catch(e){}},
 close:function(){
  if(this.hb){clearInterval(this.hb);this.hb=null;}
  if(this.joinT){clearTimeout(this.joinT);this.joinT=null;}
  try{if(this.conn)this.conn.close();}catch(e){}
  try{if(this.peer)this.peer.destroy();}catch(e){}
  this.conn=null;this.peer=null;this.role=null;this.code='';this.oppName='';this.myRem=false;this.oppRem=false;
 }};
function netLoad(cb,fail){
 if(window.Peer)return cb();
 var urls=['https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js','https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'],i=0;
 (function next(){
  if(i>=urls.length)return fail();
  var s=document.createElement('script');s.src=urls[i++];
  s.onload=function(){window.Peer?cb():next();};s.onerror=next;document.head.appendChild(s);
 })();
}
function setOnl(html){var el=$('#onlMsg');if(el)el.innerHTML=html;}
function sheetOnline(){
 Net.close();
 openSheet('<h2>Çevrimiçi</h2><p class="note" style="font-size:14px;margin-top:0">Arkadaşınla farklı telefonlardan oynayın. Biriniz oda kurar, diğeri kodu girer.</p>'+
 '<button class="btn pri sm" data-act="host">Oda kur</button><div class="gap"></div>'+
 '<h3>Odaya katıl</h3><input class="inp" id="codeIn" maxlength="4" placeholder="KOD" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false">'+
 '<div class="gap"></div><button class="btn sm" data-act="join">Katıl</button>'+
 '<p class="note" id="onlMsg"></p><button class="btn sm" data-act="close">Kapat</button>');
}
function netHost(tries){
 tries=tries||0;
 setOnl('Bağlantı kuruluyor<span class="dots"></span>');
 netLoad(function(){
  var code='',i;for(i=0;i<4;i++)code+=ALPH.charAt(rnd(ALPH.length));
  var pr;
  try{pr=new Peer(PFX+code,{debug:0,config:{iceServers:ICE}});}catch(e){setOnl('Bağlantı kurulamadı.');return;}
  Net.peer=pr;Net.role='host';Net.code=code;
  pr.on('open',function(){
   openSheet('<h2>Oda kuruldu</h2><div class="code">'+code+'</div><p class="note" style="font-size:14px">Bu kodu arkadaşına ver.<br>Katılınca oyun kendiliğinden başlar.</p>'+
   '<p class="note" id="onlMsg">Rakip bekleniyor<span class="dots"></span></p>'+
   '<button class="btn sm" data-act="share">Kodu paylaş</button><div class="gap"></div><button class="btn sm" data-act="cancelOnl">İptal</button>');
  });
  pr.on('connection',function(c){
   if(Net.conn){try{c.close();}catch(e){}return;}
   Net.conn=c;wireConn(c);
  });
  pr.on('error',function(e){
   if(e&&e.type==='unavailable-id'&&tries<6){try{pr.destroy();}catch(x){}Net.peer=null;netHost(tries+1);return;}
   if(Net.role==='host'&&!Net.conn)setOnl('Çevrimiçi sunucuya ulaşılamadı. İnternetini kontrol edip tekrar dene.');
  });
 },function(){setOnl('Çevrimiçi bileşen yüklenemedi. İnternet bağlantını kontrol et.');});
}
function netJoin(code){
 code=(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
 if(code.length!==4){setOnl('Kod 4 karakter olmalı.');return;}
 setOnl('Odaya bağlanılıyor<span class="dots"></span>');
 netLoad(function(){
  var pr;
  try{pr=new Peer(undefined,{debug:0,config:{iceServers:ICE}});}catch(e){setOnl('Bağlantı kurulamadı.');return;}
  Net.peer=pr;Net.role='guest';Net.code=code;
  pr.on('open',function(){
   var c=pr.connect(PFX+code,{reliable:true});Net.conn=c;wireConn(c);
   Net.joinT=setTimeout(function(){if(!(Net.conn&&Net.conn.open&&Net.oppName)){setOnl('Oda bulunamadı ya da bağlantı kurulamadı.');try{pr.destroy();}catch(e){}Net.peer=null;Net.conn=null;}},15000);
  });
  pr.on('error',function(e){
   if(e&&e.type==='peer-unavailable')setOnl('Bu koda ait oda yok. Kodu kontrol et.');
   else if(!(G.mode==='online'&&!G.over))setOnl('Bağlantı kurulamadı. Tekrar dene.');
  });
 },function(){setOnl('Çevrimiçi bileşen yüklenemedi. İnternet bağlantını kontrol et.');});
}
function wireConn(c){
 c.on('open',function(){
  Net.lastRx=Date.now();Net.flush();
  if(Net.role==='guest')c.send({t:'hi',name:S.name||'Oyuncu'});
 });
 c.on('data',function(d){Net.lastRx=Date.now();onNet(d);});
 c.on('close',function(){onNetLost();});
 c.on('error',function(){onNetLost();});
 if(!Net.hb)Net.hb=setInterval(function(){
  Net.send({t:'p'});
  if(G.mode==='online'&&!G.over&&Date.now()-Net.lastRx>40000)onNetLost();
 },4000);
}
function onNet(d){
 if(!d||!d.t)return;
 if(d.t==='hi'&&Net.role==='host'&&G.mode!=='online'||(d.t==='hi'&&Net.role==='host'&&G.over)){
  Net.oppName=String(d.name||'Rakip').slice(0,14);
  Net.send({t:'init',name:S.name||'Oyuncu',me:2});
  closeSheet();newGame({mode:'online',me:1});
 }else if(d.t==='init'&&Net.role==='guest'){
  Net.oppName=String(d.name||'Rakip').slice(0,14);
  closeSheet();newGame({mode:'online',me:d.me===1?1:2});
 }else if(d.t==='mv'&&G.mode==='online'&&!G.over){
  if(d.m&&d.m.length===3){G.rq.push([d.m[0]|0,d.m[1]|0,d.m[2]|0]);pumpRemote();}
 }else if(d.t==='sync-req'&&Net.role==='host'&&G.mode==='online'){
  Net.send({t:'sync',s:G.s,keys:G.keys});
 }else if(d.t==='sync'&&G.mode==='online'&&d.s){
  G.s=d.s;G.keys=d.keys||[];G.rq=[];G.busy=false;G.pend=null;render();nextTurn();
 }else if(d.t==='resign'&&G.mode==='online'&&!G.over){
  endGame(G.me,'resign');
 }else if(d.t==='rematch'){
  Net.oppRem=true;rematchCheck();
 }else if(d.t==='newgame'&&Net.role==='guest'){
  Net.myRem=false;Net.oppRem=false;closeSheet();newGame({mode:'online',me:d.me===1?1:2});
 }
}
function rematchCheck(){
 var n=$('#remNote');
 if(Net.role==='host'&&Net.myRem&&Net.oppRem){
  Net.myRem=false;Net.oppRem=false;
  var hostCol=G.me===1?2:1;
  Net.send({t:'newgame',me:G.me});
  closeSheet();newGame({mode:'online',me:hostCol});
 }else if(n){n.textContent=Net.oppRem?'Rakip rövanş istiyor.':(Net.myRem?'Rakibin onayı bekleniyor…':'');}
}
function onNetLost(){
 if(G.mode!=='online'||Net.lost)return;
 if(!Net.conn&&!Net.peer)return;
 if(G.over){var rn=$('#remNote');if(rn)rn.textContent='Rakip ayrıldı.';var rb=$('#bRem');if(rb)rb.disabled=true;Net.close();return;}
 Net.lost=true;
 G.over=true;G.busy=false;G.aiId++;hud();
 openSheet('<h2>Bağlantı koptu</h2><p class="note" style="font-size:14px">Rakiple bağlantı kesildi.</p><div class="gap"></div><button class="btn pri sm" data-act="home">Ana menü</button>',{noClose:true});
 Net.close();Net.lost=false;
}

function up(el,attr){while(el&&el!==document){if(el.getAttribute&&el.getAttribute(attr)!==null)return el;el=el.parentNode;}return null;}
document.addEventListener('click',function(e){
 resetIdle();
 var t=e.target,b;
 if(t.id==='ov'&&!t.getAttribute('data-nc')){closeSheet();return;}
 var sg=up(t,'data-seg');
 if(sg&&t.getAttribute('data-v')!==null&&t.tagName==='BUTTON'){
  var k=sg.getAttribute('data-seg'),v=t.getAttribute('data-v');
  [].forEach.call(sg.children,function(c){c.className=c===t?'on':'';});
  if(k==='diff'||k==='color')UI.sel[k]=parseInt(v,10);
  else applySetting(k,v);
  return;
 }
 b=up(t,'data-act');
 if(b){var f=ACT[b.getAttribute('data-act')];if(f&&!b.disabled){audio();f(b);}return;}
 var pt=up(t,'data-i');
 if(pt&&pt.className.indexOf('pt')>=0){tapPoint(parseInt(pt.getAttribute('data-i'),10));}
},false);

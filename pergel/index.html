<style>
:root{

}

  }
}
:root[data-theme="dark"]{

  --accent:#7d98ff; --accent-soft:#232e4f; --on-accent:#0d1220; --signal:#ffa24a;
  --grid-minor:#1d2531; --grid-major:#2c3747; --axis-x:#e0655b; --axis-y:#4fba78; --axis-z:#5d95ee;
  --shadow:0 6px 24px rgba(0,0,0,.5);

}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:400 13px/1.35 var(--f-ui);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

#app{padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);display:grid;height:100%;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"top top top" "rail view side" "foot foot foot"}

/* top bar */
#top{grid-area:top;display:flex;align-items:center;gap:10px;padding:0 12px;height:46px;background:var(--panel);border-bottom:1px solid var(--rule)}

/* tool rail */

.tool[aria-pressed="true"] span{color:var(--on-accent)}
.tool svg.i{width:22px;height:22px;flex:none}
.tool:hover{background:var(--accent-soft)}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.tool[aria-pressed="true"] svg.i .n{fill:var(--on-accent)}

/* viewport */
#view{grid-area:view;position:relative;background:var(--sheet);overflow:hidden;min-height:0;touch-action:none}

#pal{position:fixed;inset:0;z-index:60;display:none;background:rgba(10,15,30,.28)}#pal.on{display:block}

Object.assign(I18N.tr,{"guide": "Kılavuz", "hints": "İpuçları", "on": "açık", "off": "kapalı", "hideHints": "İpuçlarını kapat", "hintsOff": "İpuçları kapatıldı. Yan paneldeki Diğer bölümünden tekrar açabilirsin.", "tourStart": "Tanıtım turunu başlat", "skip": "Atla", "next": "İleri", "back": "Geri", "done": "Bitir", "gTitle": "Pergel Kılavuzu", "tr1": "Araçlar|Çizim, ölçü, katı ve düzenleme araçları burada. Bir araca basınca ne yapacağını çizim alanındaki ipucu ve alttaki komut satırı söyler.", "tr2": "Çizim alanı|Noktaları buraya tıklayarak koyarsın. Sağ tuşla sürükleyince görünüm döner, tekerlek yakınlaştırır. Telefonda iki parmakla kaydırıp yakınlaştırırsın; boş yerde tek parmakla sürükleyince görünüm döner (Ayarlar’dan kapatılabilir).", "tr3": "Görünümler|Üst, Ön, Sağ ve 3B hazır bakışlardır. Sığdır tüm çizimi ekrana getirir.", "tr4": "Panel|Katmanlar, seçili nesnenin özellikleri ve hazır nesneler burada. Telefonda bu düğmeyle açılır.", "tr5": "Komut satırı|Ölçüyü buraya yazarsın: 250 yazıp Enter’a basınca fare yönünde 250 birim çizer. Komut adı da yazabilirsin: çizgi, daire, kutu.", "tr6": "Durum çubuğu|İmlecin koordinatları, ızgara ve yakalama düğmeleri, ızgara adımı ve çalışma kotu burada.", "tr7": "Kılavuz|Adım adım anlatım burada. Bu turu kılavuz penceresinden istediğin zaman tekrar başlatabilirsin.", "h_select": "Nesneye tıkla. Boş yerde sürükle: sağa doğru içinde kalanları, sola doğru değenleri seçer. Shift ile seçime eklersin.", "h_orbit": "Sürükleyerek görünümü döndür. Bitince Esc.", "h_measure": "İki noktaya tıkla. Mesafe ve açı komut satırının üstünde yazılır.", "h_line": "Noktalara sırayla tıkla. Belirli uzunluk için fareyi yöne götür, sayıyı yaz, Enter’a bas. Boş Enter bitirir.", "h_poly": "Noktalara tıkla. K kapatır, Enter bitirir. Sonuç tek parça olur; alanı Özellikler’de görünür.", "h_image": "Harita, uydu görüntüsü ya da taranmış proje resmini çizimin altına koyar. Dosyayı seç, sol alt köşeye tıkla, genişliği tıkla ya da yaz. Sonra resmi seçip Özellikler’de <b>İki noktayla ölçekle</b> ile gerçek ölçüsüne getir.", "h_refscale": "Seçili nesneleri bilinen bir uzunluğa göre ölçekler: uzunluğun iki ucuna tıkla, gerçek uzunluğu yaz. Altlık resmi ölçeklemek için birebir.", "h_foffset": "Katının yüzünün kenarını ya da yüzdeki bir şekli yüzün üstünde içeri/dışarı öteler. Yüze tıkla, fareyi içeri ya da dışarı götür ya da uzaklığı yaz. Örnek: havuz üst yüzünü 30 içeri ötele, sonra içini 150 aşağı it.", "h_walk": "Göz yüksekliğinden (1,60 m) tasarımın içinde yürü. Durmak istediğin yere tıkla; ok tuşları ya da WASD ile ilerle ve dön, fareyle sürükleyerek bak, tekerlekle adım at. Zemin, katı ve arazi yüksekliğini izler. Telefonda sağ alttaki düğmeleri kullan.", "h_drop": "Seçili katıyı ya da bloğu hemen altındaki yüzeye (yoksa zemine) tam oturtur; arada boşluk ya da gömülme kalmaz. Yüzündeki şekiller de birlikte iner.", "h_hide": "Seçili nesneleri gizler. Çizimden silinmez; altta çıkan çubuktaki Hepsini göster ile geri gelir.", "h_isolate": "Seçili nesneler dışındakilerin hepsini gizler; kalabalık çizimde rahat çalışmak için.", "h_unhide": "Gizlenen bütün nesneleri yeniden gösterir.", "h_spline": "Yumuşak eğri: geçmesini istediğin noktalara sırayla tıkla. Enter açık bitirir; ilk noktaya tıklarsan (ya da K) kapalı olur. Sonra eğriyi seçip noktalarını sürükleyerek düzeltebilirsin.", "h_rect": "İki karşı köşeye tıkla. Ölçüyle çizmek için ilk köşeden sonra @en,boy yaz (örn. @500,300).", "h_circle": "Merkeze tıkla, sonra yarıçapı tıkla ya da yaz.", "h_arc": "Üç nokta: başlangıç, yay üzerinde bir nokta, bitiş.", "h_polygon": "Kenar sayısını yaz, merkeze tıkla, sonra köşe mesafesini tıkla ya da yaz.", "h_ellipse": "Merkeze, birinci eksenin ucuna tıkla; sonra ikinci yarı ekseni tıkla ya da yaz.", "h_text": "Konuma tıkla, yazıyı alttaki satıra yazıp Enter’a bas.", "h_hatch": "Kapalı çoklu çizgi veya daire seç, Enter’a bas. Deseni, açıyı ve aralığı Özellikler’den değiştir.", "h_dimlin": "Ölçülecek iki noktaya, sonra ölçü çizgisinin duracağı yere tıkla. Yere göre yatay ya da dikey ölçer.", "h_dimali": "İki noktaya ve ölçü çizgisinin yerine tıkla. İki nokta arasındaki gerçek mesafeyi yazar.", "h_dimang": "Köşe noktasına, iki kolun üzerine ve yayın duracağı yere tıkla.", "h_dimrad": "Daire ya da yayın üzerine tıkla, sonra yazının duracağı yere tıkla.", "h_dimdia": "Daire ya da yayın üzerine tıkla, sonra yazının duracağı yere tıkla.", "h_box": "Tabanın iki köşesine tıkla, sonra yüksekliği yaz ya da fareyi yukarı çek.", "h_cyl": "Merkeze tıkla, yarıçapı ver, sonra yüksekliği yaz ya da fareyi yukarı çek.", "h_cone": "Merkeze tıkla, yarıçapı ver, sonra yüksekliği yaz ya da fareyi yukarı çek.", "h_sphere": "Merkeze tıkla, yarıçapı tıkla ya da yaz. Küre çalışma düzlemine oturur.", "h_extrude": "Kapalı çoklu çizgi veya daire seç, Enter’a bas, yüksekliği yaz.", "h_move": "Nesneleri seç, Enter. Taban noktasına, sonra hedefe tıkla.", "h_copy": "Nesneleri seç, Enter. Taban noktasına, sonra her kopya için hedefe tıkla. Enter bitirir.", "h_rotate": "Nesneleri seç, Enter. Dönme merkezine tıkla, açıyı derece olarak yaz.", "h_scale": "Nesneleri seç, Enter. Sabit kalacak noktaya tıkla, katsayıyı yaz (2 = iki katı, 0.5 = yarısı).", "h_mirror": "Nesneleri seç, Enter. Ayna ekseninin iki noktasına tıkla. Asıl nesne yerinde kalır.", "h_array": "Nesneleri seç, Enter. Sütun ve satır sayısını, sonra sütun ve satır aralığını yaz.", "h_offset": "Mesafeyi yaz, nesneye tıkla, sonra hangi tarafa olacağına tıkla.", "h_trim": "Silinecek parçaya tıkla. Parça en yakın kesişim noktalarından kesilir.", "h_extend": "Çizginin uzatılacak ucuna yakın tıkla. Karşılaştığı ilk nesneye kadar uzar.", "h_fillet": "Yarıçapı yaz, sonra iki çizgiye tıkla. 0 yazarsan keskin köşe yapar.", "h_insert": "Yerleştirmek için tıkla. Ölçek ve açıyı Özellikler’den değiştir. Enter bitirir."});
Object.assign(I18N.en,{"guide": "Guide", "hints": "Tips", "on": "on", "off": "off", "hideHints": "Hide tips", "hintsOff": "Tips are off. Turn them back on under More in the side panel.", "tourStart": "Start the tour", "skip": "Skip", "next": "Next", "back": "Back", "done": "Finish", "gTitle": "Pergel Guide", "tr1": "Tools|Drawing, dimension, solid and editing tools live here. After you pick one, the tip in the drawing area and the command line below tell you what to do.", "tr2": "Drawing area|Click here to place points. Drag with the right button to orbit, use the wheel to zoom. On a phone, pan and zoom with two fingers.", "tr3": "Views|Top, Front, Right and 3D are ready-made views. Fit brings the whole drawing into view.", "tr4": "Panel|Layers, the properties of the selected object and the ready-made objects. On a phone this button opens it.", "tr5": "Command line|Type sizes here: type 250 and press Enter to draw 250 units towards the cursor. You can also type a command name: line, circle, box.", "tr6": "Status bar|Cursor coordinates, the grid and snap switches, the grid step and the working elevation.", "tr7": "Guide|Step-by-step instructions are here. You can restart this tour from the guide window at any time.", "h_select": "Click an object. Drag on empty space: to the right selects what is fully inside, to the left what it touches. Shift adds to the selection.", "h_orbit": "Drag to orbit the view. Press Esc when done.", "h_measure": "Click two points. Distance and angle appear above the command line.", "h_line": "Click points in turn. For an exact length, aim the cursor, type the number and press Enter. An empty Enter finishes.", "h_poly": "Click points. C closes, Enter finishes. The result is one object; its area shows in Properties.", "h_image": "Puts a map, aerial photo or scanned plan under the drawing. Choose the file, click the lower-left corner, click or type the width. Then select it and use <b>Scale by two points</b> in Properties to bring it to true size.", "h_refscale": "Scales the selection by a known length: click both ends of the length, type its real size. Ideal for underlay pictures.", "h_foffset": "Offsets a solid face's edge, or a shape on a face, inwards or outwards on that face. Click the face, move the mouse in or out or type the distance. Example: offset a pool's top 30 inwards, then push the inside down 150.", "h_walk": "Walk through the design at eye height (1.60 m). Click where to stand; arrows or WASD to move and turn, drag to look, wheel to step. It follows floors, solids and terrain. On a phone use the buttons bottom right.", "h_drop": "Sets the selected solid or block exactly onto the surface right below it (or the ground) with no gap or overlap. Shapes on its faces go along.", "h_hide": "Hides the selected objects. Nothing is deleted; Show all on the bar at the bottom brings them back.", "h_isolate": "Hides everything except the selection, for working in a busy drawing.", "h_unhide": "Shows every hidden object again.", "h_spline": "Smooth curve: click the points it should pass through. Enter leaves it open; click the first point (or K) to close it. Select it later and drag its points to reshape.", "h_rect": "Click two opposite corners. For exact size, type @width,depth after the first corner (e.g. @500,300).", "h_circle": "Click the centre, then click or type the radius.", "h_arc": "Three points: start, a point on the arc, end.", "h_polygon": "Type the number of sides, click the centre, then click or type the corner distance.", "h_ellipse": "Click the centre and the end of the first axis; then click or type the second half axis.", "h_text": "Click the position, type the text in the line below and press Enter.", "h_hatch": "Select a closed polyline or circle and press Enter. Change pattern, angle and spacing in Properties.", "h_dimlin": "Click the two points to measure, then where the dimension line should sit. It measures horizontally or vertically depending on that position.", "h_dimali": "Click two points and the dimension line position. It shows the true distance between the points.", "h_dimang": "Click the corner point, a point on each leg, and where the arc should sit.", "h_dimrad": "Click on a circle or arc, then where the text should sit.", "h_dimdia": "Click on a circle or arc, then where the text should sit.", "h_box": "Click two corners of the base, then type the height or drag upwards.", "h_cyl": "Click the centre, give the radius, then type the height or drag upwards.", "h_cone": "Click the centre, give the radius, then type the height or drag upwards.", "h_sphere": "Click the centre, then click or type the radius. The sphere sits on the working plane.", "h_extrude": "Select a closed polyline or circle, press Enter, type the height.", "h_move": "Select objects, Enter. Click a base point, then the target.", "h_copy": "Select objects, Enter. Click a base point, then a target for each copy. Enter finishes.", "h_rotate": "Select objects, Enter. Click the rotation centre, type the angle in degrees.", "h_scale": "Select objects, Enter. Click the fixed point, type the factor (2 = double, 0.5 = half).", "h_mirror": "Select objects, Enter. Click two points of the mirror axis. The original stays.", "h_array": "Select objects, Enter. Type the number of columns and rows, then the column and row spacing.", "h_offset": "Type the distance, click the object, then click the side.", "h_trim": "Click the part to remove. It is cut at the nearest intersections.", "h_extend": "Click near the end of the line to extend. It grows to the first object it meets.", "h_fillet": "Type the radius, then click two lines. 0 makes a sharp corner.", "h_insert": "Click to place. Change scale and angle in Properties. Enter finishes."});
const GUIDE={"tr": [["1 · İlk çizim", ["<b>Komut ara</b>: bir aracın yerini bilmiyorsan üstteki büyütece bas ya da <kbd>Ctrl+K</kbd>. Ne yapmak istediğini yaz (örn. daire, havuz, ölçek, ağaç, kaydet); Türkçe harfsiz yazsan da bulur. Ok tuşlarıyla seç, Enter’a bas.", "<b>Telefonda Özellikler</b>: sağ üstteki panel düğmesine ya da seçim menüsündeki Özellikler’e dokun; panel alttan açılır. Kapatmak için üstteki çizgiyi aşağı kaydır ya da ona dokun.", "<b>Son kullanılanlar ve geçmiş</b>: şeridin en üstünde son kullandığın 5 araç durur, tek tıkla yeniden başlatırsın. Komut satırının üstünde yalnız son mesaj görünür; sağdaki <b>Geçmiş</b> ile önceki komutları ve mesajları açarsın, <b>Kısalt</b> ile kapatırsın.", "<b>Araç şeridi</b>: soldaki şeridin üstündeki sekmelerden (Görünüm, Çiz, Katı, Düzenle, Ölçü, Peyzaj) birini seç; o gruptaki araçlar adlarıyla görünür. Bir aracın üstünde durursan kısayolu ve ne işe yaradığı yazar. Telefonda sekmeler alttadır.", "Soldaki araçlardan <b>Çizgi</b>’ye bas (ya da klavyeden <kbd>L</kbd> yazıp Enter).", "Çizim alanında bir noktaya, sonra ikinci noktaya tıkla. Tıklamaya devam ettikçe çizgi uzar.", "<kbd>Enter</kbd> zinciri bitirir, <kbd>Esc</kbd> araçtan çıkar.", "Yanlış olduysa <kbd>Ctrl+Z</kbd> geri alır.", "Telefonda parmağını basılı sürükle: imleç parmağının biraz üstünde durur ve yakalama simgesi (kare: uç, üçgen: orta, daire: merkez, çarpı: kesişim) görünür. Doğru yere gelince bırak."]], ["2 · Ölçüyle çizim", ["<b>Eksen kilidi</b>: çizerken fareyi son noktadan X yönüne götürürsen kırmızı, Y yönüne götürürsen yeşil, yan görünüşte yukarı götürürsen mavi kesikli bir kılavuz çıkar ve çizgi o yöne yapışır; 30°, 45°, 60° gibi açılarda da pembe kılavuz çıkar. Bu sırada sayı yazıp Enter’a basarsan o yönde tam o uzunlukta çizer. Kapatmak ya da açmak için <kbd>izle</kbd> yaz; Dik (F8) açıkken devre dışıdır.", "İlk noktayı koy, fareyi gideceğin yöne götür, <kbd>250</kbd> yazıp Enter’a bas: o yönde 250 birim çizer.", "Son noktaya göre: <kbd>@200,0</kbd> sağa 200 birim, <kbd>@0,-150</kbd> aşağı 150 birim.", "Uzunluk ve açı: <kbd>@200&lt;45</kbd> 200 birim, 45°.", "Belirli bir yere: <kbd>100,50</kbd> (sağa,yukarı). Ondalık için nokta kullan: <kbd>12.5</kbd>.", "Dikdörtgende ilk köşeden sonra <kbd>@500,300</kbd> yazarsan 5 × 3 m olur.", "<b>Dik</b> (<kbd>F8</kbd>) çizgiyi yatay ya da dikeye kilitler. <b>Izgara</b> noktaları adım aralığına oturtur; serbest çizmek için kapat.", "Çizim birimini durum çubuğundaki <b>Birim</b> düğmesinden seçersin (mm, cm, m, inç, ft). Ölçü yazıları başka birimde gösterilebilir: çizim metreyken ölçüler cm yazılabilir."]], ["3 · Görünümü yönetme", ["<b>Yürüyerek gez</b>: Seç bölümündeki yürüyen adam düğmesine bas (ya da <kbd>yuru</kbd> yaz) ve durmak istediğin yere tıkla. Göz yüksekliğinden (1,60 m) tasarıma bakarsın. Ok tuşları ya da W/S ile ilerle-geri, A/D ile yana, ←/→ ile dön; fareyle sürükleyerek etrafa bak, tekerlekle adım at, Shift ile hızlan. Zemin, katı ve arazi yüksekliğini izler; basamak ve tepelere çıkarsın. Telefonda sağ alttaki düğmeleri kullan. Esc ya da Gezintiden çık ile biter.", "<b>Kayıtlı görünümler</b>: sağ üstteki kamera düğmesine bas (ya da <kbd>sahne</kbd> yaz). İstediğin bakış açısını ve katman düzenini kurup bir ad verip <b>Bu görünümü kaydet</b>; sonra ada tıklayınca o görünüme yumuşakça dönülür. Perspektif ve hangi katmanların açık olduğu da kaydedilir. Görünümler çizim dosyasıyla birlikte saklanır; Güncelle ile şimdiki görünümü üzerine yazarsın.", "<b>Sağ tuşla sürükle</b>: görünümü döndürür. <b>Orta tuşla sürükle</b>: kaydırır. <b>Tekerlek</b>: yakınlaştırır.", "Sağ üstteki <b>Üst / Ön / Sağ / 3B</b> hazır bakışlardır. Plan çizerken Üst’ü kullan.", "<b>Sığdır</b> tüm çizimi ekrana getirir. Çizimi kaybedersen buna bas.", "Telefonda iki parmakla kaydırıp yakınlaştır. Döndürmek için <b>Döndürerek bak</b> aracını seç ve tek parmakla sürükle."]], ["4 · 3B katılar", ["<b>Kutu</b>: tabanın iki köşesine tıkla, yüksekliği yaz (örn. <kbd>90</kbd>).", "<b>Silindir / Koni</b>: merkez, yarıçap, yükseklik. <b>Küre</b>: merkez ve yarıçap.", "<b>Yükselt</b>: kapalı bir çoklu çizgi ya da daire seç, Enter’a bas, yüksekliği yaz. Duvar, havuz, kasa gibi şekiller böyle yapılır.", "<b>Altlık resim</b>: halihazır harita, uydu görüntüsü ya da taranmış proje resmini çizimin altına koyar. Ekle bölümündeki resim düğmesine bas (ya da <kbd>resim</kbd> yaz), dosyayı seç, sol alt köşeye tıkla, genişliği tıkla ya da yaz. Gerçek ölçüye getirmek için resmi seç, Özellikler’de <b>İki noktayla ölçekle</b>’ye bas: resimde uzunluğunu bildiğin bir şeyin (yol genişliği, parsel kenarı) iki ucuna tıkla, gerçek uzunluğu yaz. Saydamlığı Özellikler’den ayarla; üstünden çizerken kaymasın diye katmanını kilitleyebilirsin. Resim paftaya da basılır.", "<b>Eğri</b>: tarh, patika, gölet kenarı gibi yumuşak çizgiler için. Eğri aracını seç (ya da <kbd>egri</kbd> yaz), geçmesini istediğin noktalara sırayla tıkla; Enter açık bitirir, ilk noktaya tıklarsan kapanır. Kapalı eğri taranabilir, yükseltilebilir, alanı ölçülür.", "<b>Nokta tutamaçları</b>: tek bir çizgi, çoklu çizgi ya da eğri seçiliyken köşelerindeki kare tutamaçları sürükleyerek şekli düzeltebilirsin; eğride eğri yumuşak kalır. Yakala açıksa başka nesnelerin noktalarına yapışır. Geri al ile döner.", "<b>Yüzeye çizim</b>: Çizgi, Çoklu çizgi, Dikdörtgen ya da Daire aracındayken fareyi bir katının yüzüne getir; yüz mavi parlar. Tıkladığın anda çizim o yüzün üstüne yapılır (üst, yan ya da eğik yüz). Yan ve eğik yüzlerde daire, yüzün düzleminde kapalı bir çoklu çizgi olarak çizilir.", "<b>Yüz kenarını ötele</b>: Katı bölümündeki Yüz kenarını ötele aracını seç (ya da <kbd>yuzotele</kbd> yaz), katının bir yüzüne ya da yüzdeki bir şekle tıkla; fareyi içeri ya da dışarı götürüp tıkla ya da uzaklığı yaz (artı içeri, eksi dışarı). Yüzün üstünde kenara paralel yeni bir şekil çizilir. Örnek havuz: kutunun üst yüzünü 30 içeri ötele, sonra içteki şekli 150 aşağı it; 30 cm kenarlı havuz olur.", "<b>Yüz seçimi</b>: seçili katının bir yüzüne dokununca yüz mavi boyanır ve düzlemi üzerinde soluk bir ağ görünür; aynı yüze yeniden dokununca kalkar. Ağı Ayarlar'dan (\u201cSeçili yüzde düzlem ağı\u201d) ya da komut aramada \u201cyüz ağı\u201d yazarak açıp kapatabilir, rengini seçebilirsin.", "<b>Yapılmış pah/yuvarlatmayı düzeltme</b>: katıyı seç, pahın ya da yuvarlatmanın kendi yüzüne dokun. (Eski çizimlerdeki ya da birleştirmeden önce yapılmış pah/yuvarlatmalar da tanınır.) Açılan pencerede türü ve ölçüyü değiştirip Tamam de; <b>Kaldır</b> ile kenar yeniden keskin olur. Diğer pah/yuvarlatmalar ve köşeleri kendiliğinden yeniden kurulur.", "<b>Seçim menüsü</b>: bir nesne seçince Taşı, Kopyala, Döndür, Aynala, Sil, Döndürerek bak, Gizle gibi düğmeler çıkar. Telefonda ekranın altında durur, katıyı kapatmaz. Telefonda yalnız simgelerden oluşan ince bir şerittir (SpaceClaim gibi): en çok kullanılanlar görünür, diğerleri <b>⋯</b> ile açılır; bir düğmeye basılı tutunca adı görünür. Soldaki ⠿ tutamacından sürükleyip istediğin yere taşıyabilirsin; ekranın sol ya da sağ kenarına bırakınca dikey sütun olur, ortaya bırakınca yeniden yatay olur. Çift dokunuşla yerine döner.", "<b>Sağ tık menüsü</b>: bilgisayarda sağ tıkla (telefonda parmağını yarım saniye basılı tut); tıkladığın yere göre değişen bir menü açılır. Katının kenarında Yuvarlat ve Pah kır, yüzünde İt/Çek, Yüz kenarını ötele ve Yüze dik bak, yuvarlatma ya da pah yüzünde Düzenle; çizgi ve şekillerde Yükselt, Döndürerek katı, Süpürerek katı, Ötele, Buda; boş yerde Sığdır, görünümler, Hepsini seç gibi işler. Bir araç açıkken Bitir ve İptal çıkar. Sağ tuşa basılı tutup sürüklersen menü açılmaz, görünüm döner. İstemezsen Ayarlar’dan kapatabilirsin; o zaman sağ tık eskisi gibi Enter işi görür.", "<b>Çoklu seçim</b>: bilgisayarda <kbd>Shift</kbd> ya da <kbd>Ctrl</kbd> ile tıkla; sürükleyerek pencereyle seç; <kbd>Ctrl+A</kbd> hepsini seçer. Telefonda seçim menüsündeki ya da Seç ve Gör sekmesindeki <b>Çoklu seç</b> düğmesini aç: dokunduğun nesneler seçime eklenir, seçili olana dokununca çıkar.", "<b>Birden çok kenara pah/yuvarlatma</b>: katıyı seç, bir kenara dokun; pencere açıkken başka kenarlara da dokunarak ekle ya da çıkar, sonra Tamam. Yalnız seçtiğin kenarlar işlenir. Pencerede \"teğet devam eden kenarlara da uygula\" kutusu hep görünür. Kenarı yumuşakça sürdüren kenar varsa (örneğin daha önce yuvarlatılmış bir köşenin yanında) sayısı yazar; işaretlersen onlar da (kesik turuncu) birlikte yuvarlanır. Keskin köşeli bir kutuda böyle kenar olmadığı için kutu soluk görünür ve seçilemez.", "<b>Tek parça daire, yay ve elips</b>: her düzlemde (yan ya da eğik yüzde de) tek nesnedir, noktalara bölünmez. Seçince tutamaçlar çıkar: ortadaki tutamaçla taşı, kenardakiyle büyüt/küçült (yayda uçlar, elipste iki yarıçap). Döndür, aynala, ölçekle ve X/Y ekseninde döndürmeden sonra da tek parça kalır; DXF'e gerçek daire/yay olarak yazılır.", "<b>Kesin geometri</b>: katılar OpenCascade geometri motoruyla formülle saklanır (düzlem, silindir, koni, küre, gerçek yuvarlatma). Birleştir, çıkar, kesiştir ve kenar pahı/yuvarlatma kesin hesaplanır; hacim ve metraj formülle aynı çıkar. Motor ilk açılışta bir kez iner (yaklaşık 7 MB), sonra internetsiz de çalışır.", "<b>Birleşmiş katıda kenar pahı / yuvarlatma</b>: it/çek, birleştir ya da çıkar ile oluşmuş bir katıyı seç; kenarları mavi çizgiyle görünür. Bir kenara dokun (delik ya da oyuk kenarındaki yay tek kenar sayılır; teğet devam eden kenarlar, örneğin önceki bir yuvarlatmanın ucu, birlikte seçilir ve tek parça yuvarlanır); açılan pencerede Pah (mesafe + 2. mesafe) ya da Yuvarlatma (yarıçap) seç, Tamam. Yalnız dışa dönük (keskin) kenarlarda çalışır; içe dönük köşe için dışa yuvarlatma/pah kullan.", "<b>Yüzeye tam oturma</b>: bir katının yüzüne çizdiğin şekiller ve yüze tıklayarak kurduğun katılar yüzün tam üstüne oturur, arada kıl payı boşluk kalmaz. Yanlışlıkla havada kalan ya da içine gömülen bir katıyı ya da bloğu seç, seçim menüsünden <b>Yüzeye oturt</b>’a bas (Düzenle sekmesinde de var): hemen altındaki yüzeye, yoksa zemine tam iner ya da çıkar.", "<b>Birleşime dışa yuvarlatma / pah (kaynak gibi)</b>: bir katı başka bir katının yüzüne oturuyorsa (örn. kutunun üstündeki silindir), üstteki katının alt kenarına tıkla; açılan küçük pencerede <b>Alttaki katıyla birleşim</b> bölümünden Dışa yuvarlatma (yarıçap) ya da Dışa pah seç; pahta içe pahtaki gibi tabanda mesafe, açı ve duvarda mesafe verilir (eşit değilse eğik pah olur), <b>Uygula</b>. Köşeye ayrı bir parça olarak malzeme eklenir; <b>İki katıyla birleştir</b> işaretlersen hepsi tek parça olur. Kutu üstündeki kutuda dört kenarın hepsine birden uygulanır.", "<b>İt/Çek düğmesi</b>: yüzdeki şekli seçince üstteki menüde <b>İt/Çek</b> çıkar; bas, ölçüyü yaz (artı yukarı/dışarı çıkıntı, eksi aşağı/içeri oyuk ya da delik) ya da fareyi oynatıp tıkla. Katı sekmesindeki ilk araç da odur: şeklin içine tıkla, sonra ölçüyü yaz.", "<b>Yüzdeki şekli it / çek</b>: katının yüzüne çizdiğin daire, dikdörtgen ya da kapalı çoklu çizginin içine gel (el imleci çıkar), basılı tutup sürükle. Dışarı çekersen çıkıntı, içeri itersen oyuk olur; katıyı geçecek kadar itersen delik açılır. Ölçü sürüklerken yanında yazar. Şekle bir kez tıklayıp ölçüyü yazabilirsin (örn. <kbd>-50</kbd>, Enter). Şekil yeni yüzün üstüne taşınır; tekrar itip çekebilirsin. Geri al ile geri dönersin.", "<b>Yüzdeki şekli kaydırma</b>: şeklin çizgisinden (imleç dört ok olur) tutup sürükle; şekil yüzün üstünde kayar. Seçili şeklin yüz kenarlarına uzaklıkları turuncu ölçülerle görünür. Bir ölçüye tıklayıp istediğin değeri yaz: şekil tam o uzaklığa gelir.", "Katıyı Taşı, Döndür, Aynala, Ölçekle ya da Kopyala ile değiştirince yüzlerine çizdiğin şekiller de onunla birlikte gider.", "Katının arkasında ya da içinde kalan çizgiler kaybolmaz; soluk renkte görünür. Böylece yerlerini her zaman görürsün.", "Bir şeyi yukarıda çizmek için durum çubuğundaki <b>Kot</b> değerini değiştir (örn. 100). Çizilmiş bir nesneyi yükseltmek için Özellikler’deki <b>Kot (Z)</b> alanını kullan."]], ["5 · Ölçülendirme", ["<b>Doğrusal ölçü</b>: iki noktaya tıkla, sonra ölçü çizgisinin duracağı yere. Üste ya da alta çekersen yatay, yana çekersen dikey ölçer.", "<b>Hizalı ölçü</b>: eğik bir kenarın gerçek uzunluğunu yazar.", "<b>Açı ölçüsü</b>: köşe, birinci kol, ikinci kol, sonra yayın yeri.", "<b>Yarıçap / Çap</b>: daireye tıkla, yazının yerini göster.", "Yazı küçük ya da büyükse: hiçbir şey seçili değilken Özellikler’deki <b>Ölçü yazı yüks.</b> değerini değiştir. Tek bir ölçünün yazısını seçip Özellikler’den değiştirebilirsin.", "Sadece ölçmek istiyorsan <b>Ölç</b> aracını kullan; çizime bir şey eklemez."]], ["6 · Seçme ve düzenleme", ["<b>Seçme</b>: nesneye tıkla. Sürükleyerek kutu aç: sağa doğru yalnızca içinde kalanlar, sola doğru değenler seçilir. <kbd>Shift</kbd> seçime ekler, <kbd>Del</kbd> siler.", "<b>Gizle / Yalnız bunları göster</b>: kalabalık çizimde seçtiğin nesneleri gizle ya da yalnızca onları bırakıp gerisini gizle (Seç bölümündeki düğmeler ya da Özellikler’deki Görünürlük satırı). Çizimden hiçbir şey silinmez; altta çıkan çubuktaki <b>Hepsini göster</b> ile hepsi geri gelir. Gizli nesneler paftaya basılmaz.", "<b>Seçim menüsü</b>: bir ya da birkaç nesne seçince üstünde küçük bir menü çıkar: Taşı, Kopyala, Döndür, Aynala, Gizle, Sil. İki ya da daha çok katı seçiliyse Birleştir ve Çıkar da gelir; telefonda Özellikler düğmesi de vardır. Düğmeye basınca araç seçili nesnelerle hemen başlar.", "<b>Taşı / Kopyala</b>: seç, Enter, taban noktası, hedef.", "<b>Döndür</b>: merkez ve açı. <b>Ölçekle</b>: sabit nokta ve katsayı.", "<b>Aynala</b>: iki noktayla eksen göster. <b>Doğrusal çoğalt</b>: sütun, satır ve aralıkları yaz.", "<b>Ötele</b>: mesafeyi yaz, nesneye ve tarafa tıkla. Yol kenarı, bordür gibi paralel çizgiler için.", "<b>Buda</b>: fazlalık parçaya tıkla. <b>Uzat</b>: kısa kalan uca yakın tıkla.", "<b>Yuvarlat</b>: yarıçapı yaz, iki çizgiye tıkla."]], ["7 · Katmanlar, renk ve çizgi tipi", ["Sağ panelde <b>Ekle</b> ile katman aç, adına çift tıklayarak değiştir.", "Katmanın adına tıklayınca <b>etkin</b> olur; yeni çizdiklerin o katmana gider.", "Göz simgesi gizler, kilit düzenlemeyi kapatır, renk kutusu rengi değiştirir.", "Hiçbir şey seçili değilken Özellikler’de etkin katmanın <b>çizgi tipini</b> ve <b>kalınlığını</b> ayarlarsın.", "Tek bir nesneye farklı renk ya da çizgi tipi vermek için onu seç ve Özellikler’den değiştir.", "Kesikli çizgiler çok sık ya da seyrekse <b>Çizgi tipi ölçeği</b> değerini değiştir."]], ["8 · Tarama ve hazır nesneler", ["<b>Tarama</b>: kapalı bir şekli seç, Tarama aracına bas, Enter. Deseni (çizgili, çapraz, dolu), açıyı ve aralığı Özellikler’den değiştir. Alanı m² olarak görünür.", "<b>Bitki seç (tür ve ebat)</b>: Hazır nesneler bölümündeki bu düğme ya da komut aramada “bitki”. Gövde çevresi, boy ve kök/saksı bilgisini yaz, listeden türe tıkla (çınar, ıhlamur, fıstık çamı, lavanta… 40’tan çok tür), çizimde yerleştir. Seçili bitkinin türü ve ebatı Özellikler’den değiştirilir. Metraj, keşif cetveli ve paftadaki bitki listesi tür + ebata göre ayrı satır olur, birim adettir.", "<b>Hazır nesneler</b>: sağ panelden ağaç, bank, aydınlatma gibi bir nesne seç ve çizimde tıkla. Ölçek ve açıyı Özellikler’den ayarla. Ağaç, çam, servi, palmiye, söğüt ve çalı ayrı parçalardan (gövde, kök, eğik dallar, taç kümeleri, palmiye yaprakları, söğüdün sarkan dalları) oluşur: bloğu <b>Düzenle</b> ile açıp tek bir parçanın rengini, boyunu ya da yerini değiştirebilir, <b>Patlat</b> ile parçalara ayırabilirsin. Ağacı seçince Özellikler’de <b>taç çapı ve boyu</b> görünür; <b>Tür adı</b> yazıp <b>Etiket göster</b>i işaretlersen ağacın yanına “ad Ø… H… m” yazılır, paftaya ve DXF’e de geçer. Metraj bitkileri tür adına göre ayrı sayar. Eski bir çizimdeki ağacı seçince Özellikler’de <b>Yeni modele güncelle</b> çıkarsa, basınca o türün bütün kopyaları güncel modele geçer.", "<b>Alan</b>: köşelere sırayla tıkla, K ya da Enter ile kapat. Alan (m²) ve çevre şeklin ortasına yazılır; şekli taşıyıp ölçeklersen yazı güncellenir. Kapalı bir şekli seçip Alan’a basarsan doğrudan alana çevrilir. Alan yazısını seçip Özellikler’den boyutunu (A− / A+), kalın ya da eğik biçimini, rengini, birimini (m², dönüm, ha), ondalığını, ön ekini, açısını ve yerini değiştirirsin; son biçim sonraki alanlarda da kullanılır.", "Birden çok alan, kapalı şekil ya da çizgi seçersen Özellikler’de <b>toplam alan</b> ve <b>toplam uzunluk</b> görünür."]], ["9 · Dosyalar", ["<b>Bilgisayara kur</b>: üst çubuktaki ekran simgesine ya da Diğer › Bilgisayara kur’a bas (Chrome/Edge). Pergel kendi penceresinde açılan bir program olur; masaüstüne ve Başlat menüsüne eklenir, internet olmadan da çalışır ve her açılışta güncellenir. Telefonda Safari’de Paylaş › Ana Ekrana Ekle.", "<b>Kaydet</b>: çizimin tamamını Pergel dosyası (.json) olarak indirir. Katılar ve ölçüler düzenlenebilir kalır. Üstteki ad kutusuna dosya adını yaz.", "<b>Aç</b>: Pergel, DXF ya da DWG dosyası açar. Dosyayı çizim alanına sürükleyip bırakabilirsin.", "<b>DXF</b>: başka CAD programları için dışa aktarır. Katılar yüzey ağı, ölçüler çizgi ve yazı olarak gider.", "Çizim ayrıca bu tarayıcıda otomatik saklanır; yine de önemli işleri <b>Kaydet</b> ile dosyaya al."]], ["10 · Sık karşılaşılanlar", ["<b>Nokta istediğim yere gitmiyor</b>: Izgara ya da Yakala açıktır. Durum çubuğundan kapat.", "<b>Çizim ekranda yok</b>: Sığdır’a bas.", "<b>Nesneyi seçemiyorum</b>: katmanı kilitli ya da gizli olabilir.", "<b>Araç bir şey yapmıyor</b>: komut satırındaki mavi yazı sıradaki adımı söyler.", "<b>Yükseklik fareyle olmuyor</b>: Üst görünümde yükseklik görünmez; sayıyı yaz ya da 3B görünüme geç.", "<b>DWG açılmadı</b>: dosyayı kaynağında DXF olarak kaydedip onu aç."]]], "en": [["1 · First drawing", ["<b>Search commands</b>: if you do not know where a tool is, press the magnifier at the top or <kbd>Ctrl+K</kbd>. Type what you want to do (e.g. circle, pool, scale, tree, save); pick with the arrow keys and press Enter.", "<b>Properties on a phone</b>: tap the panel button top right or Properties in the selection menu; the panel slides up from the bottom. Swipe its top bar down or tap it to close.", "<b>Recent tools and history</b>: the top of the rail keeps your last 5 tools for one-click restart. Above the command line only the last message shows; <b>History</b> on the right opens earlier commands and messages, <b>Collapse</b> closes them.", "<b>Tool rail</b>: pick a tab at the top of the left rail (View, Draw, Solid, Edit, Dimension, Site); that group's tools show with their names. Hover a tool to see its shortcut and what it does. On a phone the tabs are at the bottom.", "Pick <b>Line</b> from the tools on the left (or type <kbd>L</kbd> and press Enter).", "Click a point in the drawing area, then a second one. Keep clicking to continue the chain.", "<kbd>Enter</kbd> ends the chain, <kbd>Esc</kbd> leaves the tool.", "<kbd>Ctrl+Z</kbd> undoes a mistake.", "On a phone, press and drag: the cursor floats a little above your finger and the snap marker shows (square: end, triangle: mid, circle: centre, cross: intersection). Release at the right spot."]], ["2 · Drawing to size", ["<b>Axis lock</b>: while drawing, move the mouse from the last point along X for a red, along Y for a green, or upwards in a side view for a blue dashed guide, and the line sticks to it; 30°, 45°, 60° and similar angles show a pink guide. Type a number and Enter to draw exactly that length that way. Type <kbd>track</kbd> to switch it off or on; it is off while Ortho (F8) is on.", "Place the first point, aim the cursor, type <kbd>250</kbd> and press Enter: it draws 250 units that way.", "Relative to the last point: <kbd>@200,0</kbd> is 200 units right, <kbd>@0,-150</kbd> is 150 units down.", "Length and angle: <kbd>@200&lt;45</kbd> is 200 units at 45°.", "An exact place: <kbd>100,50</kbd> (right,up). Use a dot for decimals: <kbd>12.5</kbd>.", "In Rectangle, typing <kbd>@500,300</kbd> after the first corner gives 5 × 3 m.", "<b>Ortho</b> (<kbd>F8</kbd>) locks lines to horizontal or vertical. <b>Grid</b> snaps points to the step; turn it off to draw freely.", "Pick the drawing unit with the <b>Unit</b> button in the status bar (mm, cm, m, in, ft). Dimension text can use another unit: a drawing in metres can show dimensions in cm."]], ["3 · Moving around", ["<b>Walk through</b>: press the walking-person button in Select (or type <kbd>walk</kbd>) and click where to stand. You see the design from eye height (1.60 m). Arrows or W/S move forward-back, A/D sideways, ←/→ turn; drag to look around, wheel to step, Shift to go faster. It follows floors, solids and terrain, so you climb steps and slopes. On a phone use the buttons bottom right. Esc or Leave walk ends it.", "<b>Saved views</b>: press the camera button top right (or type <kbd>scene</kbd>). Set up the viewing angle and the layers you want, give it a name and press <b>Save this view</b>; click the name later to glide back to it. Perspective and which layers are on are saved too. Views are kept in the drawing file; Update overwrites one with the current view.", "<b>Right-drag</b> orbits. <b>Middle-drag</b> pans. The <b>wheel</b> zooms.", "<b>Top / Front / Right / 3D</b> at the top right are ready-made views. Use Top for plans.", "<b>Fit</b> shows the whole drawing. Press it if you lose the drawing.", "On a phone, pan and zoom with two fingers; drag one finger on empty space to orbit (this can be turned off in Settings)."]], ["4 · 3D solids", ["<b>Box</b>: click two corners of the base, type the height (e.g. <kbd>90</kbd>).", "<b>Cylinder / Cone</b>: centre, radius, height. <b>Sphere</b>: centre and radius.", "<b>Extrude</b>: select a closed polyline or circle, press Enter, type the height. Good for walls, pools and planters.", "<b>Underlay image</b>: puts a map, aerial photo or scanned plan under the drawing. Press the picture button in Insert (or type <kbd>image</kbd>), choose the file, click the lower-left corner, click or type the width. To bring it to true size select it and press <b>Scale by two points</b> in Properties: click both ends of something whose length you know (a road width, a plot edge) and type the real length. Set its opacity in Properties; lock its layer so it does not shift while you trace. The picture prints on the sheet too.", "<b>Spline</b>: for soft lines such as planting beds, paths and pond edges. Pick the Spline tool (or type <kbd>spline</kbd>) and click the points it should pass through; Enter leaves it open, clicking the first point closes it. A closed curve can be hatched, extruded and measured.", "<b>Point grips</b>: with one line, polyline or curve selected, drag the square grips at its points to reshape it; a curve stays smooth. With Snap on it sticks to other objects' points. Undo reverts.", "<b>Drawing on a face</b>: with Line, Polyline, Rectangle or Circle, move the mouse onto a solid's face; it lights up blue. Your drawing then lies on that face (top, side or sloped). On side and sloped faces a circle is drawn as a closed polyline in the face's plane.", "<b>Offset face edge</b>: pick Offset face edge in Solid (or type <kbd>foffset</kbd>), click a solid face or a shape on a face; move the mouse in or out and click, or type the distance (plus inwards, minus outwards). A new shape parallel to the edge is drawn on the face. Pool example: offset a box's top 30 inwards, then push the inner shape down 150; you get a pool with a 30 cm rim.", "<b>Face selection</b>: tap a face of the selected solid to tint it and show a faint grid on its plane; tap it again to clear. Turn the grid on/off or pick its colour in Settings (\u201cPlane grid on the selected face\u201d) or type \u201cface grid\u201d in command search.", "<b>Editing a chamfer/round</b>: select the solid and tap the chamfer's or round's own face. (Chamfers/rounds from older drawings or made before a union are recognised too.) In the box change the kind or size and press OK; <b>Remove</b> makes the edge sharp again. The other chamfers/rounds and their corners are rebuilt automatically.", "<b>Selection menu</b>: selecting an object shows Move, Copy, Rotate, Mirror, Delete, Orbit view, Hide and more. On a phone it sits at the bottom and does not cover the solid. On a phone it is a slim icon-only strip (like SpaceClaim): the most used buttons show, the rest open with <b>⋯</b>; hold a button to see its name. Drag its ⠿ grip anywhere; drop it on the left or right edge and it stands up as a column, drop it in the middle and it lies flat again. Double-tap the grip to put it back.", "<b>Right-click menu</b>: right-click on a computer (on a phone hold your finger for half a second); the menu changes with what is under the pointer. On a solid’s edge: Round and Chamfer; on a face: Push/Pull, Offset face edge and Look at face; on a round or chamfer face: Edit; on lines and shapes: Extrude, Revolve, Sweep, Offset, Trim; on empty space: Zoom to fit, views, Select all. With a tool running it offers Finish and Cancel. Right-drag still orbits. Turn it off in Settings and right-click works as Enter again.", "<b>Multiple selection</b>: on a computer click with <kbd>Shift</kbd> or <kbd>Ctrl</kbd>; drag a window; <kbd>Ctrl+A</kbd> selects all. On a phone turn on <b>Multi-select</b> in the selection menu or the View tab: tapped objects are added, tapping a selected one removes it.", "<b>Chamfer/round several edges</b>: select the solid and tap an edge; while the box is open tap more edges to add or remove them, then OK. Only the edges you chose are done. The box \"also apply to edges running on tangentially\" is always shown. When edges carry the chosen one on smoothly (for example next to a corner that was already rounded) it gives their number; tick it to round those too (dashed orange). On a box with sharp corners there are none, so the box is greyed out.", "<b>One-piece circle, arc and ellipse</b>: on any plane (side or sloping faces too) each is a single object, never split into points. Selected, it shows grips: drag the middle one to move it, an edge one to resize it (arc ends, the ellipse's two radii). It stays one piece after rotate, mirror, scale and X/Y-axis rotation, and goes to DXF as a true circle/arc.", "<b>Exact geometry</b>: solids are kept as exact shapes by the OpenCascade geometry engine (planes, cylinders, cones, spheres, true rounds). Union, subtract, intersect and edge chamfer/round are computed exactly; volume and quantities match the formula. The engine downloads once on first use (about 7 MB), then also works offline.", "<b>Chamfer / round on a combined solid</b>: select a solid made by push/pull, union or subtract; its edges show as blue lines. Tap an edge (the arc round a hole or notch counts as one edge; edges that carry on tangentially, such as the end of an earlier round, are taken along and rounded in one piece), pick Chamfer (distance + 2nd distance) or Round (radius), OK. Works on outward (sharp) edges; for an inner corner use the outward round/chamfer.", "<b>Sitting exactly on a face</b>: shapes drawn on a solid's face and solids placed by clicking a face sit exactly on it, with no hair-line gap. Select a solid or block that floats or sinks and press <b>Drop onto surface</b> in the selection menu (also in the Edit tab): it moves exactly onto the surface right below, or the ground.", "<b>Outward round / chamfer at a joint (like a weld)</b>: when a solid stands on another (e.g. a cylinder on a box), click the upper solid's bottom edge; in the small window under <b>Joint with the solid below</b> pick Outward round (radius) or Outward chamfer; a chamfer takes distance on base, angle and distance on wall like the inward one (unequal gives a slanted chamfer), <b>Apply</b>. The corner piece is added separately; tick <b>Unite with both solids</b> to make everything one piece. On a box standing on a box all four edges get it.", "<b>Push/pull button</b>: select a shape on a face and the menu above shows <b>Push/pull</b>; press it and type the distance (plus out, minus in for a pocket or hole) or move the mouse and click. It is also the first tool in the Solid tab: click inside the shape, then type the distance.", "<b>Push / pull a shape on a face</b>: move into a circle, rectangle or closed polyline drawn on a solid's face (the hand cursor shows), hold and drag. Outwards makes a boss, inwards a pocket; push past the far side for a hole. The distance shows while dragging. Or click the shape once and type the distance (e.g. <kbd>-50</kbd>, Enter). The shape moves onto the new face so you can push/pull again. Undo reverts it.", "<b>Sliding a shape on a face</b>: grab the shape's outline (the cursor becomes a four-way arrow) and drag; it slides over the face. A selected shape shows its distances to the face edges in orange. Click one and type a value to place the shape exactly.", "When you Move, Rotate, Mirror, Scale or Copy a solid, the shapes drawn on its faces go along with it.", "Lines behind or inside a solid do not vanish; they show faint so you always see where they are.", "To draw higher up, change <b>Elev</b> in the status bar (e.g. 100). To lift an existing object, use <b>Elevation (Z)</b> in Properties."]], ["5 · Dimensions", ["<b>Linear</b>: click two points, then where the dimension line sits. Pull it above or below for horizontal, sideways for vertical.", "<b>Aligned</b>: shows the true length of a slanted edge.", "<b>Angle</b>: corner, first leg, second leg, then the arc position.", "<b>Radius / Diameter</b>: click the circle, then the text position.", "If the text is too small or large, change <b>Dimension text ht.</b> in Properties with nothing selected. Select a single dimension to change its text.", "To just measure, use <b>Measure</b>; it adds nothing to the drawing."]], ["6 · Selecting and editing", ["<b>Select</b>: click an object. Drag a box: to the right takes only what is inside, to the left what it touches. <kbd>Shift</kbd> adds, <kbd>Del</kbd> deletes.", "<b>Hide / Show only these</b>: in a busy drawing hide the selected objects, or keep only them and hide the rest (buttons in Select, or the Visibility row in Properties). Nothing is deleted; <b>Show all</b> on the bar at the bottom brings everything back. Hidden objects are not printed.", "<b>Selection menu</b>: select one or more objects and a small menu appears above them: Move, Copy, Rotate, Mirror, Hide, Delete. With two or more solids Union and Subtract are added; on a phone there is a Properties button too. A button starts the tool on the selection at once.", "<b>Move / Copy</b>: select, Enter, base point, target.", "<b>Rotate</b>: centre and angle. <b>Scale</b>: fixed point and factor.", "<b>Mirror</b>: show the axis with two points. <b>Linear array</b>: type columns, rows and spacings.", "<b>Offset</b>: type the distance, click the object and the side. Good for kerbs and path edges.", "<b>Trim</b>: click the surplus part. <b>Extend</b>: click near the short end.", "<b>Fillet</b>: type the radius, click two lines."]], ["7 · Layers, colour and line type", ["Use <b>Add</b> in the side panel to create a layer; double-click its name to rename.", "Click a layer name to make it <b>active</b>; new objects go there.", "The eye hides, the lock prevents editing, the swatch changes colour.", "With nothing selected, Properties sets the active layer’s <b>line type</b> and <b>weight</b>.", "To give one object its own colour or line type, select it and change it in Properties.", "If dashes look too dense or sparse, change <b>Line type scale</b>."]], ["8 · Hatch and ready-made objects", ["<b>Hatch</b>: select a closed shape, pick Hatch, press Enter. Change pattern (lines, cross, solid), angle and spacing in Properties. The area shows in m².", "<b>Pick a plant (species and size)</b>: the button in Ready-made objects, or search “plant”. Type trunk girth, height and root/pot, click a species (plane, linden, stone pine, lavender… 40+ species) and place it. Change species and size in Properties. Quantities, the estimate sheet and the plant schedule get one row per species and size, in pieces.", "<b>Ready-made objects</b>: pick a tree, bench or lamp post in the side panel and click in the drawing. Set scale and angle in Properties. Tree, conifer, cypress, palm, willow and shrub are made of separate parts (trunk, root flare, slanted branches, crown clusters, palm fronds, willow's hanging strands): open the block with <b>Edit</b> to change one part's colour, size or place, or <b>Explode</b> it into parts. Selecting a tree shows its <b>crown width and height</b> in Properties; type a <b>Species</b> and tick <b>Show label</b> to write “name Ø… H… m” beside it, also on the sheet and in DXF. The take-off counts plants by species. When an older drawing's tree shows <b>Update to new model</b> in Properties, pressing it switches every copy of that kind to the current model.", "<b>Area</b>: click the corners in turn and close with C or Enter. The area (m²) and perimeter are written in the middle of the shape and update when you move or scale it. Select a closed shape and pick Area to convert it directly. Select the area and use Properties to change the text size (A− / A+), bold or italic, colour, unit (m², decare, ha), decimals, prefix, angle and position; the last format is reused for the next areas.", "Select several areas, closed shapes or lines and Properties shows the <b>total area</b> and <b>total length</b>."]], ["9 · Files", ["<b>Install on this computer</b>: press the screen icon in the top bar or More › Install (Chrome/Edge). Pergel becomes a program in its own window, added to the desktop and Start menu; it works offline and updates itself. On iPhone use Safari Share › Add to Home Screen.", "<b>Save</b> downloads the whole drawing as a Pergel file (.json). Solids and dimensions stay editable. Type the file name in the box at the top.", "<b>Open</b> loads a Pergel, DXF or DWG file. You can also drop a file onto the drawing area.", "<b>DXF</b> exports for other CAD programs. Solids go as face meshes, dimensions as lines and text.", "The drawing is also kept in this browser automatically; still, use <b>Save</b> for anything important."]], ["10 · Common snags", ["<b>The point will not go where I want</b>: Grid or Snap is on. Turn it off in the status bar.", "<b>The drawing is gone</b>: press Fit.", "<b>I cannot select an object</b>: its layer may be locked or hidden.", "<b>The tool does nothing</b>: the blue text in the command line tells you the next step.", "<b>Height by mouse does not work</b>: height is invisible in Top view; type the number or switch to 3D.", "<b>A DWG did not open</b>: save it as DXF at the source and open that."]]]};
GUIDE.tr.splice(9,0,...[["10 · Nokta ve koordinat", ["<b>Nokta</b> aracına bas (ya da <kbd>nokta</kbd> yaz). Çizimde tıklarsan nokta oraya konur.", "Koordinatla koymak için komut satırına <kbd>sağa,yukarı</kbd> ya da <kbd>sağa,yukarı,kot</kbd> yaz; örnek: <kbd>4512.35,2210.80,102.4</kbd>. Sıra AutoCAD’deki X,Y ve Netcad’deki Y,X ile aynıdır: önce sağa, sonra yukarı değer.", "Noktalar kendiliğinden numaralanır (1, 2, 3…). Adı Özellikler’den değiştirirsin.", "Bir noktayı seçince Özellikler’de X, Y ve Kot (Z) kutuları çıkar; değer yazarak noktayı tam yerine taşırsın. Aynı kutular yazı, daire, kutu ve hazır nesnelerde de vardır.", "Özellikler’den adın, kotun ve koordinatın noktanın yanına yazılmasını açıp kapatırsın.", "Toplu giriş: komut satırına <kbd>noktalar</kbd> yaz. Açılan kutuya her satırda bir nokta olacak şekilde <kbd>ad sağa yukarı kot</kbd> yaz ya da yapıştır; Excel’den kopyalanan sütunlar da olur.", "Noktalar yakalama hedefidir: çizerken bir noktaya yaklaşınca “Nokta” simgesi çıkar.", "Koordinat adları harita düzenindedir (Netcad’deki gibi): <b>Y sağa, X yukarı</b>. İlk kutu ve ilk yazılan değer her zaman sağa olandır. AutoCAD düzenini (X sağa · Y yukarı) istersen Birimler penceresinden değiştir; yalnızca adlar değişir, sayılar aynı kalır."]], ["11 · Birimler ve ayarlar", ["Durum çubuğundaki <b>Birim</b> düğmesi: çizim birimi (mm, cm, m, inç, ft), ölçü yazılarının birimi, ondalık basamak, ölçüye birim ekleme ve koordinat adları.", "Birimi değiştirirken <b>Sayılar aynı kalsın</b> yalnızca birimi değiştirir; <b>Dönüştür</b> çizimi yeni birime göre yeniden boyutlandırır.", "Birim bilgisi olmayan bir DXF ya da DWG açılınca program birimi sorar.", "Durum çubuğu: <b>Izgara</b> (<kbd>F9</kbd>) noktaları adıma oturtur; <b>Yakala</b> (<kbd>F3</kbd>) uç, orta, merkez, kesişim, dik ve noktaları yakalar; <b>Dik</b> (<kbd>F8</kbd>) yatay ya da dikeye kilitler. <b>Adım</b> ızgara aralığı, <b>Kot</b> çalışma yüksekliğidir.", "Hiçbir şey seçili değilken Özellikler: yazı yüksekliği, ölçü yazı yüksekliği, çizgi tipi ölçeği, etkin katmanın çizgi tipi ve kalınlığı.", "Yazı biçimi: alan, ölçü, nokta ya da yazıyı seç; <b>A− / A+</b> ile boyut, ayrıca kalın, eğik ve yazı rengi. Birden çok nesne seçersen hepsine uygulanır.", "Alan ve ölçü yazısını tutup sürükleyerek yerini değiştirirsin; tam değer için Özellikler’deki <b>Yazıyı kaydır X / Y</b> kutularını kullan.", "Yan paneldeki <b>Diğer</b> bölümü: kılavuz, yardım, açık / koyu tema, tam ekran ve ipuçlarını açıp kapatma. Dil sağ üstteki TR / EN düğmesinden değişir."]]]);GUIDE.en.splice(9,0,...[["10 · Points and coordinates", ["Pick <b>Point</b> (or type <kbd>point</kbd>). Click in the drawing to place a point there.", "To place by coordinates, type <kbd>right,up</kbd> or <kbd>right,up,elevation</kbd> in the command line, e.g. <kbd>4512.35,2210.80,102.4</kbd>. The order matches X,Y in AutoCAD and Y,X in Netcad: first the value to the right, then upwards.", "Points are numbered automatically (1, 2, 3…). Change the name in Properties.", "Select a point and Properties shows X, Y and Elevation (Z) boxes; type values to move it exactly. The same boxes exist for text, circles, boxes and ready-made objects.", "Properties also switches the name, elevation and coordinates next to the point on or off.", "Bulk entry: type <kbd>ptlist</kbd> in the command line. Type or paste one point per line as <kbd>name right up elevation</kbd>; columns copied from Excel work too.", "Points are snap targets: the “Point” marker appears when you get close while drawing.", "Coordinate names follow the survey convention (as in Netcad): <b>Y to the right, X upwards</b>. The first box and the first typed value are always the one to the right. For the AutoCAD convention (X right · Y up), change it in the Units window; only the names change, the numbers stay."]], ["11 · Units and settings", ["The <b>Unit</b> button in the status bar: drawing unit (mm, cm, m, in, ft), unit of dimension text, decimal places, unit suffix on dimensions, and coordinate names.", "When changing the unit, <b>Keep the numbers</b> only changes the unit; <b>Convert</b> resizes the drawing for the new unit.", "When a DXF or DWG has no unit information, the program asks for it.", "Status bar: <b>Grid</b> (<kbd>F9</kbd>) snaps points to the step; <b>Snap</b> (<kbd>F3</kbd>) catches ends, midpoints, centres, intersections, perpendiculars and points; <b>Ortho</b> (<kbd>F8</kbd>) locks to horizontal or vertical. <b>Step</b> is the grid spacing, <b>Elev</b> the working height.", "With nothing selected, Properties holds text height, dimension text height, line type scale, and the active layer’s line type and weight.", "Text style: select an area, dimension, point or text; use <b>A− / A+</b> for size, plus bold, italic and text colour. With several objects selected it applies to all.", "Drag an area or dimension text to move it; for exact values use <b>Shift text X / Y</b> in Properties.", "<b>More</b> in the side panel: guide, help, light / dark theme, full screen and tips on or off. The language switches with TR / EN at the top right."]]]);GUIDE.tr[11][0]='12 · Sık karşılaşılanlar';GUIDE.tr[9][1].splice(0,2,"<b>Nokta</b> aracına bas (ya da <kbd>nokta</kbd> yaz). <b>Nokta ekle</b> penceresi açılır.","Pencerede adı, sağa ve yukarı değerlerini, istersen kotu yaz ve <b>Ekle</b>’ye (ya da Enter’a) bas. Önce sağa (Y), sonra yukarı (X) değer girilir. Ad sonu sayıysa kendiliğinden artar (P1, P2, P3…).","Pencere açıkken çizimde tıklarsan nokta tıkladığın yere, penceredeki adla konur. Komut satırına <kbd>4512.35,2210.80,102.4</kbd> yazmak da olur.");GUIDE.en[9][1].splice(0,2,"Pick <b>Point</b> (or type <kbd>point</kbd>). The <b>Add point</b> window opens.","Type the name, the right and up values and, if you like, the elevation, then press <b>Add</b> (or Enter). First the value to the right (Y), then the value upwards (X). A name ending in a number counts up by itself (P1, P2, P3…).","With the window open, clicking in the drawing places the point there with the name in the window. Typing <kbd>4512.35,2210.80,102.4</kbd> in the command line works too.");GUIDE.tr[6][1].splice(3,0,"Katmanın yanındaki <b>kalem</b> düğmesi düzenleme penceresini açar: ad, renk, çizgi tipi, kalınlık, görünür ve kilitli. Seçili nesneleri o katmana taşıma ve katmanı silme de buradadır.");GUIDE.en[6][1].splice(3,0,"The <b>pencil</b> button next to a layer opens the edit window: name, colour, line type, weight, visible and locked. Moving the selected objects to that layer and deleting the layer are there too.");GUIDE.tr[8][1].unshift("Program her açılışta <b>boş sayfayla</b> başlar. Daha önce açtığın ve üzerinde çalıştığın çizimler <b>Son çizimler</b> listesinde durur (üst çubuktaki saat simgesi ya da açılış kartı); bir satıra basınca çizim geri gelir. Liste bu tarayıcıda saklanır ve en fazla 12 çizim tutar.");GUIDE.en[8][1].unshift("The program starts with a <b>blank sheet</b> every time. Drawings you opened and worked on stay in <b>Recent drawings</b> (the clock icon in the top bar or the start card); press a row to bring one back. The list is kept in this browser and holds up to 12 drawings.");Object.assign(I18N.tr,{h_poly:I18N.tr.h_poly+" Başlangıç noktasına tıklarsan şekil kapanır; kendi köşelerine ve orta noktalarına da yakalar.",h_area:I18N.tr.h_area+" İlk köşeye tıklamak da kapatır."});Object.assign(I18N.en,{h_poly:I18N.en.h_poly+" Click the start point to close the shape; it also snaps to its own corners and midpoints.",h_area:I18N.en.h_area+" Clicking the first corner closes it too."});GUIDE.tr[9][1].splice(5,0,"Nokta adının üstüne tıklayınca nokta seçilir. Adı tutup sürükleyerek yerini değiştirirsin; Özellikler’den yazı yüksekliğini, <b>A− / A+</b> ile boyutunu, kalın, eğik ve rengini, <b>Yazıyı kaydır</b> kutularıyla tam yerini ayarlarsın.");GUIDE.en[9][1].splice(5,0,"Click a point’s name to select the point. Drag the name to move it; in Properties set the text height, size with <b>A− / A+</b>, bold, italic and colour, and the exact position with the <b>Shift text</b> boxes.");Object.assign(I18N.tr,{h_measure:"Noktalara sırayla tıkla; her parçanın uzunluğu ve toplam yazılır. Çoklu çizginin köşelerini sırayla tıklayarak toplam uzunluğu ölçersin. Başlangıca dönersen alanı da verir. Enter bitirir."});Object.assign(I18N.en,{h_measure:"Click points in turn; each segment length and the running total are shown. Click the corners of a polyline in order to get its total length. Returning to the start also gives the area. Enter finishes."});GUIDE.tr[4][1][5]="Sadece ölçmek istiyorsan <b>Ölç</b> aracını kullan; çizime bir şey eklemez. Noktalara sırayla tıkladıkça her parçanın uzunluğu ve <b>toplam</b> yazılır; başlangıca dönersen kapalı şeklin alanını da verir.";GUIDE.en[4][1][5]="To just measure, use <b>Measure</b>; it adds nothing to the drawing. As you click points in turn, each segment length and the <b>total</b> are shown; returning to the start also gives the enclosed area.";GUIDE.tr[10][1].splice(4,0,"<b>Yakala</b> düğmesinin yanındaki kalem, yakalama türlerini açar: Uç, Nokta, Kesişim, Orta, Merkez, Çeyrek, Dik ve En yakın. İşaretli olmayan türler yakalanmaz. Aynı pencerede <b>Hepsini aç</b> ve <b>Hepsini kapat</b> düğmeleri vardır. Yakala açıkken yalnızca yakalanan noktalar kabul edilir: boş yere tıklarsan nokta konmaz. Serbest çizmek için Yakala’yı kapat (<kbd>F3</kbd>) ya da koordinat yaz; bu kuralı pencerenin en üstündeki kutudan kaldırabilirsin. Ölçü çizgisinin yeri, yazı ve hazır nesne yerleştirme her zaman serbesttir.");GUIDE.en[10][1].splice(4,0,"The pencil next to <b>Snap</b> opens the snap types: End, Point, Intersection, Mid, Centre, Quadrant, Perpendicular and Nearest. Unticked types are not caught. The same window has <b>Turn all on</b> and <b>Turn all off</b>. While Snap is on only snapped points are accepted: a click in empty space places nothing. To draw freely, turn Snap off (<kbd>F3</kbd>) or type coordinates; the box at the top of the window removes this rule. Dimension line position, text and ready-made objects are always placed freely.");GUIDE.tr[6][1].splice(4,0,"Bir nesneye tıklayınca ait olduğu katman listede turuncu çerçeveyle işaretlenir ve görünür yere kaydırılır. O satırdaki kalemle ya da Özellikler’deki <b>Katmanı düzenle</b> düğmesiyle katmanın adını, rengini, çizgi tipini ve kalınlığını hemen değiştirirsin.");GUIDE.en[6][1].splice(4,0,"Click an object and its layer is marked with an orange frame in the list and scrolled into view. Use the pencil on that row or the <b>Edit layer</b> button in Properties to change the layer’s name, colour, line type and weight right away.");Object.assign(I18N.tr,{h_dimcon:"İki noktaya ve ölçü çizgisinin yerine tıkla; sonra her tıklama bir önceki noktadan devam eden yeni bir ölçü ekler. Hepsi aynı hizada durur. Enter bitirir."});Object.assign(I18N.en,{h_dimcon:"Click two points and the dimension line position; after that every click adds a new dimension continuing from the previous point, all on the same line. Enter finishes."});GUIDE.tr[4][1].splice(4,0,"<b>Zincir ölçü</b>: ilk ölçüyü koyduktan sonra her tıklama bir önceki noktadan devam eden yeni ölçü ekler; hepsi aynı hizada durur.","<b>Ölçü stili</b> (Ölçü grubundaki ayar düğmesi): ok tipi (dolu, açık, eğik çizgi, nokta), ok büyüklüğü, yazı yüksekliği, yazının çizgiye uzaklığı, yazının yeri (üstünde ya da ortasında), uzatma çizgisi boşluğu ve taşması, dar yerde okların dışa dönmesi. <b>Tüm ölçülere uygula</b> ya da yalnızca seçili ölçülere uygula.");GUIDE.en[4][1].splice(4,0,"<b>Continuous dimension</b>: after the first dimension, every click adds a new one continuing from the previous point, all on the same line.","<b>Dimension style</b> (the settings button in the Dimension group): arrow type (filled, open, oblique tick, dot), arrow size, text height, text gap, text position (above or centred), extension line offset and overshoot, arrows turning outside when tight. <b>Apply to all dimensions</b> or only to the selected ones.");GUIDE.tr[6][1].push("<b>Yeni çizilecek nesneler</b>: hiçbir şey seçili değilken Özellikler’de renk, çizgi tipi ve çizgi kalınlığı seçersin; bundan sonra çizdiklerin bu özelliklerle gelir. “Katmandan” seçiliyse nesne katmanının özelliklerini alır (AutoCAD’deki ByLayer).","Çizilmiş bir nesnenin rengini, çizgi tipini ve kalınlığını değiştirmek için onu seç; aynı kutular Özellikler’de çıkar.");GUIDE.en[6][1].push("<b>New objects</b>: with nothing selected, pick a colour, line type and line weight in Properties; what you draw next gets them. “By layer” means the object takes its layer’s properties.","To change the colour, line type or weight of an existing object, select it; the same boxes appear in Properties.");GUIDE.tr[5][1].splice(1,0,"Seçilen nesneler kalın, kesikli ve renkli çizgiyle, köşelerinde kare <b>tutamaç</b> noktalarıyla gösterilir. Rengi, kalınlığı, kesikli ya da düz olmasını ve tutamaçları yan paneldeki <b>Diğer › Ayarlar</b> penceresinden değiştirirsin.");GUIDE.en[5][1].splice(1,0,"Selected objects are drawn with a thick, dashed, coloured line and square <b>grip</b> points at their corners. Change the colour, width, dashed or solid style and the grips under <b>More › Settings</b> in the side panel.");GUIDE.tr[4][1].splice(1,0,"Ölçü yazısı ve okları <b>otomatik</b> boyutla başlar: o an ekranda rahat okunacak büyüklükte çizilir, çizimdeki diğer ölçülerle aynı boyda kalır. Büyütüp küçültmek için ölçüyü seçip <b>A− / A+</b> düğmelerini ya da <b>Ölçü stili</b> penceresini kullan. Sabit bir boy istersen Özellikler’de “Ölçü yazı yüks.” kutusuna değer yaz; otomatik kapanır.");GUIDE.en[4][1].splice(1,0,"Dimension text and arrows start at an <b>automatic</b> size: readable at the current zoom and the same as the other dimensions in the drawing. Select a dimension and use <b>A− / A+</b> or the <b>Dimension style</b> window to resize. Type a value in “Dimension text ht.” for a fixed size; automatic turns off.");GUIDE.tr[0][1].push("<b>Kapat</b> (üst çubuk): açık çizimi kapatır ve boş sayfaya döner. Kapatmadan önce sorar: <b>Kaydet ve kapat</b> (Pergel dosyası), <b>DXF kaydet ve kapat</b>, <b>Kaydetmeden kapat</b> ya da <b>Vazgeç</b>.");GUIDE.en[0][1].push("<b>Close</b> (top bar): closes the open drawing and returns to an empty page. It asks first: <b>Save and close</b> (Pergel file), <b>Save DXF and close</b>, <b>Close without saving</b> or <b>Cancel</b>.");GUIDE.tr.push([(GUIDE.tr.length+1)+' · Katıyı doğrudan düzenleme',["Kutu çizince <b>Kutu ölçüleri</b> penceresi açılır: en, boy, yükseklik, açı ve konumu yazarsın. Sonradan açmak için kutuya çift tıkla ya da Özellikler’de <b>Tüm ölçüler</b>’e bas.", "Fareyi kutunun üstünde gezdir: altındaki <b>kenar</b> ya da <b>yüz</b> turkuaz renkle parlar. Tıklayınca o kenar ya da yüz seçilir ve yanında küçük bir ölçü kutusu açılır.", "<b>Kenar</b> seçiliyken yeni uzunluğu yazıp Enter’a bas; kutu, tıkladığın uca doğru uzar ya da kısalır.", "<b>Yüz</b> seçiliyken yüzü fareyle (telefonda parmakla) tutup çek; mesafe ve yeni ölçü imlecin yanında görünür. İstersen mesafeyi yaz: artı değer dışarı çeker, eksi değer içeri iter.", "Sayıyı komut satırına yazmak da aynı işi görür. Her adım <b>Geri al</b> ile geri döner."]]);GUIDE.en.push([(GUIDE.en.length+1)+' · Editing a solid directly',["Drawing a box opens the <b>Box sizes</b> window: width, depth, height, angle and position. Double-click a box or press <b>All sizes</b> in Properties to open it later.", "Move the mouse over a box: the <b>edge</b> or <b>face</b> under it glows turquoise. Click to select it; a small size box opens next to it.", "With an <b>edge</b> selected, type the new length and press Enter; the box grows or shrinks toward the end you clicked.", "With a <b>face</b> selected, drag it; the distance and new size follow the cursor. Or type a distance: positive pulls out, negative pushes in.", "Typing the number in the command line does the same. Every step can be undone."]]);GUIDE.tr[GUIDE.tr.length-1][1].splice(4,0,"Seçilen yüzün ortasında, yüze dik sarı bir <b>ok</b> belirir; hareketin yönünü gösterir. Oku tutup sürükleyerek de çekip itebilirsin. İçeri iterken ok ters döner ve kırmızıya döner.");GUIDE.en[GUIDE.en.length-1][1].splice(4,0,"A yellow <b>arrow</b> appears at the centre of the selected face, perpendicular to it, and shows the direction of movement. You can drag the arrow as well. When pushing in, it flips and turns red.");GUIDE.tr[GUIDE.tr.length-1][1].push("Küçük ölçü kutusu başlığından tutulup taşınır; <b>Tamam</b>, Enter ya da köşedeki çarpı ile kapanır. Aynı ayarların hepsi sağdaki <b>Özellikler</b> panelinde de vardır: kutu ölçüleri, konum, açı, seçili kenarın uzunluğu ve seçili yüz için çekme/itme mesafesi.");GUIDE.en[GUIDE.en.length-1][1].push("The small size box can be dragged by its title and closes with <b>OK</b>, Enter or the cross. All the same settings are in the <b>Properties</b> panel on the right: box sizes, position, angle, the selected edge length and the pull/push distance of the selected face.");GUIDE.tr[GUIDE.tr.length-1][1].push("<b>Pah ve yuvarlatma</b>: kutunun bir kenarına tıkla. Kenarın ortasında mor, çift başlı bir ok çıkar. Oku ya da kenarı kutunun içine doğru sürükle: kenara pah verilir; dışarı sürükleyince azalır, sıfırda keskin kenara döner.","Küçük kutudan ya da Özellikler’den <b>Kenar işlemi</b> seç: Yok, Pah ya da Yuvarlatma. Pahta <b>mesafe</b>, <b>açı</b> ve <b>2. mesafe</b> birbirine bağlıdır (açıyı yazarsan 2. mesafe, 2. mesafeyi yazarsan açı hesaplanır). Yuvarlatmada yalnızca <b>yarıçap</b> vardır.","<b>Tüm kenarlar</b> aynı işlemi kutunun 12 kenarına uygular. Pahlı kutuda en, boy, yükseklik ve yüz çekme yine çalışır; pah yerinde kalır.");GUIDE.en[GUIDE.en.length-1][1].push("<b>Chamfer and round</b>: click an edge of the box. A violet double-headed arrow appears at its middle. Drag the arrow or the edge into the box to chamfer; dragging outward reduces it, down to a sharp edge.","Pick an <b>Edge treatment</b> in the small box or in Properties: None, Chamfer or Round. For a chamfer the <b>distance</b>, <b>angle</b> and <b>2nd distance</b> are linked. A round only has a <b>radius</b>.","<b>All edges</b> applies the same treatment to all 12 edges. Width, depth, height and face pulling keep working on a chamfered box.");GUIDE.tr[GUIDE.tr.length-1][1].push("Bir yüz ya da kenar seçiliyken sürüklemek için tam okun üstüne gelmen gerekmez: çizim alanında herhangi bir yerde fareyi basılı tutup ok yönünde sürükle. Kenar oku her zaman 45° çaprazdır.");GUIDE.en[GUIDE.en.length-1][1].push("With a face or an edge selected you need not grab the arrow: hold the mouse button anywhere in the drawing area and drag along the arrow. The edge arrow is always on the 45° diagonal.");GUIDE.tr[5][1].push("<b>Görüntü kalitesi</b> (Diğer › Ayarlar): <b>Hızlı</b> sade ve en hafif olanıdır; <b>Dengeli</b> yumuşak ışık, saten yüzey ve net kenar çizgileri verir; <b>Güzel</b> buna zemine düşen gölgeyi ekler. Çizim ağırlaşırsa kalite kendiliğinden bir kademe düşer.");GUIDE.en[5][1].push("<b>Display quality</b> (More › Settings): <b>Fast</b> is plain and lightest; <b>Balanced</b> gives soft light, a satin surface and crisp edges; <b>Nice</b> adds a ground shadow. Quality steps down automatically when drawing gets slow.");GUIDE.tr[GUIDE.tr.length-1][1].push("Aynı işlemler <b>silindir, koni, küre ve yükseltilmiş şekillerde</b> de çalışır. Silindirde üst ve alt yüz yüksekliği, yan yüz yarıçapı değiştirir; üst ve alt çemberlere pah ya da yuvarlatma verilir. Konide taban yüzü ve yan yüz, kürede yüzey çekilir. Yükseltilmiş şekilde üst/alt yüz yüksekliği, yan yüz o kenarı öteler; dik kenarlara pah ve yuvarlatma verilir. Hepsinde çift tıklama <b>Ölçüler</b> penceresini açar.");GUIDE.en[GUIDE.en.length-1][1].push("The same works on <b>cylinders, cones, spheres and extruded shapes</b>. On a cylinder the top and bottom faces change the height and the side changes the radius; the top and bottom circles can be chamfered or rounded. On a cone pull the base or the side, on a sphere the surface. On an extruded shape the top/bottom faces change the height, a side face offsets that side, and the vertical edges can be chamfered or rounded. Double-click opens the <b>Sizes</b> window.");GUIDE.tr.push([(GUIDE.tr.length+1)+' · Katıları birleştirme ve çıkarma',["<b>Birleştir</b>: iç içe geçen katıları seç, Birleştir’e bas; tek parça olur.", "<b>Çıkar</b>: önce <b>kalacak</b> katıyı seç ve Çıkar’a bas, sonra <b>çıkarılacak</b> katıya tıkla. Delik, oyuk ve pencere boşluğu böyle açılır. Art arda başka katılara tıklayarak çıkarmaya devam edebilirsin; Enter bitirir.", "<b>Kesiştir</b>: seçili katıların yalnızca ortak hacmi kalır.", "Sonuç <b>serbest katı</b> olur: taşınır, kopyalanır, döndürülür, ölçülendirilir ve yeniden birleştirme/çıkarma işlemine girer; ama yüz çekme, pah ve Ölçüler penceresi onda çalışmaz. Ölçüyü değiştirmek gerekirse Geri al ile öncesine dön.", "Örnek: 200×200×20 bir kutu çiz, ortasına yarıçapı 40 olan bir silindir koy, kutuyu seç → Çıkar → silindire tıkla: ortası delik bir levha olur."]]);GUIDE.en.push([(GUIDE.en.length+1)+' · Union and subtraction of solids',["<b>Union</b>: select overlapping solids and press Union; they become one piece.", "<b>Subtract</b>: select the solid to <b>keep</b> and press Subtract, then click the solid to <b>remove</b>. That is how holes, pockets and openings are made. Keep clicking other solids to subtract more; Enter finishes.", "<b>Intersect</b>: only the common volume of the selected solids remains.", "The result is a <b>free-form solid</b>: it can be moved, copied, rotated, dimensioned and used in further booleans, but face pulling, chamfers and the Sizes window do not work on it. Use Undo to go back if a size must change.", "Example: draw a 200×200×20 box, put a cylinder of radius 40 in its middle, select the box → Subtract → click the cylinder: a plate with a hole."]]);GUIDE.tr.push([(GUIDE.tr.length+1)+' · Metraj',["<b>Metraj</b> (Ölçü grubu ya da komut satırında <b>metraj</b>): çizimdeki nesnelerin adet, uzunluk, alan ve hacim toplamlarını katman ve türe göre tablo yapar. Değerler metre, metrekare ve metreküp olarak verilir; çizim birimi ne olursa olsun doğru çevrilir.", "Önce nesne seçersen yalnızca seçilenler, seçmezsen görünen tüm nesneler hesaplanır; pencerenin üstündeki <b>Kapsam</b> kutusundan değiştirirsin. Kapalı katmanlar hesaba girmez.", "<b>Excel’e aktar</b> tabloyu Excel’in doğrudan açtığı bir dosya olarak kaydeder; <b>Kopyala</b> ile tabloyu açık bir Excel sayfasına yapıştırabilirsin.", "İpucu: bordür, döşeme, duvar gibi kalemleri ayrı katmanlara çizersen metraj her kalemi ayrı satırda verir. Hazır nesneler (ağaç, bank…) adet olarak sayılır."]]);GUIDE.en.push([(GUIDE.en.length+1)+' · Quantities',["<b>Estimate sheet (Excel)</b>: in the Quantities window give each row an item no., description, unit and unit price; total, VAT (rate editable) and grand total show below. <b>Estimate sheet (Excel)</b> gives a real Excel file: the <b>Estimate</b> sheet in unit-price-schedule layout (no., item no., description, unit, quantity, unit price, amount; total excl. VAT, VAT, grand total), rows with the same item, unit and price merged and amounts as live formulas; the <b>Quantities</b> sheet shows which layer and objects each quantity comes from.", "<b>Quantities</b> (Dimension group, or type <b>takeoff</b>): totals of count, length, area and volume by layer and type, in metres, square metres and cubic metres whatever the drawing unit.", "With a selection only the selected objects are measured, otherwise everything visible; change it with <b>Scope</b>. Hidden layers are skipped.", "<b>Export to Excel</b> saves a file Excel opens directly; <b>Copy</b> lets you paste the table into an open sheet.", "Tip: draw each item (kerb, paving, wall…) on its own layer and the take-off lists it on its own row. Ready-made objects are counted."]]);GUIDE.tr.push([(GUIDE.tr.length+1)+' · Pafta ve ölçekli çıktı',["<b>Yazdır / PDF</b> (yan panelde Diğer, Ctrl+P ya da komut satırında <b>yazdir</b>): çizimin üst görünümünü seçtiğin kâğıda (A4–A0) ve ölçeğe (1:1 … 1:10000 ya da Sığdır) yerleştirir; önizlemeyi pencerede görürsün.", "Çerçeve ve antet açıkken alt şeritte proje, çizim adı, ölçek, tarih, çizen ve pafta no yazar; hepsini pencereden doldurursun.", "<b>Yazdır / PDF</b> tarayıcının yazdırma penceresini açar. Hedef olarak “PDF olarak kaydet”i seç. Ölçeğin doğru çıkması için kenar boşluğu “Yok”, ölçek “%100” olmalı.", "<b>SVG kaydet</b> aynı paftayı vektör dosya olarak verir; tarayıcıda, Word’de ya da çizim programlarında açılır.", "Çizgi kalınlıkları katman ve nesne ayarından gelir; siyah-beyaz ya da renkli seçebilirsin. Yalnızca seçili nesneleri yazdırmak için önce seç, sonra Kapsam’dan “Yalnızca seçili nesneler”i işaretle."]]);GUIDE.en.push([(GUIDE.en.length+1)+' · Sheet and scaled output',["<b>Print / PDF</b> (More in the side panel, Ctrl+P, or type <b>print</b>): places the top view on the paper (A4–A0) and scale (1:1 … 1:10000 or Fit) you choose, with a preview.", "With the frame and title block on, the bottom strip shows project, drawing title, scale, date, author and sheet number.", "<b>Print / PDF</b> opens the browser print window. Choose “Save as PDF”; for a true scale set margins to “None” and scale to “100%”.", "<b>Save SVG</b> gives the same sheet as a vector file.", "Line weights come from the layer and object settings; choose black-and-white or colour. To print only some objects, select them first and pick “Selected objects only”."]]);GUIDE.tr.push([(GUIDE.tr.length+1)+' · Döndürerek katı ve yol boyunca süpürme',["<b>Döndürerek katı</b>: saksı, sütun, kase, direk başlığı gibi dönel şekiller için. Şeklin yarım kesitini (profil) çoklu çizgiyle çiz, profili seç, aracı aç; dönme ekseninin önce alt, sonra üst noktasına tıkla. Enter tam tur (360°) döndürür; açı yazarsan (örneğin 180) o kadar döner. Planda (üst görünümde) çizilen profil ayağa kaldırılır: eksen dikey olur, şekil çizim kotuna oturur.", "<b>Süpürerek katı</b>: bordür, boru, korkuluk, saçak gibi bir yol boyunca uzanan şekiller için. Kesiti (profil) kapalı çoklu çizgi ya da daire olarak çiz, yolu çizgi, çoklu çizgi, yay ya da daire olarak çiz. Profili seç, aracı aç, yola tıkla. İkisini birlikte seçip aracı açarsan hemen oluşur.", "Profil yola şöyle oturur: daire (boru) ortalanır; diğer kesitler alt kenarlarının ortasıyla yolun üstüne oturur, yani bordür zemine basar. Köşelerde kesit gönyeli birleşir.", "Kullanılan profil katıya dönüşür ve silinir; yol ve eksen çizgileri yerinde kalır. Sonuç serbest katıdır: birleştirme, çıkarma, metraj ve pafta çıktısında kullanılır. Geri al ile öncesine dönersin."]]);GUIDE.en.push([(GUIDE.en.length+1)+' · Revolve and sweep',["<b>Revolve</b>: for round shapes like pots, columns, bowls. Draw half the section (the profile) as a polyline, select it, start the tool and click the bottom, then the top point of the axis. Enter turns it a full 360°; type an angle (e.g. 180) for a partial turn. A profile drawn in plan is stood up: the axis becomes vertical and the shape rests on the drawing level.", "<b>Sweep</b>: for kerbs, pipes, rails, copings. Draw the cross-section as a closed polyline or circle and the path as a line, polyline, arc or circle. Select the profile, start the tool and click the path. Select both before starting and it is made at once.", "A circle (pipe) is centred on the path; other sections stand on the path with the middle of their bottom edge, so a kerb sits on the ground. Corners are mitred.", "The profile becomes the solid and is removed; the path and axis lines stay. The result is a free-form solid usable in booleans, quantities and sheets. Undo goes back."]]);GUIDE.tr.push([(GUIDE.tr.length+1)+' · Bloklar',["<b>Blok oluştur</b> (Ekle grubu): ağaç, bank, aydınlatma direği, logo gibi tekrar eden bir nesneyi bir kez çiz; parçalarını seç, aracı aç, taban noktasına tıkla ve bir ad ver. Seçili parçalar tek bir bloğa dönüşür.", "<b>Blok yerleştir</b>: listeden bloğu seç, yerleştirmek istediğin noktalara tıkla. Açı yazarsan sonraki kopyalar o açıyla konur; Enter bitirir. Bloklar taşınır, kopyalanır, döndürülür, ölçeklenir ve aynalanır.", "<b>Bloğu düzenle</b>: bir bloğa çift tıkla (ya da Özellikler’de Bloğu düzenle). Parçaları düzenle, ekle ya da sil; üstteki çubuktan <b>Bloğu kaydet</b>e bas: çizimdeki tüm kopyaları birlikte değişir. Vazgeç eski hâline döndürür.", "<b>Patlat</b>: seçili bloğu yeniden ayrı parçalara çevirir; diğer kopyalar etkilenmez.", "Metraj blokları adlarıyla adet olarak sayar; pafta çıktısı ve DXF’e kaydetme blokların içini çizer. Blok listesinden bir bloğu yeniden adlandırabilir ya da silebilirsin."]]);GUIDE.en.push([(GUIDE.en.length+1)+' · Blocks',["<b>Make block</b> (Insert group): draw a repeated object once (a tree, a bench, a lamp post), select its parts, start the tool, click the base point and give a name. The parts become one block.", "<b>Insert block</b>: pick the block from the list and click where to place it. Type an angle to set the angle of the next copies; Enter finishes. Blocks can be moved, copied, rotated, scaled and mirrored.", "<b>Edit block</b>: double-click a block (or Edit block in Properties). Change, add or delete parts, then press <b>Save block</b> on the bar at the top: every copy in the drawing changes. Cancel restores it.", "<b>Explode</b>: turns the selected block back into separate parts; other copies are not affected.", "Quantities count blocks by name; sheets and DXF export draw their contents. Blocks can be renamed or deleted from the block list."]]);GUIDE.tr[GUIDE.tr.length-1][1].push("<b>Hazır nesneler de bloktur</b>: Ağaç, Çam, Çalı, Bank, Aydınlatma, Çöp kovası ve Saksı yerleştirildiğinde kendi adıyla bir blok olur. Birine çift tıklayıp düzenlersen (örneğin ağacın tacını büyütür ya da gövdesine bir kutu eklersen) çizimdeki aynı türdeki tüm nesneler değişir. Eski dosyalardaki hazır nesneler açılırken kendiliğinden bloğa çevrilir.");GUIDE.en[GUI

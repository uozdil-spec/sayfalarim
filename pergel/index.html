<style>
:root{
  /* layout: a drafting sheet. tool rail left, sheet centre, layers right, title-block strip along the bottom */
  --paper:#e9edf2; --panel:#ffffff; --sheet:#f7f8fa; --ink:#172130; --ink-2:#5b6779; --rule:#cdd5df;
  --accent:#2447d6; --accent-soft:#e3e9fd; --on-accent:#ffffff; --signal:#e2540b;
  --grid-minor:#e1e6ed; --grid-major:#c5cdd9; --axis-x:#d0453a; --axis-y:#2f9a57; --axis-z:#2f6fd6;
  --f-ui:"IBM Plex Sans",system-ui,"Segoe UI",Roboto,sans-serif;
  --f-cond:"IBM Plex Sans Condensed","IBM Plex Sans","Arial Narrow",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --shadow:0 6px 24px rgba(23,33,48,.14);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#10151d; --panel:#19202b; --sheet:#141a23; --ink:#e6ebf2; --ink-2:#8e9bb0; --rule:#2b3545;
    --accent:#7d98ff; --accent-soft:#232e4f; --on-accent:#0d1220; --signal:#ffa24a;
    --grid-minor:#1d2531; --grid-major:#2c3747; --axis-x:#e0655b; --axis-y:#4fba78; --axis-z:#5d95ee;
    --shadow:0 6px 24px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10151d; --panel:#19202b; --sheet:#141a23; --ink:#e6ebf2; --ink-2:#8e9bb0; --rule:#2b3545;
  --accent:#7d98ff; --accent-soft:#232e4f; --on-accent:#0d1220; --signal:#ffa24a;
  --grid-minor:#1d2531; --grid-major:#2c3747; --axis-x:#e0655b; --axis-y:#4fba78; --axis-z:#5d95ee;
  --shadow:0 6px 24px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:400 13px/1.35 var(--f-ui);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i .n{fill:var(--accent);stroke:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

#app{padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);display:grid;height:100%;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"top top top" "rail view side" "foot foot foot"}

/* top bar */
#top{grid-area:top;display:flex;align-items:center;gap:10px;padding:0 12px;height:46px;background:var(--panel);border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:7px;font:600 17px/1 var(--f-cond);letter-spacing:.06em;text-transform:uppercase;margin-right:6px}
.brand svg{width:24px;height:24px;color:var(--accent)}
.brand small{font:500 10px/1 var(--f-mono);color:var(--on-accent);background:var(--accent);padding:3px 4px;border-radius:3px;letter-spacing:0}
.brand em{font:500 10.5px/1 var(--f-mono);font-style:normal;letter-spacing:0;text-transform:none;color:var(--ink-2);margin-left:2px}
.grp{display:flex;align-items:center;gap:2px}
a.tb{text-decoration:none}
#topMore .tb span{display:none}
.more{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.more .tb{justify-content:flex-start;border:1px solid var(--rule);font-size:12px}
.more .tb span{display:inline!important}
.sign{font:500 11px var(--f-mono);color:var(--ink-2);text-align:right;margin-top:12px}
.tb{display:flex;align-items:center;gap:6px;height:32px;padding:0 9px;border-radius:6px;font-weight:500;color:var(--ink)}
.tb:hover{background:var(--accent-soft)}
.tb:disabled{opacity:.35;cursor:default;background:none}
.tb.icon{padding:0;width:32px;justify-content:center}
.vr{width:1px;height:22px;background:var(--rule);margin:0 4px}
#docName{font:500 12px/1 var(--f-mono);color:var(--ink-2);background:none;border:1px solid transparent;border-radius:5px;padding:6px 8px;min-width:60px;width:150px;text-overflow:ellipsis}
#docName:hover,#docName:focus{border-color:var(--rule);color:var(--ink);outline:none}
.sp{flex:1}
.seg{display:flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.seg button{padding:0 9px;height:28px;font:600 11px/1 var(--f-cond);letter-spacing:.08em;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.only-m{display:none}

/* tool rail */
#rail{grid-area:rail;background:var(--panel);border-right:1px solid var(--rule);padding:8px 6px;overflow-y:auto;width:134px;scrollbar-width:thin}
.rg{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-bottom:10px}
.rg h3{grid-column:1/-1;margin:0 0 2px 3px;font:600 10px/1.4 var(--f-cond);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.tool{height:38px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--ink);position:relative}
.tool svg.i{width:22px;height:22px}
.tool:hover{background:var(--accent-soft)}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.tool[aria-pressed="true"] svg.i .n{fill:var(--on-accent)}

/* viewport */
#view{grid-area:view;position:relative;background:var(--sheet);overflow:hidden;min-height:0;touch-action:none}
#gl,#ov{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{pointer-events:none}
#gl.draw{cursor:crosshair}
#gl.orbit{cursor:grab}
#viewbar{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.vgroup{display:flex;background:var(--panel);border:1px solid var(--rule);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
.vgroup button{height:32px;min-width:38px;padding:0 9px;font:600 11px/1 var(--f-cond);letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:5px;color:var(--ink)}
.vgroup button+button{border-left:1px solid var(--rule)}
.vgroup button:hover{background:var(--accent-soft)}
.vgroup button[aria-pressed="true"]{color:var(--accent)}
#subHud{position:absolute;left:0;top:0;display:none;align-items:center;flex-wrap:wrap;gap:6px;max-width:250px;background:var(--panel);border:1px solid var(--rule);border-left:3px solid #12b5cb;border-radius:8px;box-shadow:var(--shadow);padding:7px 9px;z-index:4;font-size:12px}
#subHud.on{display:flex}
#subHud label{flex:1 0 100%;font-weight:600;color:var(--ink);cursor:move;touch-action:none;user-select:none;padding-right:24px}
#subHud .cls{position:absolute;right:4px;top:4px;width:24px;height:24px;display:grid;place-items:center;border:0;background:none;color:var(--ink-2);border-radius:6px;cursor:pointer}
#subHud .cls:hover{background:var(--sheet);color:var(--ink)}
#subHud .cls svg{width:14px;height:14px}
#subHud input{width:92px;height:28px}
#subHud .info{flex:1 0 100%;color:var(--ink-2)}
#hud{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:none;gap:8px}
#hud.on{display:flex}
#hud button{height:38px;padding:0 14px 0 10px;border-radius:19px;display:flex;align-items:center;gap:6px;font-weight:600;box-shadow:var(--shadow);background:var(--panel);border:1px solid var(--rule)}
#hud button.ok{background:var(--accent);color:var(--on-accent);border-color:transparent}
#hud kbd{font:500 10px/1 var(--f-mono);opacity:.7}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);max-width:min(520px,calc(100% - 120px));background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;font-weight:500;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s;text-align:center}
#toast.on{opacity:1}
#hint{position:absolute;left:10px;top:10px;max-width:min(320px,calc(100% - 200px));display:none;background:var(--panel);border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:8px;box-shadow:var(--shadow);padding:8px 30px 9px 11px;line-height:1.4}
#hint.on{display:block;pointer-events:none}
#hint button{pointer-events:auto}
#hint b{display:block;font:600 11px var(--f-cond);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
#hint span{font-size:12.5px}
#hint button{position:absolute;right:4px;top:4px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;color:var(--ink-2);border-radius:5px}
#hint button:hover{background:var(--accent-soft)}
#hint svg.i{width:14px;height:14px}
.guide details{border:1px solid var(--rule);border-radius:8px;margin:6px 0;background:var(--sheet)}
.guide summary{cursor:pointer;padding:9px 12px;font-weight:600;list-style-position:inside}
.guide details[open] summary{border-bottom:1px solid var(--rule)}
.guide ol{margin:8px 0 10px;padding:0 14px 0 30px}
.guide li{margin:5px 0}
kbd{font:500 11.5px var(--f-mono);background:var(--accent-soft);color:var(--ink);border-radius:4px;padding:1px 5px;white-space:nowrap}
#tour{position:fixed;inset:0;z-index:30}
#tourSpot{position:fixed;border-radius:10px;box-shadow:0 0 0 9999px rgba(10,14,20,.62);outline:2px solid var(--accent);transition:left .2s,top .2s,width .2s,height .2s}
#tourCard{position:fixed;width:min(330px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px 12px}
#tourCard .n{font:500 11px var(--f-mono);color:var(--ink-2)}
#tourCard h3{margin:2px 0 6px;font:600 15px var(--f-cond);letter-spacing:.06em;text-transform:uppercase}
#tourCard p{margin:0 0 12px;line-height:1.5}
#tourCard .acts{display:flex;align-items:center;gap:8px}
#tourCard .lnk{color:var(--ink-2);font-weight:500;padding:6px 2px}
#ptBox{position:absolute;left:10px;top:10px;width:262px;display:none;background:var(--panel);border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:10px;box-shadow:var(--shadow);padding:10px 12px 8px}
#ptBox.on{display:block}
#ptBox>b{display:block;font:600 11px var(--f-cond);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
#ptBox .x{position:absolute;right:6px;top:6px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--ink-2);border-radius:5px}
#ptBox .x:hover{background:var(--accent-soft)}
#ptBox .x svg.i{width:15px;height:15px}
#ptBox .row{grid-template-columns:84px minmax(0,1fr);min-height:32px}
#ptBox .acts{display:flex;gap:6px;margin-top:8px}
#ptBox .acts .btn{flex:1;height:32px}
#ptBox p{margin:8px 0 2px;font-size:11.5px;line-height:1.4}
#startBox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,calc(100% - 24px));display:none;background:var(--panel);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px 14px}
#startBox.on{display:block}
#startBox h2{margin:0 0 4px;font:600 16px var(--f-cond);letter-spacing:.08em;text-transform:uppercase}
#startBox p{margin:0 0 10px;color:var(--ink-2)}
#startBox .x{position:absolute;right:8px;top:8px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--ink-2);border-radius:6px}
#startBox .x:hover{background:var(--accent-soft)}
#startBox .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
#startBox .acts .btn{flex:1;white-space:nowrap}
#startBox h3{margin:12px 0 4px;font:600 10.5px var(--f-cond);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.rrow{display:flex;align-items:center;gap:4px;border-radius:7px}
.rrow:hover{background:var(--accent-soft)}
.rname{flex:1;min-width:0;text-align:left;padding:7px 8px;display:flex;flex-direction:column;gap:1px}
.rname b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rname span{font:400 11px var(--f-mono);color:var(--ink-2)}
.rdel{width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--ink-2);border-radius:6px;flex:none}
.rdel:hover{color:var(--signal)}
.rdel svg.i{width:15px;height:15px}
#busy{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:color-mix(in srgb,var(--sheet) 80%,transparent);font:600 14px var(--f-cond);letter-spacing:.1em;text-transform:uppercase}
#busy.on{display:flex}

/* side panel */
#side{grid-area:side;width:268px;background:var(--panel);border-left:1px solid var(--rule);overflow-y:auto;scrollbar-width:thin}
.sec{border-bottom:1px solid var(--rule);padding:10px 12px 12px}
.sec>h2{margin:0 0 8px;display:flex;align-items:center;justify-content:space-between;font:600 11px/1.4 var(--f-cond);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.sec>h2 button{display:flex;align-items:center;gap:4px;color:var(--accent);font:600 11px var(--f-cond);letter-spacing:.06em;padding:3px 6px;border-radius:5px}
.sec>h2 button:hover{background:var(--accent-soft)}
.sec>h2 svg.i{width:15px;height:15px}
.layer{display:flex;align-items:center;gap:4px;height:32px;border-radius:6px;padding:0 4px 0 2px}
.layer.act{background:var(--accent-soft)}
.layer.hsel{box-shadow:inset 3px 0 0 var(--signal),0 0 0 1px var(--signal)}
.layer.hsel .nm{color:var(--signal);font-weight:600}
.btn.sm{display:inline-flex;align-items:center;gap:5px}
.btn.sm svg.i{width:13px;height:13px}
.layer button{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:5px;color:var(--ink-2);flex:none}
.layer button:hover{color:var(--ink);background:var(--paper)}
.layer button.off{opacity:.4}
.layer svg.i{width:16px;height:16px}
.layer input[type=color]{width:18px;height:18px;padding:0;border:1px solid var(--rule);border-radius:4px;background:none;flex:none;cursor:pointer}
.layer input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.layer input[type=color]::-webkit-color-swatch{border:0;border-radius:3px}
.layer .nm{flex:1;min-width:0;height:26px;text-align:left;padding:0 5px;border-radius:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1px solid transparent;background:none;font-weight:500}
.layer .nm{display:block;width:auto}
.dlg .acts{flex-wrap:wrap}
.layer.act .nm{font-weight:600}
.layer input.nm{border-color:var(--accent);background:var(--panel);outline:none}
.layer .cnt{font:400 10px var(--f-mono);color:var(--ink-2);min-width:22px;text-align:right}
.row{display:grid;grid-template-columns:92px minmax(0,1fr);align-items:center;gap:8px;min-height:30px}
.row label{color:var(--ink-2);font-size:12px}
.row input[type=text],.row input[type=number],.row select{width:100%;height:26px;border:1px solid var(--rule);border-radius:5px;background:var(--sheet);padding:0 7px;font:400 12px var(--f-mono);min-width:0}
.row input:focus,.row select:focus{border-color:var(--accent);outline:none}
.row output{font:400 12px var(--f-mono)}
.row .chk{display:flex;align-items:center;gap:6px}
.ptitle{font-weight:600;margin-bottom:4px}
.btn.sm{height:26px;padding:0 11px;font:600 12px var(--f-mono);background:var(--sheet)}
.btn.sm:hover{background:var(--accent-soft)}
.row .chk{flex-wrap:wrap;row-gap:2px}
.row label.chk{color:var(--ink);gap:4px;margin-right:6px}
.row input[type=color]{width:26px;height:22px;padding:0;border:1px solid var(--rule);border-radius:4px;background:none}
.muted{color:var(--ink-2)}
.lib{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.lib button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 5px;border-radius:7px;font-size:10.5px;line-height:1.15;color:var(--ink)}
.lib button:hover{background:var(--accent-soft)}
.lib button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.lib svg.i{width:24px;height:24px}

/* command line + title block */
#foot{grid-area:foot;background:var(--panel);border-top:1px solid var(--rule)}
#log{height:50px;overflow-y:auto;padding:4px 12px 0;font:400 11.5px/1.4 var(--f-mono);color:var(--ink-2);scrollbar-width:thin}
#log div.e{color:var(--signal)} #log div.k{color:var(--ink)}
#cmd{display:flex;align-items:center;gap:8px;padding:4px 12px 6px}
#prompt{font:600 12px var(--f-mono);color:var(--accent);white-space:nowrap;max-width:60%;overflow:hidden;text-overflow:ellipsis}
#cmdIn{flex:1;min-width:0;height:30px;border:1px solid var(--rule);border-radius:6px;background:var(--sheet);padding:0 10px;font:500 13px var(--f-mono)}
#cmdIn:focus{border-color:var(--accent);outline:none}
#cmd button{height:30px;width:38px;border-radius:6px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center}
#status{display:flex;align-items:stretch;border-top:1px solid var(--rule);height:30px;overflow-x:auto;scrollbar-width:none}
#status::-webkit-scrollbar{display:none}
.cell{display:flex;align-items:center;gap:6px;padding:0 10px;border-right:1px solid var(--rule);white-space:nowrap;flex:none}
.cell b{font:600 9.5px/1 var(--f-cond);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.cell span,.cell input{font:500 12px var(--f-mono);font-variant-numeric:tabular-nums}
.cell svg.i{width:14px;height:14px}
.cell span.co{display:inline-block;min-width:66px;text-align:right}
.cell input{width:52px;height:22px;border:1px solid var(--rule);border-radius:4px;background:var(--sheet);padding:0 5px;text-align:right}
button.cell{font:600 10.5px var(--f-cond);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
button.cell[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft)}
button.cell kbd{font:400 9px var(--f-mono);opacity:.6;letter-spacing:0}

/* modal */
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,14,20,.45);padding:16px;z-index:20}
#modal.on{display:flex}
#modal.float{background:transparent;pointer-events:none}
#modal.float .dlg{pointer-events:auto;width:min(340px,100%)}
.dlg h2{cursor:move;touch-action:none;user-select:none}
.dlg{background:var(--panel);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);width:min(560px,100%);max-height:100%;display:flex;flex-direction:column}
.dlg h2{margin:0;padding:16px 18px 6px;font:600 16px var(--f-cond);letter-spacing:.06em;text-transform:uppercase}
.dlg .body{padding:6px 18px 12px;overflow-y:auto;line-height:1.5}
.dlg .body h3{font:600 11px var(--f-cond);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:14px 0 4px}
.dlg .body table{border-collapse:collapse;width:100%}
.dlg .body td{padding:3px 8px 3px 0;vertical-align:top}
.dlg .body td:first-child{font:500 12px var(--f-mono);white-space:nowrap;color:var(--accent)}
.dlg .body textarea{width:100%;height:180px;font:11px var(--f-mono);border:1px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);padding:8px}
.dlg .body p{margin:6px 0}
.dlg .row{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);margin:4px 0}
.dlg .row label{color:var(--ink);font-size:13px}
button.cell b{color:var(--ink-2)}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;padding:10px 18px 16px}
.btn{height:34px;padding:0 16px;border-radius:7px;font-weight:600;border:1px solid var(--rule)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:transparent}

@media (max-width:820px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "view" "rail" "foot"}
  .only-m{display:flex}
  .tb span,.brand span,.brand small,.brand em,.hide-m{display:none}
  .tb{padding:0;width:30px;justify-content:center}
  .more .tb{width:auto;padding:0 9px}
  .tb.icon{width:30px}
  .seg{flex:none}
  .seg button{padding:0 7px}
  .brand{margin-right:0}
  #top{gap:2px;padding:0 6px}
  #docName{display:none}
  .vr{margin:0 1px}
  #rail{width:auto;display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;border-right:0;border-top:1px solid var(--rule);padding:5px 8px;scrollbar-width:none}
  #rail::-webkit-scrollbar{display:none}
  .rg{display:flex;gap:2px;margin:0;padding-right:10px;border-right:1px solid var(--rule)}
  .rg:last-child{border-right:0}
  .rg h3{display:none}
  .tool{width:42px;height:42px;flex:none}
  #side{position:fixed;top:46px;right:0;bottom:0;width:min(86vw,300px);transform:translateX(102%);transition:transform .2s;z-index:10;box-shadow:var(--shadow)}
  #side.open{transform:none}
  #log{height:20px;padding-top:2px}
  #cmdIn{font-size:16px}
  #cmd{flex-wrap:wrap;row-gap:4px}
  #prompt{flex-basis:100%;max-width:none;white-space:normal}
  #hud{bottom:10px}
  #hud kbd{display:none}
  #toast{max-width:calc(100% - 24px);top:54px}
  #hint{max-width:calc(100% - 20px);top:auto;bottom:58px}
  #ptBox{left:10px;right:10px;width:auto;top:86px}
  #ptBox .row input{font-size:16px;height:32px}
  #hint span{font-size:12px}
}

Object.assign(I18N.tr,{"guide": "Kılavuz", "hints": "İpuçları", "on": "açık", "off": "kapalı", "hideHints": "İpuçlarını kapat", "hintsOff": "İpuçları kapatıldı. Yan paneldeki Diğer bölümünden tekrar açabilirsin.", "tourStart": "Tanıtım turunu başlat", "skip": "Atla", "next": "İleri", "back": "Geri", "done": "Bitir", "gTitle": "Pergel Kılavuzu", "tr1": "Araçlar|Çizim, ölçü, katı ve düzenleme araçları burada. Bir araca basınca ne yapacağını çizim alanındaki ipucu ve alttaki komut satırı söyler.", "tr2": "Çizim alanı|Noktaları buraya tıklayarak koyarsın. Sağ tuşla sürükleyince görünüm döner, tekerlek yakınlaştırır. Telefonda iki parmakla kaydırıp yakınlaştırırsın.", "tr3": "Görünümler|Üst, Ön, Sağ ve 3B hazır bakışlardır. Sığdır tüm çizimi ekrana getirir.", "tr4": "Panel|Katmanlar, seçili nesnenin özellikleri ve hazır nesneler burada. Telefonda bu düğmeyle açılır.", "tr5": "Komut satırı|Ölçüyü buraya yazarsın: 250 yazıp Enter’a basınca fare yönünde 250 birim çizer. Komut adı da yazabilirsin: çizgi, daire, kutu.", "tr6": "Durum çubuğu|İmlecin koordinatları, ızgara ve yakalama düğmeleri, ızgara adımı ve çalışma kotu burada.", "tr7": "Kılavuz|Adım adım anlatım burada. Bu turu kılavuz penceresinden istediğin zaman tekrar başlatabilirsin.", "h_select": "Nesneye tıkla. Boş yerde sürükle: sağa doğru içinde kalanları, sola doğru değenleri seçer. Shift ile seçime eklersin.", "h_orbit": "Sürükleyerek görünümü döndür. Bitince Esc.", "h_measure": "İki noktaya tıkla. Mesafe ve açı komut satırının üstünde yazılır.", "h_line": "Noktalara sırayla tıkla. Belirli uzunluk için fareyi yöne götür, sayıyı yaz, Enter’a bas. Boş Enter bitirir.", "h_poly": "Noktalara tıkla. K kapatır, Enter bitirir. Sonuç tek parça olur; alanı Özellikler’de görünür.", "h_rect": "İki karşı köşeye tıkla. Ölçüyle çizmek için ilk köşeden sonra @en,boy yaz (örn. @500,300).", "h_circle": "Merkeze tıkla, sonra yarıçapı tıkla ya da yaz.", "h_arc": "Üç nokta: başlangıç, yay üzerinde bir nokta, bitiş.", "h_polygon": "Kenar sayısını yaz, merkeze tıkla, sonra köşe mesafesini tıkla ya da yaz.", "h_ellipse": "Merkeze, birinci eksenin ucuna tıkla; sonra ikinci yarı ekseni tıkla ya da yaz.", "h_text": "Konuma tıkla, yazıyı alttaki satıra yazıp Enter’a bas.", "h_hatch": "Kapalı çoklu çizgi veya daire seç, Enter’a bas. Deseni, açıyı ve aralığı Özellikler’den değiştir.", "h_dimlin": "Ölçülecek iki noktaya, sonra ölçü çizgisinin duracağı yere tıkla. Yere göre yatay ya da dikey ölçer.", "h_dimali": "İki noktaya ve ölçü çizgisinin yerine tıkla. İki nokta arasındaki gerçek mesafeyi yazar.", "h_dimang": "Köşe noktasına, iki kolun üzerine ve yayın duracağı yere tıkla.", "h_dimrad": "Daire ya da yayın üzerine tıkla, sonra yazının duracağı yere tıkla.", "h_dimdia": "Daire ya da yayın üzerine tıkla, sonra yazının duracağı yere tıkla.", "h_box": "Tabanın iki köşesine tıkla, sonra yüksekliği yaz ya da fareyi yukarı çek.", "h_cyl": "Merkeze tıkla, yarıçapı ver, sonra yüksekliği yaz ya da fareyi yukarı çek.", "h_cone": "Merkeze tıkla, yarıçapı ver, sonra yüksekliği yaz ya da fareyi yukarı çek.", "h_sphere": "Merkeze tıkla, yarıçapı tıkla ya da yaz. Küre çalışma düzlemine oturur.", "h_extrude": "Kapalı çoklu çizgi veya daire seç, Enter’a bas, yüksekliği yaz.", "h_move": "Nesneleri seç, Enter. Taban noktasına, sonra hedefe tıkla.", "h_copy": "Nesneleri seç, Enter. Taban noktasına, sonra her kopya için hedefe tıkla. Enter bitirir.", "h_rotate": "Nesneleri seç, Enter. Dönme merkezine tıkla, açıyı derece olarak yaz.", "h_scale": "Nesneleri seç, Enter. Sabit kalacak noktaya tıkla, katsayıyı yaz (2 = iki katı, 0.5 = yarısı).", "h_mirror": "Nesneleri seç, Enter. Ayna ekseninin iki noktasına tıkla. Asıl nesne yerinde kalır.", "h_array": "Nesneleri seç, Enter. Sütun ve satır sayısını, sonra sütun ve satır aralığını yaz.", "h_offset": "Mesafeyi yaz, nesneye tıkla, sonra hangi tarafa olacağına tıkla.", "h_trim": "Silinecek parçaya tıkla. Parça en yakın kesişim noktalarından kesilir.", "h_extend": "Çizginin uzatılacak ucuna yakın tıkla. Karşılaştığı ilk nesneye kadar uzar.", "h_fillet": "Yarıçapı yaz, sonra iki çizgiye tıkla. 0 yazarsan keskin köşe yapar.", "h_insert": "Yerleştirmek için tıkla. Ölçek ve açıyı Özellikler’den değiştir. Enter bitirir."});
Object.assign(I18N.en,{"guide": "Guide", "hints": "Tips", "on": "on", "off": "off", "hideHints": "Hide tips", "hintsOff": "Tips are off. Turn them back on under More in the side panel.", "tourStart": "Start the tour", "skip": "Skip", "next": "Next", "back": "Back", "done": "Finish", "gTitle": "Pergel Guide", "tr1": "Tools|Drawing, dimension, solid and editing tools live here. After you pick one, the tip in the drawing area and the command line below tell you what to do.", "tr2": "Drawing area|Click here to place points. Drag with the right button to orbit, use the wheel to zoom. On a phone, pan and zoom with two fingers.", "tr3": "Views|Top, Front, Right and 3D are ready-made views. Fit brings the whole drawing into view.", "tr4": "Panel|Layers, the properties of the selected object and the ready-made objects. On a phone this button opens it.", "tr5": "Command line|Type sizes here: type 250 and press Enter to draw 250 units towards the cursor. You can also type a command name: line, circle, box.", "tr6": "Status bar|Cursor coordinates, the grid and snap switches, the grid step and the working elevation.", "tr7": "Guide|Step-by-step instructions are here. You can restart this tour from the guide window at any time.", "h_select": "Click an object. Drag on empty space: to the right selects what is fully inside, to the left what it touches. Shift adds to the selection.", "h_orbit": "Drag to orbit the view. Press Esc when done.", "h_measure": "Click two points. Distance and angle appear above the command line.", "h_line": "Click points in turn. For an exact length, aim the cursor, type the number and press Enter. An empty Enter finishes.", "h_poly": "Click points. C closes, Enter finishes. The result is one object; its area shows in Properties.", "h_rect": "Click two opposite corners. For exact size, type @width,depth after the first corner (e.g. @500,300).", "h_circle": "Click the centre, then click or type the radius.", "h_arc": "Three points: start, a point on the arc, end.", "h_polygon": "Type the number of sides, click the centre, then click or type the corner distance.", "h_ellipse": "Click the centre and the end of the first axis; then click or type the second half axis.", "h_text": "Click the position, type the text in the line below and press Enter.", "h_hatch": "Select a closed polyline or circle and press Enter. Change pattern, angle and spacing in Properties.", "h_dimlin": "Click the two points to measure, then where the dimension line should sit. It measures horizontally or vertically depending on that position.", "h_dimali": "Click two points and the dimension line position. It shows the true distance between the points.", "h_dimang": "Click the corner point, a point on each leg, and where the arc should sit.", "h_dimrad": "Click on a circle or arc, then where the text should sit.", "h_dimdia": "Click on a circle or arc, then where the text should sit.", "h_box": "Click two corners of the base, then type the height or drag upwards.", "h_cyl": "Click the centre, give the radius, then type the height or drag upwards.", "h_cone": "Click the centre, give the radius, then type the height or drag upwards.", "h_sphere": "Click the centre, then click or type the radius. The sphere sits on the working plane.", "h_extrude": "Select a closed polyline or circle, press Enter, type the height.", "h_move": "Select objects, Enter. Click a base point, then the target.", "h_copy": "Select objects, Enter. Click a base point, then a target for each copy. Enter finishes.", "h_rotate": "Select objects, Enter. Click the rotation centre, type the angle in degrees.", "h_scale": "Select objects, Enter. Click the fixed point, type the factor (2 = double, 0.5 = half).", "h_mirror": "Select objects, Enter. Click two points of the mirror axis. The original stays.", "h_array": "Select objects, Enter. Type the number of columns and rows, then the column and row spacing.", "h_offset": "Type the distance, click the object, then click the side.", "h_trim": "Click the part to remove. It is cut at the nearest intersections.", "h_extend": "Click near the end of the line to extend. It grows to the first object it meets.", "h_fillet": "Type the radius, then click two lines. 0 makes a sharp corner.", "h_insert": "Click to place. Change scale and angle in Properties. Enter finishes."});
const GUIDE={"tr": [["1 · İlk çizim", ["Soldaki araçlardan <b>Çizgi</b>’ye bas (ya da klavyeden <kbd>L</kbd> yazıp Enter).", "Çizim alanında bir noktaya, sonra ikinci noktaya tıkla. Tıklamaya devam ettikçe çizgi uzar.", "<kbd>Enter</kbd> zinciri bitirir, <kbd>Esc</kbd> araçtan çıkar.", "Yanlış olduysa <kbd>Ctrl+Z</kbd> geri alır.", "Telefonda parmağını basılı sürükle: imleç parmağının biraz üstünde durur ve yakalama simgesi (kare: uç, üçgen: orta, daire: merkez, çarpı: kesişim) görünür. Doğru yere gelince bırak."]], ["2 · Ölçüyle çizim", ["İlk noktayı koy, fareyi gideceğin yöne götür, <kbd>250</kbd> yazıp Enter’a bas: o yönde 250 birim çizer.", "Son noktaya göre: <kbd>@200,0</kbd> sağa 200 birim, <kbd>@0,-150</kbd> aşağı 150 birim.", "Uzunluk ve açı: <kbd>@200&lt;45</kbd> 200 birim, 45°.", "Belirli bir yere: <kbd>100,50</kbd> (sağa,yukarı). Ondalık için nokta kullan: <kbd>12.5</kbd>.", "Dikdörtgende ilk köşeden sonra <kbd>@500,300</kbd> yazarsan 5 × 3 m olur.", "<b>Dik</b> (<kbd>F8</kbd>) çizgiyi yatay ya da dikeye kilitler. <b>Izgara</b> noktaları adım aralığına oturtur; serbest çizmek için kapat.", "Çizim birimini durum çubuğundaki <b>Birim</b> düğmesinden seçersin (mm, cm, m, inç, ft). Ölçü yazıları başka birimde gösterilebilir: çizim metreyken ölçüler cm yazılabilir."]], ["3 · Görünümü yönetme", ["<b>Sağ tuşla sürükle</b>: görünümü döndürür. <b>Orta tuşla sürükle</b>: kaydırır. <b>Tekerlek</b>: yakınlaştırır.", "Sağ üstteki <b>Üst / Ön / Sağ / 3B</b> hazır bakışlardır. Plan çizerken Üst’ü kullan.", "<b>Sığdır</b> tüm çizimi ekrana getirir. Çizimi kaybedersen buna bas.", "Telefonda iki parmakla kaydırıp yakınlaştır. Döndürmek için <b>Döndürerek bak</b> aracını seç ve tek parmakla sürükle."]], ["4 · 3B katılar", ["<b>Kutu</b>: tabanın iki köşesine tıkla, yüksekliği yaz (örn. <kbd>90</kbd>).", "<b>Silindir / Koni</b>: merkez, yarıçap, yükseklik. <b>Küre</b>: merkez ve yarıçap.", "<b>Yükselt</b>: kapalı bir çoklu çizgi ya da daire seç, Enter’a bas, yüksekliği yaz. Duvar, havuz, kasa gibi şekiller böyle yapılır.", "Bir şeyi yukarıda çizmek için durum çubuğundaki <b>Kot</b> değerini değiştir (örn. 100). Çizilmiş bir nesneyi yükseltmek için Özellikler’deki <b>Kot (Z)</b> alanını kullan."]], ["5 · Ölçülendirme", ["<b>Doğrusal ölçü</b>: iki noktaya tıkla, sonra ölçü çizgisinin duracağı yere. Üste ya da alta çekersen yatay, yana çekersen dikey ölçer.", "<b>Hizalı ölçü</b>: eğik bir kenarın gerçek uzunluğunu yazar.", "<b>Açı ölçüsü</b>: köşe, birinci kol, ikinci kol, sonra yayın yeri.", "<b>Yarıçap / Çap</b>: daireye tıkla, yazının yerini göster.", "Yazı küçük ya da büyükse: hiçbir şey seçili değilken Özellikler’deki <b>Ölçü yazı yüks.</b> değerini değiştir. Tek bir ölçünün yazısını seçip Özellikler’den değiştirebilirsin.", "Sadece ölçmek istiyorsan <b>Ölç</b> aracını kullan; çizime bir şey eklemez."]], ["6 · Seçme ve düzenleme", ["<b>Seçme</b>: nesneye tıkla. Sürükleyerek kutu aç: sağa doğru yalnızca içinde kalanlar, sola doğru değenler seçilir. <kbd>Shift</kbd> seçime ekler, <kbd>Del</kbd> siler.", "<b>Taşı / Kopyala</b>: seç, Enter, taban noktası, hedef.", "<b>Döndür</b>: merkez ve açı. <b>Ölçekle</b>: sabit nokta ve katsayı.", "<b>Aynala</b>: iki noktayla eksen göster. <b>Dizi</b>: sütun, satır ve aralıkları yaz.", "<b>Ötele</b>: mesafeyi yaz, nesneye ve tarafa tıkla. Yol kenarı, bordür gibi paralel çizgiler için.", "<b>Buda</b>: fazlalık parçaya tıkla. <b>Uzat</b>: kısa kalan uca yakın tıkla.", "<b>Köşe yuvarla</b>: yarıçapı yaz, iki çizgiye tıkla."]], ["7 · Katmanlar, renk ve çizgi tipi", ["Sağ panelde <b>Ekle</b> ile katman aç, adına çift tıklayarak değiştir.", "Katmanın adına tıklayınca <b>etkin</b> olur; yeni çizdiklerin o katmana gider.", "Göz simgesi gizler, kilit düzenlemeyi kapatır, renk kutusu rengi değiştirir.", "Hiçbir şey seçili değilken Özellikler’de etkin katmanın <b>çizgi tipini</b> ve <b>kalınlığını</b> ayarlarsın.", "Tek bir nesneye farklı renk ya da çizgi tipi vermek için onu seç ve Özellikler’den değiştir.", "Kesikli çizgiler çok sık ya da seyrekse <b>Çizgi tipi ölçeği</b> değerini değiştir."]], ["8 · Tarama ve hazır nesneler", ["<b>Tarama</b>: kapalı bir şekli seç, Tarama aracına bas, Enter. Deseni (çizgili, çapraz, dolu), açıyı ve aralığı Özellikler’den değiştir. Alanı m² olarak görünür.", "<b>Hazır nesneler</b>: sağ panelden ağaç, bank, aydınlatma gibi bir nesne seç ve çizimde tıkla. Ölçek ve açıyı Özellikler’den ayarla.", "<b>Alan</b>: köşelere sırayla tıkla, K ya da Enter ile kapat. Alan (m²) ve çevre şeklin ortasına yazılır; şekli taşıyıp ölçeklersen yazı güncellenir. Kapalı bir şekli seçip Alan’a basarsan doğrudan alana çevrilir. Alan yazısını seçip Özellikler’den boyutunu (A− / A+), kalın ya da eğik biçimini, rengini, birimini (m², dönüm, ha), ondalığını, ön ekini, açısını ve yerini değiştirirsin; son biçim sonraki alanlarda da kullanılır.", "Birden çok alan, kapalı şekil ya da çizgi seçersen Özellikler’de <b>toplam alan</b> ve <b>toplam uzunluk</b> görünür."]], ["9 · Dosyalar", ["<b>Kaydet</b>: çizimin tamamını Pergel dosyası (.json) olarak indirir. Katılar ve ölçüler düzenlenebilir kalır. Üstteki ad kutusuna dosya adını yaz.", "<b>Aç</b>: Pergel, DXF ya da DWG dosyası açar. Dosyayı çizim alanına sürükleyip bırakabilirsin.", "<b>DXF</b>: başka CAD programları için dışa aktarır. Katılar yüzey ağı, ölçüler çizgi ve yazı olarak gider.", "Çizim ayrıca bu tarayıcıda otomatik saklanır; yine de önemli işleri <b>Kaydet</b> ile dosyaya al."]], ["10 · Sık karşılaşılanlar", ["<b>Nokta istediğim yere gitmiyor</b>: Izgara ya da Yakala açıktır. Durum çubuğundan kapat.", "<b>Çizim ekranda yok</b>: Sığdır’a bas.", "<b>Nesneyi seçemiyorum</b>: katmanı kilitli ya da gizli olabilir.", "<b>Araç bir şey yapmıyor</b>: komut satırındaki mavi yazı sıradaki adımı söyler.", "<b>Yükseklik fareyle olmuyor</b>: Üst görünümde yükseklik görünmez; sayıyı yaz ya da 3B görünüme geç.", "<b>DWG açılmadı</b>: dosyayı kaynağında DXF olarak kaydedip onu aç."]]], "en": [["1 · First drawing", ["Pick <b>Line</b> from the tools on the left (or type <kbd>L</kbd> and press Enter).", "Click a point in the drawing area, then a second one. Keep clicking to continue the chain.", "<kbd>Enter</kbd> ends the chain, <kbd>Esc</kbd> leaves the tool.", "<kbd>Ctrl+Z</kbd> undoes a mistake.", "On a phone, press and drag: the cursor floats a little above your finger and the snap marker shows (square: end, triangle: mid, circle: centre, cross: intersection). Release at the right spot."]], ["2 · Drawing to size", ["Place the first point, aim the cursor, type <kbd>250</kbd> and press Enter: it draws 250 units that way.", "Relative to the last point: <kbd>@200,0</kbd> is 200 units right, <kbd>@0,-150</kbd> is 150 units down.", "Length and angle: <kbd>@200&lt;45</kbd> is 200 units at 45°.", "An exact place: <kbd>100,50</kbd> (right,up). Use a dot for decimals: <kbd>12.5</kbd>.", "In Rectangle, typing <kbd>@500,300</kbd> after the first corner gives 5 × 3 m.", "<b>Ortho</b> (<kbd>F8</kbd>) locks lines to horizontal or vertical. <b>Grid</b> snaps points to the step; turn it off to draw freely.", "Pick the drawing unit with the <b>Unit</b> button in the status bar (mm, cm, m, in, ft). Dimension text can use another unit: a drawing in metres can show dimensions in cm."]], ["3 · Moving around", ["<b>Right-drag</b> orbits. <b>Middle-drag</b> pans. The <b>wheel</b> zooms.", "<b>Top / Front / Right / 3D</b> at the top right are ready-made views. Use Top for plans.", "<b>Fit</b> shows the whole drawing. Press it if you lose the drawing.", "On a phone, pan and zoom with two fingers. To orbit, pick <b>Orbit view</b> and drag with one finger."]], ["4 · 3D solids", ["<b>Box</b>: click two corners of the base, type the height (e.g. <kbd>90</kbd>).", "<b>Cylinder / Cone</b>: centre, radius, height. <b>Sphere</b>: centre and radius.", "<b>Extrude</b>: select a closed polyline or circle, press Enter, type the height. Good for walls, pools and planters.", "To draw higher up, change <b>Elev</b> in the status bar (e.g. 100). To lift an existing object, use <b>Elevation (Z)</b> in Properties."]], ["5 · Dimensions", ["<b>Linear</b>: click two points, then where the dimension line sits. Pull it above or below for horizontal, sideways for vertical.", "<b>Aligned</b>: shows the true length of a slanted edge.", "<b>Angle</b>: corner, first leg, second leg, then the arc position.", "<b>Radius / Diameter</b>: click the circle, then the text position.", "If the text is too small or large, change <b>Dimension text ht.</b> in Properties with nothing selected. Select a single dimension to change its text.", "To just measure, use <b>Measure</b>; it adds nothing to the drawing."]], ["6 · Selecting and editing", ["<b>Select</b>: click an object. Drag a box: to the right takes only what is inside, to the left what it touches. <kbd>Shift</kbd> adds, <kbd>Del</kbd> deletes.", "<b>Move / Copy</b>: select, Enter, base point, target.", "<b>Rotate</b>: centre and angle. <b>Scale</b>: fixed point and factor.", "<b>Mirror</b>: show the axis with two points. <b>Array</b>: type columns, rows and spacings.", "<b>Offset</b>: type the distance, click the object and the side. Good for kerbs and path edges.", "<b>Trim</b>: click the surplus part. <b>Extend</b>: click near the short end.", "<b>Fillet</b>: type the radius, click two lines."]], ["7 · Layers, colour and line type", ["Use <b>Add</b> in the side panel to create a layer; double-click its name to rename.", "Click a layer name to make it <b>active</b>; new objects go there.", "The eye hides, the lock prevents editing, the swatch changes colour.", "With nothing selected, Properties sets the active layer’s <b>line type</b> and <b>weight</b>.", "To give one object its own colour or line type, select it and change it in Properties.", "If dashes look too dense or sparse, change <b>Line type scale</b>."]], ["8 · Hatch and ready-made objects", ["<b>Hatch</b>: select a closed shape, pick Hatch, press Enter. Change pattern (lines, cross, solid), angle and spacing in Properties. The area shows in m².", "<b>Ready-made objects</b>: pick a tree, bench or lamp post in the side panel and click in the drawing. Set scale and angle in Properties.", "<b>Area</b>: click the corners in turn and close with C or Enter. The area (m²) and perimeter are written in the middle of the shape and update when you move or scale it. Select a closed shape and pick Area to convert it directly. Select the area and use Properties to change the text size (A− / A+), bold or italic, colour, unit (m², decare, ha), decimals, prefix, angle and position; the last format is reused for the next areas.", "Select several areas, closed shapes or lines and Properties shows the <b>total area</b> and <b>total length</b>."]], ["9 · Files", ["<b>Save</b> downloads the whole drawing as a Pergel file (.json). Solids and dimensions stay editable. Type the file name in the box at the top.", "<b>Open</b> loads a Pergel, DXF or DWG file. You can also drop a file onto the drawing area.", "<b>DXF</b> exports for other CAD programs. Solids go as face meshes, dimensions as lines and text.", "The drawing is also kept in this browser automatically; still, use <b>Save</b> for anything important."]], ["10 · Common snags", ["<b>The point will not go where I want</b>: Grid or Snap is on. Turn it off in the status bar.", "<b>The drawing is gone</b>: press Fit.", "<b>I cannot select an object</b>: its layer may be locked or hidden.", "<b>The tool does nothing</b>: the blue text in the command line tells you the next step.", "<b>Height by mouse does not work</b>: height is invisible in Top view; type the number or switch to 3D.", "<b>A DWG did not open</b>: save it as DXF at the source and open that."]]]};
GUIDE.tr.splice(9,0,...[["10 · Nokta ve koordinat", ["<b>Nokta</b> aracına bas (ya da <kbd>nokta</kbd> yaz). Çizimde tıklarsan nokta oraya konur.", "Koordinatla koymak için komut satırına <kbd>sağa,yukarı</kbd> ya da <kbd>sağa,yukarı,kot</kbd> yaz; örnek: <kbd>4512.35,2210.80,102.4</kbd>. Sıra AutoCAD’deki X,Y ve Netcad’deki Y,X ile aynıdır: önce sağa, sonra yukarı değer.", "Noktalar kendiliğinden numaralanır (1, 2, 3…). Adı Özellikler’den değiştirirsin.", "Bir noktayı seçince Özellikler’de X, Y ve Kot (Z) kutuları çıkar; değer yazarak noktayı tam yerine taşırsın. Aynı kutular yazı, daire, kutu ve hazır nesnelerde de vardır.", "Özellikler’den adın, kotun ve koordinatın noktanın yanına yazılmasını açıp kapatırsın.", "Toplu giriş: komut satırına <kbd>noktalar</kbd> yaz. Açılan kutuya her satırda bir nokta olacak şekilde <kbd>ad sağa yukarı kot</kbd> yaz ya da yapıştır; Excel’den kopyalanan sütunlar da olur.", "Noktalar yakalama hedefidir: çizerken bir noktaya yaklaşınca “Nokta” simgesi çıkar.", "Koordinat adları harita düzenindedir (Netcad’deki gibi): <b>Y sağa, X yukarı</b>. İlk kutu ve ilk yazılan değer her zaman sağa olandır. AutoCAD düzenini (X sağa · Y yukarı) istersen Birimler penceresinden değiştir; yalnızca adlar değişir, sayılar aynı kalır."]], ["11 · Birimler ve ayarlar", ["Durum çubuğundaki <b>Birim</b> düğmesi: çizim birimi (mm, cm, m, inç, ft), ölçü yazılarının birimi, ondalık basamak, ölçüye birim ekleme ve koordinat adları.", "Birimi değiştirirken <b>Sayılar aynı kalsın</b> yalnızca birimi değiştirir; <b>Dönüştür</b> çizimi yeni birime göre yeniden boyutlandırır.", "Birim bilgisi olmayan bir DXF ya da DWG açılınca program birimi sorar.", "Durum çubuğu: <b>Izgara</b> (<kbd>F9</kbd>) noktaları adıma oturtur; <b>Yakala</b> (<kbd>F3</kbd>) uç, orta, merkez, kesişim, dik ve noktaları yakalar; <b>Dik</b> (<kbd>F8</kbd>) yatay ya da dikeye kilitler. <b>Adım</b> ızgara aralığı, <b>Kot</b> çalışma yüksekliğidir.", "Hiçbir şey seçili değilken Özellikler: yazı yüksekliği, ölçü yazı yüksekliği, çizgi tipi ölçeği, etkin katmanın çizgi tipi ve kalınlığı.", "Yazı biçimi: alan, ölçü, nokta ya da yazıyı seç; <b>A− / A+</b> ile boyut, ayrıca kalın, eğik ve yazı rengi. Birden çok nesne seçersen hepsine uygulanır.", "Alan ve ölçü yazısını tutup sürükleyerek yerini değiştirirsin; tam değer için Özellikler’deki <b>Yazıyı kaydır X / Y</b> kutularını kullan.", "Yan paneldeki <b>Diğer</b> bölümü: kılavuz, yardım, açık / koyu tema, tam ekran ve ipuçlarını açıp kapatma. Dil sağ üstteki TR / EN düğmesinden değişir."]]]);GUIDE.en.splice(9,0,...[["10 · Points and coordinates", ["Pick <b>Point</b> (or type <kbd>point</kbd>). Click in the drawing to place a point there.", "To place by coordinates, type <kbd>right,up</kbd> or <kbd>right,up,elevation</kbd> in the command line, e.g. <kbd>4512.35,2210.80,102.4</kbd>. The order matches X,Y in AutoCAD and Y,X in Netcad: first the value to the right, then upwards.", "Points are numbered automatically (1, 2, 3…). Change the name in Properties.", "Select a point and Properties shows X, Y and Elevation (Z) boxes; type values to move it exactly. The same boxes exist for text, circles, boxes and ready-made objects.", "Properties also switches the name, elevation and coordinates next to the point on or off.", "Bulk entry: type <kbd>ptlist</kbd> in the command line. Type or paste one point per line as <kbd>name right up elevation</kbd>; columns copied from Excel work too.", "Points are snap targets: the “Point” marker appears when you get close while drawing.", "Coordinate names follow the survey convention (as in Netcad): <b>Y to the right, X upwards</b>. The first box and the first typed value are always the one to the right. For the AutoCAD convention (X right · Y up), change it in the Units window; only the names change, the numbers stay."]], ["11 · Units and settings", ["The <b>Unit</b> button in the status bar: drawing unit (mm, cm, m, in, ft), unit of dimension text, decimal places, unit suffix on dimensions, and coordinate names.", "When changing the unit, <b>Keep the numbers</b> only changes the unit; <b>Convert</b> resizes the drawing for the new unit.", "When a DXF or DWG has no unit information, the program asks for it.", "Status bar: <b>Grid</b> (<kbd>F9</kbd>) snaps points to the step; <b>Snap</b> (<kbd>F3</kbd>) catches ends, midpoints, centres, intersections, perpendiculars and points; <b>Ortho</b> (<kbd>F8</kbd>) locks to horizontal or vertical. <b>Step</b> is the grid spacing, <b>Elev</b> the working height.", "With nothing selected, Properties holds text height, dimension text height, line type scale, and the active layer’s line type and weight.", "Text style: select an area, dimension, point or text; use <b>A− / A+</b> for size, plus bold, italic and text colour. With several objects selected it applies to all.", "Drag an area or dimension text to move it; for exact values use <b>Shift text X / Y</b> in Properties.", "<b>More</b> in the side panel: guide, help, light / dark theme, full screen and tips on or off. The language switches with TR / EN at the top right."]]]);GUIDE.tr[11][0]='12 · Sık karşılaşılanlar';GUIDE.tr[9][1].splice(0,2,"<b>Nokta</b> aracına bas (ya da <kbd>nokta</kbd> yaz). <b>Nokta ekle</b> penceresi açılır.","Pencerede adı, sağa ve yukarı değerlerini, istersen kotu yaz ve <b>Ekle</b>’ye (ya da Enter’a) bas. Önce sağa (Y), sonra yukarı (X) değer girilir. Ad sonu sayıysa kendiliğinden artar (P1, P2, P3…).","Pencere açıkken çizimde tıklarsan nokta tıkladığın yere, penceredeki adla konur. Komut satırına <kbd>4512.35,2210.80,102.4</kbd> yazmak da olur.");GUIDE.en[9][1].splice(0,2,"Pick <b>Point</b> (or type <kbd>point</kbd>). The <b>Add point</b> window opens.","Type the name, the right and up values and, if you like, the elevation, then press <b>Add</b> (or Enter). First the value to the right (Y), then the value upwards (X). A name ending in a number counts up by itself (P1, P2, P3…).","With the window open, clicking in the drawing places the point there with the name in the window. Typing <kbd>4512.35,2210.80,102.4</kbd> in the command line works too.");GUIDE.tr[6][1].splice(3,0,"Katmanın yanındaki <b>kalem</b> düğmesi düzenleme penceresini açar: ad, renk, çizgi tipi, kalınlık, görünür ve kilitli. Seçili nesneleri o katmana taşıma ve katmanı silme de buradadır.");GUIDE.en[6][1].splice(3,0,"The <b>pencil</b> button next to a layer opens the edit window: name, colour, line type, weight, visible and locked. Moving the selected objects to that layer and deleting the layer are there too.");GUIDE.tr[8][1].unshift("Program her açılışta <b>boş sayfayla</b> başlar. Daha önce açtığın ve üzerinde çalıştığın çizimler <b>Son çizimler</b> listesinde durur (üst çubuktaki saat simgesi ya da açılış kartı); bir satıra basınca çizim geri gelir. Liste bu tarayıcıda saklanır ve en fazla 12 çizim tutar.");GUIDE.en[8][1].unshift("The program starts with a <b>blank sheet</b> every time. Drawings you opened and worked on stay in <b>Recent drawings</b> (the clock icon in the top bar or the start card); press a row to bring one back. The list is kept in this browser and holds up to 12 drawings.");Object.assign(I18N.tr,{h_poly:I18N.tr.h_poly+" Başlangıç noktasına tıklarsan şekil kapanır; kendi köşelerine ve orta noktalarına da yakalar.",h_area:I18N.tr.h_area+" İlk köşeye tıklamak da kapatır."});Object.assign(I18N.en,{h_poly:I18N.en.h_poly+" Click the start point to close the shape; it also snaps to its own corners and midpoints.",h_area:I18N.en.h_area+" Clicking the first corner closes it too."});GUIDE.tr[9][1].splice(5,0,"Nokta adının üstüne tıklayınca nokta seçilir. Adı tutup sürükleyerek yerini değiştirirsin; Özellikler’den yazı yüksekliğini, <b>A− / A+</b> ile boyutunu, kalın, eğik ve rengini, <b>Yazıyı kaydır</b> kutularıyla tam yerini ayarlarsın.");GUIDE.en[9][1].splice(5,0,"Click a point’s name to select the point. Drag the name to move it; in Properties set the text height, size with <b>A− / A+</b>, bold, italic and colour, and the exact position with the <b>Shift text</b> boxes.");Object.assign(I18N.tr,{h_measure:"Noktalara sırayla tıkla; her parçanın uzunluğu ve toplam yazılır. Çoklu çizginin köşelerini sırayla tıklayarak toplam uzunluğu ölçersin. Başlangıca dönersen alanı da verir. Enter bitirir."});Object.assign(I18N.en,{h_measure:"Click points in turn; each segment length and the running total are shown. Click the corners of a polyline in order to get its total length. Returning to the start also gives the area. Enter finishes."});GUIDE.tr[4][1][5]="Sadece ölçmek istiyorsan <b>Ölç</b> aracını kullan; çizime bir şey eklemez. Noktalara sırayla tıkladıkça her parçanın uzunluğu ve <b>toplam</b> yazılır; başlangıca dönersen kapalı şeklin alanını da verir.";GUIDE.en[4][1][5]="To just measure, use <b>Measure</b>; it adds nothing to the drawing. As you click points in turn, each segment length and the <b>total</b> are shown; returning to the start also gives the enclosed area.";GUIDE.tr[10][1].splice(4,0,"<b>Yakala</b> düğmesinin yanındaki kalem, yakalama türlerini açar: Uç, Nokta, Kesişim, Orta, Merkez, Çeyrek, Dik ve En yakın. İşaretli olmayan türler yakalanmaz. Aynı pencerede <b>Hepsini aç</b> ve <b>Hepsini kapat</b> düğmeleri vardır. Yakala açıkken yalnızca yakalanan noktalar kabul edilir: boş yere tıklarsan nokta konmaz. Serbest çizmek için Yakala’yı kapat (<kbd>F3</kbd>) ya da koordinat yaz; bu kuralı pencerenin en üstündeki kutudan kaldırabilirsin. Ölçü çizgisinin yeri, yazı ve hazır nesne yerleştirme her zaman serbesttir.");GUIDE.en[10][1].splice(4,0,"The pencil next to <b>Snap</b> opens the snap types: End, Point, Intersection, Mid, Centre, Quadrant, Perpendicular and Nearest. Unticked types are not caught. The same window has <b>Turn all on</b> and <b>Turn all off</b>. While Snap is on only snapped points are accepted: a click in empty space places nothing. To draw freely, turn Snap off (<kbd>F3</kbd>) or type coordinates; the box at the top of the window removes this rule. Dimension line position, text and ready-made objects are always placed freely.");GUIDE.tr[6][1].splice(4,0,"Bir nesneye tıklayınca ait olduğu katman listede turuncu çerçeveyle işaretlenir ve görünür yere kaydırılır. O satırdaki kalemle ya da Özellikler’deki <b>Katmanı düzenle</b> düğmesiyle katmanın adını, rengini, çizgi tipini ve kalınlığını hemen değiştirirsin.");GUIDE.en[6][1].splice(4,0,"Click an object and its layer is marked with an orange frame in the list and scrolled into view. Use the pencil on that row or the <b>Edit layer</b> button in Properties to change the layer’s name, colour, line type and weight right away.");Object.assign(I18N.tr,{h_dimcon:"İki noktaya ve ölçü çizgisinin yerine tıkla; sonra her tıklama bir önceki noktadan devam eden yeni bir ölçü ekler. Hepsi aynı hizada durur. Enter bitirir."});Object.assign(I18N.en,{h_dimcon:"Click two points and the dimension line position; after that every click adds a new dimension continuing from the previous point, all on the same line. Enter finishes."});GUIDE.tr[4][1].splice(4,0,"<b>Zincir ölçü</b>: ilk ölçüyü koyduktan sonra her tıklama bir önceki noktadan devam eden yeni ölçü ekler; hepsi aynı hizada durur.","<b>Ölçü stili</b> (Ölçü grubundaki ayar düğmesi): ok tipi (dolu, açık, eğik çizgi, nokta), ok büyüklüğü, yazı yüksekliği, yazının çizgiye uzaklığı, yazının yeri (üstünde ya da ortasında), uzatma çizgisi boşluğu ve taşması, dar yerde okların dışa dönmesi. <b>Tüm ölçülere uygula</b> ya da yalnızca seçili ölçülere uygula.");GUIDE.en[4][1].splice(4,0,"<b>Continuous dimension</b>: after the first dimension, every click adds a new one continuing from the previous point, all on the same line.","<b>Dimension style</b> (the settings button in the Dimension group): arrow type (filled, open, oblique tick, dot), arrow size, text height, text gap, text position (above or centred), extension line offset and overshoot, arrows turning outside when tight. <b>Apply to all dimensions</b> or only to the selected ones.");GUIDE.tr[6][1].push("<b>Yeni çizilecek nesneler</b>: hiçbir şey seçili değilken Özellikler’de renk, çizgi tipi ve çizgi kalınlığı seçersin; bundan sonra çizdiklerin bu özelliklerle gelir. “Katmandan” seçiliyse nesne katmanının özelliklerini alır (AutoCAD’deki ByLayer).","Çizilmiş bir nesnenin rengini, çizgi tipini ve kalınlığını değiştirmek için onu seç; aynı kutular Özellikler’de çıkar.");GUIDE.en[6][1].push("<b>New objects</b>: with nothing selected, pick a colour, line type and line weight in Properties; what you draw next gets them. “By layer” means the object takes its layer’s properties.","To change the colour, line type or weight of an existing object, select it; the same boxes appear in Properties.");GUIDE.tr[5][1].splice(1,0,"Seçilen nesneler kalın, kesikli ve renkli çizgiyle, köşelerinde kare <b>tutamaç</b> noktalarıyla gösterilir. Rengi, kalınlığı, kesikli ya da düz olmasını ve tutamaçları yan paneldeki <b>Diğer › Ayarlar</b> penceresinden değiştirirsin.");GUIDE.en[5][1].splice(1,0,"Selected objects are drawn with a thick, dashed, coloured line and square <b>grip</b> points at their corners. Change the colour, width, dashed or solid style and the grips under <b>More › Settings</b> in the side panel.");GUIDE.tr[4][1].splice(1,0,"Ölçü yazısı ve okları <b>otomatik</b> boyutla başlar: o an ekranda rahat okunacak büyüklükte çizilir, çizimdeki diğer ölçülerle aynı boyda kalır. Büyütüp küçültmek için ölçüyü seçip <b>A− / A+</b> düğmelerini ya da <b>Ölçü stili</b> penceresini kullan. Sabit bir boy istersen Özellikler’de “Ölçü yazı yüks.” kutusuna değer yaz; otomatik kapanır.");GUIDE.en[4][1].splice(1,0,"Dimension text and arrows start at an <b>automatic</b> size: readable at the current zoom and the same as the other dimensions in the drawing. Select a dimension and use <b>A− / A+</b> or the <b>Dimension style</b> window to resize. Type a value in “Dimension text ht.” for a fixed size; automatic turns off.");GUIDE.tr[0][1].push("<b>Kapat</b> (üst çubuk): açık çizimi kapatır ve boş sayfaya döner. Kapatmadan önce sorar: <b>Kaydet ve kapat</b> (Pergel dosyası), <b>DXF kaydet ve kapat</b>, <b>Kaydetmeden kapat</b> ya da <b>Vazgeç</b>.");GUIDE.en[0][1].push("<b>Close</b> (top bar): closes the open drawing and returns to an empty page. It asks first: <b>Save and close</b> (Pergel file), <b>Save DXF and close</b>, <b>Close without saving</b> or <b>Cancel</b>.");GUIDE.tr.push([(GUIDE.tr.length+1)+' · Katıyı doğrudan düzenleme',["Kutu çizince <b>Kutu ölçüleri</b> penceresi açılır: en, boy, yükseklik, açı ve konumu yazarsın. Sonradan açmak için kutuya çift tıkla ya da Özellikler’de <b>Tüm ölçüler</b>’e bas.", "Fareyi kutunun üstünde gezdir: altındaki <b>kenar</b> ya da <b>yüz</b> turkuaz renkle parlar. Tıklayınca o kenar ya da yüz seçilir ve yanında küçük bir ölçü kutusu açılır.", "<b>Kenar</b> seçiliyken yeni uzunluğu yazıp Enter’a bas; kutu, tıkladığın uca doğru uzar ya da kısalır.", "<b>Yüz</b> seçiliyken yüzü fareyle (telefonda parmakla) tutup çek; mesafe ve yeni ölçü imlecin yanında görünür. İstersen mesafeyi yaz: artı değer dışarı çeker, eksi değer içeri iter.", "Sayıyı komut satırına yazmak da aynı işi görür. Her adım <b>Geri al</b> ile geri döner."]]);GUIDE.en.push([(GUIDE.en.length+1)+' · Editing a solid directly',["Drawing a box opens the <b>Box sizes</b> window: width, depth, height, angle and position. Double-click a box or press <b>All sizes</b> in Properties to open it later.", "Move the mouse over a box: the <b>edge</b> or <b>face</b> under it glows turquoise. Click to select it; a small size box opens next to it.", "With an <b>edge</b> selected, type the new length and press Enter; the box grows or shrinks toward the end you clicked.", "With a <b>face</b> selected, drag it; the distance and new size follow the cursor. Or type a distance: positive pulls out, negative pushes in.", "Typing the number in the command line does the same. Every step can be undone."]]);GUIDE.tr[GUIDE.tr.length-1][1].splice(4,0,"Se function wirePts(e){

  else if(e.t==='dim'){const g=dimGeom(e),tri=[];for(const q of g.segs)a.push(q[0][0],q[0][1],q[0][2],q[1][0],q[1][1],q[1][2]);for(const pl of g.fills)for(let i=1;i+1<pl.length;i++)tri.push(pl[0][0],pl[0][1],pl[0][2],pl[i][0],pl[i][1],pl[i][2],pl[i+1][0],pl[i+1][1],pl[i+1][2]);c={a,closed:false,pairs:true,txt:g.txt,tri};wcache.set(e,c);return c;}
  else if(e.t==='fill'){const q=e.pts,n=q.length,tri=[];for(let i=0;i<n;i++){const u=q[i],v=q[(i+1)%n];a.push(u[0],u[1],u[2]||0,v[0],v[1],v[2]||0);}for(let i=1;i+1<n;i++)tri.push(q[0][0],q[0][1],q[0][2]||0,q[i][0],q[i][1],q[i][2]||0,q[i+1][0],q[i+1][1],q[i+1][2]||0);c={a,closed:false,pairs:true,tri};wcache.set(e,c);return c;}

function decodeText(buf){const u8=new Uint8Array(buf);try{return new TextDecoder('utf-8',{fatal:true}).decode(u8);}catch(_){try{return new TextDecoder('windows-1254').decode(u8);}catch(__){return new TextDecoder('latin1').decode(u8);}}}
let dwgLib=null;const VER=(m=>m&&m.content?'?v='+m.content:'')(document.querySelector('meta[name=surum]'));

  await new Promise((res,rej)=>{const s=el('script',{src:'dwg/dwg-reader.js'+VER});s.onload=res;s.onerror=()=>rej(new Error('dwg-reader'));document.head.appendChild(s);});

async function openFile(file){

      try{const {lib,inst}=await loadDwgLib();await busy(L('loading'));const dwg=inst.dwg_read_data(buf,lib.Dwg_File_Type?lib.Dwg_File_Type.DWG:0);if(!dwg)throw new Error('read');const db=inst.convert(dwg);try{inst.dwg_free(dwg);}catch(_){}

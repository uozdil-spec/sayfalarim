DE.en.length-1][1].push("<b>Ready-made objects are blocks</b>: Tree, Conifer, Shrub, Bench, Lamp post, Litter bin and Planter each become a block with their own name. Double-click one and edit it, and every object of that kind changes. Ready-made objects in older files are converted when opened.");GUIDE.tr[GUIDE.tr.length-1][1].push("<b>Kolay boyutlandırma</b>: bir hazır nesneye ya da bloğa tıkla. Etrafında sarı kesikli bir halka ve üç tutamaç çıkar: <b>sarı kare</b> büyütür/küçültür, <b>mavi daire</b> döndürür (5° adımlarla; Shift ile serbest), <b>ortadaki tutamaç</b> ya da nesnenin kendisi taşır. Değer imlecin yanında yazar.","Aynı anda açılan <b>küçük menüde</b> ölçek, açı ve kot için − / + düğmeleri ve kutuları vardır; Aynala, Çoğalt, Bloğu düzenle, Patlat ve Sil de buradadır. Menü başlığından tutup istediğin yere taşınır, çarpıyla kapanır. Birden çok ağaç seçersen hepsine birlikte uygulanır; “Aynı ölçeği tüm … nesnelerine uygula” ile çizimdeki aynı türdekileri eşitlersin.");GUIDE.en[GUIDE.en.length-1][1].push("<b>Easy resizing</b>: click a ready-made object or block. A yellow dashed ring and three grips appear: the <b>yellow square</b> resizes, the <b>blue circle</b> rotates (5° steps; Shift for free), the <b>middle grip</b> or the object itself moves it.","The <b>small menu</b> that opens with it has − / + buttons and boxes for scale, angle and level, plus Mirror, Duplicate, Edit block, Explode and Delete. Drag it by its title anywhere; close it with the cross. With several objects selected it applies to all of them.");GUIDE.tr.push([(GUIDE.tr.length+1)+' · Kesit',["<b>Kesit görünümü</b> (Seç ve Gör grubu ya da komut satırında <b>kesit</b>): katıları bir düzlemle keserek içini gösterir. Planda kesit çizgisinin iki noktasına tıkla; çizginin kameraya yakın tarafı gizlenir, kesilen yüzeyden içeri bakarsın. Kesit çizgisi pembe kesik çizgiyle, bakış yönü oklarla gösterilir.", "Açılan küçük pencerede <b>Konum</b> kaydırıcısıyla kesiti ileri geri kaydırırsın; <b>Yönü çevir</b> diğer tarafı gösterir. <b>Yatay kesit</b> yapıyı belli bir yükseklikten keser (kat planı gibi); kaydırıcı yüksekliği değiştirir.", "Kesit yalnızca görünümü değiştirir: çizim, metraj ve dosya etkilenmez. “Kesiti göster” kutusuyla geçici olarak kapatabilir, çarpıyla tümden kaldırabilirsin. Kesilen yüzler içi boş görünür."]]);GUIDE.en.push([(GUIDE.en.length+1)+' · Section',["<b>Section view</b> (Select & View group, or type <b>section</b>): cuts the solids with a plane to show their inside. Click two points of the section line in plan; the side nearer the camera is hidden. The line is shown dashed pink with arrows for the viewing direction.", "In the small window, the <b>Position</b> slider moves the cut; <b>Flip side</b> shows the other half. <b>Horizontal cut</b> cuts at a height, like a floor plan; the slider changes the height.", "A section only changes the view: the drawing, quantities and file are not affected. Hide it for a moment with “Show section”, remove it with the cross. Cut faces appear hollow."]]);GUIDE.tr[5][1].push("<b>Dairesel çoğalt</b> (Düzenle grubu): nesneleri seç, aracı aç, dönme merkezine tıkla. Açılan pencereye toplam adedi (asıl nesne dahil) ve doldurulacak açıyı yaz: 360° tam daire, 180° yarım daire. “Kopyaları döndür” işaretliyse her kopya merkeze dönük durur (örneğin dairesel meydandaki banklar); işaretsizse hepsi aynı yöne bakar (örneğin ağaçlar).");GUIDE.en[5][1].push("<b>Polar array</b> (Edit group): select objects, start the tool, click the centre. Enter the total count (original included) and the angle to fill: 360° full circle, 180° half. With “Rotate copies” each copy faces the centre (benches around a plaza); without it they keep their direction (trees).");GUIDE.tr[5][1].push("<b>Sündür</b> (Düzenle grubu): planda sündürülecek bölgenin iki köşesine tıkla; bölgenin içinde kalan çizgi uçları, çoklu çizgi ve alan köşeleri, ölçü noktaları seçilir. Sonra taban ve hedef noktasına tıkla: yalnızca bu noktalar kayar, nesnelerin geri kalanı yerinde kalır. Örneğin bir yolu ya da parseli tek yönde uzatırsın. Merkezi ya da taban noktası bölgede kalan daire, katı ve bloklar tümüyle taşınır.","<b>Uzat</b> artık yaylarda da çalışır: yaya ucunun yakınından tıklayınca yay kendi çemberi üzerinde en yakın çizgiye ya da yaya kadar uzar. <b>Kırp</b> daire ve yaylarda zaten çalışıyor.");GUIDE.en[5][1].push("<b>Stretch</b> (Edit group): click two corners of the area to stretch in plan; the line ends, polyline and area corners and dimension points inside it are picked. Then click the base and target points: only those points move, the rest stays. Circles, solids and blocks whose centre or base point is inside are moved whole.","<b>Extend</b> now works on arcs too: click near the end of an arc and it extends along its circle to the nearest line or arc.");GUIDE.tr.find(q=>/Pafta/.test(q[0]))[1].push("<b>Kuzey oku ve ölçek çubuğu</b>: pafta penceresinde açıp kapatılır. Kuzey oku plan görünüşünde sağ üstte durur ve Güneş/gölge aracındaki <b>Kuzey yönü</b>ne göre döner. Ölçek çubuğu sol altta, paftanın ölçeğine göre metre bölmeleriyle çizilir; pafta küçültülüp büyütülse de doğru kalır.");GUIDE.en.find(q=>/Sheet/.test(q[0]))[1].push("<b>North arrow and scale bar</b>: switch them on or off in the sheet window. The north arrow sits top right in plan view and turns with the <b>North direction</b> set in the Sun/shadow tool. The scale bar sits bottom left in metres for the sheet scale and stays right when the print is resized.");GUIDE.tr.find(q=>/Pafta/.test(q[0]))[1].push("<b>Malzeme paftada</b>: malzeme verdiğin katılar ve dolu taramalar paftada da dokusuyla (çim, tuğla, ahşap…) basılır; doku gerçek boyutunda ölçeğe uyar. Siyah-beyaz baskıda doku basılmaz.");GUIDE.en.find(q=>/Sheet/.test(q[0]))[1].push("<b>Materials on the sheet</b>: solids and solid hatches with a material print with their texture (grass, brick, wood…) at true size to scale. Black-and-white printing leaves textures out.");GUIDE.tr.find(q=>/Pafta/.test(q[0]))[1].push("<b>3B dosya olarak kaydetme</b>: <b>Dışa aktar</b>’da <b>GLB</b> (glTF: Blender, web görüntüleyiciler, render programları; renkler malzeme olarak), <b>OBJ</b> (Blender, 3ds Max, Rhino gibi programlar; renkli) ve <b>STL</b> (3B yazıcı; milimetre, renksiz) var. <b>STEP</b> ise katıları kesin geometriyle (gerçek düzlem, silindir, yuvarlatma; milimetre) yazar; SolidWorks, SpaceClaim, FreeCAD, Fusion gibi programlarda katı olarak açılır ve düzenlenebilir. Paftadaki görünüşler ve kesitler de kesin katıdan çıkar: daire gerçek daire olarak basılır, gizli kenarlar ayıklanır. Yalnızca 3B katılar yazılır; çizgiler ve yazılar bu biçimlere girmez. GLB ve OBJ metre biriminde ve “Y yukarı” düzenindedir.");GUIDE.tr.find(q=>/Pafta/.test(q[0]))[1].push("<b>Yayda kır, köşede pah</b>: <b>Kır</b> yay ve dairelerde de çalışır: iki nokta arasındaki kısım (saat yönünün tersine) silinir; dairede kalan kısım yay olur. <b>Pah kır</b> çoklu çizgide tek tıkla çalışır: köşeye yakın tıkla, o köşe yazılan mesafede kesilir.");GUIDE.tr.find(q=>/Pafta/.test(q[0]))[1].push("<b>Hızlı seçim</b> (Seç grubunda): türe (örneğin “Ağaç (blok)”, çizgi, ölçü), katmana, renge ya da malzemeye göre toplu seç; kaç nesnenin seçileceği önceden yazar. Tüm çizimde, şu anki seçimin içinde ya da seçime ekleyerek çalışır. Bir nesne seçiliyken Özellikler’deki <b>Benzerlerini seç</b> aynı türdeki (aynı bloktaki, aynı tür adındaki) bütün nesneleri seçer.");GUIDE.tr.find(q=>/Pafta/.test(q[0]))[1].push("<b>3B ölçü</b> (Ölçü grubunda): katının iki köşesini (ya da herhangi iki 3B noktayı) tıkla, sonra ölçünün duracağı yeri tıkla ya da uzaklığı yaz. Ölçü bu üç noktanın oluşturduğu düzlemde çizilir: yükseklik ölçüsü için alttaki ve üstteki köşeyi seçip yana tıkla. Bu ölçüler nesneye bağlıdır ve <b>paftada</b> düzlemlerine bakan görünüşte basılır: önden görülen yükseklik ölçüsü ön görünüşte, yatay olanlar planda çıkar.");GUIDE.tr.find(q=>/Pafta/.test(q[0]))[1].push("<b>Bağlı ölçü</b>: ölçüyü çizgi ucuna, köşeye, daire merkezine ya da noktaya yakalayarak (F3) koyarsan ölçü o nesneye bağlanır; nesneyi uzatınca, taşıyınca, tutamaçla çekince ya da Özellikler’den değiştirince ölçü kendiliğinden güncellenir. Yarıçap ve çap ölçüleri de daireyi izler. Bağı koparmak için ölçüyü seçip Özellikler’deki <b>Bağı kopar</b>’a bas.");GUIDE.tr.find(q=>/Pafta/.test(q[0]))[1].push("<b>Oklu not</b> (Ölçü grubunda): önce okun ucunu (göstermek istediğin yeri), sonra notun yerini tıkla (istersen bir kırılma noktası daha), Enter; açılan kutuya notu yaz (Shift+Enter ile alt satır). Ok, çizgi, kısa yatay çıkış ve yazı tek nesnedir; taşınır, Özellikler’den yazısı ve boyu değişir, paftaya ve DXF’e geçer.");GUIDE.tr.find(q=>/Pafta/.test(q[0]))[1].push("<b>Güneş ve gölge</b> (Katı grubunda ☀): tarihi, saati ve yeri (enlem/boylam; İstanbul hazır) seç; gölgeler gerçek güneş açısıyla düşer. Saat çubuğunu kaydırarak gün boyu gölgeyi izle; 21 Mart, 21 Haziran, 21 Aralık düğmeleri ekinoks ve gündönümlerini açar. Çizimde kuzey yukarı (Y yönü) değilse <b>Kuzey yönü</b>nü ayarla. Açıkken gölgeler her kalitede gösterilir; kapatınca eski ışığa döner. Resim (PNG) ile gölgeli görünüşü kaydedebilirsin.");GUIDE.tr.find(q=>/Pafta/.test(q[0]))[1].push("<b>Kübaj (kazı – dolgu)</b> (Katı grubunda), Netcad’deki gibi arazi durumu ile proje durumu karşılaştırılır: <b>1)</b> Mevcut zemini <b>Arazi</b> aracıyla eş yükselti eğrileri ve kot noktalarından oluştur. <b>2)</b> Proje için ya bir <b>sabit tesviye kotu</b> kullan ya da proje eğrilerinden ikinci bir arazi yüzeyi oluştur. <b>3)</b> İstersen hesap alanını kapalı bir çoklu çizgiyle sınırla. <b>4)</b> Yüzeyleri (ve sınırı) seç, <b>Kübaj</b>’a bas: mevcut zemini, projeyi ve hücre boyunu seçip <b>Hesapla</b>. Sonuç: yarma ve dolgu hacmi (m³), net fark, yarma/dolgu alanları, ortalama kot. <b>Kopyala</b> ya da <b>Excel’e aktar</b> ile hakediş/keşif dosyana alabilirsin. Hücre küçüldükçe sonuç hassaslaşır. <b>Enkesit yöntemi</b>: yüzeylerle birlikte açık bir eksen çizgisi (yol, kanal ekseni) seçersen Yöntem’de <b>Enkesit</b> çıkar; aralığı (örn. 20 m) ve eksenden genişliği yaz: her kesitte yarma/dolgu alanı, iki kesit arası hacim (ortalama alanlar) ve kümülatif toplamlar listelenir. <b>Çizime ekle</b>: ızgara yönteminde yarma alanlarını kırmızı, dolgu alanlarını mavi gösteren bir harita; enkesit yönteminde her kesitin zemin (kahverengi) ve proje (kırmızı) çizgisi, km’si ve alanlarıyla çizimin sağına dizilmiş enkesitleri ekler; paftaya basabilirsin.");GUIDE.tr.find(q=>/Pafta/.test(q[0]))[1].push("<b>Arazi</b> (Katı grubunda): eş yükselti eğrilerini (çizgi, çoklu çizgi, yay) ve kot noktalarını seç, <b>Arazi</b>’ye bas, Enter. Bunlardan geçen eğimli bir zemin yüzeyi çimle kaplı olarak oluşur; malzemesini değiştirebilir, kesit alabilir, üzerine ağaç dizebilirsin. Bir eğrinin yüksekliğini vermek için onu seçip Özellikler’deki <b>Kot</b>’a yaz. DWG/DXF’ten gelen kotlu eğriler doğrudan kullanılır.");GUIDE.tr.find(q=>/Pafta/.test(q[0]))[1].push("<b>Kot etiketi</b> (Peyzaj grubunda): bir yeri tıkla; altındaki arazi ya da yüzeyden kotu okur ve metre cinsinden, iki ondalıkla yazar (+12.45, ±0.00, −1.20). Küçük pencereden etiket türünü seç: <b>Mevcut</b> (×), <b>Proje</b> (daire içinde +) ya da <b>İkisi</b> (üstte proje, altta parantez içinde mevcut). Proje kotunu pencereye yazarsan sonraki tıklamalarda o kullanılır; boş bırakırsan mevcutla aynı başlar. Özellikler’de iki kotu değiştirebilir, kot farkını (dolgu/yarma) görebilirsin. “Kotu zeminden oku” açıkken etiketi taşıyınca kot yeniden okunur; “Zeminden yeniden oku” seçili etiketlerin hepsini günceller. Kot etiketleri metraja girmez.");GUIDE.tr.find(q=>/Pafta/.test(q[0]))[1].push("<b>Eğim oku</b> (Peyzaj grubunda): eğimin başladığı ve bittiği noktaları tıkla. Uçların kotu, orada bir kot etiketi varsa ondan (proje kotu öncelikli), yoksa altındaki arazi ya da yüzeyden okunur. Eğim = kot farkı ÷ plandaki uzunluk × 100; ok her zaman suyun aktığı alçak tarafa bakar. Yazı yüzde (%2.5), oran (1:40) ya da ikisi olabilir. Özellikler’de uç kotlarını elle değiştirebilir, eğimi, oranı, uzunluğu ve kot farkını görebilirsin. Uçtaki kot etiketinin proje kotunu değiştirirsen ok kendiliğinden güncellenir. Eğim okları metraja girmez.");GUIDE.tr.find(q=>/Pafta/.test(q[0]))[1].push("<b>Eğim haritası</b> (Peyzaj grubunda): arazi yüzeyini seç, Enter. Pencerede her eğim aralığının plan alanı ve payı, ortalama eğim görünür. Aralık sınırlarını değiştirebilirsin (varsayılan 2, 5, 10, 20 %). <b>Çizime ekle</b> ile ayrı bir “Eğim analizi” katmanına renkli eğim haritası (yeşil düz → kırmızı dik), suyun aktığı yöne bakan akış okları ve lejant eklenir; hangisini istediğini kutulardan seç. Her üçgenin eğimi kendi düzleminden kesin hesaplanır. Yeniden eklersen aynı yüzeyin önceki haritası silinip yenisi konur; katmanı kapatıp açarak gösterip gizleyebilirsin. Paftaya da basılır.");GUIDE.tr.find(q=>/Dosyalar/.test(q[0]))[1].push("<b>3B model içe aktar</b> (Ekle sekmesi, ya da <b>Aç</b> ile .step/.stp/.stl/.obj seç, ya da dosyayı ekrana sürükle): model mevcut çizime, dosya adını taşıyan yeni bir katmana eklenir. Pencerede dosyanın birimini (STL/OBJ; STEP kendi birimini taşır) ve yukarı yönü (Z ya da Y) seç; boyutlar hemen görünür. STEP katıları kesin katı olarak gelir (yuvarlatma, it/çek, birleştir, hacim). STL/OBJ üçgen ağıdır; OBJ’deki her nesne ayrı parça olur.");GUIDE.en.find(q=>/Files/.test(q[0]))[1].push("<b>Import 3D model</b> (Insert tab, or pick a .step/.stp/.stl/.obj in <b>Open</b>, or drag the file onto the view): the model is added to the current drawing on a new layer named after the file. In the window choose the file units (STL/OBJ; STEP carries its own) and the up direction (Z or Y); the size shows straight away. STEP solids arrive as exact solids (fillet, push/pull, union, volume). STL/OBJ are triangle meshes; each object in an OBJ becomes its own part.");GUIDE.tr.find(q=>/Pafta/.test(q[0]))[1].push("<b>Tesviye yüzeyi</b> (Peyzaj grubunda): tesviye edilecek alanın kapalı sınırına (çoklu çizgi, dikdörtgen, daire) ya da içine tıkla. Pencerede <b>tesviye kotunu</b> (alanın ortasındaki kot), istersen <b>eğimi (%)</b> ve <b>iniş yönünü</b> (0° sağa, 90° yukarı) yaz. Altında arazi yüzeyi varsa alan, mevcut zemin ortalama kotu, <b>yarma</b>, <b>dolgu</b>, en derin yarma / en yüksek dolgu ve <b>net</b> hacim hemen görünür. <b>Dengele</b>, eğimi koruyup yarma ile dolguyu eşitleyen kotu bulur. Yönü derece yazmak yerine <b>İniş yönünü ekranda göster</b>’e basıp önce yüksek, sonra alçak noktaya tıklayabilirsin (eğim boşsa %2 konur). <b>Köşelere kot etiketi koy</b> işaretliyse her köşeye mevcut ve proje kotunu gösteren kot etiketi eklenir; yüzey değişince etiketler de güncellenir. <b>Çizime ekle</b> yüzeyi “Tesviye” katmanına koyar; <b>Yarma/dolgu haritası</b> ayrıca kırmızı (yarma) ve mavi (dolgu) haritayı ekler. Sonradan düzeltmek için yüzeyi seçip Özellikler’den kotu/eğimi/yönü değiştir ya da araçla yüzeye tıkla. Yüzey sınır çizgisine bağlıdır: çizginin köşelerini taşıyınca yüzey de değişir, düzlem yerinde kalır. Metrajda plan alanı ile yarma ve dolgu (m³) ayrı satırlarda yazar. Kübaj aracında da proje yüzeyi olarak seçilebilir.");GUIDE.tr.find(q=>/Pafta/.test(q[0]))[1].push("<b>Şev</b> (Peyzaj grubunda): önce şevin üst (tepe) kenarını, sonra alt (topuk) kenarını tıkla; ikisi çizgi, çoklu çizgi, yay ya da eğri olabilir. Üst kenardan alt kenarın en yakın noktasına uzun çizgiler, aralarına kısa çizgiler çizilir; ortaya eğim (1:n = yatay genişlik ÷ yükseklik farkı) yazılır. Küçük pencereden çizgi aralığını (varsayılan 1 m) ve kısa çizgi boyunu (%40) seç. Kenarların kotu çizgilerin kendi kotundan alınır; düz çizdiysen Özellikler’de yükseklik farkını yaz. Şev kenar çizgilerine bağlıdır: çizgileri taşır, uzatır ya da köşelerini değiştirirsen tarama ve eğim kendiliğinden güncellenir; çizgiler silinirse şev son hâliyle kalır. Özellikler’de ortalama genişlik, plan alanı ve şev yüzey alanı görünür; metrajda şev, eğik yüzey alanıyla (çimlendirme, kaplama için) sayılır.");GUIDE.tr.find(q=>/Pafta/.test(q[0]))[1].push("<b>Sunum resmi</b>: görünüşü istediğin açıya getir, <b>Dışa aktar › Resim (PNG)</b>’ye bas, boyutu (ekranın 2–6 katı) seç; istersen beyaz arka plan ve ızgara. İmleç ve seçim resme girmez.");GUIDE.tr.find(q=>/Pafta/.test(q[0]))[1].push("<b>Yol boyunca çoğalt</b> (Düzenle grubunda): bir ağaç ya da aydınlatma seç, aracı aç, sonra çizgi, yay ya da çoklu çizgiyi tıkla. Açılan pencerede <b>aralık</b> (örneğin 5 m’de bir) ya da <b>adet</b> (baştan sona eşit) seç; bank gibi yönlü nesneler için <b>Yolun yönüne çevir</b>i işaretle. Kopyalar yolun başından başlar.");GUIDE.tr.find(q=>/Pafta/.test(q[0]))[1].push("<b>Bitki listesi</b>: pafta penceresinde <b>Bitki listesi: Var</b> seçince paftanın sağına tablo eklenir: her tür ve boy için sıra no, tür adı (yazdıysan Latince adıyla), adet, taç çapı ve boy; altta toplam adet. Hazır ağaç, çam, servi, palmiye, söğüt, çalı ile tür adı verilmiş bütün bloklar sayılır.");GUIDE.tr.find(q=>/Pafta/.test(q[0]))[1].push("<b>Keşif cetveli (Excel)</b>: Metraj penceresinde her satıra poz no, iş kalemi tanımı, birim ve birim fiyatı yaz; altta toplam, KDV (oranı değiştirilebilir) ve genel toplam görünür. <b>Keşif cetveli (Excel)</b> düğmesi gerçek bir Excel dosyası verir: <b>Keşif</b> sayfası birim fiyat cetveli düzenindedir (sıra no, poz no, tanım, birim, miktar, birim fiyat, tutar; KDV hariç toplam, KDV, genel toplam); aynı poz, birim ve fiyattaki satırlar birleşir, tutarlar Excel formülüyle hesaplanır. <b>Metraj</b> sayfası her miktarın hangi katman ve nesneden geldiğini gösterir. Miktarlar 3, tutarlar 2 ondalığa yuvarlanır.", "<b>Metrajdan keşif</b>: Metraj tablosunda her satıra <b>poz no</b>, <b>birim</b> (adet, m, m², m³) ve <b>birim fiyat</b> yaz; miktar o birime göre alınır, <b>tutar</b>, katman ara toplamları ve genel toplam kendiliğinden hesaplanır. Fiyatlar çizimle kaydedilir, <b>Excel’e aktar</b> hepsini dışarı verir.");GUIDE.tr.find(q=>/Pafta/.test(q[0]))[1].push("<b>SketchUp’a aktarma</b>: üst çubuktaki <b>Dışa aktar</b>’a bas, <b>DAE (SketchUp)</b>’yu seç. SketchUp’ta <b>Dosya › İçe aktar</b> ile .dae dosyasını aç: katılar yüz, çizgiler kenar, renkler malzeme, ağaç gibi bloklar bileşen olarak gelir. Dokular düz renk olarak gelir.");GUIDE.tr.find(q=>/Pafta/.test(q[0]))[1].push("<b>Pencereler</b>: pafta penceresinde <b>iki</b> (yan yana ya da alt alta) veya <b>dört</b> pencere seçebilirsin. Her pencereye ayrı görünüş (plan, ön, yan, kesit…) ve ayrı ölçek ver; her pencerenin üstünde adı ve ölçeği yazar. Ölçekler farklıysa antette “Çeşitli” yazar.");GUIDE.tr.find(q=>/Pafta/.test(q[0]))[1].push("<b>Düzenle grubunda yeni</b>: <b>Pah kır</b> (mesafeyi yaz, iki çizgiyi tıkla, köşe kesilir), <b>Çizgileri birleştir</b> (uç uca değen çizgileri seç, Enter: tek çoklu çizgi olur), <b>Kır</b> (çizgide iki nokta tıkla, arası silinir; tek noktadan sonra Enter ikiye ayırır), <b>Özellik kopyala</b> (önce kaynak nesneyi, sonra hedefleri tıkla: katman, renk, çizgi tipi/kalınlığı ve malzeme aktarılır).");GUIDE.tr.find(q=>/Pafta/.test(q[0]))[1].push("<b>Malzeme</b>: bir katıyı ya da taramayı seç, Özellikler’deki <b>Malzeme</b>’den çim, kilit taşı, arnavut kaldırımı, karo, mermer, granit, asfalt, kum, ahşap, ahşap deck, beton, beton plak, su, toprak, malç, kauçuk zemin, tuğla, doğal taş duvar, kiremit ya da çakıl seç. Dokuların hepsi programın içinde çizilir; telif sorunu yoktur. Doku gerçek boyutunda döşenir (örneğin kilit taşları 20 cm). Taramaya malzeme verince dolu taramaya dönüşür; çim alanı, yol, havuz için kullan. Paftada ve DXF’te renk olarak kalır.");GUIDE.tr.find(q=>/Pafta/.test(q[0]))[1].push("<b>Yardımcı çizgi</b> (Seç grubunda, şerit metre gibi): iki nokta tıkla, sonsuz uzun kesikli bir kılavuz çizilir. Önce bir çizgi seçip aracı açarsan ona paralel çizer: fareyle uzaklığı ayarla ve tıkla ya da uzaklığı yaz. Yardımcı çizgiler ayrı katmandadır, yakalama noktası verir ama paftaya, DXF’e ve metraja girmez. Hepsini silmek için ipucu kutusundaki <b>Hepsini sil</b>’e bas ya da komut satırına <kbd>yardimsil</kbd> yaz.");GUIDE.tr.find(q=>/Pafta/.test(q[0]))[1].push("<b>İt/Çek</b>: birleştir, çıkar, kabuk ya da eğme ile oluşan serbest katılarda Katı grubundaki <b>İt/Çek</b>’e bas, düz bir yüze tıkla, sonra fareyi oynat: yüz fareyi izler, uygun yerde tıkla. İstersen mesafeyi yazıp Enter’a bas (artı dışarı, eksi içeri).");GUIDE.tr.find(q=>/Pafta/.test(q[0]))[1].push("<b>Kabuk</b>: kutu, silindir ya da yükseltilmiş şekli seç, Katı grubundaki Kabuk’a bas, et kalınlığını yazıp Enter’a bas. İçi boşalır, duvarlar ve taban o kalınlıkta kalır, üstü açık olur (saksı, havuz, çiçeklik).");GUIDE.tr.find(q=>/Pafta/.test(q[0]))[1].push("<b>Eğme</b>: Döndür’e basınca çıkan kutuda <b>X</b> (öne eğ) ya da <b>Y</b> (yana yatır) eksenini seç, dönme noktasını tıkla, açıyı yazıp Enter’a bas. Eğilen kutu, silindir ve koniler serbest katıya, daire ve yaylar çoklu çizgiye dönüşür; bloklar parçalarına ayrılır.","<b>Kesit</b> açıkken kesilen katıların yüzü ekranda da dolu ve eğik taralı görünür.");GUIDE.tr.find(q=>/Pafta/.test(q[0]))[1].push("<b>Çizim sırası</b>: üst üste binen nesnelerde hangisinin üstte görüneceğini sen seçersin. Nesneleri seçip Düzenle grubundaki <b>Öne getir</b> ya da <b>Arkaya gönder</b> düğmesine bas (sağdaki özellikler bölümünde de var). Bütün bir katman için katmanın kalem düğmesindeki <b>Katmanı öne getir / arkaya gönder</b>i kullan. Dolu tarama öne gelince altındaki çizgileri örter. Sıra kaydedilir, DXF ve paftaya da aynen geçer.");GUIDE.tr.find(q=>/Pafta/.test(q[0]))[1].push("<b>Görünüş</b>: paftaya üst görünüş (plan) yerine <b>ön, arka, sağ ya da sol yan görünüş</b> basabilirsin. <b>Üç görünüş</b> ön görünüşü sol üste, yan görünüşü sağına, planı altına aynı ölçekte ve hizalı yerleştirir; her birinin adı üstünde yazar. Çizimde bir <b>kesit</b> açıksa listede <b>Kesit</b> de çıkar: kesilen yerler kalın çizgi ve eğik tarama ile, arkada görünen kısımlar ince çizgiyle basılır. Görünüşlerde yazı, ölçü ve taramalar gösterilmez. <b>Gizli çizgiler</b> seçeneği <b>Kaldır</b> iken katıların arkasında kalan çizgiler çizilmez (planda da katıların altında kalan kenarlar gizlenir); hepsini görmek için <b>Göster</b>i seç.");GUIDE.en.find(q=>/Sheet/.test(q[0]))[1].push("<b>Saving 3D files</b>: <b>Export</b> offers <b>GLB</b> (glTF: Blender, web viewers, renderers; colours as materials), <b>OBJ</b> (Blender, 3ds Max, Rhino and others; coloured) and <b>STL</b> (3D printing; millimetres, no colour). <b>STEP</b> writes solids with exact geometry (true planes, cylinders, rounds; millimetres); they open as editable solids in SolidWorks, SpaceClaim, FreeCAD, Fusion and others. Sheet views and sections are also made from the exact solids: a circle prints as a true circle and hidden edges are removed. Only 3D solids are written; lines and texts are not part of these formats. GLB and OBJ are in metres with Y up.");GUIDE.en.find(q=>/Sheet/.test(q[0]))[1].push("<b>Break arcs, chamfer corners</b>: <b>Break</b> also works on arcs and circles: the part between two points (counter-clockwise) is removed; a circle becomes an arc. <b>Chamfer</b> on a polyline takes one click: click near a corner and it is cut at the given distance.");GUIDE.en.find(q=>/Sheet/.test(q[0]))[1].push("<b>Quick select</b> (Select group): select in bulk by kind (e.g. “Tree (block)”, line, dimension), layer, colour or material; the count is shown first. Works on the whole drawing, within the current selection or adding to it. With an object selected, <b>Select similar</b> in Properties picks every object of the same kind (same block, same species).");GUIDE.en.find(q=>/Sheet/.test(q[0]))[1].push("<b>3D dimension</b> (Dimension group): click two corners of a solid (or any two 3D points), then click where the dimension goes or type the distance. It is drawn in the plane through the three points: for a height pick the bottom and top corner and click to the side. These dimensions are linked to objects and <b>print on the sheet</b> in the view facing their plane: a height seen from the front appears in the front view, horizontal ones in the plan.");GUIDE.en.find(q=>/Sheet/.test(q[0]))[1].push("<b>Linked dimensions</b>: place a dimension on a line end, corner, circle centre or point with object snap (F3) and it is linked to that object; stretch, move, grip-drag or edit the object in Properties and the dimension updates itself. Radius and diameter dimensions follow their circle too. To unlink, select the dimension and press <b>Unlink</b> in Properties.");GUIDE.en.find(q=>/Sheet/.test(q[0]))[1].push("<b>Leader note</b> (Dimension group): click the arrow tip (the place to point at), then where the note goes (optionally one more bend), Enter; type the note in the box (Shift+Enter for a new line). Arrow, line, short landing and text are one object; move it, change text and size in Properties; it prints and goes to DXF.");GUIDE.en.find(q=>/Sheet/.test(q[0]))[1].push("<b>Sun and shadow</b> (Solid group ☀): choose date, time and place (latitude/longitude; Istanbul preset); shadows fall at the real sun angle. Slide the time to follow the day; the 21 March, 21 June and 21 December buttons give equinox and solstices. If north is not up (Y) in your drawing, set <b>North direction</b>. While open, shadows show in every quality; closing restores the normal light. Save the shaded view with Picture (PNG).");GUIDE.en.find(q=>/Sheet/.test(q[0]))[1].push("<b>Cut & fill</b> (Solid group) compares existing ground with the design: <b>1)</b> make the existing ground with <b>Terrain</b> from contours and spot heights. <b>2)</b> For the design use a <b>fixed grading level</b> or make a second terrain from design contours. <b>3)</b> Optionally limit the area with a closed polyline. <b>4)</b> Select the surfaces (and boundary), press <b>Cut & fill</b>, choose existing ground, design and cell size, then <b>Calculate</b>. You get cut and fill volumes (m³), net difference, cut/fill areas and mean level; <b>Copy</b> or <b>Export to Excel</b>. Smaller cells give more precise results. <b>Cross sections</b>: select an open axis line (road or channel centre line) with the surfaces and <b>Cross sections</b> appears under Method; enter the interval (e.g. 20 m) and width each side: each section lists cut/fill areas, the volume between sections (average end area) and running totals. <b>Add to drawing</b>: with the grid method a map of cut in red and fill in blue; with cross sections every section drawn to the right of the drawing with ground (brown) and design (red) lines, chainage and areas, ready to print.");GUIDE.en.find(q=>/Sheet/.test(q[0]))[1].push("<b>Terrain</b> (Solid group): select contour lines (lines, polylines, arcs) and spot heights, press <b>Terrain</b>, Enter. A sloping ground surface through them is made, covered in grass; change its material, cut sections or place trees on it. To give a curve its height, select it and type it in <b>Elevation</b> in Properties. Contours from DWG/DXF with elevations work directly.");GUIDE.en.find(q=>/Sheet/.test(q[0]))[1].push("<b>Spot elevation</b> (Landscape group): click a spot; the level is read from the terrain or surface below and written in metres with two decimals (+12.45, ±0.00, −1.20). In the small window pick the label: <b>Existing</b> (×), <b>Design</b> (circled +) or <b>Both</b> (design on top, existing below in brackets). A design level typed in the window is used for the next clicks; left empty it starts equal to the existing level. In Properties change both levels and see the difference (fill/cut). With “Read level from the ground” on, moving the label reads the level again; “Read from ground again” updates all selected labels. Spot elevations are not counted in the take-off.");GUIDE.en.find(q=>/Sheet/.test(q[0]))[1].push("<b>Slope arrow</b> (Landscape group): click where the slope starts and ends. Each end takes its level from a spot elevation there (design level first), otherwise from the terrain or surface below. Slope = level difference ÷ plan length × 100; the arrow always points downhill, the way water runs. The text can be a percentage (2.5%), a ratio (1:40) or both. In Properties change the end levels by hand and see the slope, ratio, length and level difference. Changing the design level of a spot at an end updates the arrow by itself. Slope arrows are not counted in the take-off.");GUIDE.en.find(q=>/Sheet/.test(q[0]))[1].push("<b>Slope map</b> (Landscape group): select the terrain surface, Enter. The window shows the plan area and share of every slope band and the mean slope. You can change the band limits (default 2, 5, 10, 20 %). <b>Add to drawing</b> puts a coloured slope map (green flat → red steep), flow arrows pointing the way water runs and a legend on a separate “Slope analysis” layer; tick which you want. Each triangle’s slope comes exactly from its own plane. Adding again replaces the earlier map of the same surface; switch the layer off and on to hide or show it. It prints on sheets too.");GUIDE.en.find(q=>/Sheet/.test(q[0]))[1].push("<b>Grading surface</b> (Landscape group): click the closed outline of the area to grade (polyline, rectangle, circle) or inside it. In the window type the <b>design level</b> (level at the middle of the area) and, if you like, a <b>slope (%)</b> and the <b>downhill direction</b> (0° right, 90° up). With terrain underneath you see the area, existing average level, <b>cut</b>, <b>fill</b>, deepest cut / highest fill and the <b>net</b> volume straight away. <b>Balance</b> keeps the slope and finds the level where cut equals fill. Instead of typing degrees, press <b>Show the downhill direction on screen</b> and click the high point, then the low point (an empty slope becomes 2%). With <b>Put level labels at the corners</b> ticked, each corner gets a level label with existing and design levels; they update when the surface changes. <b>Add to drawing</b> puts the surface on the “Grading” layer; <b>Cut/fill map</b> also adds the red (cut) and blue (fill) map. To change it later select the surface and edit level/slope/direction in Properties, or click it with the tool. The surface is linked to its outline: move the line’s corners and the surface follows, the plane stays in place. The take-off lists the plan area and the cut and fill (m³) on separate rows. It can also be picked as the design surface in Cut & fill.");GUIDE.en.find(q=>/Sheet/.test(q[0]))[1].push("<b>Embankment</b> (Landscape group): click the top edge of the slope, then its bottom (toe) edge; each can be a line, polyline, arc or spline. Long lines run from the top edge to the nearest point of the toe with short lines between; the gradient (1:n = horizontal width ÷ height difference) is written in the middle. In the small window choose the line spacing (default 1 m) and the short line length (40%). Edge levels come from the lines themselves; if they were drawn flat, type the height difference in Properties. The embankment is tied to its edge lines: move, extend or reshape them and the hatching and gradient update by themselves; if the lines are deleted the embankment keeps its last shape. Properties show the mean width, plan area and slope surface area; the take-off counts the embankment by its sloping surface area (for grassing or cladding).");GUIDE.en.find(q=>/Sheet/.test(q[0]))[1].push("<b>Presentation picture</b>: set up the view, press <b>Export › Picture (PNG)</b> and choose the size (2–6 times the screen); optionally a white background and the grid. Cursor and selection are left out.");GUIDE.en.find(q=>/Sheet/.test(q[0]))[1].push("<b>Path array</b> (Edit group): select a tree or light, open the tool, then click a line, arc or polyline. In the dialog choose a <b>distance</b> (e.g. every 5 m) or a <b>count</b> (even, end to end); tick <b>Turn with the path</b> for objects with a front such as benches. Copies start at the beginning of the path.");GUIDE.en.find(q=>/Sheet/.test(q[0]))[1].push("<b>Plant schedule</b>: set <b>Plant schedule: On</b> in the sheet dialog to add a table on the right: per species and size the number, name (with the species you typed), count, crown width and height, plus the total. Ready-made trees, conifers, cypresses, palms, willows, shrubs and any block with a species name are counted.");GUIDE.en.find(q=>/Sheet/.test(q[0]))[1].push("<b>Cost estimate</b>: in the take-off table enter an <b>item no.</b>, a <b>unit</b> (pcs, m, m², m³) and a <b>unit price</b> per row; the quantity follows that unit and the <b>amount</b>, layer subtotals and grand total are worked out. Prices are saved with the drawing; <b>Export to Excel</b> includes them.");GUIDE.en.find(q=>/Sheet/.test(q[0]))[1].push("<b>Export to SketchUp</b>: press <b>Export</b> in the top bar and choose <b>DAE (SketchUp)</b>. In SketchUp use <b>File › Import</b> to open the .dae: solids come in as faces, lines as edges, colours as materials, blocks such as trees as components. Textures come in as plain colours.");GUIDE.en.find(q=>/Sheet/.test(q[0]))[1].push("<b>Windows</b>: in the sheet dialog choose <b>two</b> (side by side or stacked) or <b>four</b> windows. Give each its own view (plan, front, side, section…) and scale; each shows its name and scale on top. With different scales the title block says “Various”.");GUIDE.en.find(q=>/Sheet/.test(q[0]))[1].push("<b>New in Edit</b>: <b>Chamfer</b> (type the distance, click two lines, the corner is cut), <b>Join lines</b> (select lines touching end to end, Enter: one polyline), <b>Break</b> (click two points on a line, the part between goes; Enter after one point splits it), <b>Match properties</b> (click the source, then the targets: layer, colour, line type/weight and material are copied).");GUIDE.en.find(q=>/Sheet/.test(q[0]))[1].push("<b>Material</b>: select a solid or hatch and pick grass, pavers, cobblestone, tile, marble, granite, asphalt, sand, wood, decking, concrete, slab, water, soil, mulch, rubber surface, brick, stone wall, roof tile or gravel under <b>Material</b> in Properties. All textures are drawn by the program itself, so there are no copyright issues. Textures are laid at real size (pavers are 20 cm). A hatch with a material becomes a solid fill; use it for lawns, paths and pools. Sheets and DXF keep the colour.");GUIDE.en.find(q=>/Sheet/.test(q[0]))[1].push("<b>Guide line</b> (Select group, like a tape measure): click two points to draw an endless dashed guide. Select a line first to draw parallel to it: set the distance with the mouse and click, or type it. Guides live on their own layer and snap, but are left out of sheets, DXF and take-off. Clear them all with <b>Clear all</b> in the tip box or type <kbd>guideclear</kbd>.");GUIDE.en.find(q=>/Sheet/.test(q[0]))[1].push("<b>Push/Pull</b>: on free-form solids made by union, subtract, shell or tilt, press <b>Push/Pull</b> in the Solid group, click a flat face, then move the mouse: the face follows it, click where you want. Or type the distance and press Enter (plus out, minus in).");GUIDE.en.find(q=>/Sheet/.test(q[0]))[1].push("<b>Shell</b>: select a box, cylinder or extruded shape, press Shell in the Solid group, type the wall thickness and press Enter. It is hollowed out with walls and floor of that thickness and an open top (planter, pool).");GUIDE.en.find(q=>/Sheet/.test(q[0]))[1].push("<b>Tilt</b>: in the box shown by Rotate choose the <b>X</b> (tip forward) or <b>Y</b> (tip sideways) axis, click the pivot, type the angle and press Enter. Tilted boxes, cylinders and cones become free-form solids, circles and arcs become polylines; blocks are taken apart.","With a <b>section</b> on, cut solids show a filled, diagonally hatched face on screen too.");GUIDE.en.find(q=>/Sheet/.test(q[0]))[1].push("<b>Draw order</b>: choose which overlapping object shows on top. Select objects and press <b>Bring to front</b> or <b>Send to back</b> in the Edit group (also in the properties panel). For a whole layer use <b>Bring layer to front / Send layer to back</b> in the layer's pencil button. A solid hatch in front covers the lines under it. The order is saved and carried to DXF and the sheet.");GUIDE.en.find(q=>/Sheet/.test(q[0]))[1].push("<b>View</b>: print the <b>front, back, right or left side view</b> instead of the plan. <b>Three views</b> puts the front view top-left, the side view to its right and the plan below, at one scale and aligned, each with its name. When a <b>section</b> is on, the list also offers <b>Section</b>: cut faces print with a thick outline and diagonal hatch, what lies beyond in thin lines. Elevations leave out texts, dimensions and hatches. With <b>Hidden lines: Remove</b>, lines behind solids are not drawn (in the plan too, edges under solids are hidden); choose <b>Show</b> to draw every edge.");GUIDE.tr[7][0]='8 · Tarama, alan ve hazır nesneler';GUIDE.en[7][0]='8 · Hatch, area and ready-made objects';GUIDE.en[11][0]='12 · Common snags';

      else if(cur.snap===6)st(()=>{c.moveTo(x,y-q-2);c.lineTo(x+q+2,y);c.lineTo(x,y+q+2);c.lineTo(x-q-2,y);c.closePath();});
      else if(cur.snap===7)st(()=>{c.moveTo(x-q,y-q);c.lineTo(x+q,y-q);c.lineTo(x-q,y+q);c.lineTo(x+q,y+q);c.closePath();});
      else if(cur.snap===8)st(()=>{c.moveTo(x-q,y);c.lineTo(x+q,y);c.moveTo(x,y-q);c.lineTo(x,y+q);});
      else if(cur.snap===9&&TRK){const A={x:0,y:0},B={x:0,y:0},Lg=wpp()*4000,col=TRKC[TRK.ax];if(toScr(TRK.a[0],TRK.a[1],TRK.a[2]||0,A)&&toScr(TRK.a[0]+TRK.d[0]*Lg,TRK.a[1]+TRK.d[1]*Lg,(TRK.a[2]||0)+TRK.d[2]*Lg,B)){
          c.save();c.strokeStyle=col;c.lineWidth=1.5;c.setLineDash([6,4]);c.beginPath();c.moveTo(A.x,A.y);c.lineTo(B.x,B.y);c.stroke();c.restore();}
        st(()=>{c.moveTo(x-q,y);c.lineTo(x+q,y);c.moveTo(x,y-q);c.lineTo(x,y+q);});
        tag(x+16,y-22,TRK.ax==='a'?(TRK.deg+'°'):L('trk'+TRK.ax.toUpperCase()),col);}
      else if(cur.snap===5){st(()=>c.arc(x,y,q+1,0,7));st(()=>{c.moveTo(x-q+2,y-q+2);c.lineTo(x+q-2,y+q-2);c.moveTo(x+q-2,y-q+2);c.lineTo(x-q+2,y+q-2);});}
      else if(strictNow()){c.globalAlpha=.6;c.strokeStyle=TH.ink2;c.lineWidth=1.6;c.beginPath();c.arc(x,y,8,0,7);c.moveTo(x-5.6,y+5.6);c.lineTo(x+5.6,y-5.6);c.stroke();c.globalAlpha=1;}
      else st(()=>{c.moveTo(x-11,y);c.lineTo(x+11,y);c.moveTo(x,y-11);c.lineTo(x,y+11);});
      if(cur.snap>=0&&cur.snap<8)tag(x+16,y-22,L(['snEnd','snMid','snCen','snInt','snPer','snNode','snQuad','snNear'][cur.snap]),TH.signal);
      if(tool.live){const str=tool.live(cur.p);if(str)tag(x+16,y+46,str,TH.accent);}
      const last=tool.last&&tool.last();
      if(last){const dx=cur.p[0]-last[0],dy=cur.p[1]-last[1],dz=cur.p[2]-last[2],d=Math.hypot(dx,dy,dz);if(d>1e-9)tag(a.x+16,a.y+22,fmt(d)+' '+uL()+'  ∠ '+fmt(Math.atan2(dy,dx)/RAD)+'°');}
      else tag(a.x+16,a.y+22,fmt(cur.p[0])+', '+fmt(cur.p[1])+(Math.abs(cur.p[2])>1e-9?', '+fmt(cur.p[2]):''));
    }
  }
  // axis triad
  const m=cam.matrixWorldInverse.elements,ox=38,oy=vh-40,len=24;
  const ax=[[AX(0),m[0],m[1],TH.ax[0]],[AX(1),m[4],m[5],TH.ax[1]],['Z',m[8],m[9],TH.ax[2]]];
  c.lineWidth=2;c.font='600 10px "IBM Plex Mono",ui-monospace,monospace';c.textAlign='center';
  for(const [n,x,y,col] of ax){c.strokeStyle=col;c.fillStyle=col;c.beginPath();c.moveTo(ox,oy);c.lineTo(ox+x*len,oy-y*len);c.stroke();if(Math.hypot(x,y)>.25)c.fillText(n,ox+x*(len+9),oy-y*(len+9));}

GUIDE.tr.push([(GUIDE.tr.length+1)+' · Sulama',["<b>Su kaynağı</b> (Sulama sekmesi): suyun alındığı noktayı (şebeke bağlantısı, hidrofor) koy; Özellikler’de statik basıncı (bar) ve debiyi (m³/sa) yaz.","<b>Sulama başlığı</b>: üstteki küçük pencereden başlık türünü (sprey, rotator, rotor), atış yarıçapını ve açısını seç, sonra yerine tıkla. Tam daire değilse ikinci tıklama sulanacak tarafın başladığı yönü verir; alan saat yönünün tersine açılır. Sulanan alan açık renkle dolu görünür, böylece boş kalan yer hemen fark edilir.","<b>Alana başlık diz</b>: kapalı bir çoklu çizgi, alan ya da dairenin kenarına veya içine tıkla. Her köşeye köşe açısı kadar, kenarlara en çok bir yarıçap arayla yarım daire, içine kare ya da üçgen düzende tam daire başlıklar konur (baş başa). Sonunda başlık sayısı ve toplam debi yazılır.","<b>Değerler</b>: türlerin atış, basınç ve yağış değerleri ortalamadır (sprey 1,5–5,5 m · 40 mm/sa, rotator 4–9,5 m · 10 mm/sa, rotor 7–16 m · 13 mm/sa). Debi, aynı yağışı verecek şekilde açıyla orantılı hesaplanır; her başlıkta Özellikler’den kendi ürününün değerini girebilirsin. Başlıklar metrajda tür ve yarıçapa göre sayılır.","<b>PE boru</b>: küçük pencereden <b>ana hat</b> (su kaynağından vanalara, kalın çizgi) ya da <b>yan hat</b> (vanadan başlıklara) seç; dış çapı (PE100 Ø16–125) ve basınç sınıfını (PN6/10/16) gir ya da çapı otomatik bırak (hesap adımında seçilecek). Çoklu çizgi gibi çizilir, Enter bitirir; sonra taşı, uzat, kır, birleştir gibi tüm düzenleme araçları çalışır.","<b>Kendiliğinden bağlanma</b>: başlık ya da vana boruya 30 cm’den yakınsa bağlı sayılır. Birbirine değen yan hatlar tek gruptur ve üstündeki vananın numarasını alır; ana hat ile yan hat yalnızca vana üzerinden bağlanır. Her vana grubu (boru, başlıklar, vana) ayrı renkte görünür; bağlı olmayan başlık kendi rengiyle kalır.","<b>Vana</b>: ana hattın üstüne tıkla; numara (V1, V2…) sırayla verilir. Özellikler’de numarayı, çapı, bağlı başlık sayısını, toplam debiyi ve ana hatta olup olmadığını görürsün. <b>Kontrol ünitesi</b>: istasyon sayısı çizimdeki vana sayısına göre önerilir, Özellikler’den değişir.","<b>Başlıkları bağla</b>: başlıkları (pencereyle) seç, istersen bir vanayı da seç, Enter’a bas. Başlıklar o vanaya (seçmediysen en yakın vanaya) en kısa yan hatla bağlanır; dallanmalar ayrı boru olur. Metrajda borular çap, sınıf ve hatta göre, vanalar çapa göre, kontrol ünitesi istasyon sayısına göre sayılır.","<b>Damla hattı</b>: küçük pencereden damlatıcı aralığını (20–50 cm), damlatıcı debisini (1–4 L/sa) ve boru çapını (Ø16/20) seç, sonra hattı çoklu çizgi gibi çiz. Kesikli görünür. Damlatıcı sayısı = uzunluk ÷ aralık + 1; hattın debisi = damlatıcı sayısı × damlatıcı debisi.","<b>Alana damla hattı diz</b>: kapalı bir alanın kenarına ya da içine tıkla. Alanın en uzun kenarına paralel, sıra aralığıyla hatlar konur; kenarlardan 10 cm içeride biter. İstersen hatların başlarını birleştiren bir toplayıcı boru (yan hat) da eklenir; onun ucunu vanaya bağla. Sonunda toplam uzunluk, damlatıcı sayısı, debi ve yağış (L/sa ÷ alan = mm/sa) yazılır. Damla hatları da bağlı olduğu vananın renginde görünür, vanadaki toplam debiye eklenir.","<b>Sulama hesabı</b>: her vana grubunun başlık/damlatıcı sayısını ve debisini, vanadaki ve en kötü uçtaki basıncı (gerekenle birlikte) gösterir. Her vana tek başına çalışır sayılır; ana hat en büyük vana debisine göre boyutlanır. Boru kaybı Hazen-Williams formülüyle, ek parçalar için yüzde eklenerek, kot farkıyla birlikte hesaplanır. Çapı Otomatik bırakılan borulara, hızı sınırın (varsayılan 1,5 m/s) altında tutan en küçük PE100 boru seçilir; metrajda bu çap yazılır, “Otomatik çapları çizime yaz” ile kalıcı olur. Ayarlar (C, ek parça %, vana kaybı, hız sınırı, damlatıcı basıncı) çizimle birlikte kaydedilir.","<b>Uyarılar</b>: bağlanmamış başlık, vanasız ana hatta duran başlık, vanaya bağlı olmayan yan hat, aynı hatta iki vana, ana hatta bağlı olmayan vana, su kaynağının yetmediği debi, en kötü uçta yetersiz basınç, sprey başlıkta aşırı basınç (sisleme), hızı sınırı aşan boru, bir vanada farklı yağışlı başlıklar ve alanın sulanmayan kısmı (%3 ve üstü). Her uyarıdaki <b>Göster</b> ilgili nesneyi seçip yakınlaştırır.","<b>Sulama süresi</b>: hesap penceresinde her vana için yağış (mm/sa), günlük çalışma süresi ve günlük su miktarı yazılır. Süre = günlük su ihtiyacı (varsayılan 5 mm) ÷ yağış ÷ verim (başlıkta %70, damlada %90). Damla yağışı, hattın içinde bulunduğu kapalı alana göre hesaplanır. Toplam satırı vanalar sırayla çalışınca geçen süreyi verir.","<b>Excel’e aktar</b>: Vanalar (debi, basınç, yağış, süre, toplamlar formüllü), Borular (hat, çap, uzunluk, hız, kayıp) ve Ekipman (başlıklar türe ve yarıçapa göre, vanalar, kontrol ünitesi, damlatıcı sayısı) sayfalarından oluşan bir dosya iner.","<b>Paftada sulama lejantı</b>: Pafta penceresindeki “Sulama lejantı” açıkken paftanın sağına yalnızca çizimde kullanılan sulama sembolleri ile vana tablosu (debi, başlık/damlatıcı, süre) basılır; renkli çıktıda vana renkleri de görünür. Bitki listesi de açıksa ikisi alt alta durur."]]);
GUIDE.en.push([(GUIDE.en.length+1)+' · Irrigation',["<b>Water source</b> (Irrigation tab): place where water comes in (mains connection, booster pump); enter its static pressure (bar) and flow (m³/h) in Properties.","<b>Sprinkler head</b>: pick the head type (spray, rotator, rotor), throw radius and arc in the small window, then click its place. For a part circle a second click sets the direction where the watered side starts; the arc opens anticlockwise. The watered area shows lightly filled, so gaps stand out.","<b>Fill area with heads</b>: click the edge of, or inside, a closed polyline, area or circle. Each corner gets a head with the corner’s angle, the edges get half circles at most one radius apart and the inside gets full circles on a square or triangular grid (head to head). The number of heads and the total flow are reported.","<b>Values</b>: the types use typical throw, pressure and precipitation (spray 1.5–5.5 m · 40 mm/h, rotator 4–9.5 m · 10 mm/h, rotor 7–16 m · 13 mm/h). Flow scales with the arc so every head gives the same precipitation; enter your product’s figures on each head in Properties. Heads are counted in the quantity take-off by type and radius.","<b>PE pipe</b>: in the small window choose <b>mainline</b> (from the water source to the valves, thick line) or <b>lateral</b> (from a valve to the heads); set the outside diameter (PE100 Ø16–125) and pressure class (PN6/10/16), or leave the size automatic (picked in the calculation step). Draw it like a polyline, Enter finishes; move, extend, break, join and the other edit tools all work on it.","<b>Automatic connection</b>: a head or valve closer than 30 cm to a pipe counts as connected. Laterals touching each other form one zone and take the number of the valve on them; mainline and laterals only connect through a valve. Each valve zone (pipes, heads, valve) shows in its own colour; a head that is not connected keeps its own colour.","<b>Valve</b>: click on the mainline; numbers (V1, V2…) are given in order. Properties show the number, size, connected heads, total flow and whether it sits on the mainline. <b>Controller</b>: the station count is suggested from the valves in the drawing and can be changed in Properties.","<b>Connect heads</b>: select heads (with a window), optionally a valve too, and press Enter. The heads are connected to that valve (or the nearest one) with the shortest lateral; branches become separate pipes. In the take-off pipes are counted by size, class and line, valves by size and the controller by station count.","<b>Drip line</b>: in the small window choose the emitter spacing (20–50 cm), emitter flow (1–4 L/h) and pipe size (Ø16/20), then draw the line like a polyline. It shows dashed. Emitters = length ÷ spacing + 1; line flow = emitters × emitter flow.","<b>Fill area with drip lines</b>: click the edge of, or inside, a closed area. Rows go in parallel to its longest edge at the row spacing and stop 10 cm in from the edges. Optionally a header (lateral) joins the row starts; connect its end to a valve. The total length, emitters, flow and precipitation (L/h ÷ area = mm/h) are reported. Drip lines take the colour of their valve and add to its total flow.","<b>Irrigation calculation</b>: shows the heads/emitters and flow of every valve zone and the pressure at the valve and at the worst end (with what is needed). Each valve is taken to run on its own; the mainline is sized for the largest valve flow. Pipe loss uses Hazen-Williams plus a percentage for fittings, with elevation. Pipes left on Automatic get the smallest PE100 size that keeps the velocity under the limit (default 1.5 m/s); the take-off lists that size and “Write automatic sizes to the drawing” makes it permanent. The settings (C, fittings %, valve loss, velocity limit, emitter pressure) are saved with the drawing.","<b>Warnings</b>: heads not connected, heads straight on the mainline, laterals without a valve, two valves on one lateral, valves not on the mainline, flow above the water source, too little pressure at the worst end, too much pressure at sprays (misting), pipes above the velocity limit, mixed precipitation in one zone and unwatered parts of an area (3% or more). <b>Show</b> selects the object and zooms to it.","<b>Run time</b>: the calculation window lists for every valve the precipitation (mm/h), the daily run time and the daily water. Run time = daily water need (default 5 mm) ÷ precipitation ÷ efficiency (70% for heads, 90% for drip). Drip precipitation uses the closed area its lines sit in. The total row is the time when the valves run one after another.","<b>Export to Excel</b>: a file with Valves (flow, pressure, precipitation, run time, totals as formulas), Pipes (line, size, length, velocity, loss) and Equipment (heads by type and radius, valves, controller, emitters) sheets.","<b>Irrigation legend on the sheet</b>: with “Irrigation legend” on in the sheet window, only the irrigation symbols used in the drawing and a valve schedule (flow, heads/emitters, run time) are printed on the right of the sheet; colour prints show the valve colours. With the plant list on too, they stack."]]);GUIDE.tr.push([(GUIDE.tr.length+1)+' · Bilmeniz gerekenler',["<b>Tanıtım turu</b> yalnız bir kez açılır; yeniden izlemek için bu pencerenin altındaki <b>Tanıtım turunu başlat</b>’a bas.", "<b>Telefonda geniş tablolar</b> (sulama hesabı, metraj) ekrana sığmazsa üstünde uyarı çıkar; tabloyu parmakla yana kaydır.", "<b>Kot etiketi ve eğim oku</b> araziyi değiştirdiğinde kendiliğinden yeniden okunmaz (taşıyınca okunur). Arazi değiştiyse etiketleri ya da okları seçip Özellikler’de <b>Zeminden yeniden oku</b>’ya bas. Uçta kot etiketi olan eğim okları etiketin kotunu hep izler.", "<b>Eğim haritası</b> eklendiği andaki arazinin resmidir; arazi değişirse <b>Eğim haritası</b>’nı yeniden çalıştırıp <b>Çizime ekle</b>’ye bas, eskisi silinip yenisi konur.", "<b>Şev</b>, kenar çizgileri durdukça onlara bağlı kalır; şevi tek başına taşırsan yeniden çizgilerinin yerine döner. Başka yere taşımak için çizgileriyle birlikte seç.", "<b>Tesviye yüzeyi</b> de sınır çizgisine bağlıdır; tek başına taşınırsa çizginin yerine döner. <b>Yarma/dolgu haritası</b> eklendiği anın resmidir; tesviye değişince yeniden ekle, eskisi silinir.", "<b>Sulama hesabı</b> her vananın tek başına çalıştığını varsayar; aynı anda iki vana açılacaksa debileri toplayarak su kaynağını kendin kontrol et.", "<b>Yazı boyları</b> (kot, eğim, vana etiketleri) çizim biriminde sabittir; büyük alanlarda küçük görünürlerse Özellikler’de (seçim yokken) <b>Yazı yüksekliği</b>’ni büyüt.", "<b>Bilgisayara kurulu Pergel</b> açıkken yeni sürüm çıkarsa üstte “Yeni sürüm var” uyarısı çıkar (pencereye dönünce ya da 5 dakikada bir kontrol edilir); <b>Yenile</b>’ye bas."]]);GUIDE.en.push([(GUIDE.en.length+1)+' · Good to know',["The <b>welcome tour</b> opens only once; to watch it again press <b>Start the tour</b> at the bottom of this window.", "<b>Wide tables on phones</b> (irrigation calculation, take-off) show a note when they do not fit; swipe the table sideways.", "<b>Spot elevations and slope arrows</b> are not re-read by themselves when the terrain changes (they are when moved). If the terrain changed, select them and press <b>Read from ground again</b> in Properties. Slope arrows ending on a spot elevation always follow that spot.", "A <b>slope map</b> is a picture of the terrain when it was added; if the terrain changes run <b>Slope map</b> again and press <b>Add to drawing</b>, the old one is replaced.", "An <b>embankment</b> stays tied to its edge lines while they exist; moved on its own it returns to its lines. To move it elsewhere select it together with its lines.", "The <b>grading surface</b> is linked to its outline too; moved alone it goes back to the line. The <b>cut/fill map</b> is a snapshot; add it again after changing the grading and the old one is replaced.", "The <b>irrigation calculation</b> assumes each valve runs on its own; if two valves will run together, add their flows and check the water source yourself.", "<b>Text sizes</b> (levels, slopes, valve labels) are fixed in drawing units; if they look small on large sites, raise <b>Text height</b> in Properties (with nothing selected).", "When an <b>installed Pergel</b> is open and a new version comes out, a “new version” bar appears at the top (checked when you return to the window and every 5 minutes); press <b>Reload</b>."]]);

const TOOLS=[['gSel',['select','msel','qselect','orbit','walk','hide','isolate','unhide','measure','section','scenes']],['gDraw',['line','poly','rect','circle','arc','spline','polygon','ellipse','text','point','xline','hatch','area']],['gSolid',['pushpull','box','cyl','cone','sphere','extrude','foffset','revolve','sweep','bunion','bsub','bint','shell']],['gEdit',['move','copy','drop','rotate','scale','refscale','mirror','offset','trim','extend','fillet','chamfer','array','parray','patharr','stretch','pjoin','brk','match','ordfront','ordback','del']],['gDim',['dimlin','dimali','dim3','dimcon','dimang','dimrad','dimdia','leader','dimsty','takeoff']],['gSite',['terrain','spot','slope','slopemap','bank','grade','cubage','sunstudy']],['gIrr',['wsrc','pipe','valve','ctrl','spk','spkfill','irrlink','drip','dripfill','irrcalc']],['gIns',['image','import3d','binsert','bmake','explode']]];
const TOOLG={};TOOLS.forEach(([g,ts])=>ts.forEach(t=>TOOLG[t]=g));
function railRec(){const r=$('#rrec');if(!r)return;const L2=(S.rec||[]).filter(q=>TOOLG[q]);r.hidden=!L2.length;r.innerHTML=L2.length?`<span>${esc(L('recT'))}</span>`+L2.map(t=>`<button type="button" class="tool" data-tool="${t}" title="${esc(toolTip(t))}" aria-label="${esc(L('t_'+t))}">${ico(t)}</button>`).join(''):'';if(typeof uiTool==='function'&&booted)uiTool();}

const DL_OK=['txt','json','md','csv','html','svg','pdf','zip'];
async function saveFile(name,text){

    if(dl){let fn=name,data=text,zipped=false;if(!DL_OK.includes(ext)){data=zipStore(name,text instanceof Uint8Array?text:new TextEncoder().encode(text));fn=name.replace(/\.[^.]+$/,'')+'.zip';zipped=true;}
      try{await dl.save({filename:fn,data});toast(L(zipped?'savedZip':'saved',fn),zipped?7000:3800);return;}
      catch(err){if(err&&(err.code==='declined'||err.code==='rate_limited')){toast(L('declined'));return;}}}
    if(text instanceof Uint8Array){toast(L('declined'));return;}return copyFallback(name,text);
  }

  catch(_){copyFallback(name,text);}
}
function copyFallback(name,text){

  $('#cpTxt').value=text;
}
function closeFile(){
